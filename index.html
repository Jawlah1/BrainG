}
function crashStep(){
  var g = app.game, it = g && g.inter, H = crashHost;
  if(!it || it.gameKey !== 'crash' || interSignature(it) !== H.sig || g.phase !== 'inter-active' || it.crash.done){ clearInterval(H.timer); return; }
  var now = syncedNow();
  if(now < it.startAt) return;
  var dt = Math.min(100, now - H.last); H.last = now;
  // the characters: land, then hop on while the stick is held
  it.alive.forEach(function(id){
    var p = H.ps[id]; if(!p) return;
    if(p.he && now >= p.he){ p.he = 0; crashLand(H, it, p, now); }
    if(p.dir && now - p.inAt > CRASH_INPUT_STALE) p.dir = null;
    if(!p.he && p.dir && now >= p.stunUntil){
      var d = CRASH_DIRS[p.dir], r = p.r + d[0], c = p.c + d[1];
      p.face = p.dir;
      if(r >= 0 && c >= 0 && r < CRASH_N && c < CRASH_N && !crashTaken(H, r, c, id)){
        p.fr = p.r; p.fc = p.c; p.r = r; p.c = c; p.hs = now; p.he = now + (now < p.shoeUntil ? CRASH_FAST_HOP_MS : CRASH_HOP_MS);
      }
    }
  });
  // rockets fly straight until they hit someone or the edge
  H.rockets = H.rockets.filter(function(k){
    var d = CRASH_DIRS[k.dir];
    k.t += dt/1000*CRASH_ROCKET_SPEED;
    var steps = Math.floor(k.t);
    for(var s=k.done+1; s<=steps; s++){
      var r = k.r0 + d[0]*s, c = k.c0 + d[1]*s;
      if(r < 0 || c < 0 || r >= CRASH_N || c >= CRASH_N){ crashFx(H, 'boom', k.r0 + d[0]*(s-1), k.c0 + d[1]*(s-1), 650); playSound('boom'); return false; }
      var hit = Object.keys(H.ps).filter(function(id){ var q = H.ps[id]; return id !== k.owner && !q.gone && ((q.r === r && q.c === c) || (q.he && q.fr === r && q.fc === c)); })[0];
      if(hit){ crashFx(H, 'boom', r, c, 650); playSound('boom'); crashHit(H, H.ps[hit], 'rocket', now); return false; }

    if(H.items.length < H.spawn.max) crashSpawn(H, now);
  }

  if(now >= H.cycleEnd) crashScore(H, it, now, false);
  crashSync(H, it, now, false);
}
function crashSpawn(H, now){
  var free = [], used = {};
  H.items.forEach(function(x){ used[x.cell] = true; });
  Object.keys(H.ps).forEach(function(id){ var q = H.ps[id]; if(!q.gone){ used[crashCell(q.r, q.c)] = true; used[crashCell(q.fr, q.fc)] = true; } });
  for(var i=0;i<CRASH_N*CRASH_N;i++) if(!used[i]) free.push(i);
  if(!free.length) return;
  var clockOk = now >= H.clockWait && H.clockCycle !== H.cyc && !H.items.some(function(x){ return x.type === 'clock'; });
  var types = Object.keys(CRASH_WEIGHT).filter(function(t){ return t !== 'clock' || clockOk; });
  var tot = types.reduce(function(a, t){ return a + CRASH_WEIGHT[t]; }, 0), pick = Math.random()*tot, type = types[0];
  for(var k=0;k<types.length;k++){ pick -= CRASH_WEIGHT[types[k]]; if(pick <= 0){ type = types[k]; break; } }
  var cell = free[Math.floor(Math.random()*free.length)];

function crashArrowDir(x, now){ return CRASH_ARROW[Math.floor((now - x.born)/500) % 4]; }
// a character lands on a tile: colour it, pick up what's there, step on mines
function crashLand(H, it, p, now){
  var cell = crashCell(p.r, p.c);
  crashPaint(H, p.id, cell, now);
  // a mine arms once the one who laid it has stepped off its tile
  H.mines.forEach(function(m){ if(!m.armed && m.owner === p.id && m.cell !== cell) m.armed = true; });
  // mines (the one who laid it too, once it is armed)
  H.mines = H.mines.filter(function(m){
    if(m.cell !== cell || !m.armed) return true;
    crashFx(H, 'boom', p.r, p.c, 650); playSound('boom');
    crashHit(H, p, 'mine', now);
    return false;
  });
  var x = H.items.filter(function(y){ return y.cell === cell; })[0];
  if(!x) return;
  if(CRASH_HELD[x.type] && p.held) return;          // already carrying one: it stays on the floor
  H.items = H.items.filter(function(y){ return y !== x; });
  crashTake(H, it, p, x.type, x, now);
}
function crashTake(H, it, p, type, x, now){
  var pl = findPlayer(p.id);
  playSound('appear');
  crashFx(H, 'pick', p.r, p.c, 600);
  if(CRASH_HELD[type]){ p.held = type; return; }
  if(type === 'shoe') p.shoeUntil = now + CRASH_SHOE_MS;
  else if(type === 'lock') p.lockUntil = now + CRASH_LOCK_MS;
  else if(type === 'shield') p.shieldUntil = now + CRASH_SHIELD_MS;
  else if(type === 'clock'){
    H.cycleEnd += CRASH_CLOCK_ADD; H.clockWait = now + CRASH_CLOCK_WAIT; H.clockCycle = H.cyc;
    crashFx(H, 'clock', p.r, p.c, 1400);
    playSound('submit');
  } else if(type === 'wand'){
    for(var dr=-2; dr<=2; dr++) for(var dc=-2; dc<=2; dc++){
      var r = x.r + dr, c = x.c + dc;
      if(r >= 0 && c >= 0 && r < CRASH_N && c < CRASH_N) crashPaint(H, p.id, crashCell(r, c), now);
    }
    crashFx(H, 'wand', x.r, x.c, 900);
  } else if(type === 'arrow'){
    var dir = crashArrowDir(x, now), d = CRASH_DIRS[dir];
    for(var s=0;; s++){
      var rr = x.r + d[0]*s, cc = x.c + d[1]*s;
      if(rr < 0 || cc < 0 || rr >= CRASH_N || cc >= CRASH_N) break;
      crashPaint(H, p.id, crashCell(rr, cc), now);
    }
    crashFx(H, 'line', x.r, x.c, 700, { dir:dir });
  } else if(type === 'bang'){
    var pts = 5 + Math.floor(Math.random()*16);
    it.crash.points[p.id] = (it.crash.points[p.id] || 0) + pts;
    crashFx(H, 'plus', p.r, p.c, 1300, { text:'+'+pts, pid:p.id });
    playSound('correct');
    if(pl && CHARS[pl.character]) hostVoice(p.id, pl.character, 'happy');
  } else if(type === 'quest'){
    if(Math.random() < 0.2){                                   // bad luck: zapped
      crashFx(H, 'bolt', p.r, p.c, 900, { pid:p.id });
      playSound('boom');
      crashHit(H, p, 'bolt', now);
      return;
    }
    var opts = ['rocket','shoe','mine','lock','bolt'].filter(function(t){ return !(CRASH_HELD[t] && p.held); });
    crashTake(H, it, p, opts[Math.floor(Math.random()*opts.length)], x, now);
  }
}
// a phone fires its tool
function hostCrashFire(pid, msg){
  var g = app.game, it = g.inter, H = crashHost;
  if(!it || g.phase !== 'inter-active' || it.gameKey !== 'crash' || msg.sig !== H.sig || it.crash.done) return;
  var p = H.ps[pid], now = syncedNow();
  if(!p || !p.held || now < p.stunUntil || now < it.startAt) return;
  var type = p.held; p.held = null;
  if(type === 'rocket'){
    H.rockets.push({ id:++H.seq, owner:pid, dir:p.face, r0:p.r, c0:p.c, t:0, done:0, at:now });
    playSound('pass');
  } else if(type === 'mine'){
    // under the tile I'm on (or landing on); it stays harmless to me until I step off it
    var cell = crashCell(p.r, p.c);
    if(!H.mines.some(function(m){ return m.cell === cell; })) H.mines.push({ cell:cell, owner:pid, armed:false });
    playSound('press');
  } else if(type === 'bolt'){
    playSound('boom');
    Object.keys(H.ps).forEach(function(id){
      var q = H.ps[id]; if(id === pid || q.gone) return;
      crashFx(H, 'bolt', q.r, q.c, 900, { pid:id });
      crashHit(H, q, 'bolt', now);
    });
  }

function hostCrashInput(pid, msg){
  var g = app.game, it = g.inter, H = crashHost;
  if(!it || g.phase !== 'inter-active' || it.gameKey !== 'crash' || msg.sig !== H.sig) return;
  var p = H.ps && H.ps[pid]; if(!p) return;

// every 10 s: each player's tiles become points, the floor is wiped
function crashScore(H, it, now, last){
  var count = {};
  H.tiles.forEach(function(o){ if(o) count[o] = (count[o] || 0) + 1; });
  it.alive.forEach(function(id){
    var n = count[id] || 0, q = H.ps[id];
    it.crash.points[id] = (it.crash.points[id] || 0) + n;
    if(q && n) crashFx(H, 'plus', q.r, q.c, 1300, { text:'+'+n, pid:id });
  });
  playSound('correct');
  if(last) return;
  for(var i=0;i<H.tiles.length;i++) H.tiles[i] = null;

// what the phones need: their tool, points, the clock, their effects
function crashSync(H, it, now, force){
  var held = {}, eff = {};
  Object.keys(H.ps).forEach(function(id){
    var q = H.ps[id];
    held[id] = q.held;
    eff[id] = [q.stunUntil > now ? q.stunUntil : 0, q.shoeUntil > now ? q.shoeUntil : 0, q.shieldUntil > now ? q.shieldUntil : 0, q.lockUntil > now ? q.lockUntil : 0];
  });

  H.sum = sum; H.sumAt = now;
  it.crash.cycleEnd = H.cycleEnd; it.crash.held = held; it.crash.eff = eff;
  it.alive.forEach(function(id){ it.scores[id] = it.crash.points[id] || 0; });
  broadcastState();

// time's up: the lowest go (elimination), or the places are given out (one round)
function crashFinish(it){
  var g = app.game, H = crashHost, sig = H.sig, C = it.crash;
  clearInterval(H.timer);
  C.done = true;
  it.innerScores = {};
  it.alive.forEach(function(id){ it.innerScores[id] = C.points[id] || 0; it.scores[id] = C.points[id] || 0; });
  it.elim = null; it.elimQueue = []; it.roundWin = null; it.elimNames = null;
  var pts = function(id){ return C.points[id] || 0; };
  if(C.mode === 'single'){
    // one round: everyone but the best is shot, one after the other, the lowest first; tied
    // players share a place (and if the best are tied, they all win)
    var order = it.alive.slice().sort(function(a, b){ return pts(a) - pts(b) || Math.random() - 0.5; });
    var top = pts(order[order.length-1]), grp = it.grpCount || 0, lastPts = null, losers = [];

function renderGiftsPlayer(g, it, alive, outEntry){
  var sig = interSignature(it), G = it.gifts, now = syncedNow();
  if(!G) return g.phase === 'inter-active';
  if(gp.sig !== sig) gpReset(sig);
  if(!gp.seq && giftSeqStore[sig]) gp.seq = giftSeqStore[sig];
  if(!gp.seq && alive && Date.now() - gp.needAt > 900){ gp.needAt = Date.now(); sendToHost({t:'gift-need', sig:sig}); }
  var t = now - it.startAt, playing = g.phase === 'inter-active' && alive && t >= 0 && now < it.endsAt;
  // the belts run at the round's speed
  var travel = giftTravel(Math.max(0, t), G.dur, G.accel, G.level), bk = String(Math.round(travel/100));
  if(gp.beltKey !== bk){ gp.beltKey = bk; els.giftsStage.style.setProperty('--belt-s', (travel/1000*0.18).toFixed(3) + 's'); }
  els.giftsStage.classList.toggle('run', g.phase === 'inter-active' && t >= 0 && now < it.endsAt);
  els.giftsBtns.classList.toggle('off', !playing);
  // the things coming down - only while this elimination is being played: before it starts
  // (countdown, face-off) startAt is still the LAST elimination's, which made every thing look
  // long gone and counted it as missed before the belts even started
  if(g.phase !== 'inter-active' || t < -3500){
    Object.keys(gp.nodes).forEach(function(k){ gp.nodes[k].remove(); delete gp.nodes[k]; });
  } else if(gp.seq){
    var seen = {};
    for(var i=0;i<gp.seq.length;i++){
      var x = gp.seq[i], tr = giftTravel(x[0], G.dur, G.accel, G.level), p = (t - (x[0] - tr))/tr;
      if(p >= 1 && !gp.res[i]){
        // it reached the end of its belt: caught if I'm there
        var caught = alive && g.phase === 'inter-active' && gp.lane === x[1], v = giftValue(x[2], x[3]);
        gp.res[i] = caught ? 1 : 2;
        if(caught){
          gp.score += v;
          gpFx((v > 0 ? '+' : '−') + Math.abs(v), v > 0 ? 'good' : 'bad', x[1]);
          if(v > 0){
            playSound('pass');
            gp.badRun = 0; gp.okRun++;
            if(gp.okRun === 5 && rcMoodReady('happy')) rcMood('happy', sig);
          } else {
            playSound('wrong-click');
            if(navigator.vibrate){ try{ navigator.vibrate(x[3] ? [70,40,90] : 60); }catch(e){} }
            els.giftsStage.classList.remove('ouch'); void els.giftsStage.offsetWidth; els.giftsStage.classList.add('ouch');
            gp.okRun = 0; gp.badRun++;
            if(gp.badRun === 3 && rcMoodReady('sad')) rcMood('sad', sig);
            else if(rcMoodReady('pain') && Math.random() < 0.5) rcMood('pain', sig);
          }
        }
      }
      if(p < -0.02 || p > 1.3 || gp.res[i] === 1) continue;
      seen[i] = true;
      var n = gp.nodes[i];
      if(!n){
        n = gp.nodes[i] = document.createElement('div');
        n.className = 'gift-it ' + (x[2] === 'g' ? 'g' : 'r') + (x[3] ? ' big' : '');
        n.textContent = x[2] === 'g' ? '🎁' : '🪨';
        n.style.left = (x[1]*33.333 + 16.667) + '%';
        n.style.setProperty('--sc', x[4]);
        els.giftsItems.appendChild(n);
      }
      n.style.top = (Math.max(0, p)*100).toFixed(2) + '%';
      n.style.opacity = p > 1 ? Math.max(0, 1 - (p - 1)/0.3).toFixed(2) : '1';
    }
    Object.keys(gp.nodes).forEach(function(k){ if(!seen[k]){ gp.nodes[k].remove(); delete gp.nodes[k]; } });
  }
  // my score and the time, on the machine
  var sc = (gp.score > 0 ? '' : gp.score < 0 ? '−' : '') + Math.abs(gp.score);
  if(els.giftsScore.textContent !== sc) els.giftsScore.textContent = sc;
  els.giftsScore.classList.toggle('neg', gp.score < 0);
  var tl = g.phase === 'inter-active' && t >= 0 ? wordsFmtTime(Math.max(0, it.endsAt - now)) : '';
  if(els.giftsTime.textContent !== tl) els.giftsTime.textContent = tl;
  els.giftsTime.classList.toggle('low', !!tl && it.endsAt - now <= 5000);
  els.giftsBtns.classList.toggle('off', !playing);
  if(g.phase !== 'inter-active') return false;
  // the display keeps the live scores (and the last one counts when the time is up)
  if(alive && t >= 0){
    if(now >= it.endsAt){ if(!gp.finalSent){ gp.finalSent = true; gpSend(true); } }
    else if(gp.score !== gp.sentScore && Date.now() - gp.sentAt > 150) gpSend(false);
  }
  els.notifBar.textContent = outEntry ? 'تم إقصاؤك - تابع الشاشة' : !alive ? 'تابع الشاشة'
    : t < 0 ? 'استعد...' : now >= it.endsAt ? '⏰ انتهى الوقت' : !gp.seq ? '...'
    : 'اجمع الهدايا 🎁 وابتعد عن الصخور 🪨';
  return true;
}

(function(){
  var joy = els.crashJoy, knob = els.crashKnob, active = null;
  function move(e){
    var r = joy.getBoundingClientRect(), R = r.width/2;
    var dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R), m = Math.sqrt(dx*dx + dy*dy), lim = R*0.55;
    var k = m > lim ? lim/m : 1;

    var d = m < R*0.22 ? '' : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u');   // up / down / left / right only

  function end(){ active = null; knob.style.transform = 'translate(-50%,-50%)'; joy.setAttribute('data-d', ''); cjSet(''); }

// ---- phone: the dice tray ----
// Top-down 2D physics: press and hold to pick the dice up (they gather under the finger and
// rattle), swipe and let go to throw them in that direction at that speed. They tumble
// (the face changes while they roll), bounce off the tray's edges and off each other, and
// friction brings them to rest. The final numbers are drawn fairly at the moment of the
// throw - the physics is the show. A plain tap throws them too.
var DP = { e:0.62, ee:0.72, fr:1.9, decel:120, afr:2.4, stop:22, minThrow:900, maxThrow:2600 };

  hist:[], lastT:0, clackAt:0, tray:{w:300,h:300}, size:60 };
els.diceTray.innerHTML = [0,1,2].map(function(){ return dieHtml(1, 'big'); }).join('');
function diceEls(){ return els.diceTray.querySelectorAll('.die'); }
function diceLayout(){
  var r = els.diceTray.getBoundingClientRect();
  dc.tray = { w:r.width, h:r.height, left:r.left, top:r.top };
  dc.size = Math.max(40, Math.min(84, Math.min(r.width, r.height)*0.2));
  Array.prototype.forEach.call(diceEls(), function(el){ el.style.width = el.style.height = dc.size+'px'; });
}
function diceRest(){
  // resting together near the bottom middle of the tray
  var w = dc.tray.w, h = dc.tray.h, s = dc.size;
  dc.dice = [0,1,2].map(function(i){ return { x: w/2 + (i-1)*s*1.25, y: h - s*1.1, vx:0, vy:0, a:(i-1)*12, va:0, v:dc.vals ? dc.vals[i] : i*2+1, face:dc.vals ? dc.vals[i] : i*2+1, swapAt:0 }; });
}
function diceReset(sig){
  dc.sig = sig; dc.throws = 0; dc.rolling = false; dc.holding = false; dc.fixed = false; dc.acked = false; dc.lastSent = 0; dc.vals = null; dc.hist = [];
  diceLayout(); diceRest();
}
function diceCanThrow(){
  var g = app.game, it = g && g.inter;
  if(!it || g.phase !== 'inter-active' || it.gameKey !== 'dice' || !it.dice || it.dice.subs) return false;
  if(dc.sig !== interSignature(it) || dc.fixed || dc.rolling || dc.throws >= 2 || !interMeAlive()) return false;
  return syncedNow() >= it.startAt && syncedNow() < it.endsAt;
}
function diceClack(strength){
  var now = Date.now();

  dc.clackAt = now;
  playSound('press');
}

els.diceTray.addEventListener('pointerdown', function(e){
  if(!diceCanThrow()) return;
  e.preventDefault();
  diceLayout();
  try{ els.diceTray.setPointerCapture(e.pointerId); }catch(err){}
  dc.holding = true;
  dc.hist = [dicePoint(e)];

  dc.hist.push(dicePoint(e));
  if(dc.hist.length > 12) dc.hist.shift();
});

  else { els.cvBox.style.left = '0%'; els.cvBox.style.transform = ''; }
  els.cvContainer.classList.toggle('cv-lock', Date.now() < cv.lockUntil);
  els.cvContainer.classList.toggle('cv-dead', !playing && g.phase === 'inter-active');
  els.cvContainer.classList.toggle('cv-danger', playing && cv.x < 0.25);
  els.cvBelt.classList.toggle('moving', playing && now >= it.startAt);
  if(g.phase !== 'inter-active') return false;
  els.notifBar.textContent = outEntry ? 'تم إقصاؤك - تابع الشاشة'
    : cv.dropped ? '🔥 طحت في النار...'
    : now < it.startAt ? 'استعد...' : 'اضغط نفس اتجاه السهم - لا تطيح في النار!';
  return true;
}


var BOMB_ROWS = 4, BOMB_MIN_COLS = 4, BOMB_MAX_COLS = 10;
function buildBombOrder(players){
  var groups = {};
  players.forEach(function(p){ (groups[p.score]=groups[p.score]||[]).push(p.id); });
  var scores = Object.keys(groups).map(Number).sort(function(a,b){return b-a;});
  var order = [];
  scores.forEach(function(s){ order = order.concat(shuffle(groups[s])); });
  return order; // fixed for the whole round - never recalculated mid-round
}
function bombNextConnectedTurn(bomb, players){
  var tries=0;
  while(tries < bomb.order.length){
    var pid = bomb.order[bomb.turnIndex];
    var p = players.filter(function(x){return x.id===pid;})[0];
    if(p && p.connected) return;
    bomb.turnIndex = (bomb.turnIndex+1) % bomb.order.length;
    tries++;
  }
}

// fix #6: columns are now leader-chosen (4-10), never derived from player count. Scoring
// mode ('classic' = original per-step points, 'rounds' = 1 point to whoever wins each
// round, played over a fixed number of rounds) is also leader-chosen.
function hostStartBombGame(cols, scoringMode, roundsTotal){
  var g = app.game;
  cols = Math.max(BOMB_MIN_COLS, Math.min(BOMB_MAX_COLS, parseInt(cols,10)||8));
  scoringMode = (scoringMode==='rounds') ? 'rounds' : 'classic';
  roundsTotal = Math.max(1, Math.min(30, parseInt(roundsTotal,10)||5));
  g.mode = 'bomb';
  g.bombConfig = { cols:cols, scoringMode:scoringMode, roundsTotal:roundsTotal };
  g.bombRoundsPlayed = 0;
  hostBeginBombRound();
}

function hostBeginBombRound(){
  var g = app.game;
  var cfg = g.bombConfig;
  var grid = [];
  for(var c=0;c<cfg.cols;c++){
    var safeRow = rand(0,BOMB_ROWS-1);
    var col = [];
    for(var r=0;r<BOMB_ROWS;r++) col.push(r===safeRow);
    grid.push(col);
  }
  var everDiscovered = grid.map(function(col){ return col.map(function(){return false;}); });
  var order = buildBombOrder(g.players); // fix #9: recomputed only at the start of each round
  g.bomb = { grid:grid, everDiscovered:everDiscovered, rows:BOMB_ROWS, cols:cfg.cols,
    order:order, turnIndex:0, currentCol:0, turnRevealed:[], finished:false, winnerId:null, lastChoice:null,
    instanceId: Math.random().toString(36).substring(2,9) };
  bombNextConnectedTurn(g.bomb, g.players);
  g.phase = 'bomb-playing';
  broadcastState();
}

// fix #5/#6: classic-mode wins now also go through the full winner-screen ceremony
// (instead of the old plain banner), and both paths set the same g.winnerId/celebration
// fields renderWinnerScreen() already knows how to use.
function finalizeBombWin(g, cfg, p, playerId){
  g.bomb.finished = true;
  g.bomb.winnerId = playerId;
  if(cfg.scoringMode==='classic'){
    if(p) p.score += 20;
    g.winnerId = playerId;
    g.celebration = { bursts:[], sessionId: Math.random().toString(36).substring(2,9) };
    g.phase = 'bomb-finished';
  } else {
    if(p) p.score += 1;
    g.bombRoundsPlayed++;
    if(g.bombRoundsPlayed >= cfg.roundsTotal && hostTopTied(g)){ cfg.roundsTotal++; g.tiebreak = (g.tiebreak || 0) + 1; }
    if(g.bombRoundsPlayed >= cfg.roundsTotal){
      var sorted = g.players.slice().sort(function(a,b){ return b.score-a.score; });
      g.winnerId = sorted.length ? sorted[0].id : null;
      g.celebration = { bursts:[], sessionId: Math.random().toString(36).substring(2,9) };
      g.phase = 'bomb-tournament-finished';
    } else {
      g.phase = 'bomb-round-finished'; // leader must press continue for the next round - unchanged
    }
  }
}
function hostBombChoose(playerId, row){
  var g = app.game;
  if(!g.bomb || g.phase!=='bomb-playing') return;
  if(g.bomb.order[g.bomb.turnIndex] !== playerId) return;
  var col = g.bomb.currentCol;
  if(col==null || col>=g.bomb.cols) return;
  var isSafe = g.bomb.grid[col][row];
  var p = findPlayer(playerId);
  var cfg = g.bombConfig;
  if(isSafe){
    var wasEver = g.bomb.everDiscovered[col][row];
    g.bomb.everDiscovered[col][row] = true; // internal memory only, used for classic scoring
    if(cfg.scoringMode==='classic' && p) p.score += wasEver ? 1 : 5;
    g.bomb.turnRevealed.push({col:col,row:row}); // visible only for THIS turn (fix #9)
    g.bomb.lastChoice = {col:col,row:row,safe:true};
    g.bomb.currentCol++;
    if(g.bomb.currentCol >= g.bomb.cols){
      // fix #6: pause 1s on the just-completed board (everyone can see the winning move)
      // before switching away to the winner screen - but ONLY when this win ends the
      // whole game (classic mode, or the last round of rounds-mode). An intermediate
      // rounds-mode round keeps transitioning immediately, exactly as before.
      var isFinalWin = (cfg.scoringMode==='classic') || (g.bombRoundsPlayed+1 >= cfg.roundsTotal);
      broadcastState(); // show the winning move immediately regardless
      if(isFinalWin){
        addTimer(setTimeout(function(){ finalizeBombWin(g, cfg, p, playerId); broadcastState(); }, 1000));
      } else {
        finalizeBombWin(g, cfg, p, playerId);
        broadcastState();
      }
      return;
    }
    broadcastState();
  } else {
    g.bomb.lastChoice = {col:col,row:row,safe:false};
    broadcastState();
    addTimer(setTimeout(function(){
      g.bomb.turnIndex = (g.bomb.turnIndex+1) % g.bomb.order.length;
      bombNextConnectedTurn(g.bomb, g.players);
      g.bomb.currentCol = 0;
      g.bomb.turnRevealed = []; // fix #9: colors reset for next player - must rely on memory
      g.bomb.lastChoice = null;
      broadcastState();
    }, 2000));
  }
}

function bombSig(bomb){ return bomb.lastChoice ? (bomb.lastChoice.col+'-'+bomb.lastChoice.row+'-'+bomb.lastChoice.safe) : 'none'; }
var lastBombSoundSig = null;
function maybePlayBombSound(bomb){
  var sig = bombSig(bomb);
  if(sig !== lastBombSoundSig){
    lastBombSoundSig = sig;
    if(bomb.lastChoice) playSound(bomb.lastChoice.safe ? 'correct' : 'boom');
  }
}
var lastVictorySig = null;
function maybePlayVictorySound(bomb){
  if(!bomb.finished) return;
  var sig = bomb.instanceId+'-win';
  if(sig !== lastVictorySig){
    lastVictorySig = sig;
    playSound('victory');
  }
}

// Bomb grid is rendered ONLY when the underlying state actually changes (called from
// renderAll after a broadcastState), never on a timer - this removes the double/triple
// tap issue (fix #4/#9) since click handlers are never torn out mid-gesture.
function renderBombGrid(container, bomb, interactive, onPick){
  container.innerHTML = '';
  var row1 = document.createElement('div');
  row1.style.cssText = 'display:flex;align-items:center;gap:1.4vw;direction:ltr;';
  var arrow = document.createElement('div');
  arrow.className = 'bomb-arrow';
  arrow.textContent = '➡';
  var gridEl = document.createElement('div');
  gridEl.className = 'bomb-grid';
  // fix #4: compute one SQUARE cell size that fits the available space, instead of
  // stretching a fixed-width/height box into rectangles. Uses this device's own viewport,
  // so it adapts correctly whether it's the big display or a player's phone.
  var availW = window.innerWidth*0.8 - 70;
  var availH = window.innerHeight*0.52;
  var cellSize = Math.floor(Math.min(availW/bomb.cols, availH/bomb.rows));
  cellSize = Math.max(22, Math.min(cellSize, 150));
  gridEl.style.gridTemplateColumns = 'repeat('+bomb.cols+', '+cellSize+'px)';
  gridEl.style.gridTemplateRows = 'repeat('+bomb.rows+', '+cellSize+'px)';
  gridEl.style.width = 'auto';
  gridEl.style.height = 'auto';
  var cellFont = Math.max(14, Math.floor(cellSize*0.42));
  for(var r=0;r<bomb.rows;r++){
    for(var c=0;c<bomb.cols;c++){
      var cell = document.createElement('div');
      cell.className = 'bomb-cell';
      cell.style.gridColumnStart = c+1;
      cell.style.gridRowStart = r+1;
      cell.style.fontSize = cellFont+'px';
      var isRevealedSafe = bomb.turnRevealed.some(function(t){ return t.col===c && t.row===r; });
      var isLastBomb = bomb.lastChoice && bomb.lastChoice.col===c && bomb.lastChoice.row===r && !bomb.lastChoice.safe;
      var isLastSafe = bomb.lastChoice && bomb.lastChoice.col===c && bomb.lastChoice.row===r && bomb.lastChoice.safe;
      if(isRevealedSafe || isLastSafe) cell.classList.add('safe');
      if(isLastBomb){
        cell.classList.add('bomb');
        var img = document.createElement('img');
        img.src = ASSET_BASE + 'Bomb.png';
        cell.appendChild(img);
      }
      if(!bomb.finished && c===bomb.currentCol) cell.style.outline = '3px solid var(--gold)';
      if(interactive && c===bomb.currentCol){
        cell.style.cursor = 'pointer';
        (function(rr){ cell.addEventListener('click', function(){ onPick(rr); }, {passive:true}); })(r);
      }
      gridEl.appendChild(cell);
    }
  }
  row1.appendChild(arrow);
  row1.appendChild(gridEl);
  container.appendChild(row1);
}

function renderPlayerSlotsBomb(){
  var g = app.game;
  clearArenaSlots();
  var currentTurnId = (g.bomb && !g.bomb.finished) ? g.bomb.order[g.bomb.turnIndex] : null;
  g.players.forEach(function(p, idx){
    var slotNum = SLOT_ORDER[idx % 12];
    var pos = SLOT_POS[slotNum];
    var div = document.createElement('div');
    div.className = 'player-slot';
    Object.keys(pos).forEach(function(k){ div.style[k] = pos[k]; });
    var isTurn = p.id === currentTurnId;
    div.innerHTML =
      '<div class="status-circle" style="'+(isTurn?'background:var(--gold);box-shadow:0 0 12px var(--gold);':'')+'">'+(isTurn?'🎮':'')+'</div>'+
      '<div class="pname">'+escapeHtml(p.name)+'</div>'+
      '<div class="pscore">'+fmtScore(p.score)+'</div>';
    els.arenaWrap.appendChild(div);
  });
}

function renderBombDisplay(){
  var g = app.game;
  if(g.phase === 'bomb-tournament-finished' || g.phase === 'bomb-finished'){
    els.pcontrolsWrap.classList.add('hidden');
    els.displayWrap.classList.add('hidden');
    renderWinnerScreen();
    return;
  }
  hideWinnerScreen();
  els.pcontrolsWrap.classList.add('hidden');
  els.displayWrap.classList.remove('hidden');
  els.gameNameLabel.textContent = 'لعبة القنابل 💣';
  els.roundIndicator.textContent = g.bombConfig && g.bombConfig.scoringMode==='rounds' ? ('الجولة '+(g.phase==='bomb-playing'?(g.bombRoundsPlayed+1):g.bombRoundsPlayed)+'/'+g.bombConfig.roundsTotal) : '';
  els.readyOverlay.style.display = 'none';
  els.roundOverlay.classList.remove('active');
  renderPlayerSlotsBomb();
  els.arenaCenter.innerHTML = '';

  if(g.phase === 'bomb-round-finished'){
    var w = findPlayer(g.bomb.winnerId);
    var banner = document.createElement('div');
    banner.className = 'bomb-win-banner';
    banner.textContent = '🏆 فاز بهذه الجولة: ' + (w?w.name:'');
    els.arenaCenter.appendChild(banner);
    var gridHost0 = document.createElement('div');
    els.arenaCenter.appendChild(gridHost0);
    renderBombGrid(gridHost0, g.bomb, false); // path stays visible (fix #9)
    maybePlayVictorySound(g.bomb);
    return;
  }
  var turnPlayer = findPlayer(g.bomb.order[g.bomb.turnIndex]);
  var banner2 = document.createElement('div');
  banner2.className = 'bomb-turn-banner';
  banner2.textContent = turnPlayer ? ('دور: '+turnPlayer.name) : '';
  els.arenaCenter.appendChild(banner2);
  var gridHost = document.createElement('div');
  els.arenaCenter.appendChild(gridHost);
  renderBombGrid(gridHost, g.bomb, false);
  maybePlayBombSound(g.bomb);
}

function renderBombPlayer(){
  var g = app.game;
  if(g.phase === 'bomb-tournament-finished' || g.phase === 'bomb-finished'){
    els.displayWrap.classList.add('hidden');
    els.pcontrolsWrap.classList.add('hidden');
    renderWinnerScreen();
    return;
  }
  hideWinnerScreen();
  els.displayWrap.classList.add('hidden');
  els.pcontrolsWrap.classList.remove('hidden');
  var me = findPlayer(app.myPlayerId);
  var isLeader = app.myPlayerId === g.leaderId;
  els.pScoreLabel.textContent = me ? fmtScore(me.score) : '0';
  els.pRoundIndicator.textContent = g.bombConfig && g.bombConfig.scoringMode==='rounds' ? ((g.phase==='bomb-playing'?(g.bombRoundsPlayed+1):g.bombRoundsPlayed)+'/'+g.bombConfig.roundsTotal) : '';
  els.pGameNameLabel.textContent = 'لعبة القنابل 💣';
  els.btnSubmit.classList.add('hidden');
  els.counterContainer.classList.add('hidden');
  els.submittedLabel.classList.add('hidden');
  els.pgridContainer.classList.remove('hidden');
  els.btnNextRound.classList.add('hidden');
  els.btnBombNewRound.classList.add('hidden');
  els.btnBombToLobby.classList.add('hidden');
  els.btnBombContinue.classList.add('hidden');
  els.roundOverlay.classList.remove('active');

  if(g.phase === 'bomb-round-finished'){
    var w2 = findPlayer(g.bomb.winnerId);
    els.notifBar.textContent = '🏆 فاز بهذه الجولة: ' + (w2?w2.name:'');
    renderBombGrid(els.pgridContainer, g.bomb, false);
    maybePlayVictorySound(g.bomb);
    if(isLeader){
      els.btnBombContinue.classList.remove('hidden');
      els.btnBombToLobby.classList.remove('hidden');
    }
    return;
  }
  var myTurn = g.bomb.order[g.bomb.turnIndex] === app.myPlayerId;
  els.notifBar.textContent = myTurn ? 'دورك! اختر مربعاً آمناً' : 'بانتظار دور اللاعب الآخر...';
  renderBombGrid(els.pgridContainer, g.bomb, myTurn, function(row){
    sendToHost({t:'bomb-choose', row:row});
  });
  maybePlayBombSound(g.bomb);
}

})();
</script>
