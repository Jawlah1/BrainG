<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#0b1220; --border:#334155; --bg-rgb:15,23,42;
  --gold:#f5b942; --gold2:#d97706; --blue:#2563eb; --green:#22c55e; --red:#ef4444; --text:#f1f5f9; --sub:#94a3b8;
}
/* fix #5: 6 selectable color themes (3 dark incl. the default, 3 light) - every overlay
   and button below reads these variables so switching themes recolors the whole app. */
body.theme-1{ --bg:#170f28; --bg-rgb:23,15,40; --panel:#2a1c48; --panel2:#100a1e; --border:#4a3572; --gold:#c084fc; --gold2:#9333ea; --text:#f5eeff; --sub:#c7b6ec; }
body.theme-2{ --bg:#091f1b; --bg-rgb:9,31,27; --panel:#123330; --panel2:#061513; --border:#1f5952; --gold:#2dd4bf; --gold2:#0d9488; --text:#e7fffa; --sub:#7de9d8; }
body.theme-3{ --bg:#eaf4ff; --bg-rgb:234,244,255; --panel:#ffffff; --panel2:#dcebfe; --border:#b7d8fb; --gold:#2563eb; --gold2:#1d4ed8; --text:#0f172a; --sub:#51607a; }
body.theme-4{ --bg:#fff4e8; --bg-rgb:255,244,232; --panel:#ffffff; --panel2:#ffe4bf; --border:#f8c98a; --gold:#ea580c; --gold2:#c2410c; --text:#3a2410; --sub:#8a6642; }
body.theme-5{ --bg:#eafff6; --bg-rgb:234,255,246; --panel:#ffffff; --panel2:#d3f7e7; --border:#a3edcd; --gold:#059669; --gold2:#047857; --text:#0b3b2e; --sub:#3f7a63; }
/* 6 — وردي غامق (dark pink) */
body.theme-6{ --bg:#1f0f18; --bg-rgb:31,15,24; --panel:#3a1b2d; --panel2:#150a10; --border:#6a3352; --gold:#ffafcc; --gold2:#f472b6; --text:#fff0f6; --sub:#f2bcd3; }
/* 7 — وردي فاتح (light pink) */
body.theme-7{ --bg:#fff0f6; --bg-rgb:255,240,246; --panel:#ffffff; --panel2:#ffd6e6; --border:#ffafcc; --gold:#db2777; --gold2:#be185d; --text:#3b0a24; --sub:#8a4a68; }

.theme-swatch{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex:0 0 32px;}
.theme-swatch.selected{border-color:#fff;box-shadow:0 0 0 3px var(--gold);}
.theme-picker{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:12px;direction:ltr;}
.game-picker{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:12px;direction:ltr;}
.game-chip{padding:8px 12px;border-radius:20px;border:1px solid var(--border);background:var(--panel2);color:var(--sub);font-size:13px;cursor:pointer;}
.game-chip.on{background:var(--gold);color:#111827;border-color:var(--gold2);font-weight:800;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:"Tahoma","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);user-select:none;-webkit-user-select:none;}
.screen{display:none;position:fixed;inset:0;width:100%;height:100%;}
.screen.active{display:flex;flex-direction:column;}
.center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
/* fix: plain align-items:center clips the TOP of any content taller than the viewport and
   makes it permanently unreachable by scrolling (a well-known flexbox trap) - "safe center"
   keeps the nice vertical centering for short screens (home screen etc.) but automatically
   falls back to scrollable top-alignment once content overflows, e.g. a long player list.
   Older browsers that don't understand this value simply ignore the line and keep plain
   center above, so this is a safe progressive enhancement either way. */
.center-wrap{align-items:safe center;}
.card-panel{width:100%;max-width:460px;text-align:center;}
.main-logo{width:220px;height:auto;margin:0 auto 10px;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.55));}
.card-panel h1{font-size:24px;margin:0 0 6px;font-weight:800;}
.card-panel p.sub{color:var(--sub);font-size:13px;margin:0 0 18px;line-height:1.7;}
.field{margin-bottom:12px;text-align:right;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;}
input[type="text"],input[type="number"]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:16px;text-align:center;}
input:focus{outline:2px solid #38bdf8;}
button{font-family:inherit;}
button.primary{width:100%;padding:15px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px;}
button.primary:disabled{opacity:.4;}
button.gold{width:100%;padding:13px;border-radius:12px;border:1px solid var(--gold2);background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px;}
button.gold:disabled{opacity:.35;cursor:not-allowed;}
button.ghost{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;cursor:pointer;margin-top:8px;}
button.danger{width:100%;padding:12px;border-radius:12px;border:none;background:var(--red);color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px;}
button.danger:disabled{opacity:.35;cursor:not-allowed;}
button:active{transform:scale(.97);}
.status-msg{margin-top:12px;font-size:13px;color:var(--sub);min-height:16px;line-height:1.6;}
.status-msg.error{color:#f87171;}
.room-code-big{font-size:38px;font-weight:900;letter-spacing:8px;color:var(--gold);background:var(--panel2);border:1px dashed var(--border);border-radius:14px;padding:16px;margin:14px 0;direction:ltr;}
.hidden{display:none !important;}
#reconnect-banner{position:fixed;top:0;left:0;right:0;z-index:99999;background:#7c2d12;color:#fff;text-align:center;padding:10px;font-weight:800;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.4);}
/* Lobby */
.player-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:16px;gap:10px;flex-wrap:wrap;}
.player-row .pname{flex:1;text-align:right;display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;min-width:90px;}
.player-row .crown{color:var(--gold);}
.player-row .disc-tag{color:var(--red);font-size:11px;font-weight:700;}
.player-row .pscore{color:var(--sub);font-size:14px;min-width:34px;text-align:center;font-weight:700;}
.player-row .rdot{width:11px;height:11px;border-radius:50%;background:#475569;flex:0 0 11px;}
.player-row .rdot.ready{background:var(--green);box-shadow:0 0 6px var(--green);}
.player-row.disc{opacity:.55;}
.mini-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;width:36px;height:36px;font-size:16px;cursor:pointer;line-height:1;}
.mini-btn.kick-btn{background:rgba(239,68,68,.15);border-color:var(--red);color:var(--red);font-size:14px;margin-right:4px;}
.leader-ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.list-wrap{margin:10px 0;}
.settings-box{background:var(--panel);border-radius:12px;padding:14px;margin-top:14px;text-align:right;}
.settings-summary{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:10px 0;text-align:right;font-size:13px;color:var(--sub);line-height:2;}
.settings-summary b{color:var(--text);}
.settings-summary .theme-picker{justify-content:flex-end;margin:6px 0 0;}
.settings-summary .theme-swatch{cursor:default;width:26px;height:26px;display:inline-block;flex:none;}
.settings-box label{font-size:12px;color:var(--sub);display:block;margin-bottom:6px;}
.readybtn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px;background:#475569;color:#fff;}
.readybtn.on{background:var(--green);}
/* Game screens - sized generously for large display devices (TV/iPad) */
#screen-game{background:var(--bg);position:relative;overflow:hidden;}
.display-wrap{flex:1;position:relative;display:flex;flex-direction:column;}
.game-topbar{display:flex;align-items:center;justify-content:space-between;padding:1.2vh 2vw;background:var(--panel2);border-bottom:1px solid var(--border);font-size:clamp(14px,1.8vh,20px);color:var(--sub);}
.game-topbar .gname{color:var(--gold);font-weight:800;font-size:clamp(18px,2.6vh,30px);}
.arena-wrap{flex:1;position:relative;}
.player-slot{position:absolute;display:flex;flex-direction:column;align-items:center;gap:.6vh;width:clamp(110px,13vw,220px);}
.player-slot .status-circle{width:clamp(64px,10vh,116px);height:clamp(64px,10vh,116px);border-radius:50%;background:#475569;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,4.6vh,48px);font-weight:900;border:3px solid #1e293b;transition:background .2s;}
.player-slot .status-circle.gold{background:var(--gold);}
.player-slot .status-circle.correct{background:var(--green);}
.player-slot .status-circle.wrong{background:var(--red);}
.player-slot .pname{font-size:clamp(16px,2.2vh,26px);font-weight:800;max-width:clamp(110px,13vw,220px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.player-slot .pscore{font-size:clamp(16px,2.2vh,26px);color:var(--gold);font-weight:800;}
.player-slot .count-label{font-size:clamp(18px,2.6vh,30px);color:var(--gold);font-weight:900;min-height:1em;}
.arena-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1.4vh;}
/* Board cells are locked to an equal share of the board: minmax(0,1fr) instead of plain 1fr
   (whose minimum is the content size), so a cell showing a number can never grow bigger
   than an empty one. The board itself is sized once from the screen size. */
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:.6vh;width:min(80vh,86vw,880px);height:min(80vh,86vw,880px);direction:ltr;}
.cell5{min-width:0;min-height:0;overflow:hidden;line-height:1;background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,4.6vh,50px);font-weight:800;color:#fff;transition:background .15s;position:relative;}
.cell5.my-pick{box-shadow:inset 0 0 0 4px #f97316;}
.my-pick-badge{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#dc2626;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:900;line-height:1;}
.my-pick-badge.good{background:#16a34a;}
.cell5.red{background:#dc2626;border-color:#f87171;}
.cell5.blue{background:#2563eb;border-color:#60a5fa;}
.cell5.green{background:#16a34a;border-color:#4ade80;}
.cell5.path{background:#16a34a;border-color:#4ade80;}
.answer-label{font-size:clamp(18px,3vh,32px);font-weight:900;color:var(--gold);text-align:center;}
.next-round-label{position:absolute;bottom:1.5vh;left:50%;transform:translateX(-50%);font-size:clamp(14px,2vh,22px);font-weight:800;color:var(--sub);text-align:center;z-index:3;}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:.5vh;width:100%;height:100%;transition:transform .05s linear;direction:ltr;}
.cell6{min-width:0;min-height:0;overflow:hidden;background:var(--panel);border:1px solid var(--border);border-radius:6px;position:relative;}
.cell6.on{background:var(--gold);}
.cell6 .sq-check{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(30px,6vh,58px);color:#16a34a;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.5);}
.ready-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:rgba(var(--bg-rgb),.94);z-index:5;}
.ready-overlay .gtitle{font-size:clamp(26px,5vh,54px);font-weight:900;color:var(--gold);text-align:center;}
.ready-overlay .cdnum{font-size:clamp(70px,15vh,150px);font-weight:900;}
.round-overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;background:rgba(var(--bg-rgb),.96);z-index:6;padding:20px;}
.round-overlay.active{display:flex;}
.round-overlay .gtitle{font-size:clamp(24px,4vh,44px);font-weight:900;color:var(--gold);}
.round-overlay table{width:100%;max-width:460px;border-collapse:collapse;}
.round-overlay td{padding:1vh 1.2vw;border-bottom:1px solid var(--border);font-size:clamp(15px,2.4vh,24px);}
/* mobile player controls */
.pcontrols-wrap{flex:1;display:flex;flex-direction:column;}
.notif-bar{margin:14px;padding:16px;border:2px solid var(--border);border-radius:12px;text-align:center;font-size:16px;font-weight:800;min-height:24px;}
.pgrid-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;}
.pgrid-wrap .grid5{width:min(80vh,92vw,460px);height:min(80vh,92vw,460px);}
.counter-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.counter-num{font-size:64px;font-weight:900;color:var(--text);}
.counter-btn-wrap{position:relative;display:inline-block;}
.counter-btn{width:min(60vw,240px);height:min(60vw,240px);border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,var(--gold),var(--gold2));color:#fff;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.35);}
.counter-minus-btn{position:absolute;left:0;bottom:0;width:38px;height:38px;border-radius:50%;border:2px solid var(--border);background:var(--panel);color:var(--text);font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;line-height:1;}
.counter-minus-btn:active{transform:scale(.92);}
.counter-minus-btn:disabled{opacity:.35;}
/* Flags game - remaining counter box, character preview, and D-pad */
/* Player phone: everything scales to the space actually left on THIS phone's screen, so
   the reset button can never be pushed off the bottom. min-height:0 lets the area shrink
   inside the column; sizes use the area's own height (container units, cqh) with a
   viewport-height fallback for older browsers. */
.flags-pad-wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:1vh;padding:1vh 10px;overflow-y:auto;-webkit-overflow-scrolling:touch;container-type:size;}
.flags-remaining-box{flex:0 0 auto;border:2px solid var(--border);border-radius:12px;padding:.7vh 18px;font-size:clamp(13px,2.1vh,16px);font-weight:800;color:var(--text);background:var(--panel);}
.flags-remaining-box span:last-child{color:var(--gold);font-size:clamp(16px,2.8vh,22px);}
.flags-char-wrap{flex:0 0 auto;width:min(50vw,17vh,200px);height:min(50vw,17vh,200px);display:flex;align-items:center;justify-content:center;}
.flags-char-wrap img{max-width:100%;max-height:100%;}
.dpad-wrap{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;width:min(80vw,34vh,320px);height:min(80vw,34vh,320px);gap:0.1px;}
@supports (container-type:size){
  .flags-char-wrap{width:min(50cqw,21cqh,200px);height:min(50cqw,21cqh,200px);}
  .dpad-wrap{width:min(88cqw,47cqh,340px);height:min(88cqw,47cqh,340px);}
}
/* fix: grid items don't shrink below their image's own natural size by default, which is
   exactly what was pushing the down-arrow row taller than the grid's own box and making
   it bleed into the reset button underneath - min-width/height:0 + overflow:hidden makes
   each button properly respect its grid cell instead. */
.dpad-btn{background:transparent;border:none;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;min-width:0;min-height:0;overflow:hidden;}
.dpad-btn img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;}
.dpad-btn:active img{filter:brightness(1.25);}
.dpad-up{grid-column:2;grid-row:1;}
.dpad-down{grid-column:2;grid-row:3;}
/* fix: grid-column numbers are mirrored by the page's own RTL direction, so column 1
   actually renders on the right and column 3 on the left - swapping the numbers here
   (not the button ids/handlers) is what makes "left" visually land on the left. */
.dpad-left{grid-column:3;grid-row:2;}
.dpad-right{grid-column:1;grid-row:2;}
.dpad-down img{transform:rotate(180deg);}
.dpad-left img{transform:rotate(-90deg);}
.dpad-right img{transform:rotate(90deg);}
#btn-flags-reset{flex:0 0 auto;max-width:260px;margin:0;padding:clamp(8px,1.4vh,11px);font-size:clamp(12px,1.9vh,13px);}
/* short phones: tighten the fixed chrome around the game so the controls get the room */
@media (max-height:740px){
  .pcontrols-wrap .game-topbar{padding-top:.8vh;padding-bottom:.8vh;}
  .notif-bar{margin:8px 10px 4px;padding:10px 12px;font-size:15px;}
  .submit-btn{margin:8px 10px;padding:13px;}
}
@media (max-height:600px){
  .notif-bar{padding:7px 10px;font-size:14px;}
}
/* number field with a + button on the right and a − button on the left */
.stepper{display:flex;align-items:stretch;gap:8px;margin-bottom:8px;}
.stepper input[type="number"]{flex:1;min-width:0;margin:0;-moz-appearance:textfield;}
.stepper input[type="number"]::-webkit-inner-spin-button,.stepper input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.step-btn{flex:0 0 50px;border-radius:10px;border:1px solid var(--gold2);cursor:pointer;font-family:inherit;font-size:24px;font-weight:900;line-height:1;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;touch-action:manipulation;}
.step-btn:active{transform:scale(.92);}
.flags-seq-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px;}
.flags-seq-item{position:relative;width:44px;height:44px;border-radius:10px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;}
.flags-seq-item.my-pick{box-shadow:inset 0 0 0 3px #f97316;}
.counter-btn:active{transform:scale(.95);}
.counter-btn:disabled{opacity:.35;}
.submit-btn{margin:14px;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111827;font-weight:900;font-size:16px;cursor:pointer;}
.submit-btn:disabled{opacity:.4;}
.submitted-label{font-size:26px;font-weight:900;color:var(--green);}
.leader-inline-btns{padding:0 14px 14px;}
/* bomb game */
.bomb-grid{display:grid;gap:.5vh;direction:ltr;}
.bomb-cell{background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,2.6vh,28px);position:relative;}
.bomb-cell.safe{background:#16a34a;}
.bomb-cell.bomb{background:#dc2626;}
.bomb-cell img{width:70%;height:70%;object-fit:contain;}
.bomb-arrow{font-size:clamp(22px,4vh,42px);color:#ef4444;}
.bomb-turn-banner{text-align:center;padding:1vh;font-weight:800;color:var(--gold);font-size:clamp(16px,2.6vh,26px);}
.bomb-win-banner{text-align:center;padding:1vh;font-weight:900;color:var(--gold);font-size:clamp(20px,3.4vh,34px);}
/* fix #4: winner celebration screen */
.winner-screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:1.6vh;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(var(--bg-rgb),.97);padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));}
.winner-screen > *{flex-shrink:0;}
/* confetti / emoji layers stay pinned to the screen even if a small phone has to scroll */
.winner-screen > .fx-layer, .winner-screen > .emoji-burst-layer{position:fixed;}
.winner-trophy{font-size:clamp(50px,10vh,120px);}
.winner-name{font-size:clamp(30px,6.4vh,72px);font-weight:900;color:var(--gold);text-align:center;text-shadow:0 4px 20px rgba(0,0,0,.35);}
.winner-sub{font-size:clamp(15px,2.2vh,24px);color:var(--sub);text-align:center;}
/* fix: the scoreboard used to be pinned to the bottom of the screen, so on the leader's
   phone it sat ON TOP of the "new bomb round" / "back to lobby" buttons. It is now part of
   the normal flow and always placed last - underneath any buttons. */
.winner-scoreboard{position:relative;order:99;margin-top:1.4vh;font-size:clamp(11px,1.4vh,15px);color:var(--sub);display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:92vw;padding:0 10px;z-index:2;}
.winner-scoreboard span.me{color:var(--gold);font-weight:800;}
.emoji-burst-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;}
.fx-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;}
.confetti-piece{position:absolute;top:-4%;width:9px;height:14px;opacity:.9;border-radius:1px;animation-name:confetti-fall;animation-timing-function:linear;animation-fill-mode:forwards;}
@keyframes confetti-fall{0%{transform:translate(0,0) rotate(0deg);opacity:.95;}100%{transform:translate(var(--sway),112vh) rotate(var(--rot));opacity:.85;}}
.firework-particle{position:absolute;width:6px;height:6px;border-radius:50%;animation:firework-pop .95s ease-out forwards;}
@keyframes firework-pop{0%{transform:translate(0,0);opacity:1;}100%{transform:translate(var(--dx),var(--dy));opacity:0;}}
.emoji-burst-item{position:absolute;font-size:clamp(30px,6vh,64px);opacity:0;will-change:left,top,opacity;}
.celebrate-emojis{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px;max-width:94vw;z-index:2;position:relative;}
.celebrate-emoji-btn{font-size:26px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 10px;cursor:pointer;}
.celebrate-emoji-btn:disabled{opacity:.35;}
/* ---------- Words game (Arabic Wordle) ---------- */
body{ --present:#c79a2b; --absent-bg:rgba(128,128,128,.42); }
#btn-start-words{background:linear-gradient(135deg,#15803d,#22c55e);border-color:#15803d;}
.words-wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:1vh;padding:.4vh 8px calc(.8vh + env(safe-area-inset-bottom));}
/* the board takes whatever height is left above the keyboard; tiles size themselves to it */
.words-board-wrap{position:relative;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size;}
.words-board{--rows:6;--gap:6px;display:flex;flex-direction:column;gap:var(--gap);direction:rtl;
  --tile:min(15vw, calc((52vh - 5*6px)/6), 62px);}
@supports (container-type:size){
  .words-board{--tile:min(64px, calc((100cqw - 4*var(--gap))/5), calc((100cqh - (var(--rows) - 1)*var(--gap))/var(--rows)));}
}
.words-row{display:grid;grid-template-columns:repeat(5, var(--tile));gap:var(--gap);}
.words-tile{width:var(--tile);height:var(--tile);display:flex;align-items:center;justify-content:center;
  border-radius:8px;border:1.5px solid var(--border);background:var(--panel2);color:var(--text);
  font-family:inherit;font-weight:700;font-size:calc(var(--tile)*.52);line-height:1;overflow:hidden;}
.words-tile.filled{border-color:var(--gold);background:var(--panel);}
.words-tile.correct{background:var(--green);border-color:transparent;color:#fff;}
.words-tile.present{background:var(--present);border-color:transparent;color:#fff;}
.words-tile.absent{background:var(--absent-bg);border-color:transparent;color:var(--text);}
.words-tile.hidden-letter{color:var(--gold);background:var(--panel);border-color:var(--gold);}
.words-tile.flip{animation:words-flip .45s ease both;}
@keyframes words-flip{0%{transform:rotateX(90deg);}100%{transform:rotateX(0);}}
.words-row.shake{animation:words-shake .45s ease;}
@keyframes words-shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-7px);}40%,80%{transform:translateX(7px);}}
.words-tile{position:relative;}
/* how many times a GREEN letter appears in the word (only shown when more than once) */
.words-count{position:absolute;top:2px;left:3px;font-family:inherit;font-size:max(9px, calc(var(--tile)*.24));font-weight:700;line-height:1;color:#fff;opacity:.95;}
.words-giveup{flex:0 0 auto;margin-top:0;padding:clamp(7px,1.2vh,10px);font-size:clamp(12px,1.8vh,14px);}
.words-toast{position:absolute;top:2px;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap;
  padding:8px 16px;border-radius:8px;font-weight:700;font-size:14px;color:var(--bg);background:var(--text);box-shadow:0 10px 20px -10px rgba(0,0,0,.35);}

/* on-screen Arabic keyboard */
.words-kb{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;direction:rtl;}
.words-kb-row{display:flex;gap:4px;justify-content:center;}
.words-key{flex:1 1 0;min-width:0;height:clamp(40px,6.4vh,58px);padding:0;border-radius:8px;cursor:pointer;touch-action:manipulation;
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  font-family:inherit;font-size:clamp(16px,2.6vh,22px);font-weight:700;line-height:1;}
.words-key.wide{flex:1.55 1 0;font-family:inherit;font-size:clamp(13px,2vh,15px);}
.words-key.enter{background:var(--gold2);color:#fff;border-color:transparent;}
.words-key.del{font-size:clamp(18px,2.8vh,24px);}
.words-key.correct{background:var(--green);color:#fff;border-color:transparent;}
.words-key.present{background:var(--present);color:#fff;border-color:transparent;}
.words-key.absent{background:var(--absent-bg);color:var(--sub);border-color:transparent;}
.words-key:disabled{opacity:.5;}
@media (max-height:640px){ .words-kb{gap:4px;} .words-key{height:clamp(34px,6vh,44px);} }

/* display screen */
.words-bigrow{display:flex;gap:1.2vh;direction:rtl;--tile:clamp(64px,14vh,150px);}
.words-bigrow .words-tile{border-width:2px;}
.words-mini{display:flex;gap:3px;direction:rtl;--tile:clamp(18px,2.9vh,32px);}
.words-mini .words-tile{border-radius:3px;border-width:1px;}
.words-mini-none{font-family:inherit;color:var(--sub);}
/* long-press keys (ا -> أ, و -> ؤ, ى -> ئ): the second letter shows small in the corner */
.words-key{position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
.words-key.has-alt::after{content:attr(data-alt);position:absolute;top:2px;left:4px;font-size:clamp(9px,1.4vh,11px);line-height:1;opacity:.6;pointer-events:none;}
.words-key.pressing{filter:brightness(1.25);transform:scale(.95);}/* words game: round countdown (display + phones) */
.words-clock{font-size:clamp(34px,7vh,72px);font-weight:800;line-height:1;direction:ltr;font-variant-numeric:tabular-nums lining-nums;color:var(--text);}
.notif-bar.words-clock-bar{font-size:clamp(24px,3.8vh,34px);direction:ltr;font-variant-numeric:tabular-nums lining-nums;letter-spacing:1px;}
.words-clock.low, .notif-bar.words-clock-bar.low{color:var(--red);}

/* ===================== Interactive games: Recycle ♻️ ===================== */
.inter-wrap{flex:1 1 0;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;gap:1.3vh;
  padding:.6vh 14px calc(1.2vh + env(safe-area-inset-bottom));}
.rc-bin-area{position:relative;flex:0 0 auto;height:clamp(78px,14vh,150px);display:flex;align-items:center;justify-content:center;
  border:2px dashed var(--border);border-radius:14px;background:var(--panel2);}
.rc-bin{font-size:clamp(44px,8.5vh,84px);line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));}
.rc-timer{position:absolute;top:8px;left:12px;font-size:clamp(16px,2.6vh,22px);font-weight:800;direction:ltr;font-variant-numeric:tabular-nums lining-nums;color:var(--sub);}
.rc-timer.low{color:var(--red);}
.rc-belt{position:relative;flex:0 0 auto;height:clamp(76px,13vh,122px);direction:ltr;border-radius:12px;background:var(--panel);border:1px solid var(--border);}
.rc-belt::before, .rc-belt::after{content:"";position:absolute;left:0;right:0;height:10px;opacity:.85;
  background:repeating-linear-gradient(90deg, var(--border) 0 16px, transparent 16px 32px);animation:rc-belt-move .5s linear infinite;}
.rc-belt::before{top:0;border-radius:12px 12px 0 0;}
.rc-belt::after{bottom:0;border-radius:0 0 12px 12px;}
@keyframes rc-belt-move{from{background-position:0 0;}to{background-position:32px 0;}}
.rc-target{position:absolute;left:50%;top:14%;bottom:14%;width:clamp(72px,12vh,112px);transform:translateX(-50%);
  border:2px dashed var(--gold);border-radius:12px;opacity:.55;}
.rc-item{position:absolute;left:50%;top:50%;z-index:3;font-size:clamp(42px,8vh,76px);line-height:1;transform:translate(-50%,-50%);
  will-change:transform,opacity;pointer-events:none;}
/* queue on the belt: pos-0 = in the frame (full size), pos-1/pos-2 = coming up (smaller),
   pos-3 = just off the left edge (where new items roll in from) */
.rc-item{transition:left .13s ease-out, transform .13s ease-out, opacity .13s ease-out;}
.rc-item.pos-0{left:50%;transform:translate(-50%,-50%) scale(1);}
.rc-item.pos-1{left:26%;transform:translate(-50%,-50%) scale(.6);opacity:.92;}
.rc-item.pos-2{left:9%;transform:translate(-50%,-50%) scale(.48);opacity:.78;}
.rc-item.pos-3{left:-14%;transform:translate(-50%,-50%) scale(.42);opacity:0;}
.rc-out-right{animation:rc-out-right .2s ease-in both;}
@keyframes rc-out-right{to{transform:translate(calc(-50% + 56vw),-50%) rotate(20deg);opacity:.15;}}
.rc-out-up{animation:rc-out-up .24s cubic-bezier(.3,.7,.4,1) both;}
@keyframes rc-out-up{55%{opacity:1;filter:none;}to{transform:translate(-50%,calc(-50% - 16vh)) scale(.3) rotate(-30deg);opacity:0;
  filter:sepia(1) saturate(6) hue-rotate(-25deg) brightness(1.5);}}
.rc-controls{flex:1 1 auto;min-height:0;display:flex;direction:ltr;gap:5vw;align-items:center;justify-content:center;}
.rc-btn{width:min(38vw,22vh,190px);height:min(38vw,22vh,190px);flex:0 0 auto;padding:0;border:none;border-radius:18px;cursor:pointer;
  background:#fff;color:#111;display:flex;align-items:center;justify-content:center;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.55), inset 0 -6px 0 rgba(0,0,0,.12);transition:transform .05s, opacity .1s;}
.rc-btn:active{transform:scale(.93);}
.rc-btn svg{width:60%;height:60%;fill:currentColor;pointer-events:none;}
.rc-score-label{text-align:center;font-weight:700;color:var(--sub);font-size:clamp(13px,2vh,18px);}
.rc-score{text-align:center;font-size:clamp(46px,9.5vh,96px);font-weight:900;line-height:1;color:var(--text);font-variant-numeric:tabular-nums lining-nums;}
.rc-hold .rc-btn{opacity:.4;filter:grayscale(.7);}
.rc-wrong .rc-belt{animation:rc-wrong .5s ease-out;}
@keyframes rc-wrong{0%,40%{box-shadow:inset 0 0 0 3px var(--red), 0 0 22px rgba(220,40,60,.55);}100%{box-shadow:none;}}
.rc-wrong .rc-controls{animation:rc-shake .28s;}
@keyframes rc-shake{25%{transform:translateX(-7px);}50%{transform:translateX(7px);}75%{transform:translateX(-4px);}}
.rc-dead .rc-belt, .rc-dead .rc-controls, .rc-dead .rc-bin-area{opacity:.3;filter:grayscale(1);}
@media (max-height:620px){ .rc-bin-area{height:64px;} .rc-belt{height:66px;} .rc-score{font-size:40px;} }

/* shot out: shattered screen + blood (phone) */
.elim-overlay{position:fixed;inset:0;z-index:40;pointer-events:none;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);}
.elim-overlay .crack-svg{position:absolute;inset:0;width:100%;height:100%;}
.crack-lines path{fill:none;stroke:rgba(255,255,255,.88);stroke-width:1.3;vector-effect:non-scaling-stroke;}
.blood circle, .blood path{fill:#a4001a;opacity:.93;}
.bullet-hole{fill:#0c0c0c;stroke:#666;stroke-width:1;vector-effect:non-scaling-stroke;}
.elim-text{position:relative;font-size:clamp(34px,7vh,62px);font-weight:900;color:#fff;transform:rotate(-7deg);
  text-shadow:0 3px 12px #000, 0 0 26px #a4001a;}
.elim-hit{animation:elim-hit .5s ease-out;}
.elim-hit .crack-svg{animation:crack-in .22s ease-out both;}
@keyframes elim-hit{0%{background:rgba(255,255,255,.95);}100%{background:rgba(0,0,0,.4);}}
@keyframes crack-in{from{transform:scale(.7);opacity:0;}to{transform:none;opacity:1;}}
.leader-inline-btns{position:relative;z-index:41;}

/* display: players, gun, elimination */
.player-slot.inter-out .status-circle, .player-slot.inter-out .pname, .player-slot.inter-out .pscore, .player-slot.inter-out .count-label{opacity:.55;filter:grayscale(.8);}
.player-slot.inter-idle{opacity:.35;}
.slot-crack{position:absolute;left:50%;top:0;width:clamp(90px,14vh,150px);height:clamp(90px,14vh,150px);transform:translateX(-50%);pointer-events:none;border-radius:50%;overflow:hidden;z-index:2;} /* no entrance animation: the slots are redrawn every frame */
.slot-crack .crack-svg{width:100%;height:100%;}
.inter-emojis{font-size:clamp(28px,6vh,58px);letter-spacing:4px;line-height:1.2;text-align:center;}
.inter-clock{margin-top:1vh;}
.gun-stage{position:relative;width:min(42vw,54vh);height:min(28vw,36vh);display:flex;align-items:center;justify-content:center;
  animation:gun-in .45s cubic-bezier(.2,.9,.3,1.25) both;}
@keyframes gun-in{from{transform:translateY(45vh) rotate(-25deg);opacity:0;}to{transform:none;opacity:1;}}
.gun-stage.fired{animation:gun-kick .28s ease-out;}
@keyframes gun-kick{30%{transform:translate(-14px,-8px) rotate(-4deg);}}
.gun-stage.gone{display:none;}
.gun-svg{width:100%;height:100%;overflow:visible;transform:rotate(var(--aim,0deg)) scaleX(var(--flip,1));transition:transform .45s cubic-bezier(.2,.9,.3,1.2);}
.gun-slide rect:first-child, .gun-frame, .gun-barrel{fill:var(--gun-metal,#2c3038);stroke:var(--gun-edge,#9aa3ad);stroke-width:2;}
.gun-grip{fill:var(--gun-grip,#5b3b27);stroke:var(--gun-edge,#9aa3ad);stroke-width:2;}
.gun-guard{fill:none;stroke:var(--gun-edge,#9aa3ad);stroke-width:6;}
.gun-trigger, .gun-sight{fill:var(--gun-edge,#9aa3ad);}
.gun-serr{fill:none;stroke:var(--gun-edge,#9aa3ad);stroke-width:2;}
.gun-flash{opacity:0;fill:#ffd24a;}
.reloading .gun-slide{animation:gun-rack .75s ease-in-out .15s both;}
@keyframes gun-rack{35%{transform:translateX(-30px);}55%{transform:translateX(-30px);}100%{transform:none;}}
.fired .gun-slide{animation:gun-recoil .16s ease-out;}
@keyframes gun-recoil{40%{transform:translateX(-22px);}}
.fired .gun-flash{animation:gun-flash .2s ease-out both;}
@keyframes gun-flash{0%{opacity:1;}100%{opacity:0;}}
.gun-tracer{position:absolute;left:50%;top:50%;height:4px;transform-origin:0 50%;opacity:0;border-radius:2px;
  background:linear-gradient(90deg, rgba(255,255,255,0), #ffe38a 60%, #fff);}
.fired .gun-tracer{animation:gun-tracer .22s ease-out both;}
@keyframes gun-tracer{0%{opacity:1;}100%{opacity:0;}}
.shot-flash{animation:shot-flash .3s ease-out;}
@keyframes shot-flash{0%{filter:brightness(2.4);}100%{filter:none;}}
.elim-panel{min-width:min(62vw,560px);max-width:92vw;padding:2.2vh 3vw;text-align:center;border-radius:14px;
  background:var(--panel);border:1px solid var(--border);animation:crack-in .3s ease-out both;}
.elim-title{font-size:clamp(24px,4.4vh,44px);font-weight:900;color:var(--red);}
.elim-sub{margin-top:.6vh;color:var(--sub);font-size:clamp(14px,2.2vh,22px);}
.elim-table{width:100%;border-collapse:collapse;margin-top:1.6vh;font-size:clamp(16px,2.6vh,27px);}
.elim-table td{padding:.9vh 1.2vw;border-bottom:1px solid var(--border);text-align:right;font-weight:700;}
.elim-table td:last-child{text-align:center;width:22%;color:var(--gold);font-variant-numeric:tabular-nums lining-nums;}
.elim-table tr.lost td{color:var(--red);}
.elim-table td:last-child{direction:ltr;}
.elim-title.res{color:var(--gold);}
.elim-table tr.win td{color:var(--gold);font-weight:900;}

/* smelting furnace (replaces the recycle bin): molten metal, bubbles, sparks, heat glow */
.rc-bin-area.rc-furnace{overflow:hidden;border:2px solid #3b2a22;border-radius:14px;
  background:radial-gradient(120% 95% at 50% 125%, #ff9a1f 0%, #d9480f 28%, #5a1a08 56%, #1b0d08 80%), #140a07;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.35), inset 0 -18px 40px rgba(255,120,0,.4), 0 0 24px -6px rgba(255,100,0,.55);}
.rc-furnace-label{position:absolute;top:7px;left:0;right:0;text-align:center;font-size:clamp(11px,1.8vh,14px);font-weight:800;
  color:#ffd9a8;opacity:.8;letter-spacing:.5px;text-shadow:0 0 8px rgba(255,120,0,.8);}
.rc-furnace .rc-timer{color:#ffe7c2;text-shadow:0 0 8px rgba(0,0,0,.8);z-index:2;}
.rc-molten{position:absolute;left:-10%;right:-10%;bottom:-14%;height:60%;border-radius:50% 50% 0 0 / 30% 30% 0 0;
  background:radial-gradient(60% 60% at 50% 28%, #fff6b0 0%, #ffd23f 20%, #ff8c1a 48%, #e2470d 74%, #8e2607 100%);
  box-shadow:0 -6px 22px rgba(255,170,40,.75), inset 0 8px 16px rgba(255,255,210,.5);
  animation:rc-molten 2.2s ease-in-out infinite alternate;}
@keyframes rc-molten{from{transform:translateY(0) scaleX(1);}to{transform:translateY(-5%) scaleX(1.04);}}
.rc-heat{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg, rgba(255,140,0,.28), rgba(255,90,0,.05) 55%, transparent 80%);
  animation:rc-heat 1.4s ease-in-out infinite alternate;}
@keyframes rc-heat{from{opacity:.7;}to{opacity:1;}}
.rc-bubble{position:absolute;bottom:22%;width:10px;height:10px;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 35% 35%, #fffbe0, #ffc233 55%, rgba(255,120,0,0) 72%);animation:rc-bubble 1.9s ease-in infinite;}
.rc-bubble.b1{left:16%;animation-delay:.1s;} .rc-bubble.b2{left:33%;animation-delay:.8s;width:7px;height:7px;}
.rc-bubble.b3{left:52%;animation-delay:.4s;width:12px;height:12px;} .rc-bubble.b4{left:69%;animation-delay:1.2s;}
.rc-bubble.b5{left:85%;animation-delay:.6s;width:8px;height:8px;}
@keyframes rc-bubble{0%{transform:translateY(6px) scale(.4);opacity:0;}30%{opacity:1;}100%{transform:translateY(-18px) scale(1.25);opacity:0;}}
.rc-spark{position:absolute;bottom:34%;width:3px;height:3px;border-radius:50%;opacity:0;background:#ffe27a;
  box-shadow:0 0 6px 1px #ffb300;animation:rc-spark 1.5s linear infinite;}
.rc-spark.s1{left:22%;animation-delay:.2s;} .rc-spark.s2{left:41%;animation-delay:.9s;} .rc-spark.s3{left:58%;animation-delay:.5s;}
.rc-spark.s4{left:74%;animation-delay:1.2s;} .rc-spark.s5{left:48%;animation-delay:.05s;}
@keyframes rc-spark{0%{transform:translate(0,0);opacity:0;}15%{opacity:1;}100%{transform:translate(10px,-60px);opacity:0;}}
.rc-furnace.rc-splash{animation:rc-furnace-flash .35s ease-out;}
@keyframes rc-furnace-flash{0%{box-shadow:inset 0 0 0 3px rgba(0,0,0,.35), inset 0 -30px 60px rgba(255,200,60,.95), 0 0 40px 4px rgba(255,140,0,.9);}}
.rc-furnace.rc-splash .rc-molten{filter:brightness(1.35);}

/* v1 look: solid, friendly, rounded */
.rc-btn{border-radius:22px;}
.rc-recycle{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;}
.rc-pass{background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff;}
.rc-bin-area{border-color:var(--gold);}
.gun-stage{--gun-metal:#2b2f36;--gun-edge:#cbd5e1;--gun-grip:#7c4a2d;}
.rc-bin-area.rc-furnace{border-radius:18px;border-color:#5b3a26;}

/* ===================== Characters (interactive games) ===================== */
/* display: each player's character stands on a little stage where their marker was */
.player-slot.has-char .char-stage{position:relative;width:clamp(67px,11.6vh,136px);height:clamp(84px,14.5vh,170px);}
.player-slot.has-char .char-stage::before{content:"";position:absolute;left:6%;right:6%;bottom:-5%;height:16%;border-radius:50%;
  background:var(--panel2);border:1px solid var(--border);}
.char-badge{position:absolute;right:-16%;bottom:10%;z-index:4;min-width:1.7em;padding:.08em .4em;border-radius:999px;text-align:center;
  font-size:clamp(14px,2.2vh,24px);font-weight:900;line-height:1.25;background:var(--gold);color:#15110a;direction:ltr;
  font-variant-numeric:tabular-nums lining-nums;box-shadow:0 4px 10px -4px rgba(0,0,0,.6);}
.char-layer{position:absolute;inset:0;pointer-events:none;z-index:3;}
.arena-wrap.inter-mode .arena-center{z-index:4;}
.inter-pick-title{font-size:clamp(28px,5.5vh,58px);font-weight:900;color:var(--gold);text-align:center;}

/* a character: shadow, body (the image), emoji effects */
.char-sprite{position:absolute;pointer-events:none;}
.char-sprite .cs-body{position:absolute;inset:0;transform-origin:50% 100%;animation:cs-breathe 2.4s ease-in-out infinite;animation-delay:var(--phase,0s);}
.char-sprite .cs-body img{position:absolute;display:block;height:auto;max-width:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));}
.char-sprite .cs-shadow{position:absolute;left:14%;right:14%;bottom:-4%;height:11%;border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(0,0,0,.5), rgba(0,0,0,0) 70%);}
@keyframes cs-breathe{0%,100%{transform:scale(1,1);}50%{transform:scale(.985,1.02);}}
.char-sprite.st-happy .cs-body{animation:cs-hop .5s ease-in-out infinite;}
@keyframes cs-hop{0%,100%{transform:translateY(0) scale(1,1);}40%{transform:translateY(-9%) scale(.97,1.04);}80%{transform:translateY(0) scale(1.05,.95);}}
.char-sprite.st-scared .cs-body{animation:cs-shiver .09s linear infinite;}
.char-sprite.st-scared .cs-body img{filter:drop-shadow(0 0 8px rgba(120,180,255,.75)) drop-shadow(0 4px 6px rgba(0,0,0,.35));}
@keyframes cs-shiver{0%,100%{transform:translateX(-2%);}50%{transform:translateX(2%);}}
.char-sprite.st-angry .cs-body{animation:cs-rage .12s linear infinite;}
.char-sprite.st-angry .cs-body img{filter:drop-shadow(0 0 10px rgba(255,90,40,.85)) drop-shadow(0 4px 6px rgba(0,0,0,.35));}
@keyframes cs-rage{0%,100%{transform:translate(0,0);}25%{transform:translate(1.5%,-1%);}75%{transform:translate(-1.5%,1%);}}
.char-sprite.st-sad .cs-body{animation:cs-sway 3s ease-in-out infinite;}
.char-sprite.st-sad .cs-body img{filter:saturate(.6) brightness(.9) drop-shadow(0 4px 6px rgba(0,0,0,.35));}
@keyframes cs-sway{0%,100%{transform:rotate(-2deg);}50%{transform:rotate(2deg);}}
.char-sprite.st-fallen .cs-body{animation:none;}
/* shot: white flash, flung away from the gun, lands */
.char-sprite.cs-hit .cs-body{animation:cs-hit .75s cubic-bezier(.2,.8,.3,1) both;}
@keyframes cs-hit{0%{transform:scale(1.12);filter:brightness(3);}
  30%{transform:translate(calc(var(--kx,1)*30%),-22%) rotate(calc(var(--kx,1)*35deg));filter:brightness(1.3);}
  100%{transform:none;filter:none;}}
.char-sprite.cs-dim{opacity:.55;filter:grayscale(.85);}
.char-sprite.cs-dim .cfx-ghost{display:none;}

/* emoji effects over the head (--head = top of the drawn character) */
.char-sprite .cfx{position:absolute;line-height:1;pointer-events:none;}
.char-sprite .cfx-crown{display:none;left:50%;margin-left:-.5em;top:calc(var(--head,0%) - 1.05em);font-size:1em;animation:cfx-pop .4s ease-out both;}
.char-sprite.crowned .cfx-crown{display:block;}
.cfx-sweat{left:66%;top:calc(var(--head,0%) + .2em);font-size:.75em;animation:cfx-drip 1s ease-in infinite;}
.cfx-alert{left:50%;margin-left:-.5em;top:calc(var(--head,0%) - 1.05em);font-size:1em;animation:cfx-pop .35s ease-out both;}
.cfx-anger{left:64%;top:calc(var(--head,0%) - .1em);font-size:.85em;animation:cfx-pulse .45s ease-in-out infinite;}
.cfx-cloud{left:50%;margin-left:-.5em;top:calc(var(--head,0%) - 1.1em);font-size:1em;animation:cfx-float 2.4s ease-in-out infinite;}
.cfx-spark{font-size:.7em;animation:cfx-twinkle .9s ease-in-out infinite;}
.cfx-spark.s1{left:4%;top:calc(var(--head,0%) + .3em);}
.cfx-spark.s2{left:80%;top:calc(var(--head,0%) + 1.2em);animation-delay:.45s;}
.cfx-dizzy{left:50%;margin-left:-.5em;top:calc(var(--head,0%) - 1em);font-size:.85em;animation:cfx-spin 1.2s linear infinite;}
.cfx-ghost{left:50%;margin-left:-.5em;top:var(--head,0%);font-size:.9em;opacity:0;animation:cfx-ghost 2.2s ease-out .5s both;}
@keyframes cfx-drip{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(.9em);opacity:0;}}
@keyframes cfx-pop{0%{transform:scale(0);}60%{transform:scale(1.4);}100%{transform:scale(1);}}
@keyframes cfx-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.35);}}
@keyframes cfx-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-.15em);}}
@keyframes cfx-twinkle{0%,100%{opacity:0;transform:scale(.4);}50%{opacity:1;transform:scale(1.1);}}
@keyframes cfx-spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
@keyframes cfx-ghost{0%{opacity:0;transform:translateY(0);}15%{opacity:.95;}100%{opacity:0;transform:translateY(-2.6em);}}

/* phone: pick a character */
.cpick-wrap{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.6vh 12px calc(12px + env(safe-area-inset-bottom));}
.cp-title{text-align:center;font-weight:900;font-size:clamp(18px,3vh,26px);margin:.4vh 0 1.2vh;color:var(--gold);}
.cp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px;}
.cp-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;margin:0;border-radius:14px;
  border:2px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font:inherit;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;transition:transform .1s;}
.cp-card:active{transform:scale(.95);}
.cp-img{position:relative;display:block;width:100%;height:0;padding-top:125%;overflow:hidden;}
.cp-img img{position:absolute;height:auto;max-width:none;pointer-events:none;}
.cp-name{font-weight:800;font-size:14px;line-height:1.2;}
.cp-owner{font-size:11px;color:var(--sub);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cp-card.mine{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 2px var(--gold);}
.cp-card.taken{opacity:.42;filter:grayscale(.9);}
.cp-card.cp-no{animation:rc-shake .28s;}

/* phone: my character next to the score */
.rc-avatar{position:absolute;left:10px;bottom:calc(.8vh + env(safe-area-inset-bottom));width:clamp(64px,10vh,110px);height:clamp(80px,12.5vh,138px);
  pointer-events:none;z-index:2;}
.rc-avatar .char-sprite{left:0;top:0;width:100%;height:100%;font-size:clamp(18px,3vh,32px);}

/* winner screen: the winner's character celebrating */
.winner-char{position:relative;width:clamp(96px,17.6vh,200px);height:clamp(120px,22vh,250px);flex-shrink:0;}
.winner-char img{position:absolute;height:auto;max-width:none;transform-origin:50% 100%;animation:cs-hop .7s ease-in-out infinite;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));}
@media (prefers-reduced-motion: reduce){ .char-sprite .cs-body, .winner-char img, .cp-card.mine .cp-img img{animation:none !important;} }

/* v17: pick pose stands still (no hopping, no effects) */
.char-sprite.cs-still .cs-body{animation:none;}
.char-sprite.cs-still .cs-fx{display:none;}

/* the final face-off of a round: the last two come in, then VS */
.faceoff{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;
  background:radial-gradient(ellipse at center, rgba(140,10,10,.38), rgba(0,0,0,.9) 72%);}
.fo-title{font-size:clamp(28px,6vh,64px);font-weight:900;color:var(--gold);text-align:center;animation:fo-pulse 1.2s ease-in-out infinite;}
@keyframes fo-pulse{50%{transform:scale(1.06);}}
.fo-row{display:flex;direction:ltr;align-items:center;justify-content:center;gap:5vw;}
.fo-side{display:flex;flex-direction:column;align-items:center;gap:.6vh;opacity:0;transform:translateX(-45vw);
  transition:transform .5s cubic-bezier(.2,1.25,.4,1), opacity .3s;}
.fo-s1{transform:translateX(45vw);}
.fo-side.in{opacity:1;transform:none;}
.fo-char{position:relative;width:clamp(150px,30vh,330px);height:clamp(190px,38vh,410px);}
.fo-char img{position:absolute;height:auto;max-width:none;filter:drop-shadow(0 0 24px rgba(255,80,40,.75)) drop-shadow(0 10px 16px rgba(0,0,0,.5));}
.fo-side.talk .fo-char{animation:cs-rage .12s linear infinite;}
.fo-name{font-size:clamp(20px,3.6vh,40px);font-weight:900;color:var(--text);}
.fo-cname{font-size:clamp(14px,2.2vh,24px);color:var(--sub);}
.fo-vs{font-size:clamp(48px,11vh,128px);font-weight:900;color:#ff3b3b;text-shadow:0 0 30px rgba(255,40,40,.85), 0 4px 0 #400;
  opacity:0;transform:scale(3);transition:transform .35s cubic-bezier(.2,1.4,.4,1), opacity .2s;}
.fo-vs.in{opacity:1;transform:none;}

/* winner screen (interactive): first the winner's character alone, big, saying its victory
   line - then the screen settles and the music starts */
.winner-char{transition:transform .7s cubic-bezier(.2,.8,.2,1);}
.winner-screen.wi-intro > *:not(.winner-char):not(.fx-layer):not(.emoji-burst-layer){display:none !important;}
.winner-screen.wi-intro .winner-char{transform:scale(1.9);}
.winner-screen.wi-intro .winner-char img{animation:wi-talk .32s ease-in-out infinite;}
@keyframes wi-talk{0%,100%{transform:scale(1,1);}50%{transform:scale(1.025,.975);}}
.winner-screen.wi-reveal > *:not(.winner-char):not(.fx-layer):not(.emoji-burst-layer){animation:wi-in .7s ease-out both;}
@keyframes wi-in{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

/* v18: the characters' own drawings carry the details - no symbols on top, no shaking when
   angry; movement plus soft glows / faded colours only. (Eliminated players turn grey.) */
.char-sprite .cs-fx, .char-sprite .cfx{display:none !important;}
.char-sprite.st-angry .cs-body{animation:cs-breathe 2.4s ease-in-out infinite;animation-delay:var(--phase,0s);}
.char-sprite.st-angry .cs-body img{filter:drop-shadow(0 0 7px rgba(255,90,40,.45)) drop-shadow(0 4px 6px rgba(0,0,0,.35));}
.char-sprite.st-scared .cs-body img{filter:drop-shadow(0 0 6px rgba(120,180,255,.45)) drop-shadow(0 4px 6px rgba(0,0,0,.35));}
.char-sprite.st-sad .cs-body img{filter:saturate(.75) brightness(.95) drop-shadow(0 4px 6px rgba(0,0,0,.35));}
.char-sprite.st-scared .cs-body{animation-duration:.11s;}   /* shiver 20% slower */
.char-sprite.cs-still .cs-body{animation:none;}
.fo-side .fo-char, .fo-side.talk .fo-char{animation:none;}   /* face-off: they slide in, then stand still */
.fo-char img{filter:drop-shadow(0 0 14px rgba(255,80,40,.4)) drop-shadow(0 10px 16px rgba(0,0,0,.5));}

/* end of a full round: the one who survived every elimination, alone, saying their line */
.roundwin{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;
  background:radial-gradient(ellipse at center, rgba(var(--bg-rgb),.55), rgba(var(--bg-rgb),.94) 70%);animation:wi-in .5s ease-out both;}
.rw-title{font-size:clamp(26px,5.4vh,58px);font-weight:900;color:var(--gold);text-align:center;}
.rw-char{position:relative;width:clamp(170px,34vh,380px);height:clamp(212px,42vh,470px);}
.rw-char img{position:absolute;height:auto;max-width:none;transform-origin:50% 100%;animation:wi-talk .32s ease-in-out infinite;
  filter:drop-shadow(0 0 12px rgba(255,210,90,.35)) drop-shadow(0 10px 16px rgba(0,0,0,.5));}
.roundwin.done .rw-char img{animation:none;}
.rw-name{font-size:clamp(24px,4.4vh,48px);font-weight:900;color:var(--text);}
.rw-sub{font-size:clamp(15px,2.4vh,26px);color:var(--sub);}

/* ===================== Conveyor (السير المتحرك) ===================== */
/* phone: fire + belt with the box, the arrow card, the D-pad */
.cv-wrap{flex:1 1 0;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;gap:2.2vh;
  padding:1vh 14px calc(1.2vh + env(safe-area-inset-bottom));}
.cv-track{position:relative;flex:0 0 auto;height:clamp(84px,15vh,150px);display:flex;direction:ltr;border-radius:12px;overflow:hidden;
  border:1px solid var(--border);background:var(--panel);}
.cv-fire{position:relative;flex:0 0 19%;overflow:hidden;border-right:2px solid #3b2a22;
  background:radial-gradient(120% 95% at 50% 125%, #ff9a1f 0%, #d9480f 28%, #5a1a08 56%, #1b0d08 80%), #140a07;}
.cv-fire .rc-molten{height:70%;}
.cv-fire.flare{animation:cv-flare .6s ease-out;}
@keyframes cv-flare{0%{box-shadow:inset 0 -30px 60px rgba(255,200,60,.95);filter:brightness(1.5);}100%{box-shadow:none;filter:none;}}
.cv-belt{position:relative;flex:1;}
.cv-belt::before, .cv-belt::after{content:"";position:absolute;left:0;right:0;height:9px;opacity:.85;
  background:repeating-linear-gradient(90deg, var(--border) 0 16px, transparent 16px 32px);}
.cv-belt::before{top:0;} .cv-belt::after{bottom:0;}
.cv-belt.moving::before, .cv-belt.moving::after{animation:rc-belt-move .5s linear infinite reverse;}
.cv-box{position:absolute;top:50%;width:clamp(54px,9.5vh,96px);height:clamp(54px,9.5vh,96px);margin-top:calc(clamp(54px,9.5vh,96px) / -2);}
.cv-box svg{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4));}
.cv-box.push svg{animation:cv-push .15s ease-out;}
@keyframes cv-push{50%{transform:translateX(7%) scale(1.06,.95);}}
.cv-box.falling{animation:cv-fall .75s ease-in forwards;}
@keyframes cv-fall{35%{transform:translateX(-55%) rotate(-25deg);}
  100%{transform:translate(-115%,65%) rotate(-80deg) scale(.6);opacity:0;filter:sepia(1) saturate(6) hue-rotate(-25deg) brightness(1.4);}}
.cv-danger .cv-track{animation:cv-warn .6s ease-in-out infinite alternate;}
@keyframes cv-warn{from{box-shadow:0 0 0 1px rgba(255,80,40,.3);}to{box-shadow:0 0 0 2px rgba(255,80,40,.75), 0 0 18px rgba(255,80,40,.45);}}
/* arrow card + box + pad: drawn in the theme's colours (each design adds its own touches below) */
.cv-card{align-self:center;flex:0 0 auto;width:min(78vw,380px);height:clamp(96px,17vh,180px);border-radius:16px;background:var(--panel2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;direction:ltr;box-shadow:0 12px 26px -12px rgba(0,0,0,.6);}
.cv-card.pop{animation:cv-pop .14s ease-out;}
@keyframes cv-pop{50%{transform:scale(1.05);}}
.cv-arrow{height:84%;width:auto;aspect-ratio:1/1;fill:var(--gold);stroke:var(--gold);}
.cv-arrow[data-dir="down"]{transform:rotate(90deg);}
.cv-arrow[data-dir="left"]{transform:rotate(180deg);}
.cv-arrow[data-dir="up"]{transform:rotate(-90deg);}
.cv-wrong .cv-card{animation:rc-shake .28s;}
/* the D-pad is the flags game's one (.dpad-wrap/.dpad-btn), only sized for this screen */
.cv-dpad{align-self:center;width:min(64vw,38vh,320px);height:min(64vw,38vh,320px);margin:auto 0;}
.cv-dpad .dpad-btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.cv-box{--cvb:var(--gold);--cvb-line:rgba(0,0,0,.55);--cvb-tape:rgba(0,0,0,.22);}
.cv-box .cvb{fill:var(--cvb);} .cv-box .cvb-hl{fill:rgba(255,255,255,.28);} .cv-box .cvb-sh{fill:rgba(0,0,0,.28);}
.cv-box .cvb-tape{fill:none;stroke:var(--cvb-tape);stroke-width:6;}
.cv-box .cvb-edge{fill:none;stroke:var(--cvb-line);stroke-width:2.5;stroke-linejoin:round;}
.cv-lock .cv-dpad{opacity:.45;}
.cv-dead .cv-dpad, .cv-dead .cv-card{opacity:.3;filter:grayscale(1);}
/* display: a little belt under each character */
.cv-mini{position:relative;width:clamp(70px,11vh,130px);height:10px;border-radius:5px;background:var(--panel2);border:1px solid var(--border);
  overflow:hidden;direction:ltr;}
.cv-mini i{position:absolute;left:0;top:0;bottom:0;width:16%;background:linear-gradient(90deg,#ff5a1f,#ffb347);}
.cv-mini b{position:absolute;top:1px;bottom:1px;width:9px;margin-left:-4px;border-radius:2px;background:#cfd2d8;}
.inter-emojis.ltr{direction:ltr;unicode-bidi:isolate;}
.cv-speed{font-size:clamp(16px,2.6vh,26px);color:var(--sub);}

/* v1: solid and friendly */
.player-slot.has-char .char-stage::before{background:var(--panel);border:2px solid var(--gold);}
.cp-card{border-radius:16px;}

/* v1: solid and friendly */
.cv-card{background:var(--panel);border:2px solid var(--gold);border-radius:18px;}
.cv-arrow{fill:var(--gold);stroke:var(--gold);}
.cv-box{--cvb:var(--gold);--cvb-line:rgba(0,0,0,.5);}

/* v20: conveyor arrow = block arrow + inner outline, in the theme's colours */
.cv-arrow .cva{fill:var(--cva, var(--gold));stroke:none;}
.cv-arrow .cva-line{fill:none;stroke:var(--cva-line, rgba(255,255,255,.85));stroke-width:1.3;stroke-linejoin:miter;}

/* v20: words timer screen on the phones - eye button on the left, the screen flips over */
.notif-bar.wc-mode{position:relative;display:flex;align-items:stretch;padding:0;height:clamp(58px,8.5vh,80px);min-height:0;overflow:hidden;direction:ltr;}
.wc-eye{flex:0 0 auto;height:100%;aspect-ratio:1/1;margin:0;padding:0;border:none;border-right:1px solid var(--border);cursor:pointer;
  background:var(--panel2);color:var(--text);display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.wc-eye svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.wc-eye:active{filter:brightness(1.25);}
.wc-flip{position:relative;flex:1;perspective:800px;}
.wc-card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1);}
.wc-hidden .wc-card{transform:rotateY(180deg);}
.wc-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;-webkit-backface-visibility:hidden;backface-visibility:hidden;}
.wc-back{transform:rotateY(180deg);color:var(--sub);font-size:clamp(13px,1.9vh,16px);font-weight:700;letter-spacing:0;
  background:repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 3px, transparent 3px 9px), var(--panel2);}
.wc-back span{padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--border);}
.cv-arrow{--cva:var(--gold);--cva-line:var(--panel);}

/* ===================== Keys (المفاتيح) ===================== */
.keys-wrap{width:min(62vh,50vw);height:min(62vh,50vw);}
.keys-map{display:block;width:100%;height:100%;overflow:visible;direction:ltr;}
.keys-map .kb-bridge{fill:var(--panel2);stroke:var(--border);stroke-width:.8;}
.keys-map .kb-pad{fill:var(--panel);stroke:var(--border);stroke-width:1;}
.keys-map .kb-center{fill:var(--panel);stroke:var(--gold);stroke-width:1.3;}
.keys-map .kb-ctext{fill:var(--text);font-size:15px;font-weight:900;text-anchor:middle;dominant-baseline:central;}
.keys-map .kb-num circle{fill:var(--gold);}
.keys-map .kb-num text{fill:#15110a;font-size:6.6px;font-weight:900;text-anchor:middle;dominant-baseline:central;}
.keys-map .kb-key{fill:none;stroke-width:1.35;stroke-linecap:round;transition:opacity .6s;}
.keys-map .kb-gold .kb-key{stroke:#f4b73a;}
.keys-map .kb-silver .kb-key{stroke:#cfd6df;}
.keys-map .kb-bronze .kb-key{stroke:#c98650;}
.keys-map .kb-val{font-size:7.5px;font-weight:800;text-anchor:middle;dominant-baseline:central;}
.keys-map .kb-gold .kb-val{fill:#f4b73a;} .keys-map .kb-silver .kb-val{fill:#cfd6df;} .keys-map .kb-bronze .kb-val{fill:#c98650;}
.keys-map .kb-gain{font-size:11px;font-weight:900;fill:#3ddc84;text-anchor:middle;dominant-baseline:central;opacity:0;transition:opacity .4s;
  paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:2px;}
.keys-map .kb-taken .kb-key{opacity:.12;}
.keys-map .kb-taken .kb-gain{opacity:1;}
.keys-map .kb-val{transition:opacity .4s;} .keys-map .kb-taken .kb-val{opacity:0;}
.keys-map .kb{transition:opacity .9s ease-in .35s, transform .9s ease-in .35s;}
.keys-map .kb-fall{opacity:.08;transform:translateY(7px);animation:kb-shake .35s linear;}
@keyframes kb-shake{25%{transform:translateX(1.2px);}50%{transform:translateX(-1.2px);}75%{transform:translateX(1px);}}
.keys-map .kb.mine .kb-bridge, .keys-map .kb.mine .kb-pad{stroke:var(--gold);stroke-width:2.2;}
.keys-map .kb.mine .kb-pad{fill:var(--panel2);}
.keys-map .tk{transition:transform .9s cubic-bezier(.45,0,.25,1);}
.keys-map .tk image{filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.5));}
.keys-map .tk-dot{fill:var(--gold);}
.keys-map .tk image, .keys-map .tk circle{transform-box:fill-box;transform-origin:center;transition:opacity .8s ease-in .35s, transform .8s ease-in .35s;}
.keys-map .tk-fall image, .keys-map .tk-fall circle{opacity:0;transform:translateY(14px) scale(.3);}

/* phone */
.keys-wrap-ph{flex:1 1 0;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;padding:1vh 10px calc(1vh + env(safe-area-inset-bottom));}
.keys-map-box{width:min(94vw,60vh,520px);height:min(94vw,60vh,520px);touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.keys-map-box .kb{cursor:pointer;}
/* phone: the pick countdown, big under the message */
.keys-count{font-size:clamp(46px,9vh,84px);font-weight:900;line-height:1;color:var(--gold);direction:ltr;font-variant-numeric:tabular-nums lining-nums;
  text-shadow:0 4px 14px rgba(0,0,0,.35);transition:color .2s;}
.keys-count.low{color:var(--red);animation:keys-tick 1s ease-in-out infinite;}
@keyframes keys-tick{0%{transform:scale(1.18);}35%{transform:scale(1);}}

/* v22: conveyor - the character stands on the belt (no box) */
.cv-track{height:clamp(110px,19vh,190px);}
.cv-box.cv-char{top:auto;bottom:8px;margin-top:0;height:calc(100% - 14px);width:auto;aspect-ratio:4/5;}
.cv-box.cv-char .char-sprite{left:0;top:0;width:100%;height:100%;font-size:clamp(16px,2.6vh,26px);}
.cv-box.cv-char.push .char-sprite{animation:cv-push .15s ease-out;}

/* ===================== Hawk eye (عين الصقر) ===================== */
.memo-wrap{width:min(52vh,40vw);}
.memo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(5px,1vh,10px);direction:ltr;}
.memo-grid .mc{display:block;aspect-ratio:1/1;width:100%;padding:0;margin:0;border-radius:10px;background:var(--panel2);border:1px solid var(--border);
  cursor:default;transition:background .15s, box-shadow .15s, border-color .15s, transform .1s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.memo-grid .mc.lit, .memo-grid .mc.sel{background:var(--gold);border-color:var(--gold);box-shadow:0 0 16px rgba(255,200,80,.45);}
.memo-grid .mc.hit{background:var(--green);border-color:var(--green);}
.memo-grid .mc.bad{background:var(--red);border-color:var(--red);}
.memo-grid .mc.miss{box-shadow:inset 0 0 0 3px var(--gold);}
.memo-wrap-ph{flex:1 1 0;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;
  padding:1vh 14px calc(1.2vh + env(safe-area-inset-bottom));}
.memo-grid-box{width:min(86vw,46vh,420px);}
.memo-grid-box .mc{cursor:pointer;}
.memo-grid-box .mc:active{transform:scale(.94);}
.memo-grid-box.locked .mc{cursor:default;}
.memo-grid-box.locked .mc:active{transform:none;}
.memo-submit{width:min(70vw,320px);margin:0;}
/* two grids (from the 7th elimination): side by side on the display, and on the phone at the reveal */
.memo-pair{display:flex;gap:3vw;direction:ltr;align-items:center;}
.memo-pair.two .memo-wrap{width:min(40vh,28vw);}
.memo-grids{display:flex;gap:12px;direction:ltr;align-items:center;justify-content:center;}
.memo-wrap-ph.pair .memo-grid-box{width:min(44vw,30vh,260px);}
/* my character up by the countdown (the submit button is at the bottom) */
#memo-avatar{top:1vh;bottom:auto;}

/* ===================== Dice (النرد) ===================== */
/* a die: rounded corners, pips on a 3x3 grid */
.die{position:relative;display:inline-block;box-sizing:border-box;flex:0 0 auto;
  border-radius:24%;background:linear-gradient(145deg,#fffdf7,#e3dccd);box-shadow:inset 0 -3px 6px rgba(0,0,0,.18), inset 0 2px 3px rgba(255,255,255,.8), 0 4px 9px rgba(0,0,0,.4);}
.die i{position:absolute;width:21%;height:21%;border-radius:50%;transform:translate(-50%,-50%);}
.die i:nth-child(1){left:25%;top:25%;}
.die i:nth-child(2){left:50%;top:25%;}
.die i:nth-child(3){left:75%;top:25%;}
.die i:nth-child(4){left:25%;top:50%;}
.die i:nth-child(5){left:50%;top:50%;}
.die i:nth-child(6){left:75%;top:50%;}
.die i:nth-child(7){left:25%;top:75%;}
.die i:nth-child(8){left:50%;top:75%;}
.die i:nth-child(9){left:75%;top:75%;}
.die i.on{background:#1b1b1b;box-shadow:inset 0 1px 1px rgba(255,255,255,.25);}
.die.big{position:absolute;left:0;top:0;will-change:transform;}
.die.mini{width:30px;height:30px;}
.die.mini.blank{opacity:.22;}
/* phone */
.dice-wrap-ph{flex:1 1 0;min-height:0;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:1.2vh;padding:1vh 14px calc(1.2vh + env(safe-area-inset-bottom));}
.dice-panel{display:flex;align-items:center;justify-content:center;gap:16px;direction:ltr;padding:10px 18px;border-radius:24px;
  background:linear-gradient(180deg,#171717,#050505);border:2px solid var(--gold);box-shadow:inset 0 0 0 3px rgba(0,0,0,.55), 0 10px 24px -12px rgba(0,0,0,.7);transition:box-shadow .3s;}
.dice-panel.fixed{box-shadow:inset 0 0 0 3px rgba(0,0,0,.55), 0 0 0 2px var(--gold), 0 0 22px rgba(255,200,80,.45);}
.dp-dice{display:flex;gap:10px;}
.dp-dice .die{width:clamp(28px,5vh,42px);height:clamp(28px,5vh,42px);}
.dp-sep{width:2px;align-self:stretch;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:.75;}
.dp-total{display:flex;flex-direction:column;align-items:center;line-height:1;color:#fff;min-width:2.4em;}
.dp-total small{font-size:12px;letter-spacing:1px;opacity:.75;margin-bottom:5px;}
.dp-total b{font-size:clamp(34px,6vh,54px);font-weight:900;font-variant-numeric:tabular-nums lining-nums;}
.dice-tray{position:relative;flex:1 1 0;min-height:180px;border-radius:24px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  background:radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.06), transparent 65%), repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 6px), var(--panel2);
  border:1px solid var(--border);box-shadow:inset 0 0 0 4px rgba(0,0,0,.25), inset 0 0 40px rgba(0,0,0,.45);}
.dice-tray.holding{box-shadow:inset 0 0 0 4px rgba(0,0,0,.25), inset 0 0 40px rgba(0,0,0,.45), 0 0 0 2px var(--gold);}
/* the fix button sits beside my character (bottom left) */
.dice-wrap-ph .dice-fix.gold{align-self:stretch;width:auto !important;max-width:none;margin:0 0 0 calc(clamp(64px,10vh,110px) + 10px) !important;font-size:20px;}
.dice-wrap-ph .keys-count{text-align:center;font-size:clamp(30px,5vh,46px);}
.dice-hint{text-align:center;color:var(--red);font-weight:800;font-size:15px;margin-top:-.4vh;}
/* display */
.dice-title{font-size:clamp(28px,5.5vh,56px);font-weight:900;color:var(--gold);text-align:center;}
.dice-board{display:flex;flex-direction:column;gap:1vh;min-width:min(56vw,620px);padding:1.8vh 2.2vw;border-radius:26px;
  background:linear-gradient(180deg,#171717,#050505);border:2px solid var(--gold);box-shadow:inset 0 0 0 4px rgba(0,0,0,.55), 0 20px 40px -20px rgba(0,0,0,.8);}
.dice-row{display:flex;align-items:center;gap:1.4vw;opacity:0;transform:translateY(12px) scale(.96);transition:opacity .35s, transform .35s;}
.dice-row.in{opacity:1;transform:none;}
.dr-name{flex:1;font-size:clamp(18px,2.8vh,28px);font-weight:800;color:#fff;}
.dr-dice{display:flex;gap:8px;direction:ltr;}
.dr-dice .die.mini{width:clamp(28px,4.4vh,44px);height:clamp(28px,4.4vh,44px);}
.dr-total{min-width:2.2em;text-align:center;font-size:clamp(24px,4vh,40px);font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums lining-nums;}
.dice-row.low .dr-name, .dice-row.low .dr-total{color:var(--red);}
.dice-panel, .dice-board{background:var(--panel);}

/* ===================== Wiring (توصيل الكهرباء) ===================== */
.eb{--n:4;--ar:5;--gap:5px;--src:#d6283a;--col:calc(var(--gap) + 1px + (100% - 2px - (var(--n) + 1) * var(--gap)) / var(--n) / 2);
  display:flex;flex-direction:column;align-items:stretch;direction:ltr;width:100%;}
.eb-grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--gap);padding:var(--gap);border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.28);}
.et{position:relative;display:block;aspect-ratio:1/1;width:100%;padding:0;margin:0;border:none;border-radius:7px;background:var(--panel2);cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), 0 2px 4px rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:visible;}
.et-rot{position:absolute;inset:0;display:block;transition:transform .16s ease-out;}
.et svg, .eb-ico{display:block;width:100%;height:100%;overflow:visible;}
.eb .ew-case{fill:none;stroke:rgba(0,0,0,.55);stroke-width:17;stroke-linecap:round;}
.eb .ew-core{fill:none;stroke:#7d828b;stroke-width:9;stroke-linecap:round;transition:stroke .2s;animation:ew-flow .7s linear infinite;}
.eb .ew-core.in{animation-direction:reverse;}
.et.on .ew-core, .eb-src .eb-cable, .eb.lit .eb-dst .eb-cable{stroke:var(--elec, #ffd23f);stroke-dasharray:.6 .4;stroke-linecap:butt;filter:drop-shadow(0 0 4px var(--elec, #ffd23f));}
@keyframes ew-flow{from{stroke-dashoffset:.3;}to{stroke-dashoffset:-.7;}}
/* the power source and the bulb, centred over the first / last column */
.eb-src, .eb-dst{position:relative;z-index:1;aspect-ratio:var(--ar);}
.eb-ico{position:absolute;top:0;width:auto;aspect-ratio:1/1;transform:translateX(-50%);}
.eb-src .eb-ico{left:var(--col);}
.eb-dst .eb-ico{left:calc(100% - var(--col));}
.eb-src b, .eb-dst b{position:absolute;direction:rtl;white-space:nowrap;font-size:clamp(12px,1.9vh,19px);font-weight:800;color:var(--sub, #94a3b8);transform:translateY(-50%);}
.eb-src b{top:38%;left:calc(var(--col) + 100% / var(--ar) * .55);}
.eb-dst b{top:64%;right:calc(var(--col) + 100% / var(--ar) * .55);transition:color .3s;}
.eb.lit .eb-dst b{color:var(--elec, #ffd23f);}
.src-body{fill:var(--src);stroke:rgba(0,0,0,.45);stroke-width:3;}
.eb-src .eb-ico{filter:drop-shadow(0 0 7px var(--src));animation:src-pulse 1.6s ease-in-out infinite;}
@keyframes src-pulse{50%{filter:drop-shadow(0 0 15px var(--src));}}
.src-nub{fill:#9aa0a8;stroke:rgba(0,0,0,.45);stroke-width:2;}
.src-shine{fill:rgba(255,255,255,.18);}
.src-bolt{fill:var(--elec, #ffd23f);stroke:rgba(0,0,0,.4);stroke-width:2;stroke-linejoin:round;}
.dst-glass{fill:rgba(200,206,216,.14);stroke:#8d9198;stroke-width:3.5;transition:fill .35s, stroke .35s;}
.dst-fil{fill:none;stroke:#8d9198;stroke-width:3;stroke-linejoin:round;transition:stroke .35s;}
.dst-base{fill:#8d9198;stroke:rgba(0,0,0,.45);stroke-width:2;}
.dst-thread{stroke:rgba(0,0,0,.35);stroke-width:2;}
.dst-rays path{stroke:var(--elec, #ffd23f);stroke-width:5;stroke-linecap:round;opacity:0;transition:opacity .35s;}
.eb.lit .dst-glass{fill:var(--elec, #ffd23f);stroke:#fff;}
.eb.lit .dst-fil{stroke:#fff;}
.eb.lit .dst-rays path{opacity:1;}
.eb.lit .eb-dst .eb-ico{filter:drop-shadow(0 0 14px var(--elec, #ffd23f));}
/* phone */
.elec-wrap-ph{flex:1 1 0;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;padding:1vh 14px calc(1.2vh + env(safe-area-inset-bottom));}
.elec-board{width:min(92vw,58vh,500px);}
.elec-board.locked .et{cursor:default;}
.elec-board.won .eb-grid{box-shadow:0 0 0 2px var(--elec, #ffd23f), 0 0 26px rgba(255,210,63,.45);}
.elec-wrap-ph .keys-count{font-size:clamp(28px,4.6vh,42px);}
#elec-avatar{top:1vh;bottom:auto;left:auto;right:10px;}
/* display */
.elec-title{font-size:clamp(26px,5vh,52px);font-weight:900;color:var(--gold);text-align:center;}
.elec-disp{width:min(46vh,34vw);pointer-events:none;}
.eb{--elec:#ffd23f;}

/* ===================== Don't fall (لا تطيح!) ===================== */
.fg{--n:6;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:5px;padding:6px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.28);direction:ltr;width:100%;}
.ft{position:relative;display:block;aspect-ratio:1/1;width:100%;padding:0;margin:0;border:none;border-radius:8px;background:var(--panel2);cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), 0 3px 0 rgba(0,0,0,.4);-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform .45s ease-out, opacity .45s ease-out, box-shadow .2s, background .2s;}
.ft-sh{position:absolute;inset:10%;display:block;pointer-events:none;}
.ft-sh svg{display:block;width:100%;height:100%;overflow:visible;}
.fall-ind-box svg{position:absolute;left:14%;top:14%;width:72%;height:72%;display:block;overflow:visible;}
.fs *{fill:none;stroke:var(--fs);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;}
.fs-q{--fs:var(--sh-q);} .fs-c{--fs:var(--sh-c);} .fs-x{--fs:var(--sh-x);} .fs-t{--fs:var(--sh-t);}
.ft.hole{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);cursor:default;}
.ft.fall{transform:translateY(16%) scale(.3) rotate(16deg);opacity:0;transition:transform .9s cubic-bezier(.55,0,.9,.45), opacity .9s ease-in;}
.ft.up{animation:ft-up .5s cubic-bezier(.2,1.45,.45,1);}
@keyframes ft-up{0%{transform:translateY(-35%) scale(.15) rotate(-14deg);opacity:0;filter:brightness(2.2);}60%{opacity:1;}100%{transform:none;opacity:1;filter:none;}}
.ft.safe{box-shadow:0 0 0 3px var(--sh-safe), 0 0 18px var(--sh-safe);}
.ft.taken .ft-sh{opacity:.32;}
.ft.mine{box-shadow:0 0 0 3px var(--gold), 0 0 16px var(--gold);}
.ft.pend{box-shadow:0 0 0 3px var(--gold);}
.ft.mine.safe{box-shadow:0 0 0 3px var(--gold), 0 0 22px var(--sh-safe);}
.ft-tok{position:absolute;inset:0;pointer-events:none;}
.ft-ch{position:absolute;left:50%;bottom:3%;height:94%;aspect-ratio:.8;transform:translateX(-50%);overflow:hidden;}
.ft-ch img{position:absolute;height:auto;max-width:none;pointer-events:none;}
.ft-ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.4em;color:var(--text);}
.fg.flash .ft-sh{animation:fs-flash .42s ease-out;}
@keyframes fs-flash{0%{opacity:0;transform:scale(.5);filter:brightness(2.6);}55%{opacity:1;}100%{opacity:1;transform:none;filter:none;}}
.fall-ind-box{position:relative;aspect-ratio:1/1;border-radius:18px;background:var(--panel2);border:2px solid var(--border);box-sizing:border-box;transition:border-color .25s, box-shadow .25s;}
.fall-ind-box.flash svg{animation:fs-flash .42s ease-out;}
.fall-ind-box.locked{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,255,255,.08), 0 0 26px var(--gold);}
.fall-ind-box.locked svg{animation:fall-lock .5s ease-out;}
@keyframes fall-lock{0%{transform:scale(1.35);}100%{transform:none;}}
/* display */
.fall-head{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:1.2vh;direction:rtl;}
.fall-head .fall-ind-box{width:clamp(70px,12vh,110px);}
.fall-head-txt{display:flex;flex-direction:column;align-items:center;min-width:8em;}
.fall-ind-lab{font-weight:900;font-size:clamp(18px,3.2vh,32px);color:var(--gold);}
.fall-clock{font-size:clamp(30px,6vh,60px);font-weight:900;line-height:1.1;color:var(--text);font-variant-numeric:tabular-nums;min-height:1.1em;direction:ltr;}
.fall-clock.low{color:var(--red, #ef4444);}
.fall-disp{width:min(54vh,40vw);pointer-events:none;margin:0 auto;}
/* phone */
.fall-wrap-ph{flex:1 1 0;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;padding:1vh 14px calc(1.2vh + env(safe-area-inset-bottom));}
.fall-top-ph{display:flex;align-items:center;justify-content:center;gap:16px;direction:rtl;min-height:clamp(56px,9vh,84px);}
.fall-top-ph .fall-ind-box{width:clamp(56px,9vh,84px);border-radius:14px;}
.fall-top-ph .keys-count{font-size:clamp(30px,5vh,46px);min-width:2.2em;text-align:center;direction:ltr;}
.fall-board{width:min(92vw,56vh,500px);}
.fall-board.locked .ft{cursor:default;}
#fall-avatar{top:1vh;bottom:auto;left:auto;right:10px;}
.fg, .fall-ind-box{--sh-q:#60a5fa;--sh-c:#4ade80;--sh-x:#f87171;--sh-t:#fbbf24;--sh-safe:rgba(255,255,255,.85);}
body.theme-3 .fg, body.theme-4 .fg, body.theme-5 .fg, body.theme-3 .fall-ind-box, body.theme-4 .fall-ind-box, body.theme-5 .fall-ind-box, body.theme-7 .fg, body.theme-7 .fall-ind-box{--sh-q:#2563eb;--sh-c:#16a34a;--sh-x:#dc2626;--sh-t:#d97706;--sh-safe:rgba(15,23,42,.55);}

/* the leader's settings: one box per game */
.leader-boxes{display:block;}
.leader-boxes > .settings-box > :last-child{margin-bottom:0;}
.set-sep{height:0;border-top:1px solid var(--border);margin:16px 0 14px;}
.settings-box select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px;margin-bottom:8px;}

/* v30: the colour pickers in two rows (dark / light) */
.theme-picker{display:grid;grid-template-columns:repeat(4,32px);justify-content:end;gap:10px 12px;}
.settings-summary .theme-picker{display:flex;flex-wrap:wrap;gap:8px;}

/* ===================== Crash Bash (كراش باش) ===================== */
.cr-head{display:flex;align-items:center;justify-content:center;gap:30px;margin-bottom:1vh;direction:rtl;}
.cr-cyc{display:flex;flex-direction:column;align-items:center;line-height:1;}
.cr-cyc b{font-size:clamp(34px,6.5vh,64px);font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;min-width:1.4em;text-align:center;}
.cr-cyc small{font-size:clamp(12px,1.8vh,17px);color:var(--sub);font-weight:700;margin-top:4px;}
.cr-cyc.low b{color:var(--red, #ef4444);animation:cr-pulse .5s ease-in-out infinite alternate;}
.cr-time{font-size:clamp(22px,4vh,40px);font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;direction:ltr;}
.cr-board{position:relative;width:min(66vh,48vw);aspect-ratio:1/1;margin:0 auto;direction:ltr;}
.cr-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(15,1fr);gap:2px;padding:4px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--border);}
.cr-board.wipe .cr-grid{animation:cr-wipe .6s ease-out;}
.cc{display:block;border-radius:3px;background:var(--panel2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);transition:box-shadow .15s;}
/* a coloured tile glows like a light */
.cc.on{position:relative;z-index:1;background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.62) 0, rgba(255,255,255,.12) 38%, rgba(255,255,255,0) 66%), var(--pc);
  box-shadow:0 0 10px 1px var(--pc), inset 0 0 6px rgba(255,255,255,.5);}
.cc.lk{box-shadow:0 0 10px 1px var(--pc), inset 0 0 0 2px rgba(255,255,255,.95);}
.cr-layer{position:absolute;inset:4px;pointer-events:none;}
.cr-p{position:absolute;width:calc(100% / 15 * 1.55);aspect-ratio:.8;transform:translate(-50%,-80%);}
.cr-ring{position:absolute;left:50%;bottom:-3%;width:72%;height:20%;transform:translateX(-50%);border-radius:50%;background:var(--pc);opacity:.8;box-shadow:0 0 12px 3px var(--pc);}
.cr-hop{position:absolute;inset:0;}
.cr-ch{position:absolute;inset:0;overflow:hidden;}
.cr-ch img{position:absolute;height:auto;max-width:none;pointer-events:none;}
.cr-ini{position:absolute;inset:20% 10% 0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--pc);color:#fff;font-weight:900;}
.cr-over{position:absolute;left:50%;bottom:98%;transform:translateX(-50%);display:flex;gap:2px;font-size:calc(min(66vh,48vw) / 15 * .55);white-space:nowrap;line-height:1;}
.cr-held, .cr-stun{display:inline-block;animation:cr-spin 2.4s linear infinite;}
.cr-stun{animation-duration:1s;}
.cr-p.shield .cr-hop::before{content:"";position:absolute;inset:-4% -16% 0;border-radius:50%;border:2px solid rgba(130,205,255,.9);box-shadow:0 0 14px rgba(130,205,255,.85), inset 0 0 14px rgba(130,205,255,.5);}
.cr-p.stun .cr-ch{filter:grayscale(.45) brightness(.85);}
.cr-it{position:absolute;width:calc(100% / 15);aspect-ratio:1/1;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:calc(min(66vh,48vw) / 15 * .72);z-index:5;}
.cr-spin{display:flex;align-items:center;justify-content:center;width:100%;height:100%;animation:cr-spin 6s linear infinite;filter:drop-shadow(0 0 6px rgba(255,255,255,.65));}
.cr-arrow .cr-spin{animation:none;transition:transform .12s ease-out;}
.cr-arrow svg{width:82%;height:82%;}
.cr-arrow path{fill:var(--gold);stroke:rgba(0,0,0,.45);stroke-width:4;stroke-linejoin:round;}
.cr-bang b, .cr-quest b{display:flex;align-items:center;justify-content:center;width:80%;height:80%;border-radius:18%;font-weight:900;font-size:.82em;
  background:linear-gradient(135deg,#ffd166,#f59e0b);color:#3a2100;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25), 0 0 10px rgba(255,200,80,.65);}
.cr-quest b{background:linear-gradient(135deg,#c084fc,#7c3aed);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25), 0 0 10px rgba(192,132,252,.7);}
.cr-it.blink{animation:cr-blink .32s steps(2) infinite;}
.cr-rk{position:absolute;font-size:calc(min(66vh,48vw) / 15 * .8);z-index:400;filter:drop-shadow(0 0 7px #ff9b3d);}
.cr-fx{position:absolute;transform:translate(-50%,-50%);z-index:500;font-size:calc(min(66vh,48vw) / 15 * 1.1);pointer-events:none;white-space:nowrap;}
.cr-fx-boom, .cr-fx-pick, .cr-fx-block, .cr-fx-wand{animation:cr-boom .7s ease-out forwards;}
.cr-fx-plus, .cr-fx-clock{font-weight:900;font-size:calc(min(66vh,48vw) / 15 * .78);text-shadow:0 0 6px rgba(0,0,0,.85), 0 0 2px #000;animation:cr-up 1.3s ease-out forwards;}
.cr-fx-clock{color:var(--gold);}
.cr-fx-bolt{transform:translate(-50%,-175%);text-align:center;line-height:.9;}
