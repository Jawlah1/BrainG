<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>ألعاب العقل الجماعية 🧠</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#0b1220; --border:#334155; --bg-rgb:15,23,42;
  --gold:#f5b942; --gold2:#d97706; --blue:#2563eb; --green:#22c55e; --red:#ef4444; --text:#f1f5f9; --sub:#94a3b8;
}
/* fix #5: 6 selectable color themes (3 dark incl. the default, 3 light) - every overlay
   and button below reads these variables so switching themes recolors the whole app. */
body.theme-1{ --bg:#170f28; --bg-rgb:23,15,40; --panel:#2a1c48; --panel2:#100a1e; --border:#4a3572; --gold:#c084fc; --gold2:#9333ea; --text:#f5eeff; --sub:#c7b6ec; }
body.theme-2{ --bg:#091f1b; --bg-rgb:9,31,27; --panel:#123330; --panel2:#061513; --border:#1f5952; --gold:#2dd4bf; --gold2:#0d9488; --text:#e7fffa; --sub:#7de9d8; }
body.theme-3{ --bg:#eaf4ff; --bg-rgb:234,244,255; --panel:#ffffff; --panel2:#dcebfe; --border:#b7d8fb; --gold:#2563eb; --gold2:#1d4ed8; --text:#0f172a; --sub:#51607a; }
body.theme-4{ --bg:#fff4e8; --bg-rgb:255,244,232; --panel:#ffffff; --panel2:#ffe4bf; --border:#f8c98a; --gold:#ea580c; --gold2:#c2410c; --text:#3a2410; --sub:#8a6642; }
body.theme-5{ --bg:#eafff6; --bg-rgb:234,255,246; --panel:#ffffff; --panel2:#d3f7e7; --border:#a3edcd; --gold:#059669; --gold2:#047857; --text:#0b3b2e; --sub:#3f7a63; }
.theme-swatch{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex:0 0 32px;}
.theme-swatch.selected{border-color:#fff;box-shadow:0 0 0 3px var(--gold);}
.theme-picker{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:12px;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:"Tahoma","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);user-select:none;-webkit-user-select:none;}
.screen{display:none;position:fixed;inset:0;width:100%;height:100%;}
.screen.active{display:flex;flex-direction:column;}
.center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
.card-panel{width:100%;max-width:460px;text-align:center;}
.main-logo{width:220px;height:auto;margin:0 auto 10px;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.55));}
.card-panel h1{font-size:24px;margin:0 0 6px;font-weight:800;}
.card-panel p.sub{color:var(--sub);font-size:13px;margin:0 0 18px;line-height:1.7;}
.field{margin-bottom:12px;text-align:right;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;}
input[type="text"],input[type="number"]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:16px;text-align:center;}
input:focus{outline:2px solid #38bdf8;}
button{font-family:inherit;}
button.primary{width:100%;padding:15px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px;}
button.primary:disabled{opacity:.4;}
button.gold{width:100%;padding:13px;border-radius:12px;border:1px solid var(--gold2);background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px;}
button.gold:disabled{opacity:.35;cursor:not-allowed;}
button.ghost{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;cursor:pointer;margin-top:8px;}
button.danger{width:100%;padding:12px;border-radius:12px;border:none;background:var(--red);color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px;}
button.danger:disabled{opacity:.35;cursor:not-allowed;}
button:active{transform:scale(.97);}
.status-msg{margin-top:12px;font-size:13px;color:var(--sub);min-height:16px;line-height:1.6;}
.status-msg.error{color:#f87171;}
.room-code-big{font-size:38px;font-weight:900;letter-spacing:8px;color:var(--gold);background:var(--panel2);border:1px dashed var(--border);border-radius:14px;padding:16px;margin:14px 0;direction:ltr;}
.hidden{display:none !important;}
/* Lobby */
.player-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;gap:8px;}
.player-row .pname{flex:1;text-align:right;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.player-row .crown{color:var(--gold);}
.player-row .pscore{color:var(--sub);font-size:12px;min-width:26px;text-align:center;}
.player-row .rdot{width:9px;height:9px;border-radius:50%;background:#475569;flex:0 0 9px;}
.player-row .rdot.ready{background:var(--green);box-shadow:0 0 6px var(--green);}
.player-row.disc{opacity:.4;}
.mini-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;width:26px;height:26px;font-size:13px;cursor:pointer;line-height:1;}
.leader-ctrls{display:flex;gap:4px;align-items:center;}
.list-wrap{max-height:34vh;overflow-y:auto;margin:10px 0;}
.settings-box{background:var(--panel);border-radius:12px;padding:14px;margin-top:14px;text-align:right;}
.settings-box label{font-size:12px;color:var(--sub);display:block;margin-bottom:6px;}
.readybtn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px;background:#475569;color:#fff;}
.readybtn.on{background:var(--green);}
/* Game screens - sized generously for large display devices (TV/iPad) */
#screen-game{background:var(--bg);position:relative;overflow:hidden;}
.display-wrap{flex:1;position:relative;display:flex;flex-direction:column;}
.game-topbar{display:flex;align-items:center;justify-content:space-between;padding:1.2vh 2vw;background:var(--panel2);border-bottom:1px solid var(--border);font-size:clamp(14px,1.8vh,20px);color:var(--sub);}
.game-topbar .gname{color:var(--gold);font-weight:800;font-size:clamp(18px,2.6vh,30px);}
.arena-wrap{flex:1;position:relative;}
.player-slot{position:absolute;display:flex;flex-direction:column;align-items:center;gap:.6vh;width:clamp(110px,13vw,220px);}
.player-slot .status-circle{width:clamp(64px,10vh,116px);height:clamp(64px,10vh,116px);border-radius:50%;background:#475569;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,4.6vh,48px);font-weight:900;border:3px solid #1e293b;transition:background .2s;}
.player-slot .status-circle.gold{background:var(--gold);}
.player-slot .status-circle.correct{background:var(--green);}
.player-slot .status-circle.wrong{background:var(--red);}
.player-slot .pname{font-size:clamp(16px,2.2vh,26px);font-weight:800;max-width:clamp(110px,13vw,220px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.player-slot .pscore{font-size:clamp(16px,2.2vh,26px);color:var(--gold);font-weight:800;}
.player-slot .count-label{font-size:clamp(18px,2.6vh,30px);color:var(--gold);font-weight:900;min-height:1em;}
.arena-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1.4vh;}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:.6vh;width:min(80vh,86vw,880px);height:min(80vh,86vw,880px);}
.cell5{background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,4.6vh,50px);font-weight:800;color:#fff;transition:background .15s;}
.cell5.red{background:#dc2626;border-color:#f87171;}
.cell5.blue{background:#2563eb;border-color:#60a5fa;}
.cell5.green{background:#16a34a;border-color:#4ade80;}
.cell5.path{background:#16a34a;border-color:#4ade80;}
.answer-label{font-size:clamp(18px,3vh,32px);font-weight:900;color:var(--gold);text-align:center;}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:.5vh;width:100%;height:100%;transition:transform .05s linear;}
.cell6{background:var(--panel);border:1px solid var(--border);border-radius:6px;position:relative;}
.cell6.on{background:var(--gold);}
.cell6 .sq-check{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(30px,6vh,58px);color:#16a34a;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.5);}
.ready-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:rgba(var(--bg-rgb),.94);z-index:5;}
.ready-overlay .gtitle{font-size:clamp(26px,5vh,54px);font-weight:900;color:var(--gold);text-align:center;}
.ready-overlay .cdnum{font-size:clamp(70px,15vh,150px);font-weight:900;}
.round-overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;background:rgba(var(--bg-rgb),.96);z-index:6;padding:20px;}
.round-overlay.active{display:flex;}
.round-overlay .gtitle{font-size:clamp(24px,4vh,44px);font-weight:900;color:var(--gold);}
.round-overlay table{width:100%;max-width:460px;border-collapse:collapse;}
.round-overlay td{padding:1vh 1.2vw;border-bottom:1px solid var(--border);font-size:clamp(15px,2.4vh,24px);}
/* mobile player controls */
.pcontrols-wrap{flex:1;display:flex;flex-direction:column;}
.notif-bar{margin:14px;padding:16px;border:2px solid var(--border);border-radius:12px;text-align:center;font-size:16px;font-weight:800;min-height:24px;}
.pgrid-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;}
.pgrid-wrap .grid5{width:min(80vh,92vw,460px);height:min(80vh,92vw,460px);}
.counter-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.counter-num{font-size:64px;font-weight:900;color:var(--text);}
.counter-btn-wrap{position:relative;display:inline-block;}
.counter-btn{width:min(60vw,240px);height:min(60vw,240px);border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,var(--gold),var(--gold2));color:#fff;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.35);}
.counter-minus-btn{position:absolute;left:0;bottom:0;width:38px;height:38px;border-radius:50%;border:2px solid var(--border);background:var(--panel);color:var(--text);font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;line-height:1;}
.counter-minus-btn:active{transform:scale(.92);}
.counter-minus-btn:disabled{opacity:.35;}
.counter-btn:active{transform:scale(.95);}
.counter-btn:disabled{opacity:.35;}
.submit-btn{margin:14px;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111827;font-weight:900;font-size:16px;cursor:pointer;}
.submit-btn:disabled{opacity:.4;}
.submitted-label{font-size:26px;font-weight:900;color:var(--green);}
.leader-inline-btns{padding:0 14px 14px;}
/* bomb game */
.bomb-grid{display:grid;gap:.5vh;direction:ltr;}
.bomb-cell{background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,2.6vh,28px);position:relative;}
.bomb-cell.safe{background:#16a34a;}
.bomb-cell.bomb{background:#dc2626;}
.bomb-cell img{width:70%;height:70%;object-fit:contain;}
.bomb-arrow{font-size:clamp(22px,4vh,42px);color:#ef4444;}
.bomb-turn-banner{text-align:center;padding:1vh;font-weight:800;color:var(--gold);font-size:clamp(16px,2.6vh,26px);}
.bomb-win-banner{text-align:center;padding:1vh;font-weight:900;color:var(--gold);font-size:clamp(20px,3.4vh,34px);}
</style>
</head>
<body>

<div id="screen-home" class="screen active">
  <div class="center-wrap">
    <div class="card-panel">
      <img class="main-logo" src="https://raw.githubusercontent.com/Jawlah1/RandFiles/main/Brain_Logo.png" alt="logo">
      <p class="sub">ألعاب جماعية تختبر قوة العقل والذاكرة</p>
      <button class="primary" id="btn-create-room">🖥️ إنشاء غرفة (جهاز العرض)</button>
      <button class="gold" id="btn-show-join">🎮 دخول اللاعبين</button>
      <div id="join-box" style="display:none;margin-top:14px;text-align:right;">
        <div class="field"><label>اسمك</label><input type="text" id="player-name" maxlength="16" placeholder="اكتب اسمك"></div>
        <div class="field"><label>رمز الغرفة</label><input type="text" id="room-code-input" maxlength="6" placeholder="ABCD" style="direction:ltr;text-transform:uppercase;"></div>
        <button class="primary" id="btn-join-room">دخول</button>
      </div>
      <div class="status-msg" id="home-status"></div>
    </div>
  </div>
</div>

<div id="screen-lobby" class="screen">
  <div class="center-wrap">
    <div class="card-panel">
      <div id="lobby-host-view" class="hidden">
        <h1>غرفة الانتظار</h1>
        <p class="sub">اطلب من اللاعبين إدخال هذا الرمز</p>
        <div class="room-code-big" id="room-code-display">----</div>
      </div>
      <div id="lobby-player-view" class="hidden">
        <h1>غرفة الانتظار</h1>
        <div class="room-code-big" id="room-code-display2">----</div>
      </div>
      <div class="list-wrap" id="lobby-players"></div>
      <div id="leader-settings" class="settings-box hidden">
        <label>لون تنسيق اللعبة</label>
        <div class="theme-picker" id="theme-picker"></div>
        <label>عدد جولات الألعاب السريعة</label>
        <input type="number" id="round-count-input" min="1" max="60" value="10">
        <button class="gold" id="btn-start-quick">🚀 ابدأ الألعاب السريعة</button>
        <button class="danger" id="btn-start-bomb" style="background:#7c2d12;">💣 ابدأ لعبة القنابل</button>
        <div class="status-msg" id="leader-ready-status"></div>
      </div>
      <button class="readybtn" id="btn-ready" style="display:none;">استعداد ✅</button>
      <button class="ghost" id="btn-leave-lobby">🚪 مغادرة الغرفة</button>
      <div class="status-msg" id="lobby-status"></div>
    </div>
  </div>
</div>

<div id="screen-game" class="screen">
  <!-- Host / display arena : PURE DISPLAY, NO CONTROLS -->
  <div id="display-wrap" class="display-wrap hidden">
    <div class="game-topbar">
      <div id="round-indicator">الجولة 1/10</div>
      <div class="gname" id="game-name-label">اللعبة</div>
      <div style="width:1px;"></div>
    </div>
    <div class="arena-wrap" id="arena-wrap">
      <div class="arena-center" id="arena-center"></div>
      <div class="ready-overlay" id="ready-overlay">
        <div class="gtitle" id="ready-gtitle">اللعبة</div>
        <div class="cdnum" id="ready-cdnum">5</div>
      </div>
      <div class="round-overlay" id="round-overlay">
        <div class="gtitle" id="ov-title">النتائج</div>
        <table id="ov-table"></table>
        <div class="status-msg" id="ov-status"></div>
      </div>
    </div>
  </div>
  <!-- Player mobile controls (leader gets extra buttons here) -->
  <div id="pcontrols-wrap" class="pcontrols-wrap hidden">
    <div class="game-topbar">
      <div id="p-round-indicator">1/10</div>
      <div class="gname" id="p-game-name-label">اللعبة</div>
      <div id="p-score-label" style="color:var(--gold);font-weight:800;">0</div>
    </div>
    <div class="notif-bar" id="notif-bar">استعد...</div>
    <div id="pgrid-container" class="pgrid-wrap hidden"></div>
    <div id="counter-container" class="counter-wrap hidden">
      <div class="counter-num" id="counter-num">0</div>
      <div class="counter-btn-wrap">
        <button class="counter-btn" id="counter-btn">إضغط</button>
        <button class="counter-minus-btn" id="counter-minus-btn">−</button>
      </div>
    </div>
    <div id="submitted-label" class="submitted-label hidden" style="text-align:center;">SUBMITED!</div>
    <div class="leader-inline-btns">
      <button class="gold hidden" id="btn-next-round">▶ الجولة التالية</button>
      <button class="gold hidden" id="btn-bomb-new-round">🔄 جولة قنابل جديدة</button>
      <button class="ghost hidden" id="btn-bomb-to-lobby">🏠 العودة لغرفة الانتظار</button>
    </div>
    <button class="submit-btn" id="btn-submit">إرسال ✔</button>
  </div>
</div>

<audio id="snd-press" preload="auto" src="https://raw.githubusercontent.com/Jawlah1/RandFiles/main/Press.mp3"></audio>
<audio id="snd-submit" preload="auto" src="https://raw.githubusercontent.com/Jawlah1/RandFiles/main/Submit.mp3"></audio>
<audio id="snd-boom" preload="auto" src="https://raw.githubusercontent.com/Jawlah1/RandFiles/main/Boom.mp3"></audio>
<audio id="snd-correct" preload="auto" src="https://raw.githubusercontent.com/Jawlah1/RandFiles/main/Correct.mp3"></audio>
<audio id="snd-wrong" preload="auto" src="https://raw.githubusercontent.com/Jawlah1/RandFiles/main/Wrong.mp3"></audio>
<audio id="snd-appear" preload="auto" src="https://raw.githubusercontent.com/Jawlah1/RandFiles/main/Appear.mp3"></audio>
<audio id="snd-victory" preload="auto" src="https://raw.githubusercontent.com/Jawlah1/RandFiles/main/Vectory.mp3"></audio>

<script>
(function(){
"use strict";

var PEER_CONFIG = {
  host: 'maq-peerjs-server.onrender.com',
  port: 443,
  path: '/myapp',
  secure: true,
  debug: 0,
  config: { iceServers: [
    { urls:'stun:stun.l.google.com:19302' },
    { urls:'stun:stun1.l.google.com:19302' },
    { urls:'stun:stun2.l.google.com:19302' }
  ]}
};
var ROOM_PREFIX = 'brain5games37-';
var ASSET_BASE = 'https://raw.githubusercontent.com/Jawlah1/RandFiles/main/';

var snd = {
  press: document.getElementById('snd-press'),
  submit: document.getElementById('snd-submit'),
  boom: document.getElementById('snd-boom'),
  correct: document.getElementById('snd-correct'),
  wrong: document.getElementById('snd-wrong'),
  appear: document.getElementById('snd-appear'),
  victory: document.getElementById('snd-victory')
};
// Wrong.mp3 / Appear.mp3 are not guaranteed to exist in the assets repo yet - if either
// fails to load, fall back to a synthesized sound instead of staying silent.
var wrongFileAvailable = true, appearFileAvailable = true, victoryFileAvailable = true;
snd.wrong.addEventListener('error', function(){ wrongFileAvailable = false; });
snd.appear.addEventListener('error', function(){ appearFileAvailable = false; });
snd.victory.addEventListener('error', function(){ victoryFileAvailable = false; });
var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  return audioCtx;
}
// Synthesized "counter filling up" tick - no matching asset was supplied for this effect.
function playTick(step){
  var ctx = getAudioCtx();
  if(!ctx) return;
  try{
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 480 + Math.min(step||0,40)*16;
    gain.gain.setValueAtTime(0.16, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.09);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.09);
  }catch(e){}
}
function playSynthBuzz(){
  var ctx = getAudioCtx();
  if(!ctx) return;
  try{
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(90, ctx.currentTime+0.28);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.3);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.3);
  }catch(e){}
}
// Synthesized "pop" fallback for Appear.mp3 (new number / new red-square batch).
function playSynthAppear(){
  var ctx = getAudioCtx();
  if(!ctx) return;
  try{
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(700, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1100, ctx.currentTime+0.08);
    gain.gain.setValueAtTime(0.14, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.12);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.12);
  }catch(e){}
}
// Synthesized fallback fanfare for Vectory.mp3 (bomb game win).
function playSynthVictory(){
  var ctx = getAudioCtx();
  if(!ctx) return;
  try{
    var notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach(function(freq, i){
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'triangle';
      var t0 = ctx.currentTime + i*0.12;
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.linearRampToValueAtTime(0.2, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0+0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0+0.35);
    });
  }catch(e){}
}
var audioUnlocked = false;
function unlockAudio(){

  audioUnlocked = true;
  Object.keys(snd).forEach(function(k){
    try{ snd[k].volume = 1; snd[k].play().then(function(){ snd[k].pause(); snd[k].currentTime=0; }).catch(function(){}); }catch(e){}
  });
  var ctx = getAudioCtx();
  if(ctx && ctx.state==='suspended'){ ctx.resume().catch(function(){}); }
}

  if(key==='appear' && !appearFileAvailable){ playSynthAppear(); return; }

  var a = snd[key];

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

// ===================== HOST: MESSAGE HANDLING =====================
// Protocol note: every message carries `senderId` = the sending device's own player id
// (set automatically by sendToHost). Fields named `playerId` inside a message body are
// ALWAYS an explicit TARGET id (e.g. which player's score to adjust) chosen by the leader,
// never the sender. This separation fixes leader controls acting on the wrong player.
function hostHandleMessage(msg, conn){
  var g = app.game;
  if(!g) return;
  if(msg.t === 'join'){
    hostAddOrReconnectPlayer(msg.name, conn);
  } else if(msg.t === 'leave'){
    hostRemovePlayer(msg.senderId);
  } else if(msg.t === 'ready-toggle'){
    hostToggleReady(msg.senderId);
  } else if(msg.t === 'adjust-score'){
    if(msg.senderId === g.leaderId) hostAdjustScore(msg.playerId, msg.delta);
  } else if(msg.t === 'reset-score'){
    if(msg.senderId === g.leaderId) hostResetScore(msg.playerId);
  } else if(msg.t === 'transfer-leader'){
    if(msg.senderId === g.leaderId && g.players.some(function(p){return p.id===msg.playerId;})){
      g.leaderId = msg.playerId;
      broadcastState();
    }
  } else if(msg.t === 'set-theme'){
    if(msg.senderId === g.leaderId && Number.isInteger(msg.theme) && msg.theme>=0 && msg.theme<=5){
      g.theme = msg.theme;
      broadcastState();
    }
  } else if(msg.t === 'start-quick'){
    hostTryStartQuick(msg.senderId, msg.roundCount, conn);
  } else if(msg.t === 'start-bomb'){
    hostTryStartBomb(msg.senderId, conn);
  } else if(msg.t === 'submit-answer'){
    hostReceiveAnswer(msg.senderId, msg.value);
  } else if(msg.t === 'bomb-choose'){
    hostBombChoose(msg.senderId, msg.row);
  } else if(msg.t === 'next-round'){
    if(msg.senderId === g.leaderId) hostBeginNextQuickRound();
  } else if(msg.t === 'back-to-lobby'){
    if(msg.senderId === g.leaderId) hostBackToLobby();
  }
}

function findPlayer(id){
  return app.game.players.filter(function(p){ return p.id===id; })[0];
}
function allPlayersReady(g){
  return g.players.length>0 && g.players.every(function(p){ return p.ready; });
}

function hostTryStartQuick(senderId, roundCount, conn){
  var g = app.game;
  if(senderId !== g.leaderId) return;
  if(!allPlayersReady(g)){ if(conn && conn.send) conn.send({t:'notice', text:'لازم كل اللاعبين يضغطون استعداد أولاً'}); return; }
  hostStartQuickGames(roundCount);
}
function hostTryStartBomb(senderId, conn){
  var g = app.game;
  if(senderId !== g.leaderId) return;
  if(!allPlayersReady(g)){ if(conn && conn.send) conn.send({t:'notice', text:'لازم كل اللاعبين يضغطون استعداد أولاً'}); return; }
  hostStartBombGame();
}

function hostAddOrReconnectPlayer(name, conn){
  var g = app.game;
  var existing = g.players.filter(function(p){ return p.name===name; })[0];
  if(existing){
    if(existing.connected){
      name = name + '-' + rand(1,99);
    } else {
      existing.connected = true;
      conn.playerId = existing.id;
      conn.send({t:'welcome', myId:existing.id, code:g.code});
      broadcastState();
      return;
    }
  }
  if(g.phase !== 'lobby'){
    conn.send({t:'game-in-progress'});
    setTimeout(function(){ conn.close(); }, 300);
    return;
  }
  var id = 'p-'+Math.random().toString(36).substring(2,9);
  conn.playerId = id;
  var newPlayer = {id:id, name:name, score:0, connected:true, ready:false};
  g.players.push(newPlayer);
  if(!g.leaderId) g.leaderId = id;
  conn.send({t:'welcome', myId:id, code:g.code});
  broadcastState();
}

function hostRemovePlayer(id){
  var g = app.game;
  var idx = g.players.findIndex(function(p){return p.id===id;});
  if(idx===-1) return;
  g.players.splice(idx,1);
  if(g.leaderId === id){
    g.leaderId = g.players.length ? g.players[0].id : null;
  }
  broadcastState();
}

function hostHandlePlayerDisconnect(conn){
  if(!conn || !conn.playerId) return;
  var p = findPlayer(conn.playerId);
  if(p){ p.connected = false; broadcastState(); checkAllInAfterDisconnect(); }
  app.connections = app.connections.filter(function(c){ return c!==conn; });
}
function checkAllInAfterDisconnect(){
  var g = app.game;
  if(!g || g.phase!=='round-active' || !g.round) return;
  var connectedIds = g.players.filter(function(p){return p.connected;}).map(function(p){return p.id;});
  var allIn = connectedIds.length>0 && connectedIds.every(function(id){ return !!g.round.submissions[id]; });
  if(allIn) hostFinishQuickRoundCollection();
}

function hostToggleReady(id){
  var p = findPlayer(id);
  if(p){ p.ready = !p.ready; broadcastState(); }
}
function hostAdjustScore(targetId, delta){
  var p = findPlayer(targetId);
  if(p){ p.score = Math.max(0, p.score + delta); broadcastState(); }
}
function hostResetScore(targetId){
  var p = findPlayer(targetId);
  if(p){ p.score = 0; broadcastState(); }
}

function broadcastState(){
  var g = app.game;
  var payload = {t:'state', game:g};
  app.connections.forEach(function(c){ if(c.open) c.send(payload); });
  renderAll();
}

// ===================== CLIENT: MESSAGE HANDLING =====================
function clientHandleMessage(msg){
  if(msg.t === 'welcome'){
    app.myPlayerId = msg.myId;
    els.homeStatus.textContent='';
  } else if(msg.t === 'game-in-progress'){
    alert('اللعبة بدأت بالفعل، انتظر حتى تنتهي.');
    resetToHome();
  } else if(msg.t === 'notice'){
    alert(msg.text);
  } else if(msg.t === 'host-closed'){
    alert('قام المضيف بإغلاق الغرفة.');
    resetToHome();
  } else if(msg.t === 'state'){
    app.game = msg.game;
    renderAll();
    if(app.game.phase === 'lobby') showScreen('screen-lobby'); else showScreen('screen-game');
  }
}

function sendToHost(obj){
  obj.senderId = app.myPlayerId;
  if(app.isHost){ hostHandleMessage(obj, {senderId:app.myPlayerId, send:function(){}}); }
  else if(app.hostConn && app.hostConn.open) app.hostConn.send(obj);
}

// ===================== SCHEDULING =====================
var QUICK_GAME_KEYS = ['find-number','count-squares','remember-path','count-cubes','count-emoji'];
function buildSchedule(n){
  var base = Math.floor(n/5), rem = n%5;
  var counts = {}; QUICK_GAME_KEYS.forEach(function(k){counts[k]=base;});
  var extra = pickN(QUICK_GAME_KEYS, rem);
  extra.forEach(function(k){ counts[k]++; });
  var seq = [];
  QUICK_GAME_KEYS.forEach(function(k){ for(var i=0;i<counts[k];i++) seq.push(k); });
  return shuffle(seq);
}

// ===================== HOST: QUICK GAMES FLOW =====================
// NOTE (fix #1): a quick round NEVER ends on a timer. It only ends once every
// currently-connected player has submitted an answer. The hidden 11s countdown
// is used exclusively inside computeScore() for the speed bonus.
function hostStartQuickGames(roundCount){
  var g = app.game;
  roundCount = Math.max(1, Math.min(60, roundCount||10));
  g.mode = 'quick';
  g.schedule = buildSchedule(roundCount);
  g.scheduleIndex = 0;
  g.totalRounds = g.schedule.length;
  g.round = null;
  hostBeginNextQuickRound();
}

function hostBeginNextQuickRound(){
  var g = app.game;
  if(!g || g.mode!=='quick') return;
  if(!g.round || g.round.subIndex >= g.round.subTotal){
    if(g.scheduleIndex >= g.schedule.length){
      g.phase = 'quick-finished';
      broadcastState();
      return;
    }
    var key = g.schedule[g.scheduleIndex];
    g.scheduleIndex++;
    var subTotal = (key==='count-cubes'||key==='count-emoji') ? 5 : 1;
    g.round = { key:key, subIndex:0, subTotal:subTotal, slotNumber:g.scheduleIndex, totalSlots:g.schedule.length };
  }
  g.round.subIndex++;
  startQuickRoundPhaseReady();
}

function startQuickRoundPhaseReady(){
  var g = app.game;
  g.phase = 'round-ready';
  g.round.readyStartAt = Date.now()+300;
  g.round.data = null; g.round.submissions = {}; g.round.results = null;
  broadcastState();
  addTimer(setTimeout(function(){ startQuickRoundActive(); }, 3300));
}

function startQuickRoundActive(){
  var g = app.game;
  var mod = GAME_MODULES[g.round.key];
  g.round.data = mod.generate(g.players);
  g.phase = 'round-active';
  g.round.activeStartAt = Date.now()+250;
  g.round.questionPostedAt = g.round.activeStartAt + mod.unlockAt(g.round.data);
  broadcastState();
  // No forced end-of-round timer anymore: we simply wait for all connected
  // players to submit (see hostReceiveAnswer / checkAllInAfterDisconnect).
}

function hostReceiveAnswer(playerId, value){
  var g = app.game;
  if(!g.round || g.phase!=='round-active') return;
  if(g.round.submissions[playerId]) return;
  g.round.submissions[playerId] = {value:value, t:Date.now()};
  broadcastState();
  var connectedIds = g.players.filter(function(p){return p.connected;}).map(function(p){return p.id;});
  var allIn = connectedIds.length>0 && connectedIds.every(function(id){ return !!g.round.submissions[id]; });
  if(allIn){ hostFinishQuickRoundCollection(); }
}

function hostFinishQuickRoundCollection(){
  var g = app.game;
  if(!g.round || g.phase!=='round-active') return;
  var mod = GAME_MODULES[g.round.key];
  var results = mod.evaluate(g.round.data, g.round.submissions, g.players, g.round.questionPostedAt);
  g.round.results = results;
  g.round.revealStartAt = Date.now()+150;
  results.perPlayer && Object.keys(results.perPlayer).forEach(function(pid){
    var p = findPlayer(pid);
    if(p) p.score += results.perPlayer[pid].score;
  });
  g.phase = 'round-reveal';

function roundSignature(round){
  if(!round) return null;
  return round.key+'|'+round.slotNumber+'|'+round.subIndex+'|'+round.readyStartAt;
}
// Build a container's contents only once per unique `key`; returns true if it actually
// (re)built. Prevents tearing out interactive elements on every animation tick, which
// was causing taps to sometimes require 2-3 presses (fix #4).
function buildOnce(container, key, buildFn){
  if(container._builtKey === key) return false;
  buildFn();

}

// Per-player reveal-animation bookkeeping (which tick count we last played a sound for,
// whether the final correct/wrong sound already fired) - keyed by round-signature+playerId
// so it naturally resets on every new round.
var slotRevealAudio = {};
function slotAudioState(round, p){
  var key = roundSignature(round)+'|'+p.id;
  var st = slotRevealAudio[key];
  if(!st){ st = {lastCount:-1, done:false}; slotRevealAudio[key] = st; }
  return st;
}
// fix #2: counting-type games reveal ONE PLAYER AT A TIME (in player-list order) - each
// player's counter runs from 1 up to their own answer before the next player's starts.
var slotSeqCache = { sig:null, offsets:null };
function getSlotSequenceOffsets(round, players){
  var sig = roundSignature(round);
  if(slotSeqCache.sig === sig) return slotSeqCache.offsets;
  var offsets = {}; var cum = 0;
  players.forEach(function(p){
    var sub = round.submissions[p.id];
    var value = sub ? Math.max(0, parseInt(sub.value,10)||0) : 0;
    offsets[p.id] = cum;
    cum += (sub ? countDurationMs(value) : 0) + 500; // 0.5s pause before the next player starts
  });
  slotSeqCache = { sig:sig, offsets:offsets };
  return offsets;
}
function counterStatusHTML(p, round, extraDelay, myOffset){
  var st = slotAudioState(round, p);
  var sub = round.submissions[p.id];
  if(!sub) return { circle:'<div class="status-circle"></div>', count:'' };
  var value = Math.max(0, parseInt(sub.value,10) || 0);
  var elapsed = Date.now() - (round.revealStartAt||Date.now()) - (extraDelay||0) - (myOffset||0);
  if(elapsed < 0) return { circle:'<div class="status-circle gold"></div>', count:'' }; // waiting for their turn
  var count = acceleratingCount(elapsed, value);
  if(count < value){
    if(count > st.lastCount){ st.lastCount = count; if(count>0) playTick(count); }
    // fix #2: the running number lives OUTSIDE the circle so it doesn't get wiped out
    // when the circle switches to the final check/cross mark.
    return { circle:'<div class="status-circle gold"></div>', count:String(count) };
  }
  if(st.lastCount < value) st.lastCount = value;
  var res = round.results.perPlayer[p.id];
  var correct = !!(res && res.correct);
  if(!st.done){ st.done = true; playSound(correct ? 'correct' : 'wrong'); }
  return { circle:'<div class="status-circle '+(correct?'correct':'wrong')+'">'+(correct?'✔':'✖')+'</div>', count:String(value) };
}
function renderPlayerSlots(){
  clearArenaSlots();

  var players = g.players;
  var mod = g.round ? GAME_MODULES[g.round.key] : null;
  var isCounterGame = !!(mod && mod.inputType === 'counter');
  var seqOffsets = (g.round && g.round.results && isCounterGame) ? getSlotSequenceOffsets(g.round, players) : null;
  players.forEach(function(p, idx){
    var slotNum = SLOT_ORDER[idx % 12];

    var circleHTML, countHTML = '';
    if(g.round && g.round.results){
      if(isCounterGame){
        var extraDelay = mod.revealDelayMs ? mod.revealDelayMs(g.round.data) : 0;
        var res2 = counterStatusHTML(p, g.round, extraDelay, seqOffsets[p.id]);
        circleHTML = res2.circle;
        countHTML = '<div class="count-label">'+res2.count+'</div>';
      } else {
        // fix #3: find-number / remember-path now also play correct/wrong sound on reveal.
        var revealElapsed = Date.now() - (g.round.revealStartAt||0);
        var myDelay = idx*1000; // 1 second between each player's reveal
        var statusClass = '';
        if(revealElapsed >= myDelay){
          var r = g.round.results.perPlayer[p.id];
          statusClass = r ? (r.correct ? 'correct':'wrong') : '';
          var st2 = slotAudioState(g.round, p);
          if(!st2.done && statusClass){ st2.done = true; playSound(statusClass==='correct' ? 'correct' : 'wrong'); }
        } else {
          statusClass = g.round.submissions && g.round.submissions[p.id] ? 'gold' : '';
        }
        circleHTML = '<div class="status-circle '+statusClass+'">'+(statusClass==='correct'?'✔':statusClass==='wrong'?'✖':'')+'</div>';
      }
    } else if(g.round && g.round.submissions && g.round.submissions[p.id]){
      circleHTML = '<div class="status-circle gold"></div>';
    } else {
      circleHTML = '<div class="status-circle"></div>';
    }
    div.innerHTML = circleHTML + countHTML +
      '<div class="pname">'+escapeHtml(p.name)+'</div>'+
      '<div class="pscore">'+fmtScore(p.score)+'</div>';
    els.arenaWrap.appendChild(div);

  });

// Main animation loop: rAF for smooth motion (fixes choppy cubes/emoji, fix #7/#8).
// Bomb mode is intentionally excluded - it is fully event-driven (fix #4/#9) so its
// DOM is only rebuilt when the game state actually changes, never on a timer.
function startRenderLoop(){
  function tick(){
    if(app.game){
      var ph = app.game.phase;
      if(ph==='round-ready' || ph==='round-active' || ph==='round-reveal'){
        renderAll();
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
startRenderLoop();

// ===================== SCORING =====================
// Shared accelerating count-up model used by every reveal counter (cube check-off and
// per-player answer counters): starts at 10 counts/sec, speeds up by +5/sec every second.
// count(t) = 10t + 2.5t^2  (integral of rate(t) = 10 + 5t)
function acceleratingCount(elapsedMs, maxValue){
  var t = Math.max(0, elapsedMs/1000);
  var raw = 10*t + 2.5*t*t;
  return Math.max(0, Math.min(maxValue, Math.floor(raw)));
}
// Inverse: how long (ms) it takes the accelerating counter to reach `value`.
function countDurationMs(value){
  value = Math.max(0, value||0);
  if(value<=0) return 150;
  var t = (-10 + Math.sqrt(100 + 10*value)) / 5;
  return Math.max(150, t*1000);
}
function computeScore(correct, submittedAt, questionPostedAt, rankAmongCorrect, numPlayers){
  if(!correct) return 0;
  var elapsedSec = Math.max(0,(submittedAt - questionPostedAt)/1000);
  var remaining = 11 - elapsedSec;
  var bonusPct = Math.max(0, Math.min(1, remaining/10));
  var x = 10;
  var bonus = bonusPct*2*x;
  var n = numPlayers - (rankAmongCorrect-1);
  var placement = n*(x/10);
  return x + bonus + placement;
}
function genericEvaluate(isCorrectFn, data, submissions, players, questionPostedAt){
  var order = Object.keys(submissions)
    .filter(function(pid){ return isCorrectFn(data, submissions[pid].value); })
    .sort(function(a,b){ return submissions[a].t - submissions[b].t; });
  var perPlayer = {};
  var numPlayers = players.length;
  Object.keys(submissions).forEach(function(pid){
    var correct = isCorrectFn(data, submissions[pid].value);
    var rank = order.indexOf(pid)+1;
    var score = correct ? computeScore(true, submissions[pid].t, questionPostedAt, rank, numPlayers) : 0;
    perPlayer[pid] = {correct:correct, score:score};
  });
  players.forEach(function(p){ if(!perPlayer[p.id]) perPlayer[p.id] = {correct:false, score:0}; });
  return {perPlayer:perPlayer};
}
function idxToRC(i){ return {row:Math.floor(i/5), col:i%5}; }

function buildGrid5(container){
  container.innerHTML = '';
  var wrap = document.createElement('div');
  wrap.className = 'grid5';
  var cells = [];
  for(var i=0;i<25;i++){
    var c = document.createElement('div');
    c.className = 'cell5';
    c.setAttribute('data-i', i);
    wrap.appendChild(c);
    cells.push(c);
  }
  container.appendChild(wrap);
  return cells;
}

// ===================== GAME 1: find-number =====================
// fix #4: play Appear.mp3 exactly once each time a new number / new red-square batch
// shows up. Keyed by round-signature so it resets automatically every round; each device
// (host display OR a player's phone) only ever runs ONE of the two call sites below, so a
// single shared tracker per game is safe.
var appearTrackers = {};
function checkAppear(trackerKey, round, currentCount){
  var sig = roundSignature(round);
  var st = appearTrackers[trackerKey];
  if(!st || st.sig!==sig){ st = {sig:sig, last:-1}; appearTrackers[trackerKey]=st; }
  if(currentCount > st.last){
    st.last = currentCount;
    playSound('appear');
  }
}
var G1 = {

    var hideAt = (cells.length-1)*1000 + 3000;

    return { cells:cells, hideAt:hideAt, targetCell:cells[targetIndex].cell, targetValue:cells[targetIndex].value };
  },
  unlockAt:function(data){ return data.hideAt; },

// ===================== GAME 2: count-squares =====================
var G2 = {
  inputType:'counter',
  generate:function(players){
    var durationSec = rand(10,20);
    var counts = [];
    for(var i=0;i<durationSec;i++) counts.push(rand(1,4));
    var target = counts.reduce(function(a,b){return a+b;},0);
    return { durationSec:durationSec, counts:counts, target:target };
  },
  unlockAt:function(data){ return data.durationSec*1000; },
  notifText:function(round){ return 'احسب عدد المربعات التي أضاءت'; },
  renderDisplay:function(container, round){
    var data = round.data;
    var elapsed = Date.now() - round.activeStartAt;
    var cells = buildGrid5(container);
    var secIdx = Math.floor(elapsed/1000);
    var within = elapsed % 1000;
    if(secIdx < data.durationSec && within < 700){
      var rnd = mulberry32(secIdx*7919+13);
      var n = data.counts[secIdx];
      var used = {};
      for(var k=0;k<n;k++){
        var pos; var tries=0;
        do{ pos = Math.floor(rnd()*25); tries++; } while(used[pos] && tries<50);
        used[pos]=true;
        cells[pos].classList.add('red');
      }
      checkAppear('g2-display', round, secIdx+1); // fix #4: new batch of red squares
    } else if(secIdx >= data.durationSec){
      var label = document.createElement('div');
      label.className = 'answer-label';
      label.textContent = 'أرسل عدد المربعات من جهازك';
      container.appendChild(label);
    }
  },
  renderAnswerReveal:function(container, round){
    var data = round.data;
    container.innerHTML='';
    var label = document.createElement('div');
    label.className = 'answer-label';
    label.textContent = 'العدد الصحيح: '+data.target;
    container.appendChild(label);
  },
  evaluate:function(data, submissions, players, qpa){
    return genericEvaluate(function(d,v){ return parseInt(v,10)===d.target; }, data, submissions, players, qpa);
  }
};
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

// ===================== GAME 3: remember-path =====================
function generatePath(){
  for(var attempt=0; attempt<60; attempt++){
    var targetLen = rand(9,18);
    var start = rand(0,24);
    var path = [start];
    var visited = {}; visited[start]=true;
    var ok = true;
    while(path.length < targetLen){
      var cur = path[path.length-1];
      var rc = idxToRC(cur);
      var neighbors = [];
      [[0,1],[0,-1],[1,0],[-1,0]].forEach(function(d){
        var nr=rc.row+d[0], nc=rc.col+d[1];
        if(nr>=0&&nr<5&&nc>=0&&nc<5){
          var ni = nr*5+nc;
          if(!visited[ni]) neighbors.push(ni);
        }
      });
      if(!neighbors.length){ ok=false; break; }
      var next = neighbors[rand(0,neighbors.length-1)];
      path.push(next); visited[next]=true;
    }
    if(ok && path.length>=9) return path;
  }
  return [0,1,2,3,4,9,14,19,24];
}
var G3 = {
  inputType:'grid-path',
  generate:function(players){
    var path = generatePath();
    return { path:path, start:path[0], end:path[path.length-1], revealStepMs:500, holdMs:4000 };
  },
  unlockAt:function(data){ return data.path.length*data.revealStepMs + data.holdMs; },
  notifText:function(round){ return 'أعد رسم نفس المسار بالترتيب'; },
  renderDisplay:function(container, round){
    // fix #3: number each cell with its order in the path so it's clear which direction it runs.
    var data = round.data;
    var elapsed = Date.now() - round.activeStartAt;
    var cells = buildGrid5(container);
    var hideAt = data.path.length*data.revealStepMs + data.holdMs;
    if(elapsed < hideAt){
      var shown = Math.min(data.path.length, Math.floor(elapsed/data.revealStepMs)+1);
      for(var i=0;i<shown;i++){
        var ci = data.path[i];
        cells[ci].classList.add(i===0?'blue':(i===data.path.length-1?'red':'path'));
        cells[ci].textContent = (i+1);
      }
    } else {
      var label = document.createElement('div');
      label.className = 'answer-label';
      label.textContent = 'أرسل المسار من جهازك';
      container.appendChild(label);
    }
  },
  renderAnswerReveal:function(container, round){
    var data = round.data;
    var cells = buildGrid5(container);
    data.path.forEach(function(ci,i){
      cells[ci].classList.add(i===0?'blue':(i===data.path.length-1?'red':'path'));
      cells[ci].textContent = (i+1);
    });
    var label = document.createElement('div');
    label.className = 'answer-label';
    label.textContent = 'هذا هو المسار الصحيح';
    container.appendChild(label);
  },
  renderPlayerGridLocked:function(container, round){
    // fix #3: keep the player's own grid completely blank while the path is being shown
    // on the main screen - no start/end hint, they must memorize it from the shared screen.
    buildGrid5(container);
  },
  renderPlayerGridInteractive:function(container, round, sig){
    buildOnce(container, sig, function(){
      var data = round.data;
      var cells = buildGrid5(container);
      if(!clientInput.pathArray.length) clientInput.pathArray = [data.start];
      cells[data.start].classList.add('blue');
      cells[data.end].classList.add('red');
      function refreshPathVisuals(){
        cells.forEach(function(el,i){
          var pos = clientInput.pathArray.indexOf(i);
          if(i!==data.start && i!==data.end) el.classList.toggle('path', pos>-1);
          el.textContent = pos>-1 ? (pos+1) : '';
        });
        els.btnSubmit.disabled = clientInput.pathArray.length<=1;
      }
      refreshPathVisuals();
      cells.forEach(function(el,i){
        if(i===data.start) return;
        el.style.cursor='pointer';
        el.addEventListener('click', function(){
          var pos = clientInput.pathArray.indexOf(i);
          if(pos>-1){ clientInput.pathArray = clientInput.pathArray.slice(0,pos); }
          else { clientInput.pathArray.push(i); }
          playSound('press');
          refreshPathVisuals();
        }, {passive:true});
      });
    });
  },
  evaluate:function(data, submissions, players, qpa){
    return genericEvaluate(function(d,v){
      if(!Array.isArray(v) || v.length!==d.path.length) return false;
      for(var i=0;i<v.length;i++){ if(v[i]!==d.path[i]) return false; }
      return true;
    }, data, submissions, players, qpa);
  }
};

// ===================== GAME 4: count-squares-big (6x6 colored squares, replaces cubes) =====================
// fix #1: cubes were confusing/hard to read - replaced with a clean flat 6x6 grid of
// theme-colored squares, same mechanic (static flash or the whole grid slides across).
function buildGrid6(container){
  container.innerHTML = '';
  var wrap = document.createElement('div');
  wrap.className = 'grid6';
  var cells = [];
  for(var i=0;i<36;i++){
    var c = document.createElement('div');
    c.className = 'cell6';
    c.setAttribute('data-i', i);
    wrap.appendChild(c);
    cells.push(c);
  }
  container.appendChild(wrap);
  return cells;
}
function makeSquaresStage(){
  var stage = document.createElement('div');
  stage.style.cssText = 'position:relative;width:min(80vh,86vw,900px);height:min(80vh,86vw,900px);overflow:hidden;';
  return stage;
}
var g4RevealState = { sig:null, cellEls:null, lastCount:-1 };
var G4 = {
  inputType:'counter',
  generate:function(players){
    // fix: moving grid removed per feedback - always a static 1.5s flash now.
    var total = rand(4,36);
    var cellsUsed = pickN(range(0,35), total);
    var revealMs = 1500;
    return { cells:cellsUsed, total:total, revealMs:revealMs };
  },
  unlockAt:function(data){ return data.revealMs; },
  revealDelayMs:function(data){ return countDurationMs(data.total) + 300; },
  notifText:function(round){ return 'كم عدد المربعات الملونة؟'; },
  renderDisplay:function(container, round){
    var data = round.data;
    var elapsed = Date.now() - round.activeStartAt;
    container.innerHTML = '';
    if(elapsed >= data.revealMs){
      var label = document.createElement('div');
      label.className = 'answer-label';
      label.textContent = 'أرسل عدد المربعات من جهازك';
      container.appendChild(label);
      return;
    }
    var stage = makeSquaresStage();
    container.appendChild(stage);
    var cells = buildGrid6(stage);
    data.cells.forEach(function(ci){ cells[ci].classList.add('on'); });
  },
  renderAnswerReveal:function(container, round){
    // fix #1: checkmark glyph was never given its ✔ text before - now visible. Also the
    // label under the grid is now just the running counter number, nothing else.
    var data = round.data;
    var sig = roundSignature(round);
    if(g4RevealState.sig !== sig){
      container.innerHTML = '';
      var stage = makeSquaresStage();
      container.appendChild(stage);
      var cells = buildGrid6(stage);
      var cellEls = data.cells.map(function(ci){
        cells[ci].classList.add('on');
        var chk = document.createElement('div');
        chk.className = 'sq-check';
        chk.textContent = '✔';
        cells[ci].appendChild(chk);
        return cells[ci];
      });
      var counterDiv = document.createElement('div');
      counterDiv.className = 'answer-label';
      counterDiv.id = 'sq-reveal-counter';
      container.appendChild(counterDiv);
      g4RevealState = { sig:sig, cellEls:cellEls, lastCount:0 };
    }
    var elapsedReveal = Date.now() - (round.revealStartAt||Date.now());
    var howMany = acceleratingCount(elapsedReveal, data.total);
    if(howMany > g4RevealState.lastCount){
      for(var i=g4RevealState.lastCount; i<howMany; i++){
        var cell = g4RevealState.cellEls[i];
        if(cell){ var chk = cell.querySelector('.sq-check'); if(chk) chk.style.display='flex'; }
        playTick(i+1);
      }
      g4RevealState.lastCount = howMany;
    }
    var counterEl = container.querySelector('#sq-reveal-counter');
    if(counterEl) counterEl.textContent = howMany;
  },
  evaluate:function(data, submissions, players, qpa){
    return genericEvaluate(function(d,v){ return parseInt(v,10)===d.total; }, data, submissions, players, qpa);
  }
};

// ===================== GAME 5: count-emoji =====================
var EMOJI_POOL = ['🍎','🐱','⭐','🎈','🍕','🚀','⚽','🌸'];
var G5 = {
  inputType:'counter',
  generate:function(players){
    var typesN = rand(2,4);
    var types = pickN(EMOJI_POOL, typesN);
    var items = [];
    var total = 0;
    types.forEach(function(e){
      var c = rand(3,14); // fix #8: slightly fewer emojis
      for(var i=0;i<c;i++){
        items.push({
          emoji:e, moving: Math.random()<0.5,
          baseX: rand(6,88), baseY: rand(12,82),
          amp: rand(4,10), speed: (rand(30,60)/100), phase: Math.random()*6.28
        });
      }
      total += c;
    });
    if(total>26){ var excess=total-26; while(excess>0 && items.length>0){ items.pop(); excess--; } }
    var counts = {};
    items.forEach(function(it){ counts[it.emoji]=(counts[it.emoji]||0)+1; });
    var target = types[rand(0,types.length-1)];
    return { items:items, types:types, counts:counts, target:target, targetCount:counts[target]||0 };
  },
  unlockAt:function(data){ return 0; }, // fix #6: emoji game is the only one open from the start
  notifText:function(round){ return 'عد رمز '+round.data.target+' بسرعة!'; },
  renderDisplay:function(container, round){ renderEmojiField(container, round); },
  renderAnswerReveal:function(container, round){
    var data = round.data;
    container.innerHTML = '';
    var label = document.createElement('div');
    label.className = 'answer-label';
    label.textContent = 'عدد '+data.target+' الصحيح هو: '+data.targetCount;
    container.appendChild(label);
  },
  evaluate:function(data, submissions, players, qpa){
    return genericEvaluate(function(d,v){ return parseInt(v,10)===d.targetCount; }, data, submissions, players, qpa);
  }
};
function renderEmojiField(container, round){
  var data = round.data;

  data.items.forEach(function(it){

var GAME_MODULES = {
  'find-number': G1, 'count-squares': G2, 'remember-path': G3, 'count-cubes': G4, 'count-emoji': G5
};

// ===================== BOMB GAME =====================
var BOMB_ROWS = 4, BOMB_MIN_COLS = 5, BOMB_MAX_COLS = 10;
function computeBombCols(playerCount){
  // fix #9: 2 players -> 5 cols, +1 col per extra player, capped at 10
  return Math.max(BOMB_MIN_COLS, Math.min(BOMB_MAX_COLS, playerCount+3));
}
function buildBombOrder(players){
  var groups = {};
  players.forEach(function(p){ (groups[p.score]=groups[p.score]||[]).push(p.id); });
  var scores = Object.keys(groups).map(Number).sort(function(a,b){return b-a;});
  var order = [];
  scores.forEach(function(s){ order = order.concat(shuffle(groups[s])); });
  return order; // fixed for the whole round (fix #9) - never recalculated mid-round
}
function bombNextConnectedTurn(bomb, players){
  var tries=0;
  while(tries < bomb.order.length){
    var pid = bomb.order[bomb.turnIndex];
    var p = players.filter(function(x){return x.id===pid;})[0];
    if(p && p.connected) return;
    bomb.turnIndex = (bomb.turnIndex+1) % bomb.order.length;
    tries++;
  }
}

function hostStartBombGame(){
  var g = app.game;
  var connectedCount = g.players.filter(function(p){return p.connected;}).length || g.players.length;
  var cols = computeBombCols(connectedCount);
  var grid = [];
  for(var c=0;c<cols;c++){
    var safeRow = rand(0,BOMB_ROWS-1);
    var col = [];
    for(var r=0;r<BOMB_ROWS;r++) col.push(r===safeRow);
    grid.push(col);
  }
  var everDiscovered = grid.map(function(col){ return col.map(function(){return false;}); });
  var order = buildBombOrder(g.players);
  g.mode = 'bomb';
  g.bomb = { grid:grid, everDiscovered:everDiscovered, rows:BOMB_ROWS, cols:cols,
    order:order, turnIndex:0, currentCol:0, turnRevealed:[], finished:false, winnerId:null, lastChoice:null,
    instanceId: Math.random().toString(36).substring(2,9) };
  bombNextConnectedTurn(g.bomb, g.players);
  g.phase = 'bomb-playing';
  broadcastState();
}

function hostBombChoose(playerId, row){
  var g = app.game;
  if(!g.bomb || g.phase!=='bomb-playing') return;
  if(g.bomb.order[g.bomb.turnIndex] !== playerId) return;
  var col = g.bomb.currentCol;
  if(col==null || col>=g.bomb.cols) return;
  var isSafe = g.bomb.grid[col][row];
  var p = findPlayer(playerId);
  if(isSafe){
    var wasEver = g.bomb.everDiscovered[col][row];
    g.bomb.everDiscovered[col][row] = true; // internal memory only, used for scoring
    if(p) p.score += wasEver ? 1 : 5;
    g.bomb.turnRevealed.push({col:col,row:row}); // visible only for THIS turn (fix #9)
    g.bomb.lastChoice = {col:col,row:row,safe:true};
    g.bomb.currentCol++;
    if(g.bomb.currentCol >= g.bomb.cols){
      if(p) p.score += 20;
      g.bomb.finished = true;
      g.bomb.winnerId = playerId;
      g.phase = 'bomb-finished'; // fix #9: grid & path stay visible, no auto-redirect
    }
    broadcastState();
  } else {
    g.bomb.lastChoice = {col:col,row:row,safe:false};
    broadcastState();
    addTimer(setTimeout(function(){
      g.bomb.turnIndex = (g.bomb.turnIndex+1) % g.bomb.order.length;
      bombNextConnectedTurn(g.bomb, g.players);
      g.bomb.currentCol = 0;
      g.bomb.turnRevealed = []; // fix #9: colors reset for next player - must rely on memory
      g.bomb.lastChoice = null;
      broadcastState();
    }, 2000));
  }
}

function bombSig(bomb){ return bomb.lastChoice ? (bomb.lastChoice.col+'-'+bomb.lastChoice.row+'-'+bomb.lastChoice.safe) : 'none'; }
var lastBombSoundSig = null;
function maybePlayBombSound(bomb){
  var sig = bombSig(bomb);
  if(sig !== lastBombSoundSig){
    lastBombSoundSig = sig;
    if(bomb.lastChoice) playSound(bomb.lastChoice.safe ? 'correct' : 'boom');
  }
}
var lastVictorySig = null;
function maybePlayVictorySound(bomb){
  if(!bomb.finished) return;
  var sig = bomb.instanceId+'-win';
  if(sig !== lastVictorySig){
    lastVictorySig = sig;
    playSound('victory');
  }
}

// Bomb grid is rendered ONLY when the underlying state actually changes (called from
// renderAll after a broadcastState), never on a timer - this removes the double/triple
// tap issue (fix #4/#9) since click handlers are never torn out mid-gesture.
function renderBombGrid(container, bomb, interactive, onPick){
  container.innerHTML = '';
  var row1 = document.createElement('div');
  row1.style.cssText = 'display:flex;align-items:center;gap:1.4vw;direction:ltr;';
  var arrow = document.createElement('div');
  arrow.className = 'bomb-arrow';
  arrow.textContent = '➡';
  var gridEl = document.createElement('div');
  gridEl.className = 'bomb-grid';
  // fix #4: compute one SQUARE cell size that fits the available space, instead of
  // stretching a fixed-width/height box into rectangles. Uses this device's own viewport,
  // so it adapts correctly whether it's the big display or a player's phone.
  var availW = window.innerWidth*0.8 - 70;
  var availH = window.innerHeight*0.52;
  var cellSize = Math.floor(Math.min(availW/bomb.cols, availH/bomb.rows));
  cellSize = Math.max(22, Math.min(cellSize, 150));
  gridEl.style.gridTemplateColumns = 'repeat('+bomb.cols+', '+cellSize+'px)';
  gridEl.style.gridTemplateRows = 'repeat('+bomb.rows+', '+cellSize+'px)';
  gridEl.style.width = 'auto';
  gridEl.style.height = 'auto';
  var cellFont = Math.max(14, Math.floor(cellSize*0.42));
  for(var r=0;r<bomb.rows;r++){
    for(var c=0;c<bomb.cols;c++){
      var cell = document.createElement('div');
      cell.className = 'bomb-cell';
      cell.style.gridColumnStart = c+1;
      cell.style.gridRowStart = r+1;
      cell.style.fontSize = cellFont+'px';
      var isRevealedSafe = bomb.turnRevealed.some(function(t){ return t.col===c && t.row===r; });
      var isLastBomb = bomb.lastChoice && bomb.lastChoice.col===c && bomb.lastChoice.row===r && !bomb.lastChoice.safe;
      var isLastSafe = bomb.lastChoice && bomb.lastChoice.col===c && bomb.lastChoice.row===r && bomb.lastChoice.safe;
      if(isRevealedSafe || isLastSafe) cell.classList.add('safe');
      if(isLastBomb){
        cell.classList.add('bomb');
        var img = document.createElement('img');
        img.src = ASSET_BASE + 'Bomb.png';
        cell.appendChild(img);
      }
      if(!bomb.finished && c===bomb.currentCol) cell.style.outline = '3px solid var(--gold)';
      if(interactive && c===bomb.currentCol){
        cell.style.cursor = 'pointer';
        (function(rr){ cell.addEventListener('click', function(){ onPick(rr); }, {passive:true}); })(r);
      }
      gridEl.appendChild(cell);
    }
  }
  row1.appendChild(arrow);
  row1.appendChild(gridEl);
  container.appendChild(row1);
}

function renderPlayerSlotsBomb(){
  var g = app.game;

  els.displayWrap.classList.add('hidden');

      els.btnBombToLobby.classList.remove('hidden');

  var myTurn = g.bomb.order[g.bomb.turnIndex] === app.myPlayerId;

  renderBombGrid(els.pgridContainer, g.bomb, myTurn, function(row){
    sendToHost({t:'bomb-choose', row:row});
  });
  maybePlayBombSound(g.bomb);
}
