      var cells = buildGrid5(container);
      if(!clientInput.pathArray.length) clientInput.pathArray = [data.start];
      cells[data.start].classList.add('blue');
      cells[data.end].classList.add('red');
      function refreshPathVisuals(){
        cells.forEach(function(el,i){
          var pos = clientInput.pathArray.indexOf(i);
          if(i!==data.start && i!==data.end) el.classList.toggle('path', pos>-1);
          el.textContent = pos>-1 ? (pos+1) : '';
        });
        els.btnSubmit.disabled = clientInput.pathArray.length<=1;
      }
      refreshPathVisuals();
      cells.forEach(function(el,i){
        if(i===data.start) return;
        el.style.cursor='pointer';
        el.addEventListener('click', function(){
          var pos = clientInput.pathArray.indexOf(i);
          if(pos>-1){ clientInput.pathArray = clientInput.pathArray.slice(0,pos); }
          else { clientInput.pathArray.push(i); }
          playSound('press');
          refreshPathVisuals();
        }, {passive:true});
      });
    });
  },
  evaluate:function(data, submissions, players, qpa){
    return genericEvaluate(function(d,v){
      if(!Array.isArray(v) || v.length!==d.path.length) return false;
      for(var i=0;i<v.length;i++){ if(v[i]!==d.path[i]) return false; }
      return true;
    }, data, submissions, players, qpa);
  }
};

// ===================== GAME 4: count-squares-big (6x6 colored squares, replaces cubes) =====================
// fix #1: cubes were confusing/hard to read - replaced with a clean flat 6x6 grid of
// theme-colored squares, same mechanic (static flash or the whole grid slides across).
function buildGrid6(container){
  container.innerHTML = '';
  var wrap = document.createElement('div');
  wrap.className = 'grid6';
  var cells = [];
  for(var i=0;i<36;i++){
    var c = document.createElement('div');
    c.className = 'cell6';
    c.setAttribute('data-i', i);
    wrap.appendChild(c);
    cells.push(c);
  }
  container.appendChild(wrap);
  return cells;
}
function makeSquaresStage(){
  var stage = document.createElement('div');
  stage.style.cssText = 'position:relative;width:min(80vh,86vw,900px);height:min(80vh,86vw,900px);overflow:hidden;';
  return stage;
}
var g4RevealState = { sig:null, cellEls:null, lastCount:-1 };
var G4 = {
  inputType:'counter',
  generate:function(players){
    // fix: moving grid removed per feedback - always a static 1.5s flash now.
    var total = rand(4,36);
    var cellsUsed = pickN(range(0,35), total);
    var revealMs = 1500;
    return { cells:cellsUsed, total:total, revealMs:revealMs };
  },
  unlockAt:function(data){ return data.revealMs; },
  revealDelayMs:function(data){ return countDurationMs(data.total) + 300; },
  notifText:function(round){ return 'كم عدد المربعات؟'; },
  renderDisplay:function(container, round){
    var data = round.data;
    var elapsed = syncedNow() - round.activeStartAt;
    container.innerHTML = '';
    if(elapsed >= data.revealMs){
      var label = document.createElement('div');
      label.className = 'answer-label';
      label.textContent = 'أرسل عدد المربعات من جهازك';
      container.appendChild(label);
      return;
    }
    var stage = makeSquaresStage();
    container.appendChild(stage);
    var cells = buildGrid6(stage);
    data.cells.forEach(function(ci){ cells[ci].classList.add('on'); });
  },
  renderAnswerReveal:function(container, round){
    // fix #1: checkmark glyph was never given its ✔ text before - now visible. Also the
    // label under the grid is now just the running counter number, nothing else.
    var data = round.data;
    var sig = roundSignature(round);
    if(g4RevealState.sig !== sig){
      container.innerHTML = '';
      // fix: put the counter beside the grid (not underneath), big and unmistakable.
      // direction:ltr on this row keeps it grid-then-counter left-to-right regardless
      // of the page's own RTL context, so the counter lands on the RIGHT of the grid.
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:3vw;direction:ltr;';
      var stage = makeSquaresStage();
      row.appendChild(stage);
      var cells = buildGrid6(stage);
      var cellEls = data.cells.map(function(ci){
        cells[ci].classList.add('on');
        var chk = document.createElement('div');
        chk.className = 'sq-check';
        chk.textContent = '✔';
        cells[ci].appendChild(chk);
        return cells[ci];
      });
      var counterDiv = document.createElement('div');
      counterDiv.id = 'sq-reveal-counter';
      counterDiv.style.cssText = 'font-size:clamp(70px,16vh,170px);font-weight:900;color:var(--gold);min-width:2ch;text-align:center;';
      row.appendChild(counterDiv);
      container.appendChild(row);
      g4RevealState = { sig:sig, cellEls:cellEls, lastCount:0 };
    }
    var elapsedReveal = syncedNow() - (round.revealStartAt||syncedNow());
    var howMany = acceleratingCount(elapsedReveal, data.total);
    if(howMany > g4RevealState.lastCount){
      for(var i=g4RevealState.lastCount; i<howMany; i++){
        var cell = g4RevealState.cellEls[i];
        if(cell){ var chk = cell.querySelector('.sq-check'); if(chk) chk.style.display='flex'; }
        playTick(i+1);
      }
      g4RevealState.lastCount = howMany;
    }
    var counterEl = container.querySelector('#sq-reveal-counter');
    if(counterEl) counterEl.textContent = howMany;
  },
  evaluate:function(data, submissions, players, qpa){
    return genericEvaluate(function(d,v){ return parseInt(v,10)===d.total; }, data, submissions, players, qpa);
  }
};

var EMOJI_POOL = ['🍎','🐱','⭐','🎈','🍕','🚀','⚽','🌸','🎀','💎','🎻','🎮','🍿','🥭','🍙','🍳','🍟','🍔','🐥','🦅','✈️','🚓','🎱','👑','🎁'];
var G5 = {
  inputType:'counter',
  generate:function(players){
    var typesN = rand(2,4);
    var types = pickN(EMOJI_POOL, typesN);
    var items = [];
    var total = 0;
    types.forEach(function(e){
      var c = rand(3,14); // fix #8: slightly fewer emojis
      for(var i=0;i<c;i++){
        items.push({
          emoji:e, moving: Math.random()<0.5,
          baseX: rand(6,88), baseY: rand(12,82),
          amp: rand(4,10), speed: (rand(30,60)/100), phase: Math.random()*6.28
        });
      }
      total += c;
    });
    if(total>26){ var excess=total-26; while(excess>0 && items.length>0){ items.pop(); excess--; } }
    var counts = {};
    items.forEach(function(it){ counts[it.emoji]=(counts[it.emoji]||0)+1; });
    var target = types[rand(0,types.length-1)];
    return { items:items, types:types, counts:counts, target:target, targetCount:counts[target]||0 };
  },
  unlockAt:function(data){ return 0; }, // fix #6: emoji game is the only one open from the start
  notifText:function(round){ return 'عد رمز '+round.data.target+' بسرعة!'; },
  renderDisplay:function(container, round){ renderEmojiField(container, round); },
  renderAnswerReveal:function(container, round){
    var data = round.data;
    container.innerHTML = '';
    var label = document.createElement('div');
    label.className = 'answer-label';
    label.textContent = 'عدد '+data.target+' الصحيح هو: '+data.targetCount;
    container.appendChild(label);
  },
  evaluate:function(data, submissions, players, qpa){
    return genericEvaluate(function(d,v){ return parseInt(v,10)===d.targetCount; }, data, submissions, players, qpa);
  }
};
function renderEmojiField(container, round){
  var data = round.data;
  var elapsed = (syncedNow() - round.activeStartAt)/1000;
  container.innerHTML = '';
  var field = document.createElement('div');
  field.style.cssText = 'position:relative;width:min(92vw,1500px);height:min(68vh,700px);background:var(--panel2);border-radius:14px;border:1px solid var(--border);overflow:hidden;'; // fix #4: bigger play area
  data.items.forEach(function(it){
    var span = document.createElement('span');
    span.textContent = it.emoji;
    span.style.position = 'absolute';
    span.style.fontSize = 'clamp(34px,6.4vh,66px)'; // fix #4/#8: bigger for larger screen
    var x = it.baseX, y = it.baseY;
    if(it.moving){
      x = it.baseX + Math.sin(elapsed*it.speed+it.phase)*it.amp;
      y = it.baseY - Math.abs(Math.sin(elapsed*it.speed*2+it.phase))*6;
    }
    span.style.left = x+'%'; span.style.top = y+'%';
    field.appendChild(span);
  });
  container.appendChild(field);
  var label = document.createElement('div');
  label.className = 'answer-label';
  label.textContent = 'عد رمز: '+data.target;
  container.appendChild(label);
}

// ===================== FLAGS GAME =====================
var FLAG_DIRECTIONS = ['up','down','left','right'];
function randomFlagDirExcluding(exclude){
  var options = FLAG_DIRECTIONS.filter(function(d){ return d!==exclude; });
  return options[rand(0,options.length-1)];
}
function generateInitialFlagSequence(){
  var seq = [randomFlagDirExcluding(null)];
  while(seq.length < 3){ seq.push(randomFlagDirExcluding(seq[seq.length-1])); }
  return seq;
}
function hostTryStartFlags(senderId, roundsTotal, conn){
  var g = app.game;
  if(senderId !== g.leaderId) return;
  if(!allPlayersReady(g)){ if(conn && conn.send) conn.send({t:'notice', text:'لازم كل اللاعبين يضغطون استعداد أولاً'}); return; }
  hostStartFlagsGame(roundsTotal);
}
function hostStartFlagsGame(roundsTotal){
  var g = app.game;
  roundsTotal = Math.max(2, parseInt(roundsTotal,10)||5);
  g.mode = 'flags';
  g.flagsConfig = { roundsTotal: roundsTotal };
  g.flags = { sequence:[], roundNumber:0, submissions:{}, results:null };
  hostBeginFlagsRound();
}
function hostBeginFlagsRound(){
  var g = app.game;
  var seq = g.flags.sequence;
  if(seq.length===0){
    g.flags.sequence = generateInitialFlagSequence();
  } else {
    // fix: same direction never repeats back-to-back - the new move must differ from
    // whatever the sequence currently ends on.
    seq.push(randomFlagDirExcluding(seq[seq.length-1]));
  }
  g.flags.roundNumber++;
  g.flags.submissions = {};
  g.flags.results = null;
  g.flags.readyStartAt = syncedNow()+300;
  g.phase = 'flags-ready';
  broadcastState();
  addTimer(setTimeout(function(){ startFlagsActive(); }, 3300));
}
function startFlagsActive(){
  var g = app.game;
  g.flags.activeStartAt = syncedNow()+250;
  g.flags.questionPostedAt = g.flags.activeStartAt + g.flags.sequence.length*1000;
  g.phase = 'flags-active';
  broadcastState();
  // No forced end-of-round timer, exactly like the quick games - we simply wait for
  // every present player to submit (see hostReceiveFlagsAnswer).
}
function hostReceiveFlagsAnswer(playerId, value){
  var g = app.game;
  if(!g.flags || g.phase!=='flags-active') return;
  if(g.flags.submissions[playerId]) return;
  if(!Array.isArray(value)) return;
  g.flags.submissions[playerId] = { value:value, t:syncedNow() };
  broadcastState();
  var presentIds = g.players.filter(hostPlayerCountsAsPresent).map(function(p){return p.id;});
  var allIn = presentIds.length>0 && presentIds.every(function(id){ return !!g.flags.submissions[id]; });
  if(allIn) hostFinishFlagsRound();
}
function hostFinishFlagsRound(){
  var g = app.game;
  if(!g.flags || g.phase!=='flags-active') return;
  var isCorrectFn = function(seq, v){
    return Array.isArray(v) && v.length===seq.length && v.every(function(d,i){ return d===seq[i]; });
  };
  var results = genericEvaluate(isCorrectFn, g.flags.sequence, g.flags.submissions, g.players, g.flags.questionPostedAt);
  g.flags.results = results;
  g.flags.revealStartAt = syncedNow()+150;
  results.perPlayer && Object.keys(results.perPlayer).forEach(function(pid){
    var p = findPlayer(pid);
    if(p) p.score += results.perPlayer[pid].score;
  });
  g.phase = 'flags-reveal';
  broadcastState();
  // No auto-advance - the leader presses "next round" (see hostAdvanceFlags below).
}
function hostAdvanceFlags(){
  var g = app.game;
  if(!g.flags || !g.flagsConfig) return;
  if(g.flags.roundNumber >= g.flagsConfig.roundsTotal && hostTopTied(g)){ g.flagsConfig.roundsTotal++; g.tiebreak = (g.tiebreak || 0) + 1; }
  if(g.flags.roundNumber >= g.flagsConfig.roundsTotal){
    var sorted = g.players.slice().sort(function(a,b){ return b.score-a.score; });
    g.winnerId = sorted.length ? sorted[0].id : null;
    g.celebration = { bursts:[], sessionId: Math.random().toString(36).substring(2,9) };
    g.phase = 'flags-finished';
    broadcastState();
  } else {
    hostBeginFlagsRound();
  }
}

// ---- the dictionary lives in the BrainG repo (words.json) and is edited with the page
// "تحرير فهرس كلمات اللعبة"; every version loads it when it opens. The lists above are only the
// fallback for when it can't be fetched (offline...). words.json also says where the words
// players tried that aren't in the dictionary are sent (a Google Sheet, see the editor).
var WORDS_REMOTE_URL = 'https://raw.githubusercontent.com/Jawlah1/BrainG/main/words.json';
var WORDS_LOG_URL = '';
var WORDS_SOURCE = 'built-in';
function wordsListOf(x){
  var a = Array.isArray(x) ? x : String(x || '').split(/\s+/);
  return a.map(function(w){ return String(w || '').replace(/[ً-ٰٟـ\s]/g, ''); })
    .filter(function(w){ return w.length === 5 && /^[ء-غف-ي]+$/.test(w); });
}
function wordsApplyRemote(d){
  if(!d || typeof d !== 'object') return false;
  var ans = wordsListOf(d.answers), gs = wordsListOf(d.guesses), ex = wordsListOf(d.extra);
  if(ans.length < 50) return false;                       // (a broken file never replaces a good list)
  WORDS_ANSWERS = ans;
  WORDS_DICT_PACKED = gs.join('');
  WORDS_EXTRA_PACKED = ex.join('');
  WORDS_BUCKETS = null;                                    // rebuilt from the new lists when next needed
  WORDS_LOG_URL = typeof d.logUrl === 'string' && /^https:\/\//.test(d.logUrl) ? d.logUrl : '';
  WORDS_SOURCE = 'github';
  return true;
}
(function(){
  try{
    fetch(WORDS_REMOTE_URL + '?t=' + Date.now(), { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; }).then(wordsApplyRemote).catch(function(){});
  }catch(e){}
})();
// a phone tried a word that isn't in the dictionary: the display sends it to the list (once per
// player, word and round) so it can be looked at in the editor
var wordsUnknownSent = {};
function hostWordsUnknown(pid, msg){
  var g = app.game;
  if(!g || g.mode !== 'words' || !g.words || !findPlayer(pid)) return;
  var w = String(msg.word || '').replace(/[ً-ٰٟـ\s]/g, '');
  if(w.length !== WORDS_LEN || !/^[ء-غف-ي]+$/.test(w)) return;
  if(wordsCanonical(w)) return;                            // it IS a known word (that phone had an older list)
  var key = g.words.roundNumber + '|' + pid + '|' + w;
  if(wordsUnknownSent[key]) return;
  wordsUnknownSent[key] = true;
  if(!WORDS_LOG_URL) return;
  try{ fetch(WORDS_LOG_URL + '?action=log&word=' + encodeURIComponent(w), { mode:'no-cors' }).catch(function(){}); }catch(e){}
}

// ===================== WORDS GAME (Arabic Wordle) =====================
// Every player guesses the SAME hidden 5-letter word on their own phone, one row per
// attempt (attempt count chosen by the leader). Green = right letter in the right place,
// yellow = letter is in the word but elsewhere. Scoring mirrors the quick games: you must
// find the word to score; base points + a hidden speed bonus that fades over 300s + a
// placement bonus for the order in which players found it. No round time limit - the
// round ends once every present player has either found the word or used all attempts.
var WORDS_LEN = 5;
var WORDS_BASE_POINTS = 20;      // for finding the word at all
var WORDS_BONUS_POINTS = 50;     // speed bonus at t=0, fading linearly...
var WORDS_BONUS_WINDOW_SEC = 300; // ...to 0 after this many seconds
var WORDS_ATTEMPT_BONUS = 10;    // + this much for every attempt left unused when the word is found
// bumped whenever the phone <-> display message format changes; a phone running a different
// (e.g. cached) copy of the game than the display is warned to reload
var WORDS_PROTOCOL = 10;
var WORDS_LABEL = 'لعبة الكلمات 🔤';

// Letter rules.
// IDENTITY (yellow tiles + the repeat counts): every alef / hamza form is ONE letter
//   (ا أ إ آ ء ئ ؤ ى), ت and ة are ONE letter (same sound), ه is only ever ه.
// GREEN / CONVERSION: a typed letter may only stand for these letters of the dictionary word
//   (and a sent guess is rewritten to the dictionary's spelling on exactly the same terms):
//   ا -> ى anywhere; at the START of the word also أ إ آ
//   أ (long-press ا) -> إ آ ؤ ئ anywhere; at the start also ا
//   إ / آ            -> أ إ آ anywhere; at the start also ا
//   ى -> ا or ئ anywhere        ئ (long-press ى) -> ى
//   و -> ؤ anywhere             ؤ (long-press و) -> only ؤ
//   ء -> only ء, and nothing else ever becomes ء (عقلاء can't be typed عقلاى / عقلاا)
//   LAST letter only: ت -> ة, ة -> ه, ه -> ة (never ت -> ه, never ة -> ت)
function wordsIsAlef(c){
  return c==='ا'||c==='أ'||c==='إ'||c==='آ'||c==='ٱ'||c==='ء'||c==='ؤ'||c==='ئ'||c==='ى';
}
function wordsIdent(c){ if(wordsIsAlef(c)) return 'ا'; return c==='ة' ? 'ت' : c; }
var WORDS_TYPED_TO = {
  'ا':'ى', 'ٱ':'ى', 'أ':'إآؤئ', 'إ':'أآ', 'آ':'أإ', 'ى':'ائ', 'ئ':'ى', 'و':'ؤ'
};
var WORDS_START_ALEFS = 'اأإآٱ';
function wordsTypedMatches(t, a, i){
  if(t===a) return true;
  if(i===WORDS_LEN-1 && ((t==='ت'&&a==='ة') || (t==='ة'&&a==='ه') || (t==='ه'&&a==='ة'))) return true;
  if(i===0 && WORDS_START_ALEFS.indexOf(t)>=0 && WORDS_START_ALEFS.indexOf(a)>=0) return true;
  return !!(WORDS_TYPED_TO[t] && WORDS_TYPED_TO[t].indexOf(a)>=0);
}
// does a typed word fit a dictionary word letter by letter (under the rules above)?
function wordsFits(typed, word){
  var t = wordsSplit(typed), a = wordsSplit(word);
  if(t.length!==WORDS_LEN || a.length!==WORDS_LEN) return false;
  for(var i=0;i<WORDS_LEN;i++) if(!wordsTypedMatches(t[i], a[i], i)) return false;
  return true;
}
// kept for older helpers: alef family -> ا
function wordsNormChar(c){ return wordsIsAlef(c) ? 'ا' : c; }
// ه is shown as "هـ" so it's never mistaken for another letter
function wordsShowChar(c){ return c==='ه' ? 'هـ' : (c||''); }
// letters to SHOW for a sent guess: always the guess's OWN spelling (it was already turned
// into the dictionary spelling when sent). Letters are never copied from the answer.
function wordsDisplayLetters(guess, answer, states){ return wordsSplit(guess); }
// how many letters of the answer share the identity of letter `c` (the letter written on a
// GREEN tile) - the corner number, shown when > 1 (all alef forms count together; ت + ة)
function wordsLetterCount(answer, c){
  var id = wordsIdent(c), n = 0;
  wordsSplit(answer).forEach(function(x){ if(wordsIdent(x)===id) n++; });
  return n;
}
// buckets of dictionary words that could be the same typed word: alef family + و -> ا,
// final ت/ة/ه -> ه. Inside a bucket the most common spelling comes first.
function wordsSkel(w){
  var s = wordsSplit(w).map(function(c){ return (wordsIsAlef(c) || c==='و') ? 'ا' : c; });
  if(s.length===WORDS_LEN && 'تةه'.indexOf(s[WORDS_LEN-1])>=0) s[WORDS_LEN-1] = 'ه';
  return s.join('');
}
// Two tiers: REFERENCE spellings (Riyadh dictionary + answers) and EXTRA ones from older
// word lists (may lack hamzas - "اسنان" - or carry pronouns - "مكتبه").
var WORDS_BUCKETS = null;
function wordsBuckets(){
  if(!WORDS_BUCKETS){
    WORDS_BUCKETS = {};
    var seen = {};
    var add = function(w, tier){
      if(seen[w]) return; seen[w] = true;
      var k = wordsSkel(w), b = WORDS_BUCKETS[k] || (WORDS_BUCKETS[k] = { ref:[], extra:[] });
      b[tier].push(w);
    };
    var i;
    WORDS_ANSWERS.forEach(function(w){ add(w, 'ref'); });
    for(i=0;i+WORDS_LEN<=WORDS_DICT_PACKED.length;i+=WORDS_LEN) add(WORDS_DICT_PACKED.substr(i,WORDS_LEN), 'ref');
    for(i=0;i+WORDS_LEN<=WORDS_EXTRA_PACKED.length;i+=WORDS_LEN) add(WORDS_EXTRA_PACKED.substr(i,WORDS_LEN), 'extra');
  }
  return WORDS_BUCKETS;
}
// the dictionary spelling of a typed word, or null if no word fits it. Reference spellings
// always win: typed exactly -> kept; else the most common reference word it fits
// (اسنان -> أسنان, مكتبه -> مكتبة); only if none fits, an extra-list word (exact first).
function wordsCanonical(guess){
  var typed = wordsSplit(guess).join('');
  var b = wordsBuckets()[wordsSkel(typed)];
  if(!b) return null;
  var pick = function(list){
    if(list.indexOf(typed)>=0) return typed;
    for(var i=0;i<list.length;i++) if(wordsFits(typed, list[i])) return list[i];
    return null;
  };
  return pick(b.ref) || pick(b.extra);
}
// Standard Wordle colouring, duplicates handled: greens first (same letter, or an allowed
// conversion of it), then yellows only while that letter (identity) still has unmatched
// copies ELSEWHERE in the answer - never from the tile's own position.
function wordsEvaluate(guess, answer){
  var g = wordsSplit(guess), a = wordsSplit(answer);
  var res = [], used = [];
  for(var i=0;i<WORDS_LEN;i++){
    if(g[i]!=null && a[i]!=null && wordsTypedMatches(g[i], a[i], i)){ res[i] = 'correct'; used[i] = true; }
    else res[i] = 'absent';
  }
  for(var j=0;j<WORDS_LEN;j++){
    if(res[j]==='correct' || g[j]==null) continue;
    for(var k=0;k<WORDS_LEN;k++){
      if(k!==j && !used[k] && a[k]!=null && wordsIdent(a[k])===wordsIdent(g[j])){ res[j] = 'present'; used[k] = true; break; }
    }
  }
  return res;
}
function wordsIsSolved(guess, answer){
  return wordsEvaluate(guess, answer).every(function(s){ return s==='correct'; });
}
// what actually gets sent/recorded for a typed guess: the answer's own spelling if it IS
// the answer, else the dictionary spelling; null = not a known word (rejected in strict mode)
function wordsResolveGuess(guess, answer, strict){
  if(wordsIsSolved(guess, answer)) return answer;
  var c = wordsCanonical(guess);
  if(c) return c;
  return strict ? null : guess;
}
function wordsSplit(w){ return String(w||'').replace(/[ً-ٰٟـ]/g,'').split(''); }
function wordsSignature(words){ return 'words|'+words.roundNumber+'|'+words.readyStartAt; }
function wordsRevealTotalDuration(players){ return Math.max(0, players.length-1)*1000 + 1400; }

// ---------- host ----------
var hostUsedWordAnswers = {}; // no repeats within the session (resets once all are used)
function hostPickWordAnswer(){
  var pool = WORDS_ANSWERS.filter(function(w){ return !hostUsedWordAnswers[w]; });
  if(!pool.length){ hostUsedWordAnswers = {}; pool = WORDS_ANSWERS.slice(); }
  var w = pool[rand(0,pool.length-1)];
  hostUsedWordAnswers[w] = true;
  return w;
}
function hostTryStartWords(senderId, cfg, conn){
  var g = app.game;
  if(senderId !== g.leaderId) return;
  if(!allPlayersReady(g)){ if(conn && conn.send) conn.send({t:'notice', text:'لازم كل اللاعبين يضغطون استعداد أولاً'}); return; }
  hostStartWordsGame(cfg||{});
}
function hostStartWordsGame(cfg){
  var g = app.game;
  g.mode = 'words';
  g.wordsConfig = {
    roundsTotal: Math.max(1, Math.min(20, parseInt(cfg.roundsTotal,10)||5)),
    attempts: Math.max(3, Math.min(10, parseInt(cfg.attempts,10)||6)),
    minutes: Math.max(1, Math.min(30, parseInt(cfg.minutes,10)||5)),   // round time limit
    strict: cfg.strict !== 'any',
    attemptBonus: cfg.attemptBonus !== 'off'   // +10 for every attempt left (the leader can turn it off)
  };
  g.words = { roundNumber:0, protocol:WORDS_PROTOCOL };
  hostBeginWordsRound();
}
function hostBeginWordsRound(){
  var g = app.game;
  g.words.roundNumber++;
  g.words.answer = hostPickWordAnswer();
  g.words.progress = {};    // playerId -> { guesses:[...], done, solved }
  g.words.submissions = {}; // playerId -> { value:lastWord, solved, attempts, t } once done
  g.words.results = null;
  g.words.readyStartAt = syncedNow()+300;
  g.phase = 'words-ready';
  broadcastState();
  addTimer(setTimeout(function(){ startWordsActive(); }, 3300));
}
function startWordsActive(){
  var g = app.game;
  if(!g.words || g.phase!=='words-ready') return;
  g.words.activeStartAt = syncedNow()+250;
  g.words.questionPostedAt = g.words.activeStartAt; // the speed-bonus clock starts here
  // the round's time limit (chosen by the leader) - separate from the hidden speed bonus
  g.words.endsAt = g.words.activeStartAt + g.wordsConfig.minutes*60000;
  g.phase = 'words-active';
  broadcastState();
  var round = g.words.roundNumber;
  addTimer(setTimeout(function(){ hostWordsTimeUp(round); }, g.words.endsAt - syncedNow() + 200));
}
// time's up: everyone still guessing is finished with their last sent word (no points)
function hostWordsTimeUp(round){
  var g = app.game;
  if(!g.words || g.phase!=='words-active' || g.words.roundNumber!==round) return;
  g.players.forEach(function(p){
    var pr = g.words.progress[p.id] || (g.words.progress[p.id] = { guesses:[], done:false, solved:false });
    if(pr.done) return;
    pr.done = true; pr.solved = false; pr.timeUp = true;
    g.words.submissions[p.id] = { value: pr.guesses.length ? pr.guesses[pr.guesses.length-1] : '',
      solved:false, attempts:pr.guesses.length, t:g.words.endsAt, timeUp:true };
  });
  hostFinishWordsRound();
}
// what's left of the round, in ms (display + phones), and its mm:ss form
function wordsTimeLeftMs(w){
  if(!w || !w.endsAt) return null;
  // never more than the full round (the round starts a moment after the countdown screen)
  return Math.max(0, Math.min(w.endsAt - syncedNow(), w.endsAt - (w.activeStartAt||0)));
}
function wordsFmtTime(ms){
  var s = Math.ceil(ms/1000), m = Math.floor(s/60); s = s%60;
  return m + ':' + (s<10?'0':'') + s;
}
// fix: every guess now gets an explicit answer back to the phone that sent it
// ('words-guess-ack': accepted / already had it / rejected + why). Before, a guess that was
// delayed on the connection (weak wifi, or a big victory-clip chunk queued ahead of it) or
// rejected was simply never answered, and after 6s the phone gave up and handed the letters
// back ("لم تصل المحاولة") - and a manual resend of the same word then looked like a
// duplicate. The phone now also re-sends automatically until it gets this answer.
function hostReceiveWordsGuess(playerId, guess, idx, conn){
  var reply = function(ok, reason, stored){
    if(!conn || !conn.send || conn.open===false) return;
    try{ conn.send({t:'words-guess-ack', idx:idx, ok:ok, reason:reason||'', guess:stored||''}); }catch(e){}
  };
  var g = app.game;
  if(!g.words || g.phase!=='words-active' || !findPlayer(playerId)) { reply(false, 'not-active'); return; }
  if(g.words.endsAt && syncedNow() > g.words.endsAt + 1500) { reply(false, 'not-active'); return; } // too late
  if(typeof guess !== 'string') { reply(false, 'bad'); return; }
  guess = guess.replace(/[\u064B-\u065F\u0670\u0640\s]/g,'');
  if(guess.length!==WORDS_LEN || !/^[\u0621-\u063A\u0641-\u064A]+$/.test(guess)) { reply(false, 'bad'); return; }
  // record the dictionary spelling (the display never trusts the phone's own conversion)
  guess = wordsResolveGuess(guess, g.words.answer, g.wordsConfig.strict);
  if(!guess) { reply(false, 'not-in-dictionary'); return; }
  var pr = g.words.progress[playerId] || (g.words.progress[playerId] = { guesses:[], done:false, solved:false });
  if(pr.done) { reply(false, 'done'); return; }
  // idx = how many guesses the phone had already seen. A resend of a guess we already
  // recorded is confirmed again (and the state re-sent) instead of silently dropped.
  if(typeof idx === 'number' && idx !== pr.guesses.length){
    if(idx < pr.guesses.length && pr.guesses[idx]===guess){ reply(true, 'dup', guess); broadcastState(); }
    else reply(false, 'out-of-sync');
    return;
  }
  pr.guesses.push(guess);
  reply(true, '', guess);
  var solved = wordsIsSolved(guess, g.words.answer);
  if(solved || pr.guesses.length >= g.wordsConfig.attempts){
    pr.done = true; pr.solved = solved;
    g.words.submissions[playerId] = { value:guess, solved:solved, attempts:pr.guesses.length, t:syncedNow() };
  }
  broadcastState();
  if(pr.done) hostCheckWordsAllIn();
}
function hostCheckWordsAllIn(){
  var g = app.game;
  if(!g.words || g.phase!=='words-active') return;
  var presentIds = g.players.filter(hostPlayerCountsAsPresent).map(function(p){return p.id;});
  var allIn = presentIds.length>0 && presentIds.every(function(id){ return !!g.words.submissions[id]; });
  if(allIn) hostFinishWordsRound();
}
// "withdraw from this round": the player stops guessing; their last SENT word counts as
// their final answer (wrong, so 0 points) and the round no longer waits for them
function hostWordsGiveUp(playerId){
  var g = app.game;
  if(!g.words || g.phase!=='words-active' || !findPlayer(playerId)) return;
  var pr = g.words.progress[playerId] || (g.words.progress[playerId] = { guesses:[], done:false, solved:false });
  if(pr.done) return;
  pr.done = true; pr.solved = false; pr.gaveUp = true;
  g.words.submissions[playerId] = { value: pr.guesses.length ? pr.guesses[pr.guesses.length-1] : '',
    solved:false, attempts:pr.guesses.length, t:syncedNow(), gaveUp:true };
  broadcastState();
  hostCheckWordsAllIn();
}
function computeWordsScore(submittedAt, questionPostedAt, rankAmongCorrect, numPlayers, attemptsLeft){
  var elapsedSec = Math.max(0, (submittedAt - questionPostedAt)/1000);
  var bonusPct = Math.max(0, Math.min(1, (WORDS_BONUS_WINDOW_SEC - elapsedSec)/WORDS_BONUS_WINDOW_SEC));
  var placement = numPlayers - (rankAmongCorrect-1); // same placement points as the quick games
  var attemptsBonus = Math.max(0, attemptsLeft||0) * WORDS_ATTEMPT_BONUS; // unused attempts
  return WORDS_BASE_POINTS + bonusPct*WORDS_BONUS_POINTS + placement + attemptsBonus;
}
function hostFinishWordsRound(){
  var g = app.game;
  if(!g.words || g.phase!=='words-active') return;
  var subs = g.words.submissions;
  var order = Object.keys(subs)
    .filter(function(pid){ return subs[pid].solved; })
    .sort(function(a,b){ return subs[a].t - subs[b].t; });
  var perPlayer = {};
  g.players.forEach(function(p){
    var s = subs[p.id];
    var correct = !!(s && s.solved);
    perPlayer[p.id] = { correct:correct,
      score: correct ? computeWordsScore(s.t, g.words.questionPostedAt, order.indexOf(p.id)+1, g.players.length,
                                         g.wordsConfig.attemptBonus === false ? 0 : g.wordsConfig.attempts - s.attempts) : 0 };
  });
  g.words.results = { perPlayer:perPlayer };
  g.words.revealStartAt = syncedNow()+150;
  Object.keys(perPlayer).forEach(function(pid){
    var p = findPlayer(pid);
    if(p) p.score += perPlayer[pid].score;
  });
  g.phase = 'words-reveal';
  broadcastState();
  // no auto-advance - the leader presses "next round", like every other game
}
function hostAdvanceWords(){
  var g = app.game;
  if(!g.words || !g.wordsConfig || g.phase!=='words-reveal') return;
  if(g.words.roundNumber >= g.wordsConfig.roundsTotal && hostTopTied(g)){ g.wordsConfig.roundsTotal++; g.tiebreak = (g.tiebreak || 0) + 1; }
  if(g.words.roundNumber >= g.wordsConfig.roundsTotal){
    var sorted = g.players.slice().sort(function(a,b){ return b.score-a.score; });
    g.winnerId = sorted.length ? sorted[0].id : null;
    g.celebration = { bursts:[], sessionId: Math.random().toString(36).substring(2,9) };
    g.phase = 'words-finished';
    broadcastState();
  } else {
    hostBeginWordsRound();
  }
}

function wordsTilesHtml(word, states, extraClass, answer){

// ---------- player phone ----------
// Same letter order as the iPhone Arabic keyboard. Rows are listed RIGHT-TO-LEFT (the
// keyboard is laid out rtl), so each row's first key sits at the right edge; "إرسال" is on
// the right, delete on the left. LONG-PRESS types a second letter: ا -> أ, و -> ؤ, ى -> ئ.
var WORDS_KB_ROWS = [
  ['ج','ح','خ','ه','ع','غ','ف','ق','ث','ص','ض'],
  ['ة','ك','م','ن','ت','ا','ل','ب','ي','س','ش'],
  ['ENTER','ى','و','ر','ز','د','ذ','ط','ظ','ء','DEL']
];
var WORDS_KB_LONG = { 'ا':'أ', 'و':'ؤ', 'ى':'ئ' };
var WORDS_LONG_PRESS_MS = 420;
// keyboard keys greyed out together: letters with the same identity (all alef forms; ت/ة)
function wordsKeyFor(c){ return wordsIdent(c); }
// a pressed key types its own letter exactly (ا, أ, ء, ى, ئ, و, ؤ ... are all different now)
function wordsTypedChar(k){ return k; }
var WORDS_STATE_RANK = { absent:1, present:2, correct:3 };
var WORDS_RESEND_MS = 2500;       // re-send an unanswered guess this often...
var WORDS_SEND_GIVEUP_MS = 15000; // ...and give the letters back only after this long
// the display's answer to one of our guesses (see hostReceiveWordsGuess)
function clientHandleWordsAck(msg){
  var pend = clientInput.wordsPending;
  if(!pend || msg.idx !== pend.idx) return;
  if(msg.ok){ pend.acked = true; return; } // recorded - the state update clears "pending"
  if(msg.reason === 'done' || msg.reason === 'not-active'){ clientInput.wordsPending = null; return; }
  // really rejected: give the letters back and say why
  clientInput.wordsTyped = pend.typed || wordsSplit(pend.word);
  clientInput.wordsPending = null;
  var why = msg.reason === 'not-in-dictionary' ? 'شاشة العرض لم تقبل هذه الكلمة (ليست في قاموسها)'
          : msg.reason === 'out-of-sync' ? 'حصل خلل في التزامن، اضغط إرسال مرة أخرى'
          : 'لم تُقبل المحاولة، اضغط إرسال مرة أخرى';
  clientInput.wordsToast = { text: why, until: Date.now()+3500 };
}
function wordsMyProgress(){
  var g = app.game;
  return (g.words && g.words.progress && g.words.progress[app.myPlayerId]) || { guesses:[], done:false, solved:false };
}
function wordsShowToast(text){
  clientInput.wordsToast = { text:text, until: Date.now()+1800 };
  renderAll();
}
function wordsShakeCurrentRow(){
  var row = els.wordsBoard.querySelector('.words-row.current');
  if(!row) return;
  row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
}
function wordsCanType(){
  var g = app.game;
  if(!g || app.isHost || g.mode!=='words' || g.phase!=='words-active') return false;
  if(clientInput.wordsPending) return false;
  return !wordsMyProgress().done;
}
function wordsPressKey(k){
  if(!wordsCanType()) return;
  var g = app.game;
  if(k==='DEL'){ clientInput.wordsTyped.pop(); renderAll(); return; }
  if(k==='ENTER'){
    if(clientInput.wordsTyped.length < WORDS_LEN){ wordsShakeCurrentRow(); wordsShowToast('الكلمة لازم تكون 5 أحرف'); return; }
    // send the dictionary spelling: اسنان -> أسنان, مسأول -> مسؤول, مكتبه -> مكتبة ...
    var guess = wordsResolveGuess(clientInput.wordsTyped.join(''), g.words.answer, g.wordsConfig.strict);
    if(!guess){
      wordsShakeCurrentRow(); wordsShowToast('الكلمة غير موجودة في القاموس');
      sendToHost({t:'words-unknown', word:clientInput.wordsTyped.join('')});   // (for the dictionary editor's list)
      return;
    }
    var idx = wordsMyProgress().guesses.length;
    var now = Date.now();
    clientInput.wordsPending = { word:guess, idx:idx, typed:clientInput.wordsTyped.slice(), sentAt:now, lastSentAt:now, acked:false };
    clientInput.wordsTyped = [];
    sendToHost({t:'words-guess', guess:guess, idx:idx});
    playSound('submit');
    renderAll();
    return;
  }
  if(clientInput.wordsTyped.length < WORDS_LEN){ clientInput.wordsTyped.push(wordsTypedChar(k)); renderAll(); }
}
els.wordsGiveup.addEventListener('click', function(){
  var g = app.game;

  if(!confirm('الانسحاب من هذه الجولة؟ آخر كلمة أرسلتها ستُحسب كإجابتك النهائية.')) return;

  sendToHost({t:'words-giveup'});

function buildWordsKeyboard(){

      if(k==='DEL') return '<button type="button" class="words-key wide del" data-k="DEL" aria-label="حذف">⌫</button>';
      var alt = WORDS_KB_LONG[k];

// one delegated listener, attached once - keys are never rebuilt mid-tap.
// Keys WITH a long-press letter are handled by the pointer events below instead.
els.wordsKb.addEventListener('click', function(e){

// long-press: hold ا / و / ى to type أ / ؤ / ئ; a normal tap types the key's own letter
var wordsLongPress = null;
function wordsEndLongPress(commit){
  if(!wordsLongPress) return;
  var lp = wordsLongPress; wordsLongPress = null;
  clearTimeout(lp.timer);
  lp.btn.classList.remove('pressing');
  if(commit && !lp.fired) wordsPressKey(lp.btn.getAttribute('data-k'));
}
els.wordsKb.addEventListener('pointerdown', function(e){
  var btn = e.target.closest ? e.target.closest('.words-key[data-alt]') : null;
  if(!btn || btn.disabled) return;
  e.preventDefault(); // no text selection / iOS callout while holding
  wordsEndLongPress(false);
  var lp = { btn:btn, fired:false, timer:null };
  lp.timer = setTimeout(function(){
    lp.fired = true;
    btn.classList.remove('pressing');
    wordsPressKey(btn.getAttribute('data-alt'));
  }, WORDS_LONG_PRESS_MS);
  wordsLongPress = lp;
  btn.classList.add('pressing');
});

  if(e.key==='Enter'){ e.preventDefault(); wordsPressKey('ENTER'); return; }
  if(e.key && e.key.length===1 && /[ء-غف-ي]/.test(e.key)){ e.preventDefault(); wordsPressKey(e.key); }

  }
  els.wordsBoard.innerHTML = html;
  els.wordsBoard.style.setProperty('--rows', attempts);
}
function renderWordsPlayer(){
  var g = app.game;
  var me = findPlayer(app.myPlayerId);
  var isLeader = app.myPlayerId === g.leaderId;
  els.pScoreLabel.textContent = me ? fmtScore(me.score) : '0';
  els.btnNextRound.classList.add('hidden');
  els.btnBombNewRound.classList.add('hidden');
  els.btnBombToLobby.classList.add('hidden');
  els.btnBombContinue.classList.add('hidden');
  els.pgridContainer.classList.add('hidden');
  els.counterContainer.classList.add('hidden');
  els.flagsPadContainer.classList.add('hidden');
  els.btnSubmit.classList.add('hidden');

  if(g.phase === 'words-finished'){
    els.wordsContainer.classList.add('hidden');
    els.displayWrap.classList.add('hidden');
    els.pcontrolsWrap.classList.add('hidden');
    renderWinnerScreen();
    return;
  }
  hideWinnerScreen();
  els.roundOverlay.classList.remove('active');
  var w = g.words;
  var attempts = g.wordsConfig.attempts;
  els.pRoundIndicator.textContent = w.roundNumber+'/'+g.wordsConfig.roundsTotal;
  els.pGameNameLabel.textContent = WORDS_LABEL;

  var sig = wordsSignature(w);
  if(sig !== clientInput.lastWordsSig){
    clientInput.lastWordsSig = sig;
    clientInput.wordsTyped = [];
    clientInput.wordsPending = null;
    clientInput.wordsSeenRows = 0;
    clientInput.wordsToast = null;
    els.wordsBoard._builtKey = null;
    buildWordsKeyboard();
  }

  if(g.phase === 'words-ready'){
    els.notifBar.textContent = 'استعد... '+WORDS_LABEL+' - '+attempts+' محاولات';
    els.submittedLabel.classList.add('hidden');
    els.wordsContainer.classList.add('hidden');
    return;
  }

  var pr = wordsMyProgress();
  // a sent guess stays "pending" until the display's state includes it. While waiting, the
  // phone re-sends it every WORDS_RESEND_MS (the display answers each send - see
  // clientHandleWordsAck); only after WORDS_SEND_GIVEUP_MS without any answer at all are
  // the letters handed back.
  var pend = clientInput.wordsPending;
  if(pend && pr.guesses.length > pend.idx){ clientInput.wordsPending = pend = null; }
  if(pend && g.phase==='words-active'){
    var nowP = Date.now();
    if(!pend.acked && nowP-pend.lastSentAt > WORDS_RESEND_MS && nowP-pend.sentAt < WORDS_SEND_GIVEUP_MS){
      pend.lastSentAt = nowP;
      sendToHost({t:'words-guess', guess:pend.word, idx:pend.idx});
    }
    if(nowP-pend.sentAt > (pend.acked ? WORDS_SEND_GIVEUP_MS*2 : WORDS_SEND_GIVEUP_MS)){
      clientInput.wordsTyped = pend.typed || wordsSplit(pend.word);
      clientInput.wordsPending = pend = null;
      clientInput.wordsToast = { text:'تعذّر الاتصال بشاشة العرض، اضغط إرسال مرة أخرى', until: nowP+3000 };
    }
  }
  if(g.words.protocol && g.words.protocol !== WORDS_PROTOCOL && !(clientInput.wordsToast && Date.now() < clientInput.wordsToast.until)){
    clientInput.wordsToast = { text:'نسخة اللعبة في جهازك تختلف عن شاشة العرض - حدّث الصفحة', until: Date.now()+4000 };
  }

  // rows: confirmed guesses, then the pending one, then what's being typed now
  var rowsData = [];
  function sentRow(word){
    var states = wordsEvaluate(word, w.answer);
    return { letters: wordsDisplayLetters(word, w.answer, states), typed: wordsSplit(word), states: states,
      counts: states.map(function(s, i){ return s==='correct' ? wordsLetterCount(w.answer, wordsSplit(word)[i]) : 0; }) };
  }
  pr.guesses.forEach(function(gw){ rowsData.push(sentRow(gw)); });
  if(pend) rowsData.push(sentRow(pend.word));
  var colouredRows = rowsData.length;
  var activeTyping = g.phase==='words-active' && !pr.done && !pend;
  if(activeTyping && rowsData.length < attempts){
    rowsData.push({ letters:clientInput.wordsTyped.slice(), states:null, cls:'current' });
  }
  if(colouredRows > clientInput.wordsSeenRows){
    rowsData[colouredRows-1].animate = true; // flip only the newly coloured row
  }
  var boardKey = sig+'|'+g.phase+'|'+rowsData.map(function(r){ return r.letters.join('')+(r.states?'#':''); }).join(',')+'|'+attempts;
  if(els.wordsBoard._builtKey !== boardKey){
    renderWordsBoard(rowsData, attempts);
    els.wordsBoard._builtKey = boardKey;
    clientInput.wordsSeenRows = colouredRows;
  }

  // keyboard: green / yellow finds are shown ONLY on the tiles above - the keyboard just
  // greys out letters that turned out not to be in the word at all
  var keyState = {};
  rowsData.forEach(function(r){
    if(!r.states) return;
    r.typed.forEach(function(c, i){
      var k = wordsKeyFor(c);
      if((WORDS_STATE_RANK[r.states[i]]||0) > (WORDS_STATE_RANK[keyState[k]]||0)) keyState[k] = r.states[i];
    });
  });
  var kbKey = JSON.stringify(keyState)+'|'+(activeTyping?1:0);
  if(els.wordsKb._stateKey !== kbKey){
    els.wordsKb.querySelectorAll('.words-key').forEach(function(b){
      var k = b.getAttribute('data-k');
      b.classList.remove('correct','present','absent');
      if(keyState[wordsKeyFor(k)]==='absent') b.classList.add('absent');
      b.disabled = !activeTyping;
    });
    els.wordsKb._stateKey = kbKey;
  }

  var toast = clientInput.wordsToast;
  var showToast = !!(toast && Date.now() < toast.until);
  els.wordsToast.classList.toggle('hidden', !showToast);
  if(showToast) els.wordsToast.textContent = toast.text;

  els.wordsContainer.classList.remove('hidden');

  els.wordsGiveup.classList.toggle('hidden', !(g.phase==='words-active' && !pr.done));

  if(g.phase === 'words-reveal'){
    els.wordsKb.classList.add('hidden');
    els.submittedLabel.classList.remove('hidden');
    var revealElapsed = syncedNow() - (w.revealStartAt||syncedNow());
    if(revealElapsed < wordsRevealTotalDuration(g.players)){
      els.notifBar.textContent = 'جاري التصحيح...';
      els.submittedLabel.textContent = 'SUBMITED!';
      els.submittedLabel.style.color = 'var(--green)';
    } else {
      els.notifBar.textContent = 'الكلمة الصحيحة: '+w.answer;
      var r = w.results ? w.results.perPlayer[app.myPlayerId] : null;
      els.submittedLabel.textContent = r ? (r.correct ? '✔ عرفت الكلمة! +'+Math.round(r.score) : (pr.gaveUp ? '🏳️ انسحبت من الجولة' : pr.timeUp ? '⏰ انتهى الوقت' : '✖ ما عرفت الكلمة')) : '';
      els.submittedLabel.style.color = r && r.correct ? 'var(--green)' : 'var(--red)';
    }
    if(isLeader){
      els.btnNextRound.textContent = w.roundNumber < g.wordsConfig.roundsTotal ? ('▶ الجولة التالية ('+(w.roundNumber+1)+'/'+g.wordsConfig.roundsTotal+')') : (hostTopTied(g) ? '▶ ⚖️ جولة كسر التعادل' : '▶ عرض النتيجة النهائية');
      els.btnNextRound.classList.remove('hidden');
      els.btnBombToLobby.classList.remove('hidden');
    }
    return;
  }

  els.notifBar.classList.remove('words-clock-bar','low','wc-mode','wc-hidden');
  // phase === 'words-active'
  if(pr.done){
    els.wordsKb.classList.add('hidden');
    els.submittedLabel.classList.remove('hidden');
    els.submittedLabel.textContent = 'SUBMITED!';
    els.submittedLabel.style.color = 'var(--green)';
    var leftD = wordsTimeLeftMs(w);
    wordsClockRender(leftD==null ? '' : wordsFmtTime(leftD), leftD!=null && leftD <= 30000);
    return;
  }
  els.wordsKb.classList.remove('hidden');
  els.submittedLabel.classList.add('hidden');
  // only the round's countdown here - the rows already show which attempt this is
  var leftP = wordsTimeLeftMs(w);
  wordsClockRender(leftP==null ? '' : wordsFmtTime(leftP), leftP!=null && leftP <= 30000);
}

// the character box on screen is ASPECT wide per 1 high; the normal pose fills CHAR_FILL of the
// height, every other pose of the same character keeps that scale (feet on the ground line)
var CHAR_ASPECT = 0.8, CHAR_FILL = 0.94;
var CHAR_STATE_SCALE = { fallen:0.85 };
// all versions of a pose (falls back to normal if a character doesn't have that pose)
function charFiles(key, st){ var f = CHAR_FILES[key] || {}; return (f[st] && f[st].length) ? f[st] : (f.normal || []); }
function charFile(key, st, random){ var l = charFiles(key, st); return random ? l[Math.floor(Math.random()*l.length)] : l[0]; }
function charFileUrl(file){ return ASSET_BASE + file + '.png'; }
function charUrl(key, st){ return charFileUrl(charFile(key, st)); }
// position of the image inside a box (all in % of the box, so it never needs re-measuring)
function charScale(key, st){   // one scale per character: its first normal pose fills the box
  var n = CHAR_BOX[charFile(key, 'normal')];
  return CHAR_FILL / (n[5]-n[3]) * (CHAR_STATE_SCALE[st] || 1);   // box height = 1
}
function charImgCss(key, st, file){
  var m = CHAR_BOX[file] || CHAR_BOX[charFile(key, 'normal')], s = charScale(key, st);
  var W = CHAR_ASPECT, cx = (m[2]+m[4])/2*s;
  return 'width:'+(m[0]*s/W*100).toFixed(2)+'%;left:'+((W/2-cx)/W*100).toFixed(2)+'%;top:'+((1-m[5]*s)*100).toFixed(2)+'%';
}
function charHeadTop(key, st, file){   // where the top of the drawn character is (% of box height)
  var m = CHAR_BOX[file] || CHAR_BOX[charFile(key, 'normal')], s = charScale(key, st);
  return Math.max(-10, (1 - (m[5]-m[3])*s)*100);
}
var charImgCache = {};
function charPreload(key){
  if(!CHARS[key] || charImgCache[key]) return;
  charImgCache[key] = [];
  CHAR_STATES.forEach(function(st){
    charFiles(key, st).forEach(function(f){ var im = new Image(); im.decoding = 'async'; im.src = charFileUrl(f); charImgCache[key].push(im); });
  });
}
// random = a random version of the pose (the pick cards use the first one so they stay put)
function charImgHtml(key, st, random){
  var f = charFile(key, st, random);
  return '<img alt="" draggable="false" src="'+charFileUrl(f)+'" style="'+charImgCss(key, st, f)+'">';
}

// ---- a character "sprite": the image + its effects, kept alive between frames ----
var CHAR_FX_HTML = {};   // no symbols over the characters: their own drawings carry those details
function charMakeSprite(key, cls){
  charPreload(key);
  var el = document.createElement('div');
  el.className = 'char-sprite '+(cls||'');
  el.innerHTML = '<div class="cs-shadow"></div><div class="cs-body"><img alt="" draggable="false"></div><div class="cs-fx"></div>';
  var sp = { el:el, key:key, state:null, body:el.querySelector('.cs-body'), img:el.querySelector('img'), fx:el.querySelector('.cs-fx'), flags:'' };
  el.style.setProperty('--phase', (-Math.random()*2).toFixed(2)+'s');   // idle animations out of step
  return sp;
}
// o: { state, crown, dim, hit, kx }
function charSetState(sp, o){
  var st = (CHAR_STATES.indexOf(o.state) >= 0 || (CHAR_FILES[sp.key] && CHAR_FILES[sp.key][o.state])) ? o.state : 'normal';
  if(sp.state !== st){
    var wasUp = sp.state && sp.state !== 'fallen';
    var file = charFile(sp.key, st, true);          // a random version of the pose each time
    sp.img.src = charFileUrl(file);
    sp.img.style.cssText = charImgCss(sp.key, st, file);
    sp.fx.innerHTML = CHAR_FX_HTML[st] || '';
    sp.el.style.setProperty('--head', charHeadTop(sp.key, st, file).toFixed(1)+'%');
    if(sp.state) sp.el.classList.remove('st-'+sp.state);
    sp.el.classList.add('st-'+st);
    sp.el.classList.remove('cs-hit');
    if(st === 'fallen' && o.hit && wasUp){
      sp.el.style.setProperty('--kx', (o.kx || 1));
      void sp.el.offsetWidth; sp.el.classList.add('cs-hit');
    }
    sp.state = st;
  }
  var flags = (o.crown?'c':'')+(o.dim?'d':'')+(o.still?'s':'');
  if(flags !== sp.flags){ sp.flags = flags; sp.el.classList.toggle('crowned', !!o.crown); sp.el.classList.toggle('cs-dim', !!o.dim); sp.el.classList.toggle('cs-still', !!o.still); }
}


// ---- character voices ----
// Real voice clips (RandFiles/charecters voices/<character>/<character>_<kind>-N.mp3), read

// a random clip of that kind (not the same one twice in a row); maxDur prefers shorter clips
function voiceChoose(key, kind, maxDur){
  var l = (CHAR_VOICES[key] && CHAR_VOICES[key][kind]) || [];
  if(!l.length) return null;
  var pool = maxDur ? l.filter(function(v){ return v[1] <= maxDur; }) : l;
  if(!pool.length) pool = [l.slice().sort(function(a, b){ return a[1]-b[1]; })[0]];
  var id = key+'|'+kind;
  var options = pool.length > 1 ? pool.filter(function(v){ return v[0] !== voiceLast[id]; }) : pool;
  var v = options[Math.floor(Math.random()*options.length)];
  voiceLast[id] = v[0];
  return { url: voiceUrl(v[0]), dur: v[1] };
}
// the clips are fetched (small, compressed) once and decoded only when played
var voiceData = {};
function voiceFetch(url){
  if(!voiceData[url]) voiceData[url] = fetch(url).then(function(r){ if(!r.ok) throw new Error('missing'); return r.arrayBuffer(); })
    .catch(function(e){ delete voiceData[url]; throw e; });
  return voiceData[url];
}
function voicePrefetch(key){
  var all = CHAR_VOICES[key]; if(!all || voicePrefetch[key]) return;
  voicePrefetch[key] = true;
  Object.keys(all).forEach(function(kind){ all[kind].forEach(function(v){ voiceFetch(voiceUrl(v[0])).catch(function(){}); }); });
}
function voicePlayNow(url){
  var ctx = getAudioCtx();
  if(!ctx || !url) return;
  var asked = Date.now();
  voiceFetch(url).then(function(buf){
    return new Promise(function(res, rej){
      var p = ctx.decodeAudioData(buf.slice(0), res, rej);   // callback + promise forms (older WebKit)
      if(p && p.then) p.then(res, rej);
    });
  }).then(function(decoded){
    if(Date.now() - asked > 2500) return;                 // arrived far too late - skip it
    if(ctx.state !== 'running' && ctx.state !== 'closed'){
      try{ ctx.resume().then(function(){ if(ctx.state === 'running') playBuffer(decoded); }, function(){}); }catch(e){}
      return;
    }
    playBuffer(decoded);
  }).catch(function(){});
}
// Display (host) decides where every voice plays: only ONE voice at a time on the display.
// If the display is still busy with another voice, this one plays on that player's own
// phone instead. A voice stays where it started.
var dispVoiceUntil = 0;
function dispVoiceFree(){ return Date.now() >= dispVoiceUntil; }
// o: { display: always on the display (queued after the current one), noPhone: drop it
// rather than send it to the phone }. Returns the clip's length in ms (0 = nothing played).
function hostVoice(pid, key, kind, o, clip){
  o = o || {};
  var v = clip || voiceChoose(key, kind, o.maxDur);
  if(!v) return 0;
  var ms = v.dur*1000, now = Date.now();
  if(o.display){
    var at = Math.max(now, dispVoiceUntil);
    dispVoiceUntil = at + ms + 150;
    if(at > now) setTimeout(function(){ voicePlayNow(v.url); }, at - now); else voicePlayNow(v.url);
    return ms + (at - now);
  }
  if(dispVoiceFree()){ dispVoiceUntil = now + ms + 150; voicePlayNow(v.url); return ms; }
  if(o.noPhone) return 0;
  var conn = app.connections.filter(function(c){ return c.playerId === pid && c.open; })[0];
  if(conn){ try{ conn.send({t:'char-voice', url:v.url}); }catch(e){} }
  return ms;
}

// ===================== INTERACTIVE GAMES =====================
// A new section of games everyone plays AT THE SAME TIME on their own phone. The leader picks
// which interactive games to use, how many (outer) rounds and how long each inner round lasts.
// Game 1 - Recycle (♻️): an elimination round. Each outer round is played as (players - 1)
// INNER rounds; after every inner round the player with the fewest points is shot out (ties:
// random). Outer-round points: the first one out 0, the next 1 ... the last one standing
// (players - 1). A new interactive game can be added to INTER_GAMES later.
var INTER_GAMES = {
  recycle: { label:'فرن الصهر 🔥' },
  conveyor: { label:'السير المتحرك 📦' },
  keys: { label:'المفاتيح 🔑' },
  memo: { label:'عين الصقر 🦅' },
  dice: { label:'النرد 🎲' },
  elec: { label:'توصيل الكهرباء ⚡' },
  fall: { label:'لا تطيح! ⬛' },
  crash: { label:'كراش باش 🎨' },
  gifts: { label:'الهدايا 🎁' },
  puzzle: { label:'ترتيب الصورة 🧩' }
};
var INTER_GAME_KEYS = Object.keys(INTER_GAMES);
var INTER_READY_MS = 3000;        // countdown before every inner round
var INTER_GRACE_MS = 1200;        // after time's up: wait this long for the phones' last scores
var INTER_ELIM_SHOT_MS = 1900;    // elimination: reload at 0, shot this long after
var INTER_ELIM_PANEL_MS = 1000;   // ...ranking shows this long after the shot
var INTER_WRONG_HOLD_MS = 550;    // wrong move: the player is frozen this long
var RC_QUEUE = 3;                 // items on the belt: the one to decide on + 2 coming up
var RC_RECYCLE = ['🔩','🔧','⚙️','🔨'];   // must be recycled
var RC_KEEP = ['💎','🎁','🎮','🧸'];      // must be passed on

// the game id makes every new interactive game's rounds different from the last game's
// (otherwise round 1 of a new game looked like the old one: the phone kept its old score
// and the gun/glass sounds, which play once per round, stayed silent)
function interSignature(it){ return it ? ('inter|'+(it.gameId||'')+'|'+it.roundNumber+'|'+it.innerNumber) : ''; }
function interGameLabel(key){ return (INTER_GAMES[key] && INTER_GAMES[key].label) || key; }
function interPlayerAlive(it, pid){ return !!(it && it.alive && it.alive.indexOf(pid) >= 0); }
function interInnerTotal(it){ return Math.max(1, (it && it.startCount ? it.startCount : 2) - 1); }

// ---------------- host ----------------
function hostTryStartInter(senderId, msg, conn){
  var g = app.game;
  if(senderId !== g.leaderId) return;
  if(!allPlayersReady(g)){ if(conn && conn.send) conn.send({t:'notice', text:'لازم كل اللاعبين يضغطون استعداد أولاً'}); return; }
  var present = g.players.filter(hostPlayerCountsAsPresent);
  if(present.length < 2){ if(conn && conn.send) conn.send({t:'notice', text:'الألعاب التفاعلية تحتاج لاعبين اثنين على الأقل'}); return; }
  var games = (Array.isArray(msg.games) ? msg.games : []).filter(function(k){ return INTER_GAMES[k]; });
  g.mode = 'interactive';
  g.interConfig = {
    roundsTotal: Math.max(1, Math.min(20, parseInt(msg.roundsTotal,10)||3)),
    innerSec: Math.max(10, Math.min(90, parseInt(msg.innerSec,10)||20)),
    elecSize: [3,4,5].indexOf(parseInt(msg.elecSize,10)) >= 0 ? parseInt(msg.elecSize,10) : 4,
    elecSec: Math.max(20, Math.min(300, parseInt(msg.elecSec,10)||75)),
    fallSize: parseInt(msg.fallSize,10) === 7 ? 7 : 6,
    fallPick: FALL_PICKS.indexOf(parseFloat(msg.fallPick)) >= 0 ? parseFloat(msg.fallPick) : 3,
    crashMode: msg.crashMode === 'single' ? 'single' : 'elim',
    crashMin: Math.max(0.5, Math.min(10, Math.round((parseFloat(msg.crashMin) || 1)*2)/2)),
    crashItems: CRASH_SPAWN[msg.crashItems] ? msg.crashItems : 'balanced',
    giftsSec: Math.max(20, Math.min(180, parseInt(msg.giftsSec,10)||45)),
    giftsSpeed: msg.giftsSpeed === 'steady' ? 'steady' : 'accel',
    giftsLevel: [1,2,3,4,5].indexOf(parseInt(msg.giftsLevel,10)) >= 0 ? parseInt(msg.giftsLevel,10) : 2,
    puzzleMode: msg.puzzleMode === 'single' ? 'single' : 'elim',
    puzzleSize: [3,4,5,6].indexOf(parseInt(msg.puzzleSize,10)) >= 0 ? parseInt(msg.puzzleSize,10) : 3,
    puzzlePlay: msg.puzzlePlay === 'swap' ? 'swap' : 'slide',
    puzzleShow: msg.puzzleShow === 'hide' ? 'hide' : 'show',
    puzzleHint: msg.puzzleHint === 'on' ? 'on' : 'off',
    puzzleMin: Math.max(0.5, Math.min(15, Math.round((parseFloat(msg.puzzleMin) || 1)*2)/2)),
    games: games.length ? games : INTER_GAME_KEYS.slice()
  };
  if(g.interConfig.games.indexOf('puzzle') >= 0) puzzleLoadList();   // the picture list, ready before the first puzzle
  g.inter = { roundNumber:0, gameId: Math.random().toString(36).substring(2,9) };
  // first everyone picks a character (the one from last time is kept pre-selected)
  g.players.forEach(function(p){ if(p.character && !CHARS[p.character]) p.character = null; });
  g.phase = 'inter-pick';
  broadcastState();
}
// display-only reactions (not sent to the phones): when each player last scored / went wrong
var interFx = { sig:null, scoreAt:{}, wrongAt:{}, wrong:{}, mood:{}, cvPos:{}, pickAt:{} };
function interFxFor(sig){ if(interFx.sig !== sig) interFx = { sig:sig, scoreAt:{}, wrongAt:{}, wrong:{}, mood:{}, cvPos:{}, pickAt:interFx.pickAt }; return interFx; }
function hostInterPick(pid, key){
  var g = app.game, p = findPlayer(pid);
  if(!p || g.mode !== 'interactive' || g.phase !== 'inter-pick' || !CHARS[key]) return;
  if(g.players.some(function(o){ return o.id !== pid && o.character === key; })) return;   // taken
  if(p.character === key) return;
  p.character = key;
  interFx.pickAt[pid] = Date.now();
  charPreload(key);
  voicePrefetch(key);
  hostVoice(pid, key, 'pick');
  broadcastState();
}
// whoever hasn't picked when the leader starts gets a random free character
function hostInterAssignMissing(){
  var g = app.game, taken = {};
  g.players.forEach(function(p){ if(p.character && CHARS[p.character]) taken[p.character] = true; });
  g.players.filter(hostPlayerCountsAsPresent).forEach(function(p){
    if(p.character && CHARS[p.character]) return;
    var free = CHAR_KEYS.filter(function(k){ return !taken[k]; });
    if(!free.length) return;
    p.character = free[rand(0, free.length-1)];
    taken[p.character] = true;
  });
}
function hostBeginInterRound(){
  var g = app.game, it = g.inter, cfg = g.interConfig;
  it.roundNumber++;
  it.gameKey = it.nextGame || cfg.games[(it.roundNumber-1) % cfg.games.length];   // a tie-break round: the random pick
  it.nextGame = null;
  it.alive = g.players.filter(hostPlayerCountsAsPresent).map(function(p){ return p.id; });
  it.startCount = it.alive.length;
  it.out = [];            // eliminated, in order: [{id, inner, score}]
  it.innerNumber = 0;
  it.elim = null;
  it.roundResults = null;
  if(it.alive.length < 2){ hostInterFinishRound(); return; }
  hostBeginInterInner();
}
function hostBeginInterInner(){
  var g = app.game, it = g.inter;
  it.innerNumber++;
  it.scores = {};
  it.alive.forEach(function(pid){ it.scores[pid] = 0; });
  it.finals = {};
  it.cvQueue = [];          // conveyor: boxes that fell, waiting for the gun (in order)
  it.elimQueue = []; it.elimNames = null;   // keys: several out at once, shot one after the other
  if(it.gameKey === 'keys') keysSetup(it);
  it.denseRank = it.gameKey === 'memo';   // hawk eye: places counted by eliminations
  if(it.gameKey === 'memo') memoSetup(it);
  if(it.gameKey === 'dice') diceSetup(it);
  if(it.gameKey === 'elec') elecSetup(it, g.interConfig);
  if(it.gameKey === 'fall') fallSetup(it, g.interConfig);
  if(it.gameKey === 'crash') crashSetup(it, g.interConfig);
  if(it.gameKey === 'gifts') giftsSetup(it, g.interConfig);
  if(it.gameKey === 'puzzle') puzzleSetup(it, g.interConfig);
  it.elim = null;
  var sig = interSignature(it);
  if(it.alive.length === 2 && hostInterFaceoff(sig)) return;
  hostInterStartReady(sig);
}
function hostInterStartReady(sig){
  var g = app.game, it = g.inter;
  if(!it || interSignature(it) !== sig) return;
  it.finalIntro = null;
  it.readyStartAt = syncedNow() + 300;
  g.phase = 'inter-ready';
  broadcastState();
  addTimer(setTimeout(function(){ hostInterStartActive(sig); }, 300 + INTER_READY_MS));
}
// Final face-off of the round: the last two come in one after the other, fired up (Conan
// keeps his cool), each saying something - then VS - then the countdown.
function hostInterFaceoff(sig){
  var g = app.game, it = g.inter;
  var ps = it.alive.map(findPlayer).filter(function(p){ return p && CHARS[p.character]; });
  if(ps.length !== 2) return false;
  var t = 900, items = [];
  ps.forEach(function(p){
    var pose = charFaceoffPose(p.character);
    var v = voiceChoose(p.character, pose === 'angry' ? 'angry' : 'pick', 4.5);
    var ms = v ? Math.min(v.dur*1000, 4500) : 1200;
    items.push({ id:p.id, pose:pose, img:charFile(p.character, pose, true), at:t });
    (function(pid, key, clip, delay){
      addTimer(setTimeout(function(){ if(g.phase === 'inter-final' && interSignature(it) === sig && clip) hostVoice(pid, key, '', {display:true}, clip); }, delay));
    })(p.id, p.character, v, t);
    t += Math.max(1300, ms + 350);
  });
  it.finalIntro = { start:syncedNow(), items:items, vsAt:t, end:t + 1400 };
  g.phase = 'inter-final';
  broadcastState();
  addTimer(setTimeout(function(){ if(g.phase === 'inter-final' && interSignature(it) === sig) hostInterStartReady(sig); }, t + 1400));
  return true;
}
function hostInterStartActive(sig){
  var g = app.game, it = g.inter;
  if(!it || g.phase !== 'inter-ready' || interSignature(it) !== sig) return;
  it.startAt = syncedNow() + 250;
  it.endsAt = it.startAt + (it.gameKey === 'conveyor' ? CV_MAX_MS : it.gameKey === 'keys' ? KEYS_PICK_MS : it.gameKey === 'memo' ? memoDuration(it) : it.gameKey === 'dice' ? DICE_MS : it.gameKey === 'elec' ? (g.interConfig.elecSec || 75)*1000 : it.gameKey === 'fall' ? FALL_MAX_MS : it.gameKey === 'crash' ? Math.round((g.interConfig.crashMin || 1)*60000) : it.gameKey === 'gifts' ? it.gifts.dur : it.gameKey === 'puzzle' ? Math.round((g.interConfig.puzzleMin || 1)*60000) : g.interConfig.innerSec*1000);
  if(it.gameKey === 'fall') fallWave(it, it.startAt);   // the first wave starts with the game
  if(it.gameKey === 'crash') crashStart(it);
  g.phase = 'inter-active';
  broadcastState();
  addTimer(setTimeout(function(){ hostInterCloseInner(sig); }, it.endsAt - syncedNow() + INTER_GRACE_MS));
}
// live score reports from the phones (a phone only ever sends its own running total)
var interBroadcastPending = false;
function hostInterScore(pid, msg){
  var g = app.game, it = g.inter;
  if(!it || g.mode !== 'interactive' || g.phase !== 'inter-active') return;
  if(msg.sig !== interSignature(it) || !interPlayerAlive(it, pid)) return;
  var s = parseInt(msg.score, 10);
  var maxPlausible = g.interConfig.innerSec * 15 + 5;           // anti-nonsense cap
  if(!(s >= 0) || s > maxPlausible) return;
  var fx = interFxFor(interSignature(it));
  if(s > (it.scores[pid]||0)){ it.scores[pid] = s; fx.scoreAt[pid] = Date.now(); }
  var w = parseInt(msg.wrong, 10);
  if(w > (fx.wrong[pid]||0)){ fx.wrong[pid] = w; fx.wrongAt[pid] = Date.now(); }
  if(msg.final) it.finals[pid] = true;
  // live scores for the display: at most ~6 broadcasts a second
  if(!interBroadcastPending){
    interBroadcastPending = true;
    setTimeout(function(){ interBroadcastPending = false; if(app.game && app.game.mode==='interactive') broadcastState(); }, 160);
  }
}
// a phone tells how its player is doing: 'angry' (5 right in a row - fired up), 'sad' (3 wrong
// in a row), 'pain' (now and then on a wrong move), 'calm' (the hot streak ended)
var hostMoodLast = {};
function hostInterMood(pid, msg){
  var g = app.game, it = g.inter;
  if(!it || g.mode !== 'interactive' || g.phase !== 'inter-active') return;
  if(msg.sig !== interSignature(it) || !interPlayerAlive(it, pid)) return;
  var p = findPlayer(pid), key = p && CHARS[p.character] ? p.character : null;
  var fx = interFxFor(msg.sig), m = msg.mood;
  if(m === 'calm'){ delete fx.mood[pid]; return; }
  if(['happy','sad','pain'].indexOf(m) < 0) return;   // (angry comes from the ranking, see interRankWatch)
  var holdKey = pid+'|'+m;
  if(Date.now() - (hostMoodLast[holdKey] || 0) < MOOD_HOLD_MS[m] - 1000) return;
  hostMoodLast[holdKey] = Date.now();
  fx.mood[pid] = { mood:m, at:Date.now() };
  if(m === 'angry') fx.scoreAt[pid] = Date.now();
  if(key) hostVoice(pid, key, m);
}
// a mood decided by the display (the ranking), shown on the display AND on that player's phone
function hostMoodSet(pid, m){
  var it = app.game.inter, holdKey = pid+'|'+m;
  if(Date.now() - (hostMoodLast[holdKey] || 0) < MOOD_HOLD_MS[m]) return;
  hostMoodLast[holdKey] = Date.now();
  interFxFor(interSignature(it)).mood[pid] = { mood:m, at:Date.now() };
  var p = findPlayer(pid);
  if(p && CHARS[p.character]) hostVoice(pid, p.character, m);
  var conn = app.connections.filter(function(c){ return c.playerId === pid && c.open; })[0];
  if(conn){ try{ conn.send({t:'inter-mood-set', mood:m}); }catch(e){} }
}
// every ~0.4s: if someone who was behind a player is now ahead of them, that player gets angry
var rankWatch = { sig:null, prev:null, at:0 };
function interRankWatch(g, it){
  var sig = interSignature(it), now = Date.now();
  if(rankWatch.sig !== sig) rankWatch = { sig:sig, prev:null, at:0 };
  if(now - rankWatch.at < 400) return;
  rankWatch.at = now;
  if(syncedNow() < it.startAt + 4000){ rankWatch.prev = null; return; }   // let the round get going first
  var conv = it.gameKey === 'conveyor', margin = conv ? 0.03 : 0;
  var ids = it.alive.filter(function(id){ return !(conv && it.cvQueue && it.cvQueue.indexOf(id) >= 0); });
  var cur = {};
  ids.forEach(function(id){ cur[id] = conv ? cvPosOf(id) : ((it.scores && it.scores[id]) || 0); });
  var prev = rankWatch.prev; rankWatch.prev = cur;
  if(!prev) return;
  ids.forEach(function(p){
    if(prev[p] == null) return;
    var overtaken = ids.some(function(q){ return q !== p && prev[q] != null && prev[q] < prev[p] - margin && cur[q] > cur[p] + margin; });
    if(overtaken) hostMoodSet(p, 'angry');
  });
}
function hostInterCloseInner(sig){
  var g = app.game, it = g.inter;
  if(!it || g.phase !== 'inter-active' || interSignature(it) !== sig) return;
  if(it.gameKey === 'conveyor'){ hostCvTimeout(sig); return; }
  if(it.gameKey === 'keys'){ hostKeysReveal(sig); return; }
  if(it.gameKey === 'memo'){ hostMemoReveal(sig); return; }
  if(it.gameKey === 'dice'){ hostDiceReveal(sig); return; }
  if(it.gameKey === 'elec'){ hostElecEnd(sig); return; }
  if(it.gameKey === 'fall') return;   // (it ends when one is left)
  if(it.gameKey === 'crash') return;  // (its own clock ends it)
  if(it.gameKey === 'gifts'){ hostGiftsEnd(sig); return; }
  if(it.gameKey === 'puzzle'){ hostPuzzleEnd(sig); return; }
  // the lowest score among those still standing is out; a tie is settled at random
  var low = Infinity;
  it.alive.forEach(function(pid){ low = Math.min(low, it.scores[pid]||0); });
  var lows = it.alive.filter(function(pid){ return (it.scores[pid]||0) === low; });
  var victim = lows[rand(0, lows.length-1)];
  it.out.push({ id:victim, inner:it.innerNumber, score:it.scores[victim]||0 });
  it.alive = it.alive.filter(function(pid){ return pid !== victim; });
  it.innerScores = {};
  Object.keys(it.scores).forEach(function(k){ it.innerScores[k] = it.scores[k]; });
  var vp = findPlayer(victim), vk = vp && CHARS[vp.character] ? vp.character : null;
  var scared = vk ? voiceChoose(vk, 'scared', 4) : null;
  var wait = Math.max(INTER_ELIM_SHOT_MS, scared ? 250 + Math.min(scared.dur, 4)*1000 + 300 : 0);
  it.elim = { id:victim, at:syncedNow(), shotAt:syncedNow()+wait, tie:lows.length>1, key:sig+'|'+victim };
  var lose = vk ? voiceChoose(vk, 'lose', 6) : null;
  interElimVoice = { key:it.elim.key, scared:scared, lose:lose };
  it.roundWin = null;
  if(it.alive.length === 1){
    // the full round is over: after the shot and the loser's voice, a moment for the one who
    // survived every elimination (their victory line), then the ranking + next round
    var wid = it.alive[0], wpp = findPlayer(wid), wk = wpp && CHARS[wpp.character] ? wpp.character : null;
    var vic = wk ? voiceChoose(wk, 'vectory', 6) : null;
    var rwAt = it.elim.shotAt + 150 + Math.max(1200, (lose ? lose.dur*1000 : 0) + 400);
    it.roundWin = { id:wid, at:rwAt, until: rwAt + 600 + (vic ? vic.dur*1000 : 1500) + 900 };
    if(vic) addTimer(setTimeout(function(){
      if(app.game && app.game.inter === it && it.roundWin && it.roundWin.id === wid) hostVoice(wid, wk, '', {display:true}, vic);
    }, rwAt + 600 - syncedNow()));
  }
  if(it.alive.length <= 1) hostInterFinishRound(true);
  g.phase = 'inter-elim';
  broadcastState();
}
// outer round over: points by place, added to everyone's total
function hostInterFinishRound(fromElim){
  var g = app.game, it = g.inter;
  var n = it.startCount || 0;
  var results = [];
  // first out: 0. Players out together (same group) share the place: everyone out before them counts
  it.out.forEach(function(o, i){
    var gk = o.grp != null ? o.grp : i;
    var earlier = it.out.filter(function(x, j){ return (x.grp != null ? x.grp : j) < gk; });
    // hawk eye counts eliminations (everyone out together = one place), the others count players
    var before = it.denseRank ? earlier.map(function(x){ return x.grp; }).filter(function(x, k, a){ return a.indexOf(x) === k; }).length : earlier.length;
    results.push({ id:o.id, points:before });
  });
  it.alive.forEach(function(pid){ results.push({ id:pid, points:Math.max(0, n-1), winner:true }); });
  results.forEach(function(r){ var p = findPlayer(r.id); if(p) p.score += r.points; });
  it.roundResults = results.slice().reverse();                               // best first
  if(!fromElim){ g.phase = 'inter-elim'; it.elim = null; broadcastState(); }
}
function hostInterNext(){
  var g = app.game, it = g.inter;
  if(it && g.phase === 'inter-pick'){ hostInterAssignMissing(); hostBeginInterRound(); return; }
  if(!it || g.phase !== 'inter-elim') return;
  if(!it.roundResults){ hostBeginInterInner(); return; }
  if(it.roundNumber < g.interConfig.roundsTotal){ hostBeginInterRound(); return; }
  if(hostTopTied(g)){
    g.interConfig.roundsTotal++;
    g.tiebreak = (g.tiebreak || 0) + 1;
    it.nextGame = g.interConfig.games[rand(0, g.interConfig.games.length-1)];
    hostBeginInterRound();
    return;
  }
  var sorted = g.players.slice().sort(function(a,b){ return b.score-a.score; });
  g.winnerId = sorted.length ? sorted[0].id : null;
  g.celebration = { bursts:[], sessionId: Math.random().toString(36).substring(2,9) };

// ---------------- conveyor (السير المتحرك) ----------------
// Each phone runs its own box: it drifts left towards the fire, faster and faster as the
// round goes on; every correct arrow press pushes it right. A box that falls in = the gun

var CV_START = 0.55;          // where the box starts (0 = the fire, 1 = the far right end)

  if(!it.cvQueue.length || it.alive.length <= 1) return;
  var victim = it.cvQueue.shift();
  var vp = findPlayer(victim), vk = vp && CHARS[vp.character] ? vp.character : null;
  var scared = vk ? voiceChoose(vk, 'scared', 4) : null, lose = vk ? voiceChoose(vk, 'lose', 6) : null;

    hostInterRoundWin(it, lose);

    broadcastState();
    return;
  }

    if(app.game !== g || g.inter !== it || !it.elim || it.elim.key !== key) return;

// time runs out; then everyone walks out at once - a bridge with 2+ players on it collapses
// (they get nothing), a player alone takes all its keys. The keys add up over the whole

  if(msg.sig !== interSignature(it) || !interPlayerAlive(it, pid) || syncedNow() > it.endsAt + 600) return;

  var wait = Math.max(INTER_ELIM_SHOT_MS, scared ? 250 + Math.min(scared.dur, 4)*1000 + 300 : 0);

// ---------------- Hawk eye (عين الصقر) ----------------
// A 4x4 grid lights up for 2 seconds (on the display and every phone); then each player
// redraws it from memory on their phone and submits (20 seconds per pattern; whatever is
// marked counts when the time runs out). Anyone who gets it wrong is out - even if that's
// everybody. It gets harder every elimination: very few or very many lit squares are easy,
// a middle amount is hard. From the 7th elimination on there are TWO grids, one after the
// other (the first with 8 lit, a 1 second pause, then the second, which starts easy again
// and gets harder); the player redraws and submits the first, then the second.
// Places: everyone out in the same elimination shares one place, counted by eliminations
// (first group 0, next group 1 ...); a sole survivor gets players - 1.
var MEMO_SHOW_MS = 2000;        // each grid is shown this long
var MEMO_GAP_MS = 1000;         // pause between the two grids
var MEMO_ANSWER_MS = 20000;     // per pattern

    cells: memoPattern(two ? 8 : memoCount(it.innerNumber)),

    subs:null, result:null, revealAt:0, allOk:false

}

  if(msg.sig !== interSignature(it) || !interPlayerAlive(it, pid) || syncedNow() > it.endsAt + 1000) return;
  if(memoSubsHost.sig !== msg.sig) memoSubsHost = { sig:msg.sig, subs:{} };
  memoSubsHost.subs[pid] = { a: memoClean(msg.cells), b: memoClean(msg.cells2) };

// ---------------- Wiring (توصيل الكهرباء) ----------------
// An n x n board of wire tiles (3x3 / 4x4 / 5x5, the leader picks; so does the time). Power
// comes in at the top of the top-left tile (red) and must reach the bottom of the bottom-
// right tile (grey). Tapping a tile turns it 90 degrees clockwise; every wire connected to

  [0,2,6], [0,2,4,6], [0,3,5], [0,2,5],                        // T, cross, Y, Y with a side

    el._ik = ik;
    el.innerHTML = v.stage === 'rise' ? '' : fallShapeSvg(F.ind[v.k]);   // (empty while the tiles come back)
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');

}

  });

  if(!v) return;
  var lab = document.getElementById('fall-ind-lab'), clock = document.getElementById('fall-clock'), label = document.getElementById('fall-label');
  if(v.popped) playSound('pass');                              // a click for every tile that comes back
  var lt = v.stage === 'shuffle' || v.stage === 'rise' ? 'الشكل الآمن...' : 'الشكل الآمن!';
  if(lab.textContent !== lt) lab.textContent = lt;
  var ct = v.stage === 'pick' ? Math.max(0, (F.pickEnd - now)/1000).toFixed(1) : '';
  if(clock.textContent !== ct) clock.textContent = ct;
  clock.classList.toggle('low', v.stage === 'pick' && F.pickEnd - now <= 1000);
  var picked = it.alive.filter(function(id){ return F.picks[id] != null; }).length;
  var tiles = F.present.length;
  var txt = v.stage === 'rise' ? (F.wave === 1 ? 'استعدوا!' : 'المربعات ترجع...') : v.stage === 'shuffle' ?('انتبهوا! — '+tiles+' مربع') : v.stage === 'pick' ? ('اختاروا مربعاً آمناً! — '+picked+' / '+it.alive.length)
    : v.stage === 'wait' ? '...' : (F.res.fell.length ? '⬇️ طاح '+F.res.fell.length : '✔ ما طاح أحد!');
  if(label.textContent !== txt) label.textContent = txt;

  var key = F.wave+'|'+v.stage+'|'+v.k;
  if(fallFx.key !== key){
    var prev = fallFx.key; fallFx.key = key;
    if(prev){
      if(v.stage === 'shuffle') playSound('appear');
      else if(v.stage === 'pick') playSound('submit');

}
function fallCharState(it, id, now){
  var F = it.fall, v = fallView(F, now);

// ---------------- Crash Bash (كراش باش) ----------------
// A 15x15 floor on the display only. Every character hops tile to tile (up / down / left /
// right only) driven by a joystick on its player's phone, and every tile it lands on takes its
// colour (taking it from whoever had it). Every 10 seconds the coloured tiles are counted as
// points and the floor is wiped. Two ways to play (the leader's choice): elimination rounds
// (lowest total out each round, all tied lowest go together, everyone tied = nobody), or one
// round where the most points wins. The leader also sets the round time and how many tools.
// Tools pop up spinning for 8 s: 🚀 rocket, 👟 shoes, 🧨 mine, 🔒 lock, 🪄 wand, ⚡ lightning,
// 🛡️ shield, ⏱️ clock, a turning arrow, a "!" box (points) and a "?" box (a random tool, or a
// zap). Rocket / mine / lightning are carried (one at a time) and fired with the red buttons.
// The display runs the whole game; phones only send their joystick and fire button.
var CRASH_N = 15;
var CRASH_CYCLE_MS = 10000;          // points are counted (and the floor wiped) this often
var CRASH_HOP_MS = 250;              // one hop (~4 tiles a second)
var CRASH_FAST_HOP_MS = 85;          // with the shoes (x3)
var CRASH_ITEM_MS = 8000;            // a tool on the floor disappears after this
var CRASH_STUN = { rocket:3000, mine:3000, bolt:2000 };

var CRASH_CLOCK_ADD = 10000, CRASH_CLOCK_WAIT = 60000;
var CRASH_ROCKET_SPEED = 11;         // tiles a second
var CRASH_INPUT_STALE = 1500;        // a joystick we stop hearing from lets go

var CRASH_ITEMS = { rocket:'🚀', shoe:'👟', mine:'🧨', lock:'🔒', wand:'🪄', bolt:'⚡', shield:'🛡️', clock:'⏱️', arrow:'', bang:'!', quest:'?' };
var CRASH_WEIGHT = { rocket:12, shoe:10, mine:10, lock:8, wand:8, bolt:7, shield:8, clock:5, arrow:10, bang:8, quest:10 };
var CRASH_HELD = { rocket:true, mine:true, bolt:true };
// each character's colour (a little lighter where the given one disappears on a dark floor)
var CRASH_COLORS = { luffy:'#c41e3a', zoro:'#6a994e', naruto:'#e36414', sakura:'#f26a8d', kakashi:'#a9b4bf', goku:'#ffd000',
  vegeta:'#2563c9', conan:'#4cc9f0', haibara:'#99582a', kaito_kid:'#6a11b0', levi:'#197278', mikasa:'#e7bc91', killua:'#a06cd5' };
var CRASH_SPARE = ['#ff006e','#3a86ff','#8ac926','#ff9f1c','#00b4d8','#c77dff'];
var CRASH_DIRS = { u:[-1,0], d:[1,0], l:[0,-1], r:[0,1] };
var CRASH_ARROW = ['u','r','d','l'];

var crashHost = { sig:null };
function crashColor(pid){
  var p = findPlayer(pid);
  if(p && CRASH_COLORS[p.character]) return CRASH_COLORS[p.character];
  var i = app.game.players.findIndex(function(x){ return x.id === pid; });
  return CRASH_SPARE[Math.max(0, i) % CRASH_SPARE.length];
}
function crashSetup(it, cfg){
  it.denseRank = false;                       // players out together share a place, counted by players
  it.crash = { mode: cfg.crashMode === 'single' ? 'single' : 'elim', cycleEnd:0, end:0, points:{}, held:{}, eff:{}, tieAll:false, done:false };
  it.alive.forEach(function(id){ it.crash.points[id] = 0; });

function crashCell(r, c){ return r*CRASH_N + c; }
// the game starts (inter-active): everyone on their starting tile
function crashStart(it){

    spawn: CRASH_SPAWN[cfg.crashItems] || CRASH_SPAWN.balanced, nextSpawn: it.startAt + 1500,
    clockWait:0, clockCycle:-1, cyc:0, cycleEnd: it.startAt + CRASH_CYCLE_MS, end: it.endsAt, sum:'', sumAt:0, last:it.startAt };

function crashFx(H, type, r, c, ms, extra){

// is somebody (other than pid) on this tile, or hopping onto / off it?
function crashTaken(H, r, c, pid){
  return Object.keys(H.ps).some(function(id){

    if(id === pid || q.gone) return false;

function crashPaint(H, pid, cell, now){

// a hit (rocket / mine / lightning): the shield stops it
function crashHit(H, q, kind, now){
  if(now < q.shieldUntil){ crashFx(H, 'block', q.r, q.c, 700, { pid:q.id }); return false; }
  q.stunUntil = Math.max(q.stunUntil, now + CRASH_STUN[kind]);
  var p = findPlayer(q.id); if(p && CHARS[p.character]) hostVoice(q.id, p.character, 'pain');
