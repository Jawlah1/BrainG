.cr-cloud{display:block;}
.cr-zap{display:block;animation:cr-zap .14s steps(2) infinite;filter:drop-shadow(0 0 8px #ffe14d);}
@keyframes cr-spin{to{transform:rotate(360deg);}}
@keyframes cr-blink{50%{opacity:.25;}}
@keyframes cr-boom{0%{transform:translate(-50%,-50%) scale(.4);opacity:1;}100%{transform:translate(-50%,-50%) scale(1.7);opacity:0;}}
@keyframes cr-up{0%{transform:translate(-50%,-60%);opacity:1;}100%{transform:translate(-50%,-230%);opacity:0;}}
@keyframes cr-zap{50%{opacity:.2;}}
@keyframes cr-wipe{0%{filter:brightness(1.9);}100%{filter:none;}}
@keyframes cr-pulse{to{transform:scale(1.12);}}
/* phone: the controller */
.crash-wrap-ph{flex:1 1 0;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:1.4vh;
  padding:1.2vh 16px calc(1.8vh + env(safe-area-inset-bottom));touch-action:none;-webkit-user-select:none;user-select:none;}
.crash-top{width:100%;max-width:520px;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--border);direction:rtl;}
.crash-item{flex:1;min-height:clamp(64px,10vh,96px);display:flex;align-items:center;justify-content:center;gap:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);transition:border-color .2s, box-shadow .2s;}
.crash-item.has{border-color:var(--gold);box-shadow:0 0 16px -2px var(--gold);}
.crash-tool{font-size:clamp(38px,6.5vh,60px);line-height:1;animation:crash-bob 1.4s ease-in-out infinite alternate;}
@keyframes crash-bob{to{transform:translateY(-4px) rotate(-6deg);}}
.crash-tool-name{font-weight:900;font-size:clamp(16px,2.4vh,22px);color:var(--gold);}
.crash-none{color:var(--sub);font-weight:700;font-size:14px;}
.crash-info{display:flex;flex-direction:column;align-items:center;min-width:76px;gap:2px;}
.crash-pts{font-size:clamp(26px,4.4vh,40px);font-weight:900;line-height:1;color:var(--text);}
.crash-pts::after{content:"نقطة";display:block;font-size:11px;color:var(--sub);font-weight:700;text-align:center;}
.crash-cyc{font-size:15px;font-weight:800;color:var(--gold);direction:ltr;}
.crash-cyc:not(:empty)::before{content:"⏱ ";}
.crash-eff{display:flex;gap:6px;font-size:13px;font-weight:800;flex-wrap:wrap;justify-content:center;color:var(--text);}
#crash-avatar{position:relative;left:auto;right:auto;top:auto;bottom:auto;flex:0 0 auto;width:clamp(56px,8.5vh,84px);height:clamp(70px,10.6vh,105px);}
.crash-joy{position:relative;width:min(78vw,44vh,380px);aspect-ratio:1/1;border-radius:50%;flex:0 0 auto;touch-action:none;
  background:radial-gradient(circle at 50% 50%, var(--panel) 0 32%, var(--panel2) 72%);border:2px solid var(--border);
  box-shadow:inset 0 0 30px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);transition:opacity .2s, filter .2s;}
.crash-joy::before{content:"";position:absolute;inset:16%;border-radius:50%;border:1px dashed var(--border);}
.crash-joy i{position:absolute;width:0;height:0;border:9px solid transparent;opacity:.55;}
.crash-joy i.u{left:50%;top:5%;margin-left:-9px;border-bottom:12px solid var(--sub);border-top:0;}
.crash-joy i.d{left:50%;bottom:5%;margin-left:-9px;border-top:12px solid var(--sub);border-bottom:0;}
.crash-joy i.l{top:50%;left:5%;margin-top:-9px;border-right:12px solid var(--sub);border-left:0;}
.crash-joy i.r{top:50%;right:5%;margin-top:-9px;border-left:12px solid var(--sub);border-right:0;}
.crash-joy[data-d="u"] i.u{border-bottom-color:var(--gold);opacity:1;} .crash-joy[data-d="d"] i.d{border-top-color:var(--gold);opacity:1;}
.crash-joy[data-d="l"] i.l{border-right-color:var(--gold);opacity:1;} .crash-joy[data-d="r"] i.r{border-left-color:var(--gold);opacity:1;}
.crash-knob{position:absolute;left:50%;top:50%;width:38%;aspect-ratio:1/1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.75), var(--gold) 55%, var(--gold2));box-shadow:0 6px 16px rgba(0,0,0,.45), inset 0 -4px 8px rgba(0,0,0,.25);}
.crash-btns{width:100%;max-width:520px;display:flex;justify-content:space-between;}
.crash-fire{width:clamp(96px,14vh,132px);aspect-ratio:1/1;border-radius:20px;border:none;cursor:pointer;color:#fff;font-family:inherit;font-weight:900;font-size:clamp(16px,2.4vh,22px);
  background:linear-gradient(160deg,#e23b3b,#9b1414);box-shadow:inset 0 -6px 0 rgba(0,0,0,.3), 0 8px 18px rgba(155,20,20,.45);touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.crash-fire:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3), 0 4px 10px rgba(155,20,20,.45);}
.crash-fire:disabled{opacity:.42;filter:grayscale(.45);}
.crash-wrap-ph.off .crash-joy{opacity:.5;}
.crash-wrap-ph.stun .crash-joy{opacity:.55;filter:grayscale(.7);}

/* ===================== Gifts (الهدايا) ===================== */
.gf-machine{position:relative;width:100%;z-index:2;}
.gm-box{position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;
  background:linear-gradient(180deg,#a7b0ba,#737c86 55%,#5d656e);border:2px solid rgba(0,0,0,.35);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4), inset 0 -5px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.35);}
.gm-box::before, .gm-box::after{content:"";position:absolute;top:7px;width:7px;height:7px;border-radius:50%;background:#4b525a;box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 calc(100% + 0px) 0 transparent;}
.gm-box::before{left:7px;} .gm-box::after{right:7px;}
.gm-lamp{flex:0 0 auto;width:14px;height:14px;border-radius:50%;background:#ffd23f;box-shadow:0 0 10px #ffd23f, inset 0 -2px 0 rgba(0,0,0,.25);animation:gm-blink 1s steps(2) infinite;}
.gm-lamp.b{background:#ff5d5d;box-shadow:0 0 10px #ff5d5d, inset 0 -2px 0 rgba(0,0,0,.25);animation-delay:-.5s;}
@keyframes gm-blink{50%{opacity:.35;box-shadow:none;}}
.gm-screen{flex:1;display:flex;align-items:center;justify-content:center;gap:16px;min-height:46px;padding:6px 12px;border-radius:10px;direction:ltr;
  background:#0a1018;color:#7cffb2;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 14px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.3);}
.gm-screen b{font-size:clamp(24px,3.8vh,34px);line-height:1;text-shadow:0 0 8px rgba(124,255,178,.55);}
.gm-screen b.neg{color:#ff6b6b;text-shadow:0 0 8px rgba(255,107,107,.6);}
.gm-screen span{font-size:clamp(14px,2.2vh,18px);color:#a8ffd0;opacity:.85;}
.gm-screen span.low{color:#ff8a8a;opacity:1;}
.gm-chutes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 4px;margin-top:-2px;}
.gm-chutes i{justify-self:center;width:50%;height:16px;border-radius:0 0 9px 9px;background:linear-gradient(180deg,#5d656e,#373c43);border:2px solid rgba(0,0,0,.35);border-top:none;box-shadow:inset 0 -5px 6px rgba(0,0,0,.45);}
/* belts, chutes and buttons always run left to right (belt 1 on the left), whatever the page's direction */
.gifts-belts, .gm-chutes, .gifts-btns, .gifts-stage{direction:ltr;}
.gifts-belts{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 4px;}
.gift-belt{position:relative;border-radius:8px;overflow:hidden;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,.09) 0 3px, transparent 3px 24px), linear-gradient(90deg,#252a31,#3a414b 50%,#252a31);
  border-left:6px solid #5a616b;border-right:6px solid #5a616b;box-shadow:inset 0 0 14px rgba(0,0,0,.65);transition:box-shadow .15s;}
.gift-belt::before, .gift-belt::after{content:"";position:absolute;top:0;bottom:0;width:4px;background:repeating-linear-gradient(180deg,#8a929c 0 8px,transparent 8px 40px);opacity:.7;}
.gift-belt::before{left:2px;} .gift-belt::after{right:2px;}
.run .gift-belt{animation:gf-belt var(--belt-s,.42s) linear infinite;}
@keyframes gf-belt{to{background-position:0 24px, 0 0;}}
/* display */
.gf-disp{width:min(46vh,40vw);margin:0 auto 1vh;}
.gf-disp .gifts-belts{height:min(26vh,200px);}
.gf-drop{position:absolute;left:50%;top:-10%;font-size:clamp(22px,3.6vh,34px);transform:translate(-50%,-50%);animation:gf-fall 2.8s linear infinite;}
@keyframes gf-fall{0%{top:-8%;opacity:0;}10%{opacity:1;}88%{opacity:1;}100%{top:108%;opacity:0;}}
.gf-n{display:inline-block;direction:ltr;font-style:normal;}
.gf-rule{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin-top:.8vh;font-weight:800;font-size:clamp(13px,2vh,18px);color:var(--sub);}
/* phone */
.gifts-wrap-ph{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:1.2vh;padding:1vh 14px calc(1.6vh + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none;}
.gifts-stage{flex:1 1 0;min-height:0;display:flex;flex-direction:column;position:relative;}
.gifts-stage .gifts-belts{flex:1 1 0;min-height:0;}
.gifts-stage[data-lane="0"] .gift-belt:nth-child(1), .gifts-stage[data-lane="1"] .gift-belt:nth-child(2), .gifts-stage[data-lane="2"] .gift-belt:nth-child(3){box-shadow:inset 0 0 14px rgba(0,0,0,.65), 0 0 0 2px var(--gold), 0 0 16px -2px var(--gold);}
.gifts-items{position:absolute;inset:0 4px;pointer-events:none;}
.gift-it{position:absolute;transform:translate(-50%,-50%) scale(var(--sc,1));font-size:clamp(30px,5.2vh,46px);line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));will-change:top;}
.gift-it.g.big{filter:drop-shadow(0 0 9px rgba(255,214,90,.85)) drop-shadow(0 3px 3px rgba(0,0,0,.5));}
.gifts-me{position:relative;flex:0 0 auto;height:clamp(84px,13vh,122px);}
#gifts-avatar{position:absolute;top:-10%;bottom:auto;left:50%;transform:translateX(-50%);transition:left .12s ease-out;}
.gifts-stage[data-lane="0"] #gifts-avatar{left:calc(4px + (100% - 8px - 20px)/6);}
.gifts-stage[data-lane="1"] #gifts-avatar{left:50%;}
.gifts-stage[data-lane="2"] #gifts-avatar{left:calc(100% - 4px - (100% - 8px - 20px)/6);}
.gifts-stage.ouch #gifts-avatar{animation:gf-ouch .35s;}
@keyframes gf-ouch{25%{margin-left:-6px;}75%{margin-left:6px;}}
.gifts-fx{position:absolute;left:4px;right:4px;bottom:clamp(84px,13vh,122px);height:0;pointer-events:none;z-index:3;}
.gift-fx{position:absolute;bottom:0;transform:translateX(-50%);font-weight:900;font-size:clamp(24px,4vh,34px);text-shadow:0 0 6px rgba(0,0,0,.8);animation:gf-up .9s ease-out forwards;direction:ltr;}
.gift-fx.good{color:#4ade80;} .gift-fx.bad{color:#ff5d5d;}
@keyframes gf-up{from{transform:translate(-50%,0);opacity:1;}to{transform:translate(-50%,-70px);opacity:0;}}
.gifts-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 4px;flex:0 0 auto;}
.gift-btn{height:clamp(70px,11vh,104px);border:none;border-radius:16px;cursor:pointer;color:#fff;font-size:clamp(20px,3vh,28px);font-family:inherit;
  background:linear-gradient(160deg,#e23b3b,#9b1414);box-shadow:inset 0 -6px 0 rgba(0,0,0,.3), 0 8px 16px rgba(155,20,20,.4);touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.gift-btn.hit{animation:gf-press .16s ease-out;}
@keyframes gf-press{50%{transform:translateY(3px) scale(.97);}}
.gifts-btns.off .gift-btn{opacity:.45;filter:grayscale(.4);}

/* ===================== Picture puzzle (ترتيب الصورة) ===================== */
.puzzle-wrap-ph{flex:1 1 0;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;padding:1vh 14px calc(1.4vh + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none;}
.pz-top{display:flex;align-items:center;justify-content:center;gap:18px;min-height:clamp(40px,6vh,56px);direction:rtl;}
.pz-top .keys-count{font-size:clamp(28px,4.6vh,42px);direction:ltr;}
.pz-moves{font-weight:800;color:var(--sub);font-size:clamp(14px,2.1vh,18px);}
.puzzle-board{position:relative;width:min(92vw,56vh,520px);aspect-ratio:1/1;border-radius:12px;overflow:hidden;direction:ltr;touch-action:none;
  background:rgba(0,0,0,.35);border:2px solid var(--border);box-shadow:0 10px 26px rgba(0,0,0,.35);transition:box-shadow .3s;}
.pz-pcs{position:absolute;inset:0;}
.pz-pc{position:absolute;left:0;top:0;width:calc(100% / var(--n));height:calc(100% / var(--n));background-color:var(--panel2);background-repeat:no-repeat;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.14);transition:transform .14s ease-out;cursor:grab;touch-action:none;}
.pz-pc.drag{transition:none;z-index:2;cursor:grabbing;box-shadow:inset 0 0 0 2px var(--gold), 0 6px 16px rgba(0,0,0,.5);}
.pz-pc.noimg{background-image:linear-gradient(135deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(18px,4vh,34px);color:#fff;}
.puzzle-board.locked .pz-pc{cursor:default;}
.pz-full{position:absolute;inset:0;background-size:100% 100%;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5;}
.puzzle-board.peek .pz-full, .puzzle-board.solved .pz-full{opacity:1;}
.puzzle-board.solved{box-shadow:0 0 0 3px var(--gold), 0 0 30px var(--gold);}
.pz-peek{display:flex;align-items:center;justify-content:center;gap:8px;width:min(92vw,56vh,520px);padding:12px 16px;border-radius:14px;cursor:pointer;
  border:1px solid var(--border);background:var(--panel);color:var(--text);font-family:inherit;font-weight:800;font-size:clamp(14px,2.2vh,18px);touch-action:none;-webkit-touch-callout:none;}
.pz-peek.on{background:var(--gold);color:var(--panel2);border-color:var(--gold);}
#puzzle-avatar{top:1vh;bottom:auto;left:auto;right:10px;}
/* display */
.pz-disp{display:flex;align-items:center;justify-content:center;gap:3vw;direction:rtl;}
.pz-cover{position:relative;flex:0 0 auto;width:min(44vh,30vw);aspect-ratio:1/1;border-radius:14px;overflow:hidden;background-size:cover;background-position:center;border:2px solid var(--border);box-shadow:0 10px 26px rgba(0,0,0,.35);}
.pz-cover::before{content:"";position:absolute;inset:0;transition:opacity .7s;
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 14px, transparent 14px 28px), var(--panel2);}
.pz-cover span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(14vh,10vw);transition:opacity .5s;}
.pz-cover.open::before, .pz-cover.open span{opacity:0;}
.pz-side{display:flex;flex-direction:column;align-items:center;gap:1.2vh;width:min(40vw,440px);}
.pz-title{font-size:clamp(24px,4.4vh,44px);font-weight:900;color:var(--gold);}
.pz-title small{font-size:.55em;color:var(--sub);direction:ltr;display:inline-block;}
.pz-list{width:100%;display:flex;flex-direction:column;gap:7px;}
.pz-row{display:grid;grid-template-columns:7.5em 1fr 5.8em;align-items:center;gap:10px;font-size:clamp(14px,2.2vh,20px);}
.pz-row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pz-row i{display:block;height:12px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;}
.pz-row s{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .4s;}
.pz-row.done s{background:var(--green, #22c55e);}
.pz-row em{font-style:normal;font-weight:800;direction:ltr;text-align:left;}

/* ---- picture puzzle v35: the picture sits on an inner layer, so a piece can be lifted / pushed while it travels ---- */
.pz-pc{background:none !important;box-shadow:none;transition:transform .28s cubic-bezier(.3,.85,.3,1);}
.puzzle-board:not(.swap) .pz-pc{transition:transform .14s ease-out;}
.pz-pc.drag{transition:none;box-shadow:none;}
.pz-in{position:absolute;inset:0;display:block;font-style:normal;background-color:var(--panel2);background-repeat:no-repeat;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.14);transition:transform .22s ease-out, box-shadow .22s, filter .22s;}
.pz-pc.drag .pz-in{box-shadow:inset 0 0 0 2px var(--gold), 0 6px 16px rgba(0,0,0,.5);}
.pz-pc.noimg .pz-in{background-image:linear-gradient(135deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(18px,4vh,34px);color:#fff;}
.puzzle-board.swap .pz-pc{cursor:pointer;}
.pz-pc.up{z-index:3;}
.pz-pc.up .pz-in{transform:translateY(-7%) scale(1.1);box-shadow:0 16px 26px rgba(0,0,0,.6), 0 0 0 3px var(--gold);filter:brightness(1.08);}
.pz-pc.pushed .pz-in{animation:pz-push .3s ease-out;}
@keyframes pz-push{40%{transform:scale(.88);filter:brightness(.85);}}
.pz-pc.ok{z-index:2;}
.pz-pc.ok .pz-in{animation:pz-ok .85s ease-out;}
@keyframes pz-ok{0%{box-shadow:inset 0 0 0 3px #7dffb0, 0 0 20px 4px #7dffb0;filter:brightness(1.4);}100%{box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.14);filter:none;}}
</style>
</head>
<body>

<div id="reconnect-banner" class="hidden">🔄 جاري إعادة الاتصال بالغرفة...</div>

<div id="screen-home" class="screen active">
  <div class="center-wrap">
    <div class="card-panel">
      <img class="main-logo" src="https://raw.githubusercontent.com/Jawlah1/RandFiles/main/Brain_Logo.png" alt="logo">
      <p class="sub">ألعاب جماعية تختبر قوة العقل والذاكرة</p>
      <button class="primary" id="btn-create-room">🖥️ إنشاء غرفة (جهاز العرض)</button>

        <div class="field"><label>رمز الغرفة</label><input type="text" id="room-code-input" maxlength="6" placeholder="ABCD" style="direction:ltr;text-transform:uppercase;"></div>
        <button class="primary" id="btn-join-room">دخول</button>
      </div>
      <div class="status-msg" id="home-status"></div>
    </div>
  </div>
</div>

<div id="screen-lobby" class="screen">
  <div class="center-wrap">
    <div class="card-panel">
      <div id="lobby-host-view" class="hidden">
        <h1>غرفة الانتظار</h1>
        <p class="sub">اطلب من اللاعبين إدخال هذا الرمز</p>
        <div class="room-code-big" id="room-code-display">----</div>
      </div>
      <div id="lobby-player-view" class="hidden">
        <h1>غرفة الانتظار</h1>
        <div class="room-code-big" id="room-code-display2">----</div>
      </div>
      <div id="lobby-settings-summary" class="settings-summary hidden"></div>
      <div class="list-wrap" id="lobby-players"></div>
      <button class="ghost hidden" id="btn-rename">✏️ تغيير اسمي</button>
      <button class="ghost hidden" id="btn-reset-all-scores">↺ تصفير نقاط جميع اللاعبين</button>
      <div id="my-theme-box" class="settings-box hidden">
        <label>لون تنسيق جوالك</label>
        <div class="theme-picker" id="my-theme-picker"></div>
        <div id="display-theme-wrap" class="hidden">
          <label>لون تنسيق شاشة العرض</label>
          <div class="theme-picker" id="theme-picker"></div>
        </div>
      </div>
      <div id="leader-settings" class="leader-boxes hidden">
        <div class="settings-box">
          <label>الألعاب السريعة المطلوبة</label>
          <div class="game-picker" id="game-picker"></div>
          <label>عدد جولات الألعاب السريعة</label>
          <div class="stepper"><button type="button" class="step-btn" data-step="1" data-for="round-count-input" aria-label="زيادة">+</button><input type="number" id="round-count-input" min="1" max="60" value="10"><button type="button" class="step-btn" data-step="-1" data-for="round-count-input" aria-label="إنقاص">−</button></div>
          <button class="gold" id="btn-start-quick">🚀 ابدأ الألعاب السريعة</button>
        </div>
        <div class="settings-box">
          <label>عدد مراحل (أعمدة) لعبة القنابل</label>
          <div class="stepper"><button type="button" class="step-btn" data-step="1" data-for="bomb-cols-input" aria-label="زيادة">+</button><input type="number" id="bomb-cols-input" min="4" max="10" value="8"><button type="button" class="step-btn" data-step="-1" data-for="bomb-cols-input" aria-label="إنقاص">−</button></div>
          <label>طريقة حساب النقاط في لعبة القنابل</label>
          <select id="bomb-scoring-select" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px;margin-bottom:8px;">
            <option value="classic">نقاط الخطوات</option>

          <div id="bomb-rounds-box" class="hidden">

        <div class="settings-box">

          <button class="gold" id="btn-start-flags" style="background:linear-gradient(135deg,#0369a1,#0ea5e9);">🚩 ابدأ لعبة الأعلام</button>
        </div>
        <div class="settings-box">
          <label>عدد جولات لعبة الكلمات</label>
          <div class="stepper"><button type="button" class="step-btn" data-step="1" data-for="words-rounds-input" aria-label="زيادة">+</button><input type="number" id="words-rounds-input" min="1" max="20" value="5"><button type="button" class="step-btn" data-step="-1" data-for="words-rounds-input" aria-label="إنقاص">−</button></div>

<script>
(function(){
"use strict";

var PEER_CONFIG = {
  host: 'maq-peerjs-server.onrender.com',
  port: 443,
  path: '/myapp',
  secure: true,
  debug: 0,
  config: { iceServers: [
    { urls:'stun:stun.l.google.com:19302' },
    { urls:'stun:stun1.l.google.com:19302' },
    { urls:'stun:stun2.l.google.com:19302' }
  ]}
};
var ROOM_PREFIX = 'brain5games37-';
var ASSET_BASE = 'https://raw.githubusercontent.com/Jawlah1/RandFiles/main/';
// Flags game: preload every direction/color-variant image up front (both colors, since
// the leader can switch themes mid-lobby) so switching directions on screen is instant -
// no per-frame network fetch ever happens once these are warm in the browser cache.
var FLAG_DIRS = ['up','down','left','right'];
var FLAG_IMG_URLS = {};
(function(){
  var prefixes = { W:'WFlag-', B:'BFlag-' };
  var caps = { up:'Up', down:'Down', left:'Left', right:'Right' };
  Object.keys(prefixes).forEach(function(p){
    FLAG_IMG_URLS[p] = {};
    FLAG_DIRS.forEach(function(d){
      var url = ASSET_BASE + prefixes[p] + caps[d] + '.png';
      FLAG_IMG_URLS[p][d] = url;
      try{ var im = new Image(); im.src = url; }catch(e){}
    });
  });
})();
var THEME_LIGHT = [3,4,5,7];   // the light themes
function flagImageColorPrefix(themeIdx){
  // fix: dark themes (0-2) use the White-figure images, light themes (3-5) use Black.
  return THEME_LIGHT.indexOf(themeIdx) >= 0 ? 'B' : 'W';
}
// D-pad button artwork: one "up" image per theme (0-6), rotated in CSS for the other

var snd = {}; // kept for compatibility elsewhere; no longer <audio> elements
// fix #1: rapid button presses could silently drop sounds when reusing a single <audio>
// element (currentTime reset while a previous play() was still settling). Every sound is
// now decoded ONCE into an AudioBuffer; each playSound() call spawns a brand new
// BufferSourceNode, so overlapping/rapid-fire playback is fully supported natively.
var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  return audioCtx;
}
var soundBuffers = {};
var soundLoadFailed = {};
function loadSoundBuffer(key, url){
  var ctx = getAudioCtx();
  if(!ctx){ soundLoadFailed[key] = true; return; }
  fetch(url).then(function(r){
    if(!r.ok) throw new Error('not found');
    return r.arrayBuffer();
  }).then(function(buf){
    return ctx.decodeAudioData(buf);
  }).then(function(decoded){
    soundBuffers[key] = decoded;
  }).catch(function(){
    soundLoadFailed[key] = true;
  });
}

function playBuffer(buffer, gainValue){
  var ctx = getAudioCtx();
  if(!ctx || !buffer) return null;
  try{
    var src = ctx.createBufferSource();
    src.buffer = buffer;
    var gain = ctx.createGain();
    gain.gain.value = gainValue==null ? 1 : gainValue;
    src.connect(gain); gain.connect(ctx.destination);
    src.start(0);
    return src;
  }catch(e){ return null; }
}
// Synthesized "counter filling up" tick - no matching asset was supplied for this effect.
function playTick(step){
  var ctx = getAudioCtx();
  if(!ctx) return;
  try{
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 480 + Math.min(step||0,40)*16;
    gain.gain.setValueAtTime(0.16, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.09);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.09);
  }catch(e){}
}
function playSynthBuzz(){
  var ctx = getAudioCtx();
  if(!ctx) return;
  try{
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(90, ctx.currentTime+0.28);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.3);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.3);
  }catch(e){}
}

// fix: victory music must be stoppable (leader can leave the winner screen mid-song), so
// every node it starts is tracked here and killed on demand by stopVictoryMusic().
var victoryAudioSession = { sources: [], token: 0 };
function stopVictoryMusic(){
  pendingVictory = null; // a win that never got to play must not start after leaving the screen
  victoryAudioSession.token++;
  victoryAudioSession.sources.forEach(function(s){ try{ s.stop(); }catch(e){} });
  victoryAudioSession.sources = [];
}
// Synthesized fallback fanfare for Vectory.mp3 (bomb game win / classic-mode win).
function playSynthVictory(){
  var ctx = getAudioCtx();
  if(!ctx) return;
  try{
    var notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach(function(freq, i){
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'triangle';
      var t0 = ctx.currentTime + i*0.12;
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.linearRampToValueAtTime(0.2, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0+0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0+0.35);
      victoryAudioSession.sources.push(osc);
    });
  }catch(e){}
}
var audioUnlocked = false;
function unlockAudio(){
  audioUnlocked = true;
  // fix: after a background/reconnect cycle, mobile browsers commonly suspend the
  // AudioContext again even though it was "unlocked" once before at page load - so this
  // must keep being able to resume it on every future interaction too, not just the very
  // first tap (which is why the previous version silently lost all sound after a
  // reconnect: the resume logic had already fired-and-disarmed itself via {once:true}).
  var ctx = getAudioCtx();
  if(!ctx) return;
  primeVictoryEl();
  if(!ctx._victoryStateHook){
    // iPad: the context drops to "suspended"/"interrupted" after a lock/notification -
    // try to bring it back straight away, and play any win that was waiting on it.
    ctx._victoryStateHook = true;
    ctx.addEventListener && ctx.addEventListener('statechange', function(){
      if(ctx.state === 'running') tryPlayPendingVictory();
      else if(ctx.state !== 'closed' && document.visibilityState === 'visible'){ try{ ctx.resume().catch(function(){}); }catch(e){} }
    });
  }
  if(ctx.state!=='running'){
    ctx.resume().then(tryPlayPendingVictory, function(){});
  } else {
    tryPlayPendingVictory();
  }
  // fix #1: on some WebKit/iPadOS builds, merely resume()-ing a context that was CREATED
  // outside of a user gesture is not enough to truly unlock playback (this is why it
  // worked fine on a laptop/PC browser but stayed silent on an iPad display device) -
  // actually starting a real (silent) buffer source from inside the gesture handler is
  // the standard, more reliable unlock technique across WebKit versions.
  try{
    var buffer = ctx.createBuffer(1, 1, 22050);
    var src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    if(src.start) src.start(0); else if(src.noteOn) src.noteOn(0);
  }catch(e){}
}
document.addEventListener('touchstart', unlockAudio);
document.addEventListener('click', unlockAudio);
['touchend','pointerdown','pointerup','keydown'].forEach(function(ev){
  document.addEventListener(ev, unlockAudio, {capture:true, passive:true});
});
// iOS: a context left running while the page is in the background often comes back
// "running" but silent - park it while hidden, wake it on return (see visibilitychange).
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden' && audioCtx && audioCtx.state === 'running'){
    try{ audioCtx.suspend().catch(function(){}); }catch(e){}
  }
});
window.addEventListener('pageshow', function(){ unlockAudio(); });

}
function handleHostConnectionLost(){
  if(app.intentionalLeave || app.reconnecting) return;
  app.reconnecting = true;
  showReconnectBanner();
  attemptHostReconnect();
}

function joinRoomFlow(codeRaw, name, opts){
  opts = opts || {};
  var code = codeRaw.trim().toLowerCase();
  app.roomCode = code;
  if(!opts.isReconnect) app.intentionalLeave = false;
  var hostId = ROOM_PREFIX + code + '-host';
  var peer = new Peer(undefined, PEER_CONFIG);
  app.peer = peer;
  app.isHost = false;
  app.myName = name;

  peer.on('open', function(){
    var conn = peer.connect(hostId, {reliable:true});
    app.hostConn = conn;
    conn.on('open', function(){
      app.reconnecting = false;
      hideReconnectBanner();
      unlockAudio(); // make sure sound is actually working again after a reconnect
      // an unconfirmed victory-clip transfer was cut off by the drop - allow a fresh send
      // (the 'state' handler skips it if the display already confirmed it for this id)
      app.victoryAudioSent = false;
      app.victoryAudioAttempts = 0;
      conn.send({t:'join', name:name, priorId: app.myPlayerId||null});
      requestTimeSync();
    });
    conn.on('data', function(msg){ clientHandleMessage(msg); });
    conn.on('close', function(){ handlePlayerConnectionLost(); });
  });
  peer.on('disconnected', function(){ handlePlayerConnectionLost(); });
  peer.on('error', function(err){
    if(opts.isReconnect){
      scheduleReconnectRetry(attemptPlayerReconnect);
      return;
    }
    if(err.type === 'peer-unavailable'){
      els.homeStatus.textContent = 'لم يتم العثور على غرفة بهذا الرمز.';
    } else {
      els.homeStatus.textContent = 'تعذر الاتصال، حاول مرة أخرى.';
    }
    els.homeStatus.classList.add('error');
    els.btnJoinRoom.disabled = false;
  });
}

// fix: switching apps / backgrounding the tab for a while used to silently drop the
// connection, and the ONLY thing the old code did about it was alert() + dump the player
// back to the home screen - they had to manually retype the room code. Now we detect the
// drop and quietly reconnect them under their own name (the host already knows how to
// restore a returning player's id/score by name - see hostAddOrReconnectPlayer).
function handlePlayerConnectionLost(){
  if(app.isHost || app.intentionalLeave || !app.myName) return;
  if(app.reconnecting) return;
  app.reconnecting = true;
  showReconnectBanner();
  attemptPlayerReconnect();
}
function attemptPlayerReconnect(){
  if(app.peer){ try{ app.peer.destroy(); }catch(e){} }
  joinRoomFlow(app.roomCode, app.myName, {isReconnect:true});
}
function scheduleReconnectRetry(retryFn){
  addTimer(setTimeout(function(){
    if(!app.intentionalLeave && app.reconnecting) retryFn();
  }, 2500));
}
function showReconnectBanner(){
  if(els.reconnectBanner) els.reconnectBanner.classList.remove('hidden');
}
function hideReconnectBanner(){
  if(els.reconnectBanner) els.reconnectBanner.classList.add('hidden');
}
// A quick foreground check: if the tab was suspended, 'close'/'disconnected' events can
// be delayed or missed entirely - re-check the connection the instant the user comes back.
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'visible') return;
  unlockAudio(); // proactively resume audio too - don't wait for another tap/click
  if(app.intentionalLeave) return;
  if(!app.isHost && app.myName){
    var alive = app.hostConn && app.hostConn.open;
    if(!alive) handlePlayerConnectionLost();
  } else if(app.isHost && app.game){
    var peerAlive = app.peer && !app.peer.destroyed && !app.peer.disconnected;
    if(!peerAlive) handleHostConnectionLost();
  }
});

// ===================== HOST: MESSAGE HANDLING =====================
// Protocol note: every message carries `senderId` = the sending device's own player id
// (set automatically by sendToHost). Fields named `playerId` inside a message body are
// ALWAYS an explicit TARGET id (e.g. which player's score to adjust) chosen by the leader,
// never the sender. This separation fixes leader controls acting on the wrong player.
function hostHandleMessage(msg, conn){
  if(msg.t === 'time-sync'){
    // Answered immediately and independent of game state / conn.playerId, so it stays
    // accurate even before a player has fully joined.
    if(conn && conn.send) conn.send({t:'time-sync-reply', clientSentAt: msg.clientSentAt, hostNow: Date.now()});
    return;
  }
  var g = app.game;
  if(!g) return;
  if(msg.t === 'join'){
    hostAddOrReconnectPlayer(msg.name, conn, msg.priorId);
  } else if(msg.t === 'leave'){
    hostRemovePlayer(msg.senderId);
  } else if(msg.t === 'ready-toggle'){
    hostToggleReady(msg.senderId);
  } else if(msg.t === 'adjust-score'){
    if(msg.senderId === g.leaderId) hostAdjustScore(msg.playerId, msg.delta);
  } else if(msg.t === 'reset-score'){
    if(msg.senderId === g.leaderId) hostResetScore(msg.playerId);
  } else if(msg.t === 'reset-all-scores'){
    if(msg.senderId === g.leaderId && g.phase === 'lobby') hostResetAllScores();
  } else if(msg.t === 'transfer-leader'){
    if(msg.senderId === g.leaderId && g.players.some(function(p){return p.id===msg.playerId;})){
      g.leaderId = msg.playerId;
      broadcastState();
    }
  } else if(msg.t === 'kick-player'){
    if(msg.senderId === g.leaderId) hostKickPlayer(msg.playerId);
  } else if(msg.t === 'set-theme'){
    if(msg.senderId === g.leaderId && Number.isInteger(msg.theme) && msg.theme>=0 && msg.theme<THEME_COUNT){
      g.theme = msg.theme;
      broadcastState();
    }
  } else if(msg.t === 'update-lobby-settings'){
    // fix #7: mirrors the leader's in-progress choices (games/rounds/bomb/flags config)
    // to everyone's screen live, before they even press a "start" button.
    if(msg.senderId === g.leaderId && msg.settings && g.phase==='lobby'){
      g.lobbySettings = g.lobbySettings || {};
      Object.keys(msg.settings).forEach(function(k){ g.lobbySettings[k] = msg.settings[k]; });
      broadcastState();
    }
  } else if(msg.t === 'start-quick'){
    hostTryStartQuick(msg.senderId, msg.roundCount, msg.selectedGames, conn);
  } else if(msg.t === 'start-bomb'){
    hostTryStartBomb(msg.senderId, msg.cols, msg.scoringMode, msg.roundsTotal, conn);
  } else if(msg.t === 'start-flags'){
    hostTryStartFlags(msg.senderId, msg.roundsTotal, conn);
  } else if(msg.t === 'submit-answer'){
    hostReceiveAnswer(msg.senderId, msg.value);
  } else if(msg.t === 'flags-answer'){
    hostReceiveFlagsAnswer(msg.senderId, msg.value);
  } else if(msg.t === 'bomb-choose'){
    hostBombChoose(msg.senderId, msg.row);
  } else if(msg.t === 'next-round'){
    if(msg.senderId === g.leaderId) hostBeginNextQuickRound();
  } else if(msg.t === 'flags-next-round'){
    if(msg.senderId === g.leaderId) hostAdvanceFlags();
  } else if(msg.t === 'start-inter'){
    hostTryStartInter(msg.senderId, msg, conn);
  } else if(msg.t === 'inter-score'){
    hostInterScore(msg.senderId, msg);
  } else if(msg.t === 'puzzle-done'){
    hostPuzzleDone(msg.senderId, msg, conn);
  } else if(msg.t === 'puzzle-prog'){
    hostPuzzleProg(msg.senderId, msg);
  } else if(msg.t === 'gift-score'){
    hostGiftScore(msg.senderId, msg);
  } else if(msg.t === 'gift-need'){
    hostGiftNeed(msg.senderId, msg, conn);
  } else if(msg.t === 'crash-in'){
    hostCrashInput(msg.senderId, msg);
  } else if(msg.t === 'crash-fire'){
    hostCrashFire(msg.senderId, msg);
  } else if(msg.t === 'fall-pick'){
    hostFallPick(msg.senderId, msg);
  } else if(msg.t === 'elec-done'){
    hostElecDone(msg.senderId, msg, conn);
  } else if(msg.t === 'dice-throw' || msg.t === 'dice-fix'){
    hostDiceMsg(msg.senderId, msg, conn);
  } else if(msg.t === 'memo-submit'){
    hostMemoSubmit(msg.senderId, msg, conn);
  } else if(msg.t === 'keys-pick'){
    hostKeysPick(msg.senderId, msg);
  } else if(msg.t === 'cv-pos'){
    hostCvPos(msg.senderId, msg);
  } else if(msg.t === 'cv-drop'){
    hostCvDrop(msg.senderId, msg);
  } else if(msg.t === 'inter-pick'){
    hostInterPick(msg.senderId, msg.key);
  } else if(msg.t === 'inter-mood'){
    hostInterMood(msg.senderId, msg);
  } else if(msg.t === 'inter-next'){
    if(msg.senderId === g.leaderId) hostInterNext();
  } else if(msg.t === 'start-words'){
    hostTryStartWords(msg.senderId, msg, conn);
  } else if(msg.t === 'words-unknown'){
    hostWordsUnknown(msg.senderId, msg);
  } else if(msg.t === 'words-guess'){
    hostReceiveWordsGuess(msg.senderId, msg.guess, msg.idx, conn);
  } else if(msg.t === 'words-giveup'){
    hostWordsGiveUp(msg.senderId);
  } else if(msg.t === 'words-next-round'){
    if(msg.senderId === g.leaderId) hostAdvanceWords();
  } else if(msg.t === 'bomb-next-round'){
    if(msg.senderId === g.leaderId) hostBeginBombRound();
  } else if(msg.t === 'back-to-lobby'){
    if(msg.senderId === g.leaderId) hostBackToLobby();
  } else if(msg.t === 'victory-audio-chunk'){
    hostRelayVictoryAudioChunk(msg.senderId, msg, conn);
  } else if(msg.t === 'rename'){
    hostRenamePlayer(msg.senderId, msg.name, conn);
  } else if(msg.t === 'send-emoji'){
    hostReceiveEmoji(msg.senderId, msg.emoji);
  }
}

function findPlayer(id){
  return app.game.players.filter(function(p){ return p.id===id; })[0];
}
function allPlayersReady(g){
  // fix: a disconnected player (who hasn't been kicked or reconnected yet) should never
  // block the leader from starting a game - only currently-connected players must be ready.
  var connected = g.players.filter(function(p){ return p.connected!==false; });
  return connected.length>0 && connected.every(function(p){ return p.ready; });
}

function hostTryStartQuick(senderId, roundCount, selectedGames, conn){
  var g = app.game;
  if(senderId !== g.leaderId) return;
  if(!allPlayersReady(g)){ if(conn && conn.send) conn.send({t:'notice', text:'لازم كل اللاعبين يضغطون استعداد أولاً'}); return; }
  hostStartQuickGames(roundCount, selectedGames);
}
function hostTryStartBomb(senderId, cols, scoringMode, roundsTotal, conn){
  var g = app.game;
  if(senderId !== g.leaderId) return;
  if(!allPlayersReady(g)){ if(conn && conn.send) conn.send({t:'notice', text:'لازم كل اللاعبين يضغطون استعداد أولاً'}); return; }
  hostStartBombGame(cols, scoringMode, roundsTotal);
}

function reconnectExistingPlayer(existing, conn){
  var g = app.game;
  // A stale old connection object for this same player might still be sitting in the
  // list (host hasn't detected its death yet) - drop it so we don't keep two.
  app.connections = app.connections.filter(function(c){
    if(c.playerId === existing.id && c !== conn){ try{ c.close(); }catch(e){} return false; }
    return true;
  });
  existing.connected = true;
  existing.disconnectedAt = null;
  conn.playerId = existing.id;
  conn.send({t:'welcome', myId:existing.id, code:g.code});
  broadcastState();
}
// fix #2: a player still counts as "expected to answer" for a few seconds after a
// disconnect is first detected, not just while connected===true - this is the SAME grace
// window used everywhere a round-completion check happens, so a brief hiccup can never
// cause the round to end without that player's already-in-flight answer.
var DISCONNECT_GRACE_MS = 5000;
function hostPlayerCountsAsPresent(p){
  if(p.connected) return true;
  return !!(p.disconnectedAt && (Date.now()-p.disconnectedAt) < DISCONNECT_GRACE_MS);
}
function hostAddOrReconnectPlayer(name, conn, priorId){
  var g = app.game;
  // fix: reconnect by the id the client itself remembers first (most reliable - works
  // even if the host hasn't yet noticed the old connection died, so "connected" is still
  // stale-true), falling back to name-matching for a first-time device with no prior id.
  var existing = priorId ? g.players.filter(function(p){ return p.id===priorId; })[0] : null;
  if(existing){
    reconnectExistingPlayer(existing, conn);
    return;
  }
  var byName = g.players.filter(function(p){ return p.name===name; })[0];
  if(byName){
    if(byName.connected){
      name = name + '-' + rand(1,99); // a genuinely different device using the same display name
    } else {
      reconnectExistingPlayer(byName, conn);
      return;
    }
  }
  if(g.phase !== 'lobby'){
    conn.send({t:'game-in-progress'});
    setTimeout(function(){ conn.close(); }, 300);
    return;
  }
  var id = 'p-'+Math.random().toString(36).substring(2,9);
  conn.playerId = id;
  var newPlayer = {id:id, name:name, score:0, connected:true, ready:false};
  g.players.push(newPlayer);
  if(!g.leaderId) g.leaderId = id;
  conn.send({t:'welcome', myId:id, code:g.code});
  broadcastState();
}

function hostRemovePlayer(id){
  var g = app.game;
  var idx = g.players.findIndex(function(p){return p.id===id;});
  if(idx===-1) return;
  g.players.splice(idx,1);
  if(g.leaderId === id){
    g.leaderId = g.players.length ? g.players[0].id : null;
  }
  broadcastState();
  checkAllInAfterDisconnect(); // fix #2: if the last still-pending player just left/was kicked, the round must be able to complete now instead of waiting forever
}

// New: leader can forcibly remove a player (connected or a stale disconnected ghost) -
// their name/score/data is deleted immediately and their connection is closed so they
// don't try to auto-reconnect back in.
function hostKickPlayer(targetId){
  var conn = app.connections.filter(function(c){ return c.playerId===targetId; })[0];
  if(conn){
    try{ conn.send({t:'kicked'}); }catch(e){}
    try{ conn.close(); }catch(e){}
    app.connections = app.connections.filter(function(c){ return c!==conn; });
  }
  hostRemovePlayer(targetId);
}

function hostHandlePlayerDisconnect(conn){
  if(!conn || !conn.playerId) return;
  var p = findPlayer(conn.playerId);
  if(p){
    p.connected = false;
    p.disconnectedAt = Date.now();
    broadcastState();
    // fix #2: a brief WebRTC hiccup (common with several simultaneous connections) can
    // fire a 'close' event even when the player isn't really gone and reconnects a moment
    // later. Previously we treated every disconnect as final immediately and could end a
    // round without ever collecting that player's already-in-flight answer. Now we wait a
    // short grace period before letting a disconnect actually affect round completion -
    // if they reconnect within it, connected flips back to true and nothing happens.
    var pid = p.id;
    addTimer(setTimeout(function(){
      var p2 = findPlayer(pid);
      if(p2 && p2.connected===false) checkAllInAfterDisconnect();
    }, DISCONNECT_GRACE_MS+200));
  }
  app.connections = app.connections.filter(function(c){ return c!==conn; });
}
function checkAllInAfterDisconnect(){
  // fix #2: this only ever handled the quick-games' round-active phase - if a brief
  // disconnect happened during an ACTIVE FLAGS round (very plausible on real phones over
  // real wifi, never seen on a single-computer test), its grace-period recheck did
  // nothing and the round could stay stuck forever waiting on a player who'd already
  // been excluded. Now it re-checks whichever mode is actually active.
  var g = app.game;
  if(!g) return;
  if(g.phase==='round-active' && g.round){
    var presentIds = g.players.filter(hostPlayerCountsAsPresent).map(function(p){return p.id;});
    var allIn = presentIds.length>0 && presentIds.every(function(id){ return !!g.round.submissions[id]; });
    if(allIn) hostFinishQuickRoundCollection();
  } else if(g.phase==='flags-active' && g.flags){
    var presentIds2 = g.players.filter(hostPlayerCountsAsPresent).map(function(p){return p.id;});
    var allIn2 = presentIds2.length>0 && presentIds2.every(function(id){ return !!g.flags.submissions[id]; });
    if(allIn2) hostFinishFlagsRound();
  } else if(g.phase==='words-active' && g.words){
    hostCheckWordsAllIn();
  }
}

function hostRenamePlayer(id, name, conn){
  var g = app.game, p = findPlayer(id);
  if(!p || g.phase !== 'lobby') return;
  name = String(name||'').trim().slice(0, PLAYER_NAME_MAX);
  if(!name || name === p.name) return;
  if(g.players.some(function(o){ return o.id !== id && o.name === name; })){
    if(conn && conn.send) conn.send({t:'notice', text:'هذا الاسم مستخدم من لاعب آخر، اختر اسمًا ثانيًا'});
    return;
  }
  p.name = name;
  if(conn && conn.send) conn.send({t:'renamed', name:name});
  broadcastState();
}
function hostToggleReady(id){
  var p = findPlayer(id);
  if(p){ p.ready = !p.ready; broadcastState(); }
}
function hostAdjustScore(targetId, delta){
  var p = findPlayer(targetId);
  if(p){ p.score = Math.max(0, p.score + delta); broadcastState(); }
}
function hostResetScore(targetId){
  var p = findPlayer(targetId);
  if(p){ p.score = 0; broadcastState(); }
}
function hostResetAllScores(){
  app.game.players.forEach(function(p){ p.score = 0; });
  broadcastState();
}

function broadcastState(){
  var g = app.game;
  var payload = {t:'state', game:g};
  app.connections.forEach(function(c){ if(c.open) c.send(payload); });
  renderAll();
}

// ===================== CLIENT: MESSAGE HANDLING =====================
function clientHandleMessage(msg){
  if(msg.t === 'welcome'){
    app.myPlayerId = msg.myId;
    els.homeStatus.textContent='';
  } else if(msg.t === 'game-in-progress'){
    alert('اللعبة بدأت بالفعل، انتظر حتى تنتهي.');
    resetToHome();
  } else if(msg.t === 'notice'){
    alert(msg.text);
  } else if(msg.t === 'host-closed'){
    alert('قام المضيف بإغلاق الغرفة.');
    resetToHome();
  } else if(msg.t === 'kicked'){
    app.intentionalLeave = true; // don't try to auto-reconnect after being kicked
    alert('تم طردك من الغرفة من قبل القائد.');
    resetToHome();
  } else if(msg.t === 'renamed'){
    app.myName = msg.name;
    var nameInput = document.getElementById('player-name');
    if(nameInput) nameInput.value = msg.name;
  } else if(msg.t === 'puzzle-ack'){
    if(msg.sig === pzp.sig) pzp.acked = true;   // the display has my finished picture
  } else if(msg.t === 'gift-seq'){
    giftSeqStore[msg.sig] = msg.seq;   // my own order of gifts and rocks
  } else if(msg.t === 'elec-ack'){
    if(msg.sig === ec.sig) ec.acked = true;   // the display has my finished board
  } else if(msg.t === 'dice-ack'){
    if(msg.sig === dc.sig) dc.acked = true;   // the display has my dice
  } else if(msg.t === 'memo-ack'){
    if(msg.sig === memoPh.sig) memoPh.acked = true;   // the display has my hawk-eye answer
  } else if(msg.t === 'inter-mood-set'){
    // the display decided my character's mood (e.g. I just got overtaken)
    if(msg.mood === 'angry' || msg.mood === 'happy' || msg.mood === 'sad'){ rc.mood = msg.mood; rc.moodAt = Date.now(); }
  } else if(msg.t === 'char-voice'){
    // the display passed a character's voice to this phone (it was busy with another one)
    if(typeof msg.url === 'string' && msg.url.indexOf(ASSET_BASE) === 0) voicePlayNow(msg.url);
  } else if(msg.t === 'time-sync-reply'){
    applyTimeSyncReply(msg);
  } else if(msg.t === 'victory-audio-chunk-relay'){
    clientHandleVictoryAudioChunk(msg);
  } else if(msg.t === 'victory-audio-ack'){
    clientHandleVictoryAudioAck(msg);
  } else if(msg.t === 'words-guess-ack'){
    clientHandleWordsAck(msg);
    if(app.game) renderAll();
  } else if(msg.t === 'state'){
    app.game = msg.game;
    // fix #3: send the victory clip ONCE per chosen file (not every game start). It's now
    // sent right away (even in the lobby, when the channel is idle) instead of waiting for
    // the game to start - so it has fully arrived long before anyone can win. It is only
    // re-sent if the display never confirmed it, or after a reconnect under a new id.
    // A small random delay spreads out multiple players' sends.
    if(!app.isHost && app.myPlayerId && app.myVictoryAudioBuffer && !app.victoryAudioSent &&
       !(app.victoryAudioAcked && app.victoryAudioAckedFor === app.myPlayerId)){
      app.victoryAudioSent = true;
      addTimer(setTimeout(startVictoryAudioSend, 500 + Math.random()*2000));
    }
    renderAll();
    if(app.game.phase === 'lobby') showScreen('screen-lobby'); else showScreen('screen-game');
  }
}

function sendToHost(obj){
  obj.senderId = app.myPlayerId;
  if(app.isHost){ hostHandleMessage(obj, {senderId:app.myPlayerId, send:function(){}}); }
  else if(app.hostConn && app.hostConn.open) app.hostConn.send(obj);
}

// ===================== LOBBY =====================
els.btnLeaveLobby.addEventListener('click', leaveRoom);

function leaveRoom(){
  if(app.isHost){
    app.connections.forEach(function(c){ if(c.open) c.send({t:'host-closed'}); });
    resetToHome();
  } else {
    if(app.hostConn){ try{ app.hostConn.send({t:'leave', senderId:app.myPlayerId}); }catch(e){} }
    resetToHome();
  }
}

var THEME_COUNT = 8;
var THEME_ORDER = [0,1,2,6,3,4,5,7];   // how the pickers list them (each pink next to its kind)
function applyTheme(idx){
  idx = (Number.isInteger(idx) && idx>=0 && idx<THEME_COUNT) ? idx : 0;
  if(document.body._appliedTheme === idx) return;
  document.body._appliedTheme = idx;
  document.body.className = idx>0 ? ('theme-'+idx) : '';
}
var THEME_SWATCH_COLORS = [
  ['#0f172a','#f5b942'], ['#170f28','#c084fc'], ['#091f1b','#2dd4bf'],
  ['#eaf4ff','#2563eb'], ['#fff4e8','#ea580c'], ['#eafff6','#059669'],
  ['#1f0f18','#ffafcc'], ['#ffc8dd','#db2777']
];
function renderThemePicker(selected){
  if(els.themePicker._built) {
    els.themePicker.querySelectorAll('.theme-swatch').forEach(function(sw){
      sw.classList.toggle('selected', +sw.getAttribute('data-t')===selected);
    });
    return;
  }
  els.themePicker.innerHTML = '';
  THEME_ORDER.forEach(function(i){
    var pair = THEME_SWATCH_COLORS[i];
    var sw = document.createElement('button');
    sw.className = 'theme-swatch' + (i===selected?' selected':'');
    sw.setAttribute('data-t', i);
    sw.style.background = 'linear-gradient(135deg,'+pair[0]+','+pair[1]+')';
    sw.type = 'button';
    sw.addEventListener('click', function(){ sendToHost({t:'set-theme', theme:i}); });
    els.themePicker.appendChild(sw);
  });
  els.themePicker._built = true;
}
// Every phone has its own colour theme (picked in the lobby, remembered on the phone); the
// display follows the leader's choice. Until a player picks one, their phone follows the display.
var MY_THEME_KEY = 'pbg-my-theme-' + THEME_COUNT;
app.myTheme = (function(){ try{ var t = parseInt(localStorage.getItem(MY_THEME_KEY), 10); return (t >= 0 && t < THEME_COUNT) ? t : null; }catch(e){ return null; } })();
function currentTheme(){
  var g = app.game;
  if(app.isHost || app.myTheme == null) return (g && g.theme) || 0;
  return app.myTheme;
}
function themeSwatchStyle(pair){ return typeof themeSwatchBg === 'function' ? themeSwatchBg(pair) : 'linear-gradient(135deg,'+pair[0]+','+pair[1]+')'; }
function renderMyThemePicker(){

// +/− buttons beside every number field in the leader settings: step the value within the
// field's own min/max, then fire 'input' so it syncs exactly like typing a number would.
document.querySelectorAll('.step-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    var input = document.getElementById(btn.getAttribute('data-for'));
    if(!input) return;
    var min = input.min !== '' ? parseFloat(input.min) : -Infinity;
    var max = input.max !== '' ? parseFloat(input.max) : Infinity;
    var cur = parseFloat(input.value);
    if(isNaN(cur)) cur = parseFloat(input.defaultValue) || (isFinite(min) ? min : 0);
    var next = Math.max(min, Math.min(max, Math.round((cur + parseFloat(btn.getAttribute('data-step')))*100)/100));
    input.value = next;
    input.dispatchEvent(new Event('input', {bubbles:true}));
  });
});

var wordsTimerHidden = (function(){ try{ return localStorage.getItem('pbg-words-timer-hidden') === '1'; }catch(e){ return false; } })();
var WC_EYE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.6 12S5.6 4.8 12 4.8 22.4 12 22.4 12 18.4 19.2 12 19.2 1.6 12 1.6 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>';

function wordsClockRender(text, low){
  var bar = els.notifBar;
  if(!bar._wc || !bar.contains(bar._wc.time)){
    bar.textContent = '';
    bar.innerHTML = '<button type="button" class="wc-eye"></button><div class="wc-flip"><div class="wc-card">' +
      '<div class="wc-face wc-front"></div><div class="wc-face wc-back"><span>المؤقت مخفي</span></div></div></div>';
    bar._wc = { btn: bar.querySelector('.wc-eye'), time: bar.querySelector('.wc-front') };
    bar._wc.btn.addEventListener('click', function(e){
      e.stopPropagation();
      wordsTimerHidden = !wordsTimerHidden;
      try{ localStorage.setItem('pbg-words-timer-hidden', wordsTimerHidden ? '1' : '0'); }catch(err){}
      wordsClockApply();
    });
  }
  bar.classList.add('words-clock-bar', 'wc-mode');
  bar.classList.toggle('low', !!low && !wordsTimerHidden);
  if(bar._wc.time.textContent !== text) bar._wc.time.textContent = text;
  wordsClockApply();

function wordsClockApply(){
  var bar = els.notifBar, b = bar._wc && bar._wc.btn;
  bar.classList.toggle('wc-hidden', wordsTimerHidden);
  if(!b) return;
  var icon = wordsTimerHidden ? WC_EYE : WC_EYE_OFF;     // shown: "eye with a line" = hide it
  if(b._icon !== icon){ b.innerHTML = icon; b._icon = icon; b.setAttribute('aria-label', wordsTimerHidden ? 'إظهار المؤقت' : 'إخفاء المؤقت'); }
}

// Accepts audio OR video (the video's audio track is what actually gets played - see
// playCustomOrDefaultVictory/decodeAudioData). Size is capped generously since the
// chunked transfer above is what actually made bigger files safe to send at all.
var VICTORY_AUDIO_MAX_BYTES = 10*1024*1024; // 10MB
// iOS often reports an empty/odd MIME type for files picked from the Files app, so the
// extension is checked too (and used to pick a proper MIME type for playback).
var VICTORY_AUDIO_EXT_MIME = { mp3:'audio/mpeg', m4a:'audio/mp4', aac:'audio/aac', wav:'audio/wav', ogg:'audio/ogg', oga:'audio/ogg', opus:'audio/ogg', flac:'audio/flac', caf:'audio/x-caf', aif:'audio/aiff', aiff:'audio/aiff', mp4:'video/mp4', m4v:'video/mp4', mov:'video/quicktime', webm:'video/webm', '3gp':'video/3gpp' };
function victoryFileError(text){
  els.victoryAudioStatus.textContent = text;
  els.victoryAudioStatus.classList.add('error');
}
els.victoryAudioInput.addEventListener('change', function(){
  var file = els.victoryAudioInput.files && els.victoryAudioInput.files[0];
  els.victoryAudioInput.value = '';
  if(!file) return;
  var ext = (String(file.name||'').split('.').pop() || '').toLowerCase();
  var extMime = VICTORY_AUDIO_EXT_MIME[ext];
  var typeOk = file.type && (file.type.indexOf('audio/') === 0 || file.type.indexOf('video/') === 0);
  if(!typeOk && !extMime){
    victoryFileError('❌ الرجاء اختيار ملف صوت أو فيديو (مثل MP3)');
    return;
  }
  if(file.size > VICTORY_AUDIO_MAX_BYTES){
    victoryFileError('❌ حجم الملف ' + (file.size/1024/1024).toFixed(1) + ' ميجابايت - الحد الأقصى 10 ميجابايت. اختر ملفًا آخر أصغر');
    return;
  }
  els.victoryAudioStatus.classList.remove('error');
  var reader = new FileReader();
  reader.onerror = function(){ victoryFileError('❌ تعذرت قراءة الملف - اختر ملفًا آخر'); };
  reader.onload = function(){
    // double-check the size actually read (some pickers under-report file.size)
    if(!reader.result || reader.result.byteLength > VICTORY_AUDIO_MAX_BYTES){
      victoryFileError('❌ حجم الملف أكبر من 10 ميجابايت - اختر ملفًا آخر أصغر');
      return;
    }
    app.myVictoryAudioBuffer = reader.result;
    app.myVictoryAudioMime = typeOk ? file.type : (extMime || 'audio/mpeg');
    app.myVictoryAudioName = file.name;
    app.victoryAudioAcked = false;
    app.victoryAudioAttempts = 0;
    els.victoryAudioStatus.textContent = '⏳ ' + file.name + ' — جاري الإرسال لشاشة العرض...';
    // send immediately if already connected; otherwise the next 'state' message sends it
    app.victoryAudioSent = false;
    if(app.hostConn && app.hostConn.open && app.myPlayerId){ app.victoryAudioSent = true; startVictoryAudioSend(); }
  };
  reader.readAsArrayBuffer(file);
});

// ===================== SCHEDULING =====================
// fix #5: rounds are grouped into consecutive blocks per game type (one block per
// selected game), distributed as evenly as possible with random extras for the
// remainder, and the ORDER of the blocks themselves is randomized.
function buildSchedule(n, selectedGames){
  var games = (selectedGames && selectedGames.length) ? selectedGames.slice() : QUICK_GAME_KEYS.slice();
  var base = Math.floor(n/games.length), rem = n % games.length;
  var counts = {}; games.forEach(function(k){counts[k]=base;});
  var extra = pickN(games, rem);
  extra.forEach(function(k){ counts[k]++; });
  var blockOrder = shuffle(games);
  var seq = [];
  blockOrder.forEach(function(k){ for(var i=0;i<counts[k];i++) seq.push(k); });
  return seq;
}

// ===================== HOST: QUICK GAMES FLOW =====================
// NOTE (fix #1): a quick round NEVER ends on a timer. It only ends once every
// currently-connected player has submitted an answer. The hidden 11s countdown
// is used exclusively inside computeScore() for the speed bonus.
function hostStartQuickGames(roundCount, selectedGames){
  var g = app.game;
  roundCount = Math.max(1, Math.min(60, roundCount||10));
  var games = (selectedGames && selectedGames.length) ? selectedGames.filter(function(k){ return QUICK_GAME_KEYS.indexOf(k)>-1; }) : QUICK_GAME_KEYS.slice();
  if(!games.length) games = QUICK_GAME_KEYS.slice();
  g.mode = 'quick';
  g.schedule = buildSchedule(roundCount, games);
  g.quickGames = games.slice();
  g.scheduleIndex = 0;
  g.totalRounds = g.schedule.length;
  g.round = null;
  hostBeginNextQuickRound();
}

function hostBeginNextQuickRound(){
  var g = app.game;
  if(!g || g.mode!=='quick') return;
  if(g.scheduleIndex >= g.schedule.length && hostTopTied(g)){
    var pool = (g.quickGames && g.quickGames.length) ? g.quickGames : QUICK_GAME_KEYS;
    g.schedule.push(pool[rand(0, pool.length-1)]);
    g.totalRounds = g.schedule.length;
    g.tiebreak = (g.tiebreak || 0) + 1;
  }
  if(g.scheduleIndex >= g.schedule.length){
    var sorted = g.players.slice().sort(function(a,b){ return b.score-a.score; });
    g.winnerId = sorted.length ? sorted[0].id : null;
    g.celebration = { bursts:[], sessionId: Math.random().toString(36).substring(2,9) };
    g.phase = 'quick-finished';
    g.round = null;
    broadcastState();
    return;
  }
  var key = g.schedule[g.scheduleIndex];
  g.scheduleIndex++;
  g.round = { key:key, slotNumber:g.scheduleIndex, totalSlots:g.schedule.length,
    nextKey: (g.scheduleIndex < g.schedule.length) ? g.schedule[g.scheduleIndex] : null };
  startQuickRoundPhaseReady();
}

function startQuickRoundPhaseReady(){
  var g = app.game;
  g.phase = 'round-ready';
  g.round.readyStartAt = syncedNow()+300;
  g.round.data = null; g.round.submissions = {}; g.round.results = null;
  broadcastState();
  addTimer(setTimeout(function(){ startQuickRoundActive(); }, 3300));
}

function startQuickRoundActive(){
  var g = app.game;
  var mod = GAME_MODULES[g.round.key];
  g.round.data = mod.generate(g.players);
  g.phase = 'round-active';
  g.round.activeStartAt = syncedNow()+250;
  g.round.questionPostedAt = g.round.activeStartAt + mod.unlockAt(g.round.data);
  broadcastState();
  // No forced end-of-round timer anymore: we simply wait for all connected
  // players to submit (see hostReceiveAnswer / checkAllInAfterDisconnect).
}

function hostReceiveAnswer(playerId, value){
  var g = app.game;
  if(!g.round || g.phase!=='round-active') return;
  if(g.round.submissions[playerId]) return;
  g.round.submissions[playerId] = {value:value, t:syncedNow()};
  broadcastState();
  // fix #2: use the SAME grace-period-aware presence check as checkAllInAfterDisconnect,
  // so a player mid-reconnect (briefly connected:false) still counts as expected to
  // answer instead of letting the round finish without them.
  var presentIds = g.players.filter(hostPlayerCountsAsPresent).map(function(p){return p.id;});
  var allIn = presentIds.length>0 && presentIds.every(function(id){ return !!g.round.submissions[id]; });
  if(allIn){ hostFinishQuickRoundCollection(); }
}

function hostFinishQuickRoundCollection(){
  var g = app.game;
  if(!g.round || g.phase!=='round-active') return;
  var mod = GAME_MODULES[g.round.key];
  var results = mod.evaluate(g.round.data, g.round.submissions, g.players, g.round.questionPostedAt);
  g.round.results = results;
  g.round.revealStartAt = syncedNow()+150;
  results.perPlayer && Object.keys(results.perPlayer).forEach(function(pid){
    var p = findPlayer(pid);
    if(p) p.score += results.perPlayer[pid].score;
  });
  g.phase = 'round-reveal';
  broadcastState();
  // Fix #3: no auto-advance. We wait for the leader to press "next round".
}

// ===================== HOST: BACK TO LOBBY =====================
// Tie for 1st place at the end (among the players still connected)? Then the game is not
// over yet: one more round. g.tiebreak marks it (shown next to the game's name).
function hostTopTied(g){
  var ps = g.players.filter(function(p){ return p.connected !== false; });
  if(ps.length < 2) return false;
  var top = Math.max.apply(null, ps.map(function(p){ return p.score; }));
  return ps.filter(function(p){ return p.score === top; }).length > 1;
}

  g.inter=null; g.interConfig=null;
  g.winnerId=null; g.celebration=null; g.tiebreak=0;

  broadcastState();
}

// fix #4/#1: relay a player's uploaded victory clip to every device once, out-of-band
// from the regular reactive state broadcast (this data must never ride along with `g`) -
// now reassembled from small chunks and re-streamed to everyone chunk-by-chunk as they
// arrive, rather than waiting for (and re-sending) one giant message.
var incomingVictoryTransfersHost = {};
function hostRelayVictoryAudioChunk(senderId, msg, conn){
  // fix: no longer relayed to the other players' phones - only this display device ever
  // plays victory music, and the relay was just flooding everyone's connection.
  if(!senderId) return;
  var key = senderId+'|'+msg.transferId;
  reassembleVictoryChunk(incomingVictoryTransfersHost, key, msg, function(full, mime){
    // drop any other half-finished transfers from this same player
    Object.keys(incomingVictoryTransfersHost).forEach(function(k){ if(k.indexOf(senderId+'|')===0) delete incomingVictoryTransfersHost[k]; });
    var buf;
    try{ buf = base64ToArrayBuffer(full); }catch(e){ return; } // corrupt - player will retry (no ack)
    prepareVictoryClip(senderId, buf, mime, function(ok){
      try{ if(conn && conn.open) conn.send({t:'victory-audio-ack', transferId:msg.transferId, ok:ok}); }catch(e){}
    });
  });
}
// fix #4: only the crowned winner may fire celebration emoji, rate-limited to 1/second.
function hostReceiveEmoji(senderId, emoji){
  var g = app.game;
  if(!g.celebration || senderId !== g.winnerId) return;
  if(CELEBRATION_EMOJIS.indexOf(emoji) === -1) return;
  var now = syncedNow();
  if(g.celebration.lastEmojiAt && now - g.celebration.lastEmojiAt < 200) return;
  g.celebration.lastEmojiAt = now;
  g.celebration.bursts = g.celebration.bursts.filter(function(b){ return now - b.spawnedAt < 8000; });
  g.celebration.bursts.push({ id: Math.random().toString(36).substring(2,9), emoji:emoji, spawnedAt: now });
  broadcastState();
}

// Build a container's contents only once per unique `key`; returns true if it actually
// (re)built. Prevents tearing out interactive elements on every animation tick, which
// was causing taps to sometimes require 2-3 presses (fix #4).
function buildOnce(container, key, buildFn){
  if(container._builtKey === key) return false;
  buildFn();
  container._builtKey = key;

}

function clearArenaSlots(){
  var old = els.arenaWrap.querySelectorAll('.player-slot');
  old.forEach(function(n){ n.remove(); });
}

// Per-player reveal-animation bookkeeping (which tick count we last played a sound for,
// whether the final correct/wrong sound already fired) - keyed by round-signature+playerId
// so it naturally resets on every new round.
var slotRevealAudio = {};
function slotAudioState(round, p){
  var key = roundSignature(round)+'|'+p.id;
  var st = slotRevealAudio[key];
  if(!st){ st = {lastCount:-1, done:false}; slotRevealAudio[key] = st; }
  return st;
}
// fix #2: counting-type games reveal ONE PLAYER AT A TIME (in player-list order) - each
// player's counter runs from 1 up to their own answer before the next player's starts.
var slotSeqCache = { sig:null, offsets:null };
function getSlotSequenceOffsets(round, players){
  var sig = roundSignature(round);
  if(slotSeqCache.sig === sig) return slotSeqCache.offsets;
  var offsets = {}; var cum = 0;
  players.forEach(function(p){
    var sub = round.submissions[p.id];
    var value = sub ? Math.max(0, parseInt(sub.value,10)||0) : 0;
    offsets[p.id] = cum;
    cum += (sub ? countDurationMs(value) : 0) + 500; // 0.5s pause before the next player starts
  });
  slotSeqCache = { sig:sig, offsets:offsets };
  return offsets;
}
// fix #5: how long the DISPLAY takes to finish showing every player's result, so each
// player's own device can hold back their personal correct/wrong message until after
// that - otherwise everyone learns their own result before the big screen catches up,
// which kills the suspense.
function computeRevealTotalDuration(round, players){
  var mod = GAME_MODULES[round.key];
  if(mod.inputType === 'counter'){
    var extraDelay = mod.revealDelayMs ? mod.revealDelayMs(round.data) : 0;
    var offsets = getSlotSequenceOffsets(round, players);
    var maxEnd = 0;
    players.forEach(function(p){
      var sub = round.submissions[p.id];
      var value = sub ? Math.max(0, parseInt(sub.value,10)||0) : 0;
      var end = (offsets[p.id]||0) + (sub ? countDurationMs(value) : 0);
      if(end > maxEnd) maxEnd = end;
    });
    return extraDelay + maxEnd + 400;
  }
  return Math.max(0, players.length-1)*1000 + 1400;
}
function counterStatusHTML(p, round, extraDelay, myOffset){
  var st = slotAudioState(round, p);
  var sub = round.submissions[p.id];
  if(!sub) return { circle:'<div class="status-circle"></div>', count:'' };
  var value = Math.max(0, parseInt(sub.value,10) || 0);
  var elapsed = syncedNow() - (round.revealStartAt||syncedNow()) - (extraDelay||0) - (myOffset||0);
  if(elapsed < 0) return { circle:'<div class="status-circle gold"></div>', count:'' }; // waiting for their turn
  var count = acceleratingCount(elapsed, value);
  if(count < value){
    if(count > st.lastCount){ st.lastCount = count; if(count>0) playTick(count); }
    // fix #2: the running number lives OUTSIDE the circle so it doesn't get wiped out
    // when the circle switches to the final check/cross mark.
    return { circle:'<div class="status-circle gold"></div>', count:String(count) };
  }
  if(st.lastCount < value) st.lastCount = value;
  var res = round.results.perPlayer[p.id];
  var correct = !!(res && res.correct);
  if(!st.done){ st.done = true; playSound(correct ? 'correct' : 'wrong'); }
  return { circle:'<div class="status-circle '+(correct?'correct':'wrong')+'">'+(correct?'✔':'✖')+'</div>', count:String(value) };
}
function renderPlayerSlots(){
  clearArenaSlots();
  var g = app.game;
  var players = g.players;
  var mod = g.round ? GAME_MODULES[g.round.key] : null;
  var isCounterGame = !!(mod && mod.inputType === 'counter');
  var seqOffsets = (g.round && g.round.results && isCounterGame) ? getSlotSequenceOffsets(g.round, players) : null;
  players.forEach(function(p, idx){
    var slotNum = SLOT_ORDER[idx % 12];
    var pos = SLOT_POS[slotNum];
    var div = document.createElement('div');
    div.className = 'player-slot';
    Object.keys(pos).forEach(function(k){ div.style[k] = pos[k]; });
    var circleHTML, countHTML = '';
    if(g.round && g.round.results){
      if(isCounterGame){
        var extraDelay = mod.revealDelayMs ? mod.revealDelayMs(g.round.data) : 0;
        var res2 = counterStatusHTML(p, g.round, extraDelay, seqOffsets[p.id]);
        circleHTML = res2.circle;
        countHTML = '<div class="count-label">'+res2.count+'</div>';
      } else {
        // fix #3: find-number / remember-path now also play correct/wrong sound on reveal.
        var revealElapsed = syncedNow() - (g.round.revealStartAt||0);
        var myDelay = idx*1000; // 1 second between each player's reveal
        var statusClass = '';
        if(revealElapsed >= myDelay){
          var r = g.round.results.perPlayer[p.id];
          statusClass = r ? (r.correct ? 'correct':'wrong') : '';
          var st2 = slotAudioState(g.round, p);
          if(!st2.done && statusClass){ st2.done = true; playSound(statusClass==='correct' ? 'correct' : 'wrong'); }
        } else {
          statusClass = g.round.submissions && g.round.submissions[p.id] ? 'gold' : '';
        }
        circleHTML = '<div class="status-circle '+statusClass+'">'+(statusClass==='correct'?'✔':statusClass==='wrong'?'✖':'')+'</div>';
      }
    } else if(g.round && g.round.submissions && g.round.submissions[p.id]){
      circleHTML = '<div class="status-circle gold"></div>';
    } else {
      circleHTML = '<div class="status-circle"></div>';
    }
    div.innerHTML = circleHTML + countHTML +
      '<div class="pname">'+escapeHtml(p.name)+'</div>'+
      '<div class="pscore">'+fmtScore(p.score)+'</div>';
    els.arenaWrap.appendChild(div);

  });
}

function flagsSignature(flags){ return 'flags|'+flags.roundNumber+'|'+flags.readyStartAt; }
function computeFlagsRevealTotalDuration(players){ return Math.max(0, players.length-1)*1000 + 1400; }
function renderPlayerSlotsFlags(){

    var circleHTML;
    if(g.flags && g.flags.results){
      var revealElapsed = syncedNow() - (g.flags.revealStartAt||0);
      var myDelay = idx*1000; // same 1-second stagger as the other grid/sequence games
      var statusClass = '';
      if(revealElapsed >= myDelay){

      } else {

var flagMoveSoundTracker = { sig:null, lastIdx:-1 };
function checkFlagMoveSound(g, elapsed){
  // Display-only, exactly like Appear.mp3 elsewhere - never plays on a player's phone.
  var sig = flagsSignature(g.flags);
  if(flagMoveSoundTracker.sig !== sig){ flagMoveSoundTracker = {sig:sig, lastIdx:-1}; }
  var idx = Math.floor(elapsed/1000);
  if(idx > flagMoveSoundTracker.lastIdx && idx < g.flags.sequence.length){
    flagMoveSoundTracker.lastIdx = idx;
    var dir = g.flags.sequence[idx];
    playSound((dir==='left'||dir==='right') ? 'flag-lr' : 'flag-ud');
  }
}
// fix: the correct-sequence icons should use as much of the available screen as
// possible - bigger when there are few moves and more room, smaller once there are many
// moves to fit. sizeMode 'display' targets the big shared screen; 'player' keeps a more
// modest, wrap-friendly size for the phone's own comparison row.
function computeFlagsSeqItemSize(count, sizeMode){
  if(sizeMode === 'player'){
    var availWp = Math.min(window.innerWidth*0.9, 500);
    var perRowp = Math.min(count, 6);
    return Math.floor(Math.min(60, Math.max(30, availWp/perRowp - 10)));
  }
  var availW = Math.min(window.innerWidth*0.88, 1600);
  var availH = Math.min(window.innerHeight*0.5, 600);
  var gap = 12;
  var perItemByWidth = (availW - gap*Math.max(0,count-1)) / count;
  return Math.floor(Math.max(40, Math.min(200, perItemByWidth, availH)));
}
function buildFlagsSeqRow(container, sequence, myValue, sizeMode){
  container.innerHTML = '';
  var row = document.createElement('div');
  row.className = 'flags-seq-row';
  var prefix = flagImageColorPrefix(currentTheme());
  var size = computeFlagsSeqItemSize(sequence.length, sizeMode);
  sequence.forEach(function(dir, i){
    var item = document.createElement('div');
    item.className = 'flags-seq-item';
    item.style.width = size+'px';
    item.style.height = size+'px';
    var img = document.createElement('img');
    img.src = FLAG_IMG_URLS[prefix][dir];
    img.style.cssText = 'max-width:100%;max-height:100%;';
    item.appendChild(img);
    if(myValue){
      var mine = myValue[i];
      if(mine!=null){
        item.classList.add('my-pick');
        var badge = document.createElement('div');
        badge.className = 'my-pick-badge' + (mine===dir ? ' good' : '');
        badge.textContent = mine===dir ? '✔' : '✖';
        var bsize = Math.max(14, Math.round(size*0.4));
        badge.style.width = bsize+'px';
        badge.style.height = bsize+'px';
        badge.style.fontSize = Math.max(9, Math.round(bsize*0.55))+'px';
        item.appendChild(badge);
      }
    }
    row.appendChild(item);
  });
  container.appendChild(row);
}

var CELEBRATION_EMOJIS = ['🎉','✨','😂','😎','😘','😝','🤑','🤪','🥳','🤫','🥇','🔥','💖','😏','😈','🤏','✌️','👑','🎶','🥴','✅'];

var CONFETTI_COLORS = ['#f5b942','#22c55e','#ef4444','#60a5fa','#c084fc','#2dd4bf','#fb923c'];

function spawnConfettiPiece(layer){

  var cx = 12 + Math.random()*76, cy = 10 + Math.random()*42;

  for(var i=0;i<12;i++){

    particle.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');

function renderEmojiBursts(g){
  var layer = document.getElementById('winner-burst-layer');
  if(!layer || !g.celebration) return;
  var now = syncedNow();
  var lifetime = 6000;
  g.celebration.bursts.forEach(function(burst){
    var age = now - burst.spawnedAt;
    if(age < -500 || age > lifetime) return;
    if(winnerScreenState.renderedBurstIds[burst.id]) return;
    winnerScreenState.renderedBurstIds[burst.id] = true;
    for(var i=0;i<15;i++){
      var rnd = mulberry32(hashStr(burst.id+'-'+i));
      var span = document.createElement('span');
      span.className = 'emoji-burst-item';
      span.textContent = burst.emoji;
      span._spawnedAt = burst.spawnedAt;
      span._x = 5 + rnd()*88;
      span._delay = rnd()*1000;
      span._drift = (rnd()-0.5)*10;
      span._phase = rnd()*6.28;
      layer.appendChild(span);
    }
  });
  Array.prototype.slice.call(layer.children).forEach(function(span){
    var age = now - span._spawnedAt - span._delay;
    if(age < 0){ span.style.opacity = '0'; return; }
    if(age > lifetime){ span.remove(); return; }
    var progress = age/lifetime;
    var y = 108 - progress*126;
    var x = span._x + Math.sin(progress*6+span._phase)*span._drift;
    span.style.left = x+'%';
    span.style.top = y+'%';
    span.style.opacity = String(0.72 * (progress<0.85 ? 1 : Math.max(0,(1-(progress-0.85)/0.15))));
  });
}

// ===================== SCORING =====================
// Shared accelerating count-up model used by every reveal counter (cube check-off and
// per-player answer counters): starts at 10 counts/sec, speeds up by +5/sec every second.
// count(t) = 10t + 2.5t^2  (integral of rate(t) = 10 + 5t)
function acceleratingCount(elapsedMs, maxValue){
  var t = Math.max(0, elapsedMs/1000);
  var raw = 10*t + 2.5*t*t;
  return Math.max(0, Math.min(maxValue, Math.floor(raw)));
}
// Inverse: how long (ms) it takes the accelerating counter to reach `value`.
function countDurationMs(value){
  value = Math.max(0, value||0);
  if(value<=0) return 150;
  var t = (-10 + Math.sqrt(100 + 10*value)) / 5;
  return Math.max(150, t*1000);
}
function computeScore(correct, submittedAt, questionPostedAt, rankAmongCorrect, numPlayers){
  if(!correct) return 0;
  var elapsedSec = Math.max(0,(submittedAt - questionPostedAt)/1000);
  var remaining = 11 - elapsedSec;
  var bonusPct = Math.max(0, Math.min(1, remaining/10));
  var x = 10;
  var bonus = bonusPct*2*x;
  var n = numPlayers - (rankAmongCorrect-1);
  var placement = n*(x/10);
  return x + bonus + placement;
}
function genericEvaluate(isCorrectFn, data, submissions, players, questionPostedAt){
  var order = Object.keys(submissions)
    .filter(function(pid){ return isCorrectFn(data, submissions[pid].value); })
    .sort(function(a,b){ return submissions[a].t - submissions[b].t; });
  var perPlayer = {};
  var numPlayers = players.length;
  Object.keys(submissions).forEach(function(pid){
    var correct = isCorrectFn(data, submissions[pid].value);
    var rank = order.indexOf(pid)+1;
    var score = correct ? computeScore(true, submissions[pid].t, questionPostedAt, rank, numPlayers) : 0;
    perPlayer[pid] = {correct:correct, score:score};
  });
  players.forEach(function(p){ if(!perPlayer[p.id]) perPlayer[p.id] = {correct:false, score:0}; });
  return {perPlayer:perPlayer};
}
function idxToRC(i){ return {row:Math.floor(i/5), col:i%5}; }

// fix #4: play Appear.mp3 exactly once each time a new number / new red-square batch
// shows up. Keyed by round-signature so it resets automatically every round; each device
// (host display OR a player's phone) only ever runs ONE of the two call sites below, so a
// single shared tracker per game is safe.
var appearTrackers = {};
function checkAppear(trackerKey, round, currentCount){
  var sig = roundSignature(round);
  var st = appearTrackers[trackerKey];
  if(!st || st.sig!==sig){ st = {sig:sig, last:-1}; appearTrackers[trackerKey]=st; }
  if(currentCount > st.last){
    st.last = currentCount;
    playSound('appear');
  }
}
// fix: pick numbers that are spread out (no obvious decade/pattern trick for players to
// exploit like before) but still genuinely random - reject candidates that land too close
// to an already-picked number, falling back to plain unique random if that ever fails.
function pickSpreadNumbers(count, min, max, minGap){
  for(var attempt=0; attempt<300; attempt++){
    var picked = [];
    var candidates = shuffle(range(min,max));
    for(var i=0; i<candidates.length && picked.length<count; i++){
      var c = candidates[i];
      if(picked.every(function(n){ return Math.abs(n-c) >= minGap; })) picked.push(c);
    }
    if(picked.length === count) return picked;
  }
  return pickN(range(min,max), count);
}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

// ===================== GAME 3: remember-path =====================
function generatePath(){
  for(var attempt=0; attempt<60; attempt++){
    var targetLen = rand(9,18);
    var start = rand(0,24);
    var path = [start];
    var visited = {}; visited[start]=true;
    var ok = true;
    while(path.length < targetLen){
      var cur = path[path.length-1];
      var rc = idxToRC(cur);
      var neighbors = [];
      [[0,1],[0,-1],[1,0],[-1,0]].forEach(function(d){
        var nr=rc.row+d[0], nc=rc.col+d[1];
        if(nr>=0&&nr<5&&nc>=0&&nc<5){
          var ni = nr*5+nc;
          if(!visited[ni]) neighbors.push(ni);
        }
      });
      if(!neighbors.length){ ok=false; break; }
      var next = neighbors[rand(0,neighbors.length-1)];
      path.push(next); visited[next]=true;
    }
    if(ok && path.length>=9) return path;
  }
  return [0,1,2,3,4,9,14,19,24];
}

    buildOnce(container, sig, function(){
