<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060818">
<title>ألعاب العقل 🧠</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PARTY BRAIN GAMES — "LUXE" VISUAL THEME
   Pure presentation layer: every class/id used by the game logic is kept.
   ===================================================================== */

/* ---------- Theme tokens ----------
   6 selectable themes (index = same as before so the per-theme D-pad / flag artwork still
   matches): 0-2 dark, 3-5 light. Every rule below only reads these variables. */
:root, body{
  /* 0 — ملكي ذهبي (Royal Night) */
  --bg:#060818; --bg2:#141a45; --bg-rgb:6,8,24;
  --panel:#12173a; --panel-rgb:18,23,58; --panel2:#0a0e28;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.16);
  --gold:#f8c84a; --gold2:#e0891c; --gold3:#fff0b3; --glow:248,200,74;
  --aura-b:rgba(110,86,255,.34); --aura-c:rgba(255,72,140,.20);
  --on-gold:#211503;
  --text:#f4f6ff; --sub:#9aa3c7;
  --green:#2fe39a; --red:#ff4d6d; --blue:#4f8cff;
  --shadow:rgba(0,0,0,.55); --hl:rgba(255,255,255,.08); --dots:rgba(255,255,255,.055);
  --cell-a:#1a2150; --cell-b:#0e1334;
}
/* 1 — بنفسجي ملكي (Amethyst) */
body.theme-1{
  --bg:#0b0519; --bg2:#2a0d4d; --bg-rgb:11,5,25;
  --panel:#1d1038; --panel-rgb:29,16,56; --panel2:#120823;
  --gold:#c98bff; --gold2:#7b2cf0; --gold3:#f1ddff; --glow:201,139,255;
  --aura-b:rgba(255,80,170,.30); --aura-c:rgba(80,120,255,.24);
  --on-gold:#ffffff;
  --text:#f7f0ff; --sub:#bfaee3;
  --cell-a:#271548; --cell-b:#150a2b;
}
/* 2 — زمردي (Emerald) */
body.theme-2{
  --bg:#02110d; --bg2:#073a31; --bg-rgb:2,17,13;
  --panel:#0b2923; --panel-rgb:11,41,35; --panel2:#061a16;
  --gold:#3ff0cd; --gold2:#0e9e88; --gold3:#d4fff5; --glow:63,240,205;
  --aura-b:rgba(60,160,255,.24); --aura-c:rgba(190,245,110,.16);
  --on-gold:#032019;
  --text:#e9fffa; --sub:#86d8c8;
  --cell-a:#0f3530; --cell-b:#07201b;
}
/* 3 — سماوي لؤلؤي (Pearl Sky, light) */
body.theme-3{
  --bg:#eef3ff; --bg2:#d5e3ff; --bg-rgb:238,243,255;
  --panel:#ffffff; --panel-rgb:255,255,255; --panel2:#e7efff;
  --border:rgba(37,80,200,.14); --border-strong:rgba(37,80,200,.22);
  --gold:#2f6bff; --gold2:#1c3fd0; --gold3:#9dc0ff; --glow:47,107,255;
  --aura-b:rgba(140,92,246,.22); --aura-c:rgba(6,182,212,.20);
  --on-gold:#ffffff;
  --text:#0b1533; --sub:#5a6a8e;
  --shadow:rgba(30,50,120,.18); --hl:rgba(255,255,255,.9); --dots:rgba(20,40,120,.07);
  --cell-a:#ffffff; --cell-b:#e4ecff;
}
/* 4 — غروب شمباني (Champagne Sunset, light) */
body.theme-4{
  --bg:#fff6ee; --bg2:#ffdfc4; --bg-rgb:255,246,238;
  --panel:#ffffff; --panel-rgb:255,255,255; --panel2:#fff0e3;
  --border:rgba(200,80,10,.15); --border-strong:rgba(200,80,10,.24);
  --gold:#ff6b1f; --gold2:#d4400a; --gold3:#ffc59a; --glow:255,107,31;
  --aura-b:rgba(255,61,127,.20); --aura-c:rgba(255,194,51,.26);
  --on-gold:#ffffff;
  --text:#2e190a; --sub:#8a6446;
  --shadow:rgba(120,50,10,.16); --hl:rgba(255,255,255,.9); --dots:rgba(120,50,10,.07);
  --cell-a:#ffffff; --cell-b:#ffeede;
}
/* 5 — نعناعي (Fresh Mint, light) */
body.theme-5{
  --bg:#ecfff6; --bg2:#c9f5e1; --bg-rgb:236,255,246;
  --panel:#ffffff; --panel-rgb:255,255,255; --panel2:#e0faef;
  --border:rgba(5,120,85,.15); --border-strong:rgba(5,120,85,.24);
  --gold:#10b981; --gold2:#047857; --gold3:#9af0cd; --glow:16,185,129;
  --aura-b:rgba(20,184,166,.22); --aura-c:rgba(132,204,22,.22);
  --on-gold:#ffffff;
  --text:#052e22; --sub:#3f7a63;
  --shadow:rgba(5,80,55,.16); --hl:rgba(255,255,255,.9); --dots:rgba(5,80,55,.07);
  --cell-a:#ffffff; --cell-b:#dcf8ec;
}

/* ---------- Base ---------- */
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  font-family:"Cairo","Tahoma","Segoe UI",system-ui,sans-serif;
  color:var(--text);user-select:none;-webkit-user-select:none;
  -webkit-font-smoothing:antialiased;}
html{background:var(--bg);}
body{background:radial-gradient(130% 85% at 50% -10%, var(--bg2) 0%, var(--bg) 62%) fixed, var(--bg);
  transition:background .6s ease, color .4s ease;}
/* animated aurora + fine dot texture behind every screen */
body::before{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 32% at 18% 22%, rgba(var(--glow),.26), transparent 70%),
    radial-gradient(34% 30% at 84% 16%, var(--aura-b), transparent 70%),
    radial-gradient(42% 38% at 72% 88%, var(--aura-c), transparent 70%),
    radial-gradient(30% 28% at 12% 86%, rgba(var(--glow),.12), transparent 70%);
  animation:aurora-drift 26s ease-in-out infinite alternate;will-change:transform;}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(var(--dots) 1px, transparent 1.6px);
  background-size:24px 24px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%, #000 30%, transparent 85%);
          mask-image:radial-gradient(ellipse at 50% 40%, #000 30%, transparent 85%);}
@keyframes aurora-drift{
  0%{transform:translate3d(0,0,0) rotate(0deg) scale(1);}
  50%{transform:translate3d(3%,-2%,0) rotate(6deg) scale(1.06);}
  100%{transform:translate3d(-3%,3%,0) rotate(-5deg) scale(1.02);}
}

.screen{display:none;position:fixed;inset:0;width:100%;height:100%;z-index:1;}
.screen.active{display:flex;flex-direction:column;}
.center-wrap{flex:1;display:flex;align-items:center;justify-content:center;
  padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));
  overflow-y:auto;-webkit-overflow-scrolling:touch;}
/* "safe center": centered when it fits, scrollable top-aligned when it overflows */
.center-wrap{align-items:safe center;}
.hidden{display:none !important;}

/* ---------- Glass card ---------- */
.card-panel{position:relative;width:100%;max-width:480px;text-align:center;
  padding:30px 22px 24px;border-radius:30px;
  background:linear-gradient(180deg, rgba(var(--panel-rgb),.78), rgba(var(--panel-rgb),.56));
  box-shadow:0 40px 90px -30px var(--shadow), 0 0 0 1px var(--border), inset 0 1px 0 var(--hl);
  -webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);
  animation:card-rise .7s cubic-bezier(.2,.8,.2,1) both;}
/* luminous gradient edge */
.card-panel::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:linear-gradient(140deg, rgba(var(--glow),.85), rgba(var(--glow),0) 32%, rgba(var(--glow),0) 68%, var(--aura-b));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;}
@keyframes card-rise{from{opacity:0;transform:translateY(18px) scale(.98);}to{opacity:1;transform:none;}}

.main-logo{width:230px;height:auto;margin:0 auto 6px;display:block;
  filter:drop-shadow(0 10px 30px rgba(var(--glow),.45)) drop-shadow(0 4px 10px rgba(0,0,0,.4));
  animation:logo-float 5s ease-in-out infinite;}
@keyframes logo-float{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-8px) rotate(1deg);}}

.card-panel h1{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:34px;line-height:1.3;margin:0 0 4px;
  background:linear-gradient(100deg, var(--text) 20%, var(--gold) 50%, var(--text) 80%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:text-sheen 6s linear infinite;}
@keyframes text-sheen{from{background-position:100% 0;}to{background-position:-150% 0;}}
.card-panel p.sub{color:var(--sub);font-size:14px;margin:0 0 20px;line-height:1.8;font-weight:600;}

/* ---------- Form fields ---------- */
.field{margin-bottom:14px;text-align:right;}
.field label, .settings-box label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:0 4px 7px;letter-spacing:.2px;}
input[type="text"],input[type="number"],.settings-box select{width:100%;padding:13px 16px;border-radius:16px;
  border:1px solid var(--border-strong);background:rgba(var(--panel-rgb),.55);color:var(--text);
  font-family:inherit;font-size:17px;font-weight:700;text-align:center;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.12);transition:border-color .2s, box-shadow .2s;  -webkit-user-select:text;user-select:text;}
/* number field with a + button on the right and a − button on the left */
.stepper{display:flex;align-items:stretch;gap:8px;margin-bottom:10px;}
.stepper input[type="number"]{flex:1;min-width:0;margin:0;-moz-appearance:textfield;}
.stepper input[type="number"]::-webkit-inner-spin-button,.stepper input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.step-btn{flex:0 0 54px;border-radius:16px;cursor:pointer;font-family:inherit;font-size:26px;font-weight:900;line-height:1;
  color:var(--on-gold);border:none;background:linear-gradient(135deg,var(--gold2),var(--gold));
  box-shadow:0 8px 18px -10px rgba(var(--glow),.8), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,0,0,.15);
  transition:transform .1s ease, filter .15s;touch-action:manipulation;}
.step-btn:active{transform:scale(.9);}
.settings-box select{font-size:15px;margin-bottom:10px;-webkit-appearance:none;appearance:none;text-align-last:center;cursor:pointer;}
input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(var(--glow),.22), inset 0 2px 6px rgba(0,0,0,.12);}
input::placeholder{color:var(--sub);opacity:.6;font-weight:600;}

/* ---------- Buttons ---------- */
button{font-family:inherit;}
button.primary, button.gold, button.danger, .submit-btn, .readybtn{position:relative;overflow:hidden;isolation:isolate;
  transition:transform .15s ease, box-shadow .25s ease, filter .2s ease, opacity .2s;}
/* moving light sweep on the main call-to-action buttons */
button.primary::after, button.gold::after, button.danger::after, .submit-btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;z-index:-1;pointer-events:none;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.38), transparent);transform:skewX(-20deg);
  animation:btn-sweep 4.2s ease-in-out infinite;}
@keyframes btn-sweep{0%,60%{left:-60%;}100%{left:130%;}}

button.primary{width:100%;padding:17px;border-radius:20px;border:none;margin-top:10px;cursor:pointer;
  background:linear-gradient(135deg, var(--gold2) 0%, var(--gold) 55%, var(--gold3) 130%);
  color:var(--on-gold);font-size:17px;font-weight:900;letter-spacing:.2px;
  box-shadow:0 14px 34px -10px rgba(var(--glow),.75), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(0,0,0,.16);}
button.gold{width:100%;padding:14px;border-radius:18px;border:none;margin-top:10px;cursor:pointer;
  background:linear-gradient(135deg, var(--gold2), var(--gold));
  color:var(--on-gold);font-size:15.5px;font-weight:900;
  box-shadow:0 12px 28px -12px rgba(var(--glow),.8), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,0,0,.15);}
button.ghost{width:100%;padding:12px;border-radius:16px;margin-top:10px;cursor:pointer;
  border:1px solid var(--border-strong);background:rgba(var(--panel-rgb),.35);color:var(--text);
  font-size:14px;font-weight:700;box-shadow:inset 0 1px 0 var(--hl);transition:background .2s, border-color .2s, transform .15s;}
button.ghost:hover{background:rgba(var(--glow),.12);border-color:rgba(var(--glow),.45);}
button.danger{width:100%;padding:14px;border-radius:18px;border:none;margin-top:10px;cursor:pointer;
  background:linear-gradient(135deg,#ff6b5a,#e11d48 60%,#9f1239);color:#fff;font-size:15px;font-weight:900;
  box-shadow:0 12px 28px -12px rgba(225,29,72,.85), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.2);}
#btn-start-bomb{background:linear-gradient(135deg,#ff8a3d,#e63b2e 55%,#8f1d14);box-shadow:0 12px 28px -12px rgba(230,59,46,.9), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.2);}
#btn-start-flags{background:linear-gradient(135deg,#5fd3ff,#1e8bf0 55%,#1747c9);color:#fff;box-shadow:0 12px 28px -12px rgba(30,139,240,.9), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.2);}
button:hover:not(:disabled){filter:brightness(1.06);}
button:active{transform:scale(.965);}
button.primary:disabled, button.gold:disabled, button.danger:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;}
button:disabled::after{display:none;}

.status-msg{margin-top:12px;font-size:13.5px;font-weight:600;color:var(--sub);min-height:16px;line-height:1.7;}
.status-msg.error{color:var(--red);}

/* ---------- Room code ---------- */
.room-code-big{position:relative;margin:16px 0 18px;padding:18px 10px;border-radius:22px;direction:ltr;
  font-family:"Cairo",sans-serif;font-size:46px;font-weight:900;letter-spacing:14px;text-indent:14px;
  background:linear-gradient(180deg, rgba(var(--glow),.14), rgba(var(--glow),.04)), rgba(var(--panel-rgb),.4);
  border:1px solid rgba(var(--glow),.45);
  box-shadow:0 0 0 6px rgba(var(--glow),.07), 0 0 40px -6px rgba(var(--glow),.55), inset 0 1px 0 var(--hl);
  color:var(--gold);text-shadow:0 0 22px rgba(var(--glow),.7);
  animation:code-breathe 3.2s ease-in-out infinite;}
#room-code-display{font-size:clamp(48px,9vh,92px);}
@keyframes code-breathe{0%,100%{box-shadow:0 0 0 6px rgba(var(--glow),.07), 0 0 34px -8px rgba(var(--glow),.45), inset 0 1px 0 var(--hl);}
  50%{box-shadow:0 0 0 10px rgba(var(--glow),.10), 0 0 60px -4px rgba(var(--glow),.7), inset 0 1px 0 var(--hl);}}

#reconnect-banner{position:fixed;top:0;left:0;right:0;z-index:99999;
  padding:calc(10px + env(safe-area-inset-top)) 10px 10px;text-align:center;font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(90deg,#b45309,#ea580c,#b45309);background-size:200% 100%;animation:text-sheen 3s linear infinite;
  box-shadow:0 6px 24px rgba(0,0,0,.35);}

/* ---------- Theme picker ---------- */
.theme-picker{display:flex;gap:14px 12px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:16px;direction:ltr;padding-bottom:18px;}
.theme-swatch{position:relative;width:44px;height:44px;border-radius:50%;cursor:pointer;flex:0 0 44px;padding:0;
  border:2px solid rgba(255,255,255,.55);
  box-shadow:0 6px 16px -4px var(--shadow), inset 0 2px 4px rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.25);
  transition:transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s;}
.theme-swatch.selected{transform:scale(1.12);border-color:#fff;
  box-shadow:0 0 0 3px var(--gold), 0 0 22px rgba(var(--glow),.8), inset 0 2px 4px rgba(255,255,255,.35);}
.theme-swatch.selected::before{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;font-weight:900;text-shadow:0 1px 4px rgba(0,0,0,.7);}
.theme-swatch::after{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:10.5px;font-weight:700;color:var(--sub);pointer-events:none;}
.theme-swatch:nth-child(1)::after{content:"ملكي";}
.theme-swatch:nth-child(2)::after{content:"بنفسجي";}
.theme-swatch:nth-child(3)::after{content:"زمردي";}
.theme-swatch:nth-child(4)::after{content:"لؤلؤي";}
.theme-swatch:nth-child(5)::after{content:"غروب";}
.theme-swatch:nth-child(6)::after{content:"نعناعي";}
.theme-swatch.selected::after{color:var(--gold);}
.settings-summary .theme-picker{justify-content:flex-end;margin:8px 0 0;padding-bottom:0;gap:8px;}
.settings-summary .theme-swatch{cursor:default;width:26px;height:26px;display:inline-block;flex:none;border-width:1.5px;}
.settings-summary .theme-swatch::after, .settings-summary .theme-swatch::before{display:none;}
.settings-summary .theme-swatch.selected{transform:scale(1.15);}

/* ---------- Game chips ---------- */
.game-picker{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:14px;direction:ltr;}
.game-chip{padding:9px 15px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;
  border:1px solid var(--border-strong);background:rgba(var(--panel-rgb),.45);color:var(--sub);
  transition:all .2s ease;}
.game-chip.on{color:var(--on-gold);border-color:transparent;font-weight:900;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  box-shadow:0 6px 18px -6px rgba(var(--glow),.8), inset 0 1px 0 rgba(255,255,255,.35);}

/* ---------- Lobby ---------- */
.list-wrap{margin:14px 0 6px;}
.player-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-bottom:10px;padding:13px 16px;border-radius:18px;font-size:16px;
  background:linear-gradient(135deg, rgba(var(--panel-rgb),.85), rgba(var(--panel-rgb),.55));
  border:1px solid var(--border);box-shadow:0 10px 24px -16px var(--shadow), inset 0 1px 0 var(--hl);}
.player-row .pname{flex:1;text-align:right;display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16.5px;font-weight:800;min-width:90px;padding:6px 8px;margin:-6px -8px;}
.player-row .crown{color:var(--gold);filter:drop-shadow(0 0 6px rgba(var(--glow),.8));}
.player-row .disc-tag{color:var(--red);font-size:11px;font-weight:800;}
.player-row .pscore{min-width:44px;padding:4px 12px;border-radius:999px;text-align:center;font-size:15px;font-weight:900;
  color:var(--gold);background:rgba(var(--glow),.13);border:1px solid rgba(var(--glow),.3);}
.player-row .rdot{width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:rgba(150,160,190,.45);box-shadow:inset 0 1px 2px rgba(0,0,0,.4);}
.player-row .rdot.ready{background:var(--green);box-shadow:0 0 0 3px rgba(47,227,154,.2), 0 0 12px var(--green);animation:ready-ping 1.8s ease-out infinite;}
@keyframes ready-ping{0%{box-shadow:0 0 0 0 rgba(47,227,154,.55), 0 0 12px var(--green);}100%{box-shadow:0 0 0 9px rgba(47,227,154,0), 0 0 12px var(--green);}}
.player-row.disc{opacity:.5;filter:grayscale(.6);}
.mini-btn{width:38px;height:38px;border-radius:12px;cursor:pointer;line-height:1;font-size:16px;font-weight:800;
  background:rgba(var(--panel-rgb),.6);border:1px solid var(--border-strong);color:var(--text);
  box-shadow:inset 0 1px 0 var(--hl);transition:background .15s, transform .15s;}
.mini-btn:hover{background:rgba(var(--glow),.16);}
.mini-btn.kick-btn{background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.55);color:var(--red);font-size:14px;margin-right:4px;}
.leader-ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
#btn-reset-all-scores{margin-top:2px;}

.settings-box{margin-top:16px;padding:18px 16px 16px;border-radius:22px;text-align:right;
  background:rgba(var(--panel-rgb),.45);border:1px solid var(--border);box-shadow:inset 0 1px 0 var(--hl);}
.settings-box > button + div[style*="height"]{height:10px !important;margin:14px 0 !important;border-top:1px dashed var(--border-strong);}
.settings-summary{margin:12px 0;padding:14px 16px;border-radius:18px;text-align:right;font-size:13.5px;line-height:2.1;color:var(--sub);font-weight:600;
  background:rgba(var(--panel-rgb),.45);border:1px solid var(--border);box-shadow:inset 0 1px 0 var(--hl);}
.settings-summary b{color:var(--text);font-weight:800;}

.readybtn{width:100%;padding:16px;border-radius:20px;margin-top:12px;cursor:pointer;font-family:inherit;font-weight:900;font-size:17px;
  border:1px solid var(--border-strong);color:var(--text);
  background:linear-gradient(135deg, rgba(var(--panel-rgb),.9), rgba(var(--panel-rgb),.6));
  box-shadow:0 12px 26px -14px var(--shadow), inset 0 1px 0 var(--hl);}
.readybtn.on{color:#04261a;border-color:transparent;background:linear-gradient(135deg,#1fcf87,#4ff5b4);
  box-shadow:0 0 0 0 rgba(47,227,154,.5), 0 14px 30px -10px rgba(47,227,154,.8), inset 0 1px 0 rgba(255,255,255,.5);
  animation:ready-glow 2s ease-in-out infinite;}
@keyframes ready-glow{0%,100%{box-shadow:0 0 0 0 rgba(47,227,154,.45), 0 14px 30px -10px rgba(47,227,154,.8), inset 0 1px 0 rgba(255,255,255,.5);}
  50%{box-shadow:0 0 0 8px rgba(47,227,154,0), 0 14px 34px -8px rgba(47,227,154,.95), inset 0 1px 0 rgba(255,255,255,.5);}}

/* ---------- Game screen chrome ---------- */
#screen-game{position:relative;overflow:hidden;background:transparent;}
.display-wrap{flex:1;position:relative;display:flex;flex-direction:column;}
.game-topbar{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;
  padding:calc(1.2vh + env(safe-area-inset-top)) 2.2vw 1.2vh;
  font-size:clamp(14px,1.8vh,20px);font-weight:800;color:var(--sub);
  background:linear-gradient(180deg, rgba(var(--panel-rgb),.85), rgba(var(--panel-rgb),.55));
  border-bottom:1px solid var(--border);box-shadow:0 10px 30px -18px var(--shadow);}
.game-topbar::after{content:"";position:absolute;left:10%;right:10%;bottom:-1px;height:2px;border-radius:2px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);opacity:.8;}
.game-topbar .gname{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;color:var(--gold);
  font-size:clamp(20px,3vh,34px);text-shadow:0 0 18px rgba(var(--glow),.55);}
.arena-wrap{flex:1;position:relative;}

/* player bubbles around the display */
.player-slot{position:absolute;display:flex;flex-direction:column;align-items:center;gap:.6vh;width:clamp(110px,13vw,220px);}
.player-slot .status-circle{width:clamp(64px,10vh,116px);height:clamp(64px,10vh,116px);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:clamp(24px,4.6vh,48px);font-weight:900;color:#fff;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.22), transparent 45%), linear-gradient(160deg, var(--cell-a), var(--cell-b));
  border:3px solid rgba(var(--glow),.28);
  box-shadow:0 10px 24px -8px var(--shadow), inset 0 -6px 12px rgba(0,0,0,.25);
  transition:background .25s, box-shadow .25s;}
.player-slot .status-circle.gold{border-color:rgba(255,255,255,.7);
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 45%), linear-gradient(145deg,var(--gold),var(--gold2));
  box-shadow:0 0 0 5px rgba(var(--glow),.18), 0 0 28px rgba(var(--glow),.75);}
.player-slot .status-circle.correct{border-color:rgba(255,255,255,.7);
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.5), transparent 45%), linear-gradient(145deg,#3ff5a8,#0ea567);
  box-shadow:0 0 0 5px rgba(47,227,154,.2), 0 0 30px rgba(47,227,154,.8);}
.player-slot .status-circle.wrong{border-color:rgba(255,255,255,.7);
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.45), transparent 45%), linear-gradient(145deg,#ff6b81,#d3163e);
  box-shadow:0 0 0 5px rgba(255,77,109,.2), 0 0 30px rgba(255,77,109,.8);}
.player-slot .pname{max-width:clamp(110px,13vw,220px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:clamp(16px,2.2vh,26px);font-weight:900;text-shadow:0 2px 10px var(--shadow);}
.player-slot .pscore{padding:.2vh 1.1vh;border-radius:999px;font-size:clamp(15px,2.1vh,24px);font-weight:900;color:var(--gold);
  background:rgba(var(--glow),.14);border:1px solid rgba(var(--glow),.35);}
.player-slot .count-label{font-size:clamp(18px,2.8vh,32px);color:var(--gold);font-weight:900;min-height:1em;text-shadow:0 0 14px rgba(var(--glow),.6);}

.arena-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1.4vh;}

/* ---------- Grids ---------- */
/* Board cells are locked to an equal share of the board: minmax(0,1fr) instead of plain 1fr
   (whose minimum is the content size), so a cell showing a number can never grow bigger
   than an empty one. The board itself is sized once from the screen size. */
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:.7vh;
  width:min(80vh,86vw,880px);height:min(80vh,86vw,880px);direction:ltr;
  padding:.8vh;border-radius:22px;background:rgba(var(--panel-rgb),.35);border:1px solid var(--border);
  box-shadow:0 30px 60px -30px var(--shadow);}
.cell5{position:relative;display:flex;align-items:center;justify-content:center;border-radius:12px;min-width:0;min-height:0;overflow:hidden;line-height:1;
  font-size:clamp(22px,4.6vh,50px);font-weight:900;color:var(--text);
  background:linear-gradient(160deg, var(--cell-a), var(--cell-b));border:1px solid var(--border);
  box-shadow:inset 0 1px 0 var(--hl), inset 0 -3px 0 rgba(0,0,0,.12);}
.cell5.red, .cell5.blue, .cell5.green, .cell5.path{color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35);border-color:rgba(255,255,255,.35);}
.cell5.red{background:linear-gradient(150deg,#ff6b7e,#e0173f);box-shadow:0 0 18px rgba(255,60,90,.45), inset 0 1px 0 rgba(255,255,255,.35);}
.cell5.blue{background:linear-gradient(150deg,#6aa8ff,#2254e6);box-shadow:0 0 18px rgba(60,120,255,.45), inset 0 1px 0 rgba(255,255,255,.35);}
.cell5.green,.cell5.path{background:linear-gradient(150deg,#45f0a8,#0d9e62);box-shadow:0 0 18px rgba(40,220,140,.45), inset 0 1px 0 rgba(255,255,255,.35);}
.cell5.my-pick{box-shadow:inset 0 0 0 4px #ffa62b, 0 0 20px rgba(255,166,43,.6);}
.my-pick-badge{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:linear-gradient(145deg,#ff5a6e,#c8102e);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:900;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.35);}
.my-pick-badge.good{background:linear-gradient(145deg,#3ff5a8,#0d9e62);}

.answer-label{font-size:clamp(20px,3.2vh,34px);font-weight:900;color:var(--gold);text-align:center;
  padding:.6vh 2.4vh;border-radius:999px;background:rgba(var(--panel-rgb),.55);border:1px solid rgba(var(--glow),.35);
  text-shadow:0 0 16px rgba(var(--glow),.5);box-shadow:0 10px 30px -16px var(--shadow);}
.next-round-label{position:absolute;bottom:1.8vh;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap;
  padding:.8vh 2.4vh;border-radius:999px;font-size:clamp(14px,2vh,22px);font-weight:800;color:var(--sub);text-align:center;
  background:rgba(var(--panel-rgb),.7);border:1px solid var(--border);}

.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:.5vh;width:100%;height:100%;transition:transform .05s linear;direction:ltr;}
.cell6{position:relative;border-radius:9px;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(160deg, var(--cell-a), var(--cell-b));border:1px solid var(--border);box-shadow:inset 0 1px 0 var(--hl);}
.cell6.on{background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.45), transparent 50%), linear-gradient(145deg,var(--gold),var(--gold2));border-color:rgba(255,255,255,.45);box-shadow:0 0 14px rgba(var(--glow),.55);}
.cell6 .sq-check{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(30px,6vh,58px);color:#fff;font-weight:900;text-shadow:0 0 10px #16a34a, 0 2px 4px rgba(0,0,0,.6);}

/* ---------- Overlays ---------- */
.ready-overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;
  background:radial-gradient(circle at 50% 50%, rgba(var(--glow),.20), transparent 55%), rgba(var(--bg-rgb),.96);}
.ready-overlay .gtitle{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:clamp(30px,6vh,64px);color:var(--gold);text-align:center;
  text-shadow:0 0 30px rgba(var(--glow),.6);}
.ready-overlay .cdnum{position:relative;display:flex;align-items:center;justify-content:center;
  width:clamp(150px,28vh,300px);height:clamp(150px,28vh,300px);border-radius:50%;
  font-size:clamp(80px,17vh,170px);font-weight:900;line-height:1;color:var(--text);
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.12), transparent 55%), rgba(var(--panel-rgb),.55);
  border:3px solid rgba(var(--glow),.55);
  box-shadow:0 0 0 12px rgba(var(--glow),.08), 0 0 80px rgba(var(--glow),.45), inset 0 0 40px rgba(var(--glow),.18);
  text-shadow:0 0 30px rgba(var(--glow),.8);animation:cd-beat 1s ease-in-out infinite;}
@keyframes cd-beat{0%,100%{transform:scale(1);}12%{transform:scale(1.07);}30%{transform:scale(.99);}}

.round-overlay{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.8vh;padding:20px;
  background:radial-gradient(circle at 50% 30%, rgba(var(--glow),.18), transparent 60%), rgba(var(--bg-rgb),.97);}
.round-overlay.active{display:flex;}
.round-overlay .gtitle{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:clamp(30px,5vh,56px);color:var(--gold);text-shadow:0 0 30px rgba(var(--glow),.6);}
.round-overlay table{width:100%;max-width:560px;border-collapse:separate;border-spacing:0 1vh;}
.round-overlay td{padding:1.4vh 2vh;font-size:clamp(16px,2.6vh,28px);font-weight:800;
  background:linear-gradient(135deg, rgba(var(--panel-rgb),.9), rgba(var(--panel-rgb),.6));
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.round-overlay td:first-child{border-radius:0 18px 18px 0;border-right:1px solid var(--border);text-align:right;}
.round-overlay td:last-child{border-radius:18px 0 0 18px;border-left:1px solid var(--border);text-align:center;color:var(--gold);font-weight:900;width:25%;}
.round-overlay tr:nth-child(1) td{background:linear-gradient(135deg, rgba(var(--glow),.35), rgba(var(--glow),.12));border-color:rgba(var(--glow),.6);font-size:clamp(18px,3vh,32px);}
.round-overlay tr:nth-child(2) td{background:linear-gradient(135deg, rgba(200,210,230,.25), rgba(200,210,230,.08));}
.round-overlay tr:nth-child(3) td{background:linear-gradient(135deg, rgba(205,127,50,.28), rgba(205,127,50,.08));}

/* ---------- Player phone controls ---------- */
.pcontrols-wrap{flex:1;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);}
.notif-bar{margin:14px 14px 6px;padding:16px 18px;border-radius:20px;text-align:center;font-size:17px;font-weight:900;min-height:24px;line-height:1.6;
  background:linear-gradient(135deg, rgba(var(--panel-rgb),.9), rgba(var(--panel-rgb),.6));
  border:1px solid rgba(var(--glow),.4);box-shadow:0 0 0 4px rgba(var(--glow),.06), 0 14px 30px -18px var(--shadow), inset 0 1px 0 var(--hl);}
.pgrid-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;}
.pgrid-wrap .grid5{width:min(80vh,92vw,460px);height:min(80vh,92vw,460px);}
.counter-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;}
.counter-num{font-size:76px;font-weight:900;line-height:1;
  background:linear-gradient(180deg, var(--text), var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(var(--glow),.45));}
.counter-btn-wrap{position:relative;display:inline-block;}
.counter-btn{width:min(60vw,240px);height:min(60vw,240px);border-radius:50%;border:none;cursor:pointer;
  color:var(--on-gold);font-family:"Lalezar","Cairo",sans-serif;font-size:34px;font-weight:400;
  background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.6), transparent 38%), radial-gradient(circle at 50% 50%, var(--gold), var(--gold2));
  box-shadow:0 0 0 10px rgba(var(--glow),.14), 0 0 0 22px rgba(var(--glow),.06), 0 24px 50px -10px rgba(var(--glow),.75), inset 0 -10px 20px rgba(0,0,0,.2);
  transition:transform .08s ease;}
.counter-btn:active{transform:scale(.93);}
.counter-btn:disabled{opacity:.35;}
.counter-minus-btn{position:absolute;left:0;bottom:0;width:46px;height:46px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;font-size:24px;font-weight:900;
  border:2px solid var(--border-strong);background:rgba(var(--panel-rgb),.95);color:var(--text);
  box-shadow:0 6px 16px -4px var(--shadow);}
.counter-minus-btn:active{transform:scale(.9);}
.counter-minus-btn:disabled{opacity:.35;}

/* Flags game */
/* Flags game (player phone): everything scales to the space that's actually left on
   THIS phone's screen, so the reset button can never be pushed off the bottom.
   min-height:0 lets the area shrink inside the column; sizes use the area's own height
   (container units, cqh) with a viewport-height fallback for older browsers. */
.flags-pad-wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  gap:1vh;padding:1vh 10px;overflow-y:auto;-webkit-overflow-scrolling:touch;container-type:size;}
.flags-remaining-box{flex:0 0 auto;padding:.7vh 18px;border-radius:999px;font-size:clamp(13px,2.1vh,16px);font-weight:800;color:var(--text);
  background:rgba(var(--panel-rgb),.75);border:1px solid rgba(var(--glow),.4);box-shadow:inset 0 1px 0 var(--hl);}
.flags-remaining-box span:last-child{color:var(--gold);font-size:clamp(16px,2.8vh,22px);font-weight:900;text-shadow:0 0 12px rgba(var(--glow),.6);}
.flags-char-wrap{flex:0 0 auto;width:min(50vw,17vh,200px);height:min(50vw,17vh,200px);display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:radial-gradient(circle, rgba(var(--glow),.18), transparent 70%);}
.flags-char-wrap img{max-width:100%;max-height:100%;filter:drop-shadow(0 8px 16px var(--shadow));}
.dpad-wrap{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;width:min(80vw,34vh,320px);height:min(80vw,34vh,320px);gap:0.1px;}
@supports (container-type:size){
  .flags-char-wrap{width:min(50cqw,21cqh,200px);height:min(50cqw,21cqh,200px);}
  .dpad-wrap{width:min(88cqw,47cqh,340px);height:min(88cqw,47cqh,340px);}
}
/* grid items must be allowed to shrink below their image's natural size */
.dpad-btn{background:transparent;border:none;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;min-width:0;min-height:0;overflow:hidden;}
.dpad-btn img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;filter:drop-shadow(0 6px 10px var(--shadow));}
.dpad-btn:active img{filter:brightness(1.25) drop-shadow(0 0 12px rgba(var(--glow),.8));}
.dpad-up{grid-column:2;grid-row:1;}
.dpad-down{grid-column:2;grid-row:3;}
/* grid columns are mirrored by RTL: column 3 renders on the left */
.dpad-left{grid-column:3;grid-row:2;}
.dpad-right{grid-column:1;grid-row:2;}
.dpad-down img{transform:rotate(180deg);}
.dpad-left img{transform:rotate(-90deg);}
.dpad-right img{transform:rotate(90deg);}
#btn-flags-reset{flex:0 0 auto;max-width:260px;margin:0;padding:clamp(8px,1.4vh,12px);font-size:clamp(13px,2vh,15px);}
/* short phones: tighten the fixed chrome around the game so the controls get the room */
@media (max-height:740px){
  .pcontrols-wrap .game-topbar{padding-top:calc(.8vh + env(safe-area-inset-top));padding-bottom:.8vh;}
  .notif-bar{margin:8px 10px 4px;padding:10px 12px;font-size:15px;line-height:1.45;border-radius:16px;}
  .submit-btn{margin:8px 10px;padding:13px;}
}
@media (max-height:600px){
  .notif-bar{padding:7px 10px;font-size:14px;}
}
.flags-seq-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px;}
.flags-seq-item{position:relative;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;
  background:linear-gradient(160deg, var(--cell-a), var(--cell-b));border:1px solid var(--border);box-shadow:inset 0 1px 0 var(--hl);}
.flags-seq-item.my-pick{box-shadow:inset 0 0 0 3px #ffa62b, 0 0 14px rgba(255,166,43,.5);}

.submit-btn{margin:14px;padding:17px;border-radius:20px;border:none;cursor:pointer;font-weight:900;font-size:17px;
  color:var(--on-gold);background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,var(--gold3) 140%);
  box-shadow:0 14px 34px -12px rgba(var(--glow),.8), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(0,0,0,.16);}
.submit-btn:disabled{opacity:.4;box-shadow:none;}
.submitted-label{font-family:"Lalezar","Cairo",sans-serif;font-size:34px;font-weight:400;letter-spacing:1px;color:var(--green);text-shadow:0 0 24px currentColor;}
.leader-inline-btns{padding:0 14px 14px;}

/* ---------- Bomb game ---------- */
.bomb-grid{display:grid;gap:.6vh;direction:ltr;padding:.8vh;border-radius:20px;background:rgba(var(--panel-rgb),.35);border:1px solid var(--border);}
.bomb-cell{position:relative;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:clamp(16px,2.6vh,28px);
  background:linear-gradient(160deg, var(--cell-a), var(--cell-b));border:1px solid var(--border);box-shadow:inset 0 1px 0 var(--hl), inset 0 -3px 0 rgba(0,0,0,.12);}
.bomb-cell.safe{background:linear-gradient(150deg,#45f0a8,#0d9e62);border-color:rgba(255,255,255,.35);box-shadow:0 0 16px rgba(40,220,140,.45);}
.bomb-cell.bomb{background:linear-gradient(150deg,#ff7a5a,#d4102f);border-color:rgba(255,255,255,.35);box-shadow:0 0 20px rgba(255,60,60,.6);}
.bomb-cell img{width:70%;height:70%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
.bomb-arrow{font-size:clamp(22px,4vh,42px);color:var(--red);text-shadow:0 0 14px rgba(255,77,109,.7);}
.bomb-turn-banner{text-align:center;padding:1vh;font-weight:900;color:var(--gold);font-size:clamp(16px,2.6vh,26px);text-shadow:0 0 16px rgba(var(--glow),.5);}
.bomb-win-banner{text-align:center;padding:1vh;font-family:"Lalezar","Cairo",sans-serif;font-weight:400;color:var(--gold);font-size:clamp(24px,4vh,40px);text-shadow:0 0 24px rgba(var(--glow),.7);}

/* ---------- Winner celebration ---------- */
.winner-screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:1.6vh;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  background:radial-gradient(circle at 50% 38%, rgba(var(--glow),.38), transparent 58%), rgb(var(--bg-rgb));}
/* slowly rotating spotlight rays */
.winner-screen::before{content:"";position:fixed;left:50%;top:38%;width:220vmax;height:220vmax;z-index:0;pointer-events:none;
  transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg, rgba(var(--glow),.16) 0deg 7deg, transparent 7deg 18deg);
  -webkit-mask-image:radial-gradient(circle, #000 0%, transparent 32%);mask-image:radial-gradient(circle, #000 0%, transparent 32%);
  animation:rays-spin 40s linear infinite;}
@keyframes rays-spin{to{transform:translate(-50%,-50%) rotate(360deg);}}
.winner-screen > *:not(.fx-layer):not(.emoji-burst-layer){position:relative;z-index:2;flex-shrink:0;}
/* confetti / emoji layers stay pinned to the screen even if a small phone has to scroll */
.winner-screen > .fx-layer, .winner-screen > .emoji-burst-layer{position:fixed;}
.winner-trophy{font-size:clamp(64px,13vh,150px);line-height:1;filter:drop-shadow(0 0 30px rgba(var(--glow),.9)) drop-shadow(0 10px 20px rgba(0,0,0,.4));
  animation:trophy-bounce 2.4s cubic-bezier(.3,1.4,.5,1) infinite;}
@keyframes trophy-bounce{0%,100%{transform:translateY(0) rotate(-4deg) scale(1);}50%{transform:translateY(-14px) rotate(4deg) scale(1.06);}}
.winner-name{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:clamp(40px,9vh,104px);line-height:1.2;color:var(--gold);text-align:center;
  text-shadow:0 0 30px rgba(var(--glow),.8), 0 0 60px rgba(var(--glow),.45), 0 6px 0 rgba(0,0,0,.18);
  animation:winner-in .9s cubic-bezier(.2,1.5,.4,1) both, winner-glow 2.6s ease-in-out .9s infinite;}
@keyframes winner-in{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}
@keyframes winner-glow{0%,100%{text-shadow:0 0 30px rgba(var(--glow),.8), 0 0 60px rgba(var(--glow),.45), 0 6px 0 rgba(0,0,0,.18);}
  50%{text-shadow:0 0 44px rgba(var(--glow),1), 0 0 90px rgba(var(--glow),.6), 0 6px 0 rgba(0,0,0,.18);}}
.winner-sub{font-size:clamp(16px,2.4vh,26px);font-weight:800;color:var(--text);text-align:center;opacity:.9;}
/* fix: the scoreboard used to be pinned to the bottom of the screen, so on the leader's
   phone it sat ON TOP of the "new bomb round" / "back to lobby" buttons. It is now part of
   the normal flow and always placed last - underneath any buttons. */
.winner-scoreboard{position:relative;z-index:2;order:99;margin-top:1.4vh;
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:94vw;padding:0 10px;
  font-size:clamp(11px,1.5vh,16px);font-weight:700;color:var(--sub);}
.winner-scoreboard span{padding:4px 12px;border-radius:999px;background:rgba(var(--panel-rgb),.65);border:1px solid var(--border);}
.winner-scoreboard span.me{color:var(--gold);font-weight:900;border-color:rgba(var(--glow),.55);}
.emoji-burst-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;}
.fx-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;}
.confetti-piece{position:absolute;top:-4%;width:9px;height:15px;opacity:.95;border-radius:2px;animation-name:confetti-fall;animation-timing-function:linear;animation-fill-mode:forwards;box-shadow:0 0 6px rgba(255,255,255,.25);}
@keyframes confetti-fall{0%{transform:translate(0,0) rotate(0deg);opacity:.95;}100%{transform:translate(var(--sway),112vh) rotate(var(--rot));opacity:.85;}}
.firework-particle{position:absolute;width:7px;height:7px;border-radius:50%;animation:firework-pop .95s ease-out forwards;box-shadow:0 0 10px currentColor;}
@keyframes firework-pop{0%{transform:translate(0,0);opacity:1;}100%{transform:translate(var(--dx),var(--dy));opacity:0;}}
.emoji-burst-item{position:absolute;font-size:clamp(30px,6vh,64px);opacity:0;will-change:left,top,opacity;}
.celebrate-emojis{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px;max-width:94vw;z-index:2;position:relative;}
.celebrate-emoji-btn{font-size:26px;padding:8px 10px;border-radius:16px;cursor:pointer;
  background:rgba(var(--panel-rgb),.75);border:1px solid var(--border-strong);box-shadow:0 6px 14px -8px var(--shadow), inset 0 1px 0 var(--hl);
  transition:transform .12s;}
.celebrate-emoji-btn:active{transform:scale(.85);}
.celebrate-emoji-btn:disabled{opacity:.4;}

/* ---------- Light-theme refinements ---------- */
body.theme-3 .player-slot .status-circle, body.theme-4 .player-slot .status-circle, body.theme-5 .player-slot .status-circle{color:var(--text);}
body.theme-3 .player-slot .status-circle.gold, body.theme-4 .player-slot .status-circle.gold, body.theme-5 .player-slot .status-circle.gold,
body.theme-3 .player-slot .status-circle.correct, body.theme-4 .player-slot .status-circle.correct, body.theme-5 .player-slot .status-circle.correct,
body.theme-3 .player-slot .status-circle.wrong, body.theme-4 .player-slot .status-circle.wrong, body.theme-5 .player-slot .status-circle.wrong{color:#fff;}
body.theme-3 .theme-swatch, body.theme-4 .theme-swatch, body.theme-5 .theme-swatch{border-color:#fff;}

/* ---------- Motion safety ---------- */
@media (prefers-reduced-motion: reduce){
  body::before, .card-panel, .main-logo, .card-panel h1, .room-code-big, button::after, .readybtn.on,
  .player-row .rdot.ready, .ready-overlay .cdnum, .winner-screen::before, .winner-trophy, .winner-name{animation:none !important;}
}
/* ---------- Words game (Arabic Wordle) ---------- */
body{ --present:#c79a2b; --absent-bg:rgba(128,128,128,.42); }
#btn-start-words{background:linear-gradient(135deg,#1fcf87,#0e9f63);color:#fff;box-shadow:0 12px 28px -12px rgba(31,207,135,.9), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.2);}
.words-wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:1vh;padding:.4vh 8px calc(.8vh + env(safe-area-inset-bottom));}
/* the board takes whatever height is left above the keyboard; tiles size themselves to it */
.words-board-wrap{position:relative;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size;}
.words-board{--rows:6;--gap:6px;display:flex;flex-direction:column;gap:var(--gap);direction:rtl;
  --tile:min(15vw, calc((52vh - 5*6px)/6), 62px);}
@supports (container-type:size){
  .words-board{--tile:min(64px, calc((100cqw - 4*var(--gap))/5), calc((100cqh - (var(--rows) - 1)*var(--gap))/var(--rows)));}
}
.words-row{display:grid;grid-template-columns:repeat(5, var(--tile));gap:var(--gap);}
.words-tile{width:var(--tile);height:var(--tile);display:flex;align-items:center;justify-content:center;
  border-radius:10px;border:1.5px solid var(--border);background:var(--panel2);color:var(--text);
  font-family:"Cairo","Tahoma",sans-serif;font-weight:700;font-size:calc(var(--tile)*.52);line-height:1;overflow:hidden;}
.words-tile.filled{border-color:var(--gold);background:var(--panel);}
.words-tile.correct{background:var(--green);border-color:transparent;color:#fff;}
.words-tile.present{background:var(--present);border-color:transparent;color:#fff;}
.words-tile.absent{background:var(--absent-bg);border-color:transparent;color:var(--text);}
.words-tile.hidden-letter{color:var(--gold);background:var(--panel);border-color:var(--gold);}
.words-tile.flip{animation:words-flip .45s ease both;}
@keyframes words-flip{0%{transform:rotateX(90deg);}100%{transform:rotateX(0);}}
.words-row.shake{animation:words-shake .45s ease;}
@keyframes words-shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-7px);}40%,80%{transform:translateX(7px);}}
.words-tile{position:relative;}
/* how many times a GREEN letter appears in the word (only shown when more than once) */
.words-count{position:absolute;top:2px;left:3px;font-family:"Cairo","Tahoma",sans-serif;font-size:max(9px, calc(var(--tile)*.24));font-weight:700;line-height:1;color:#fff;opacity:.95;}
.words-giveup{flex:0 0 auto;margin-top:0;padding:clamp(7px,1.2vh,10px);font-size:clamp(12px,1.8vh,14px);}
.words-toast{position:absolute;top:2px;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap;
  padding:8px 16px;border-radius:10px;font-weight:700;font-size:14px;color:var(--bg);background:var(--text);box-shadow:0 10px 20px -10px var(--shadow);}

/* on-screen Arabic keyboard */
.words-kb{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;direction:rtl;}
.words-kb-row{display:flex;gap:4px;justify-content:center;}
.words-key{flex:1 1 0;min-width:0;height:clamp(40px,6.4vh,58px);padding:0;border-radius:10px;cursor:pointer;touch-action:manipulation;
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  font-family:"Cairo","Tahoma",sans-serif;font-size:clamp(16px,2.6vh,22px);font-weight:700;line-height:1;}
.words-key.wide{flex:1.55 1 0;font-family:"Cairo","Tahoma",sans-serif;font-size:clamp(13px,2vh,15px);}
.words-key.enter{background:var(--gold2);color:var(--on-gold);border-color:transparent;}
.words-key.del{font-size:clamp(18px,2.8vh,24px);}
.words-key.correct{background:var(--green);color:#fff;border-color:transparent;}
.words-key.present{background:var(--present);color:#fff;border-color:transparent;}
.words-key.absent{background:var(--absent-bg);color:var(--sub);border-color:transparent;}
.words-key:disabled{opacity:.5;}
@media (max-height:640px){ .words-kb{gap:4px;} .words-key{height:clamp(34px,6vh,44px);} }

/* display screen */
.words-bigrow{display:flex;gap:1.2vh;direction:rtl;--tile:clamp(64px,14vh,150px);}
.words-bigrow .words-tile{border-width:2px;}
.words-mini{display:flex;gap:3px;direction:rtl;--tile:clamp(18px,2.9vh,32px);}
.words-mini .words-tile{border-radius:3px;border-width:1px;}
.words-mini-none{font-family:"Cairo","Tahoma",sans-serif;color:var(--sub);}
/* long-press keys (ا -> أ, و -> ؤ, ى -> ئ): the second letter shows small in the corner */
.words-key{position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
.words-key.has-alt::after{content:attr(data-alt);position:absolute;top:2px;left:4px;font-size:clamp(9px,1.4vh,11px);line-height:1;opacity:.6;pointer-events:none;}
.words-key.pressing{filter:brightness(1.25);transform:scale(.95);}/* words game: round countdown (display + phones) */
.words-clock{font-size:clamp(34px,7vh,72px);font-weight:800;line-height:1;direction:ltr;font-variant-numeric:tabular-nums lining-nums;color:var(--text);}
.notif-bar.words-clock-bar{font-size:clamp(24px,3.8vh,34px);direction:ltr;font-variant-numeric:tabular-nums lining-nums;letter-spacing:1px;}
.words-clock.low, .notif-bar.words-clock-bar.low{color:var(--red);}
</style>
</head>

<script>
(function(){
"use strict";

var PEER_CONFIG = {
  host: 'maq-peerjs-server.onrender.com',
  port: 443,
  path: '/myapp',
  secure: true,
  debug: 0,
  config: { iceServers: [
    { urls:'stun:stun.l.google.com:19302' },
    { urls:'stun:stun1.l.google.com:19302' },
    { urls:'stun:stun2.l.google.com:19302' }
  ]}
};
var ROOM_PREFIX = 'brain5games37-';
var ASSET_BASE = 'https://raw.githubusercontent.com/Jawlah1/RandFiles/main/';
// Flags game: preload every direction/color-variant image up front (both colors, since
// the leader can switch themes mid-lobby) so switching directions on screen is instant -
// no per-frame network fetch ever happens once these are warm in the browser cache.
var FLAG_DIRS = ['up','down','left','right'];
var FLAG_IMG_URLS = {};
(function(){
  var prefixes = { W:'WFlag-', B:'BFlag-' };
  var caps = { up:'Up', down:'Down', left:'Left', right:'Right' };
  Object.keys(prefixes).forEach(function(p){
    FLAG_IMG_URLS[p] = {};
    FLAG_DIRS.forEach(function(d){
      var url = ASSET_BASE + prefixes[p] + caps[d] + '.png';
      FLAG_IMG_URLS[p][d] = url;
      try{ var im = new Image(); im.src = url; }catch(e){}
    });
  });
})();
function flagImageColorPrefix(themeIdx){
  // fix: dark themes (0-2) use the White-figure images, light themes (3-5) use Black.
  return (themeIdx>=3) ? 'B' : 'W';
}
// D-pad button artwork: one "up" image per theme (0-6), rotated in CSS for the other
// three directions - preloaded up front so switching themes never causes a flicker/fetch.
var DPAD_IMG_URLS = [0,1,2,3,4,5].map(function(i){ return ASSET_BASE + 'Dpad-'+i+'.png'; });
DPAD_IMG_URLS.forEach(function(url){ try{ var im = new Image(); im.src = url; }catch(e){} });
function updateDpadTheme(themeIdx){

].forEach(function(id){ els[toCamel(id)] = document.getElementById(id); });
function toCamel(s){ return s.replace(/-([a-z0-9])/g, function(m,c){ return c.toUpperCase(); }); }

function showScreen(id){

// ===================== APP STATE =====================
var app = {
  peer:null, isHost:false, myPlayerId:null, myName:null,
  connections:[], hostConn:null, game:null,
  roomCode:null, intentionalLeave:false, reconnecting:false,
  clockOffset:0
};
// fix: every device compares its OWN syncedNow() against timestamps the HOST generated on
// ITS OWN clock (round start times, reveal times, etc.) - if a player's phone clock is off
// by even a couple of seconds from the host's, inputs stay locked far too long or unlock
// too early. syncedNow() corrects for that using a measured offset from a small time-sync
// handshake with the host (see time-sync / time-sync-reply below). On the host itself the
// offset is always 0, so this is a complete no-op there - purely a client-side correction.
function syncedNow(){ return Date.now() + (app.clockOffset||0); }
// Small ping/pong handshake so a player's device knows how far its own clock differs from
// the host's - without this, round timings (which the host stamps using ITS clock) can
// come out locked/unlocked at the wrong moment on a phone whose clock isn't perfectly set.
function requestTimeSync(){
  if(app.isHost || !app.hostConn || !app.hostConn.open) return;
  try{ app.hostConn.send({t:'time-sync', clientSentAt: Date.now()}); }catch(e){}
}
function applyTimeSyncReply(msg){
  var latency = (Date.now() - msg.clientSentAt) / 2;
  app.clockOffset = (msg.hostNow + latency) - Date.now();
}
setInterval(requestTimeSync, 25000); // keep the offset fresh over a long session; a no-op when not connected as a player
// fix #4: victory-clip data lives OUTSIDE the reactive game state (it's binary and would
// otherwise get re-sent on every single broadcastState() call). Keyed by playerId.
var localVictoryAudio = {};

function getPlayerName(){
  var n = els.playerName.value.trim();
  if(!n) n = 'لاعب'+rand(10,99);
  return n.slice(0,16);
}

function resetToHome(){
  app.intentionalLeave = true; // stop any in-flight reconnect attempts
  app.reconnecting = false;
  hideReconnectBanner();
  if(app.peer){ try{ app.peer.destroy(); }catch(e){} }
  app.peer=null; app.isHost=false; app.myPlayerId=null; app.connections=[]; app.hostConn=null; app.game=null;
  app.roomCode=null; app.clockOffset=0;
  clearAllTimers();
  els.btnCreateRoom.disabled=false;
  els.homeStatus.textContent='';
  applyTheme(0);
  showScreen('screen-home');
}

function wireHostPeerHandlers(peer){
  peer.on('connection', function(conn){
    conn.on('open', function(){ app.connections.push(conn); });
    conn.on('data', function(msg){ hostHandleMessage(msg, conn); });
    conn.on('close', function(){ hostHandlePlayerDisconnect(conn); });
  });
  peer.on('disconnected', function(){ handleHostConnectionLost(); });
}

// fix #8: the letter O looks too much like the digit 0 and was a common typo source when
// players typed the room code in manually - it's simply excluded from generation now.
var ROOM_CODE_CHARS = 'ABCDEFGHIJKLMNPQRSTUVWXYZ0123456789';
function generateRoomCode(len){
  var s = '';
  for(var i=0;i<len;i++) s += ROOM_CODE_CHARS[Math.floor(Math.random()*ROOM_CODE_CHARS.length)];
  return s;
}
function createRoomFlow(){
  var code = generateRoomCode(4);
  app.roomCode = code.toLowerCase();
  app.intentionalLeave = false;
  var hostId = ROOM_PREFIX + code.toLowerCase() + '-host';
  var peer = new Peer(hostId, PEER_CONFIG);
  app.peer = peer;
  app.isHost = true;
  app.connections = [];

  peer.on('open', function(){
    app.game = {
      code: code,
      leaderId: null,
      players: [],
      phase: 'lobby',
      mode: null,
      round: null,
      theme: 0,
      lobbySettings: {
        selectedQuickGames: QUICK_GAME_KEYS.slice(),
        quickRoundCount: 10,
        bombCols: 8, bombScoringMode: 'classic', bombRoundsTotal: 5,
        flagsRoundsTotal: 5,
        wordsRoundsTotal: 5, wordsAttempts: 6, wordsMinutes: 5, wordsStrict: 'strict'
      }
    };
    renderLobby();
    showScreen('screen-lobby');
  });
  wireHostPeerHandlers(peer);
  peer.on('error', function(err){
    els.homeStatus.textContent = 'تعذر إنشاء الغرفة، حاول مرة أخرى.';
    els.homeStatus.classList.add('error');
    els.btnCreateRoom.disabled = false;
  });
}

// fix: the host device (the shared display) can also get backgrounded/suspended by the
// OS - if that happens mid-game, reconnect it under the SAME room id instead of losing
// the whole session. All existing game state in app.game is preserved untouched; players
// reconnect to it individually via their own auto-reconnect flow below.
function attemptHostReconnect(){
  if(!app.game || !app.game.code) return;
  var hostId = ROOM_PREFIX + app.game.code.toLowerCase() + '-host';
  if(app.peer){ try{ app.peer.destroy(); }catch(e){} }
  var peer = new Peer(hostId, PEER_CONFIG);
  app.peer = peer;
  peer.on('open', function(){
    app.reconnecting = false;
    hideReconnectBanner();
  });
  wireHostPeerHandlers(peer);
  peer.on('error', function(){
    scheduleReconnectRetry(attemptHostReconnect);
  });
}
function handleHostConnectionLost(){
  if(app.intentionalLeave || app.reconnecting) return;
  app.reconnecting = true;
  showReconnectBanner();
  attemptHostReconnect();
}

function joinRoomFlow(codeRaw, name, opts){
  opts = opts || {};
  var code = codeRaw.trim().toLowerCase();
  app.roomCode = code;
  if(!opts.isReconnect) app.intentionalLeave = false;
  var hostId = ROOM_PREFIX + code + '-host';
  var peer = new Peer(undefined, PEER_CONFIG);
  app.peer = peer;
  app.isHost = false;
  app.myName = name;

  peer.on('open', function(){
    var conn = peer.connect(hostId, {reliable:true});
    app.hostConn = conn;
    conn.on('open', function(){
      app.reconnecting = false;
      hideReconnectBanner();
      unlockAudio(); // make sure sound is actually working again after a reconnect
      // an unconfirmed victory-clip transfer was cut off by the drop - allow a fresh send
      // (the 'state' handler skips it if the display already confirmed it for this id)
      app.victoryAudioSent = false;
      app.victoryAudioAttempts = 0;
      conn.send({t:'join', name:name, priorId: app.myPlayerId||null});
      requestTimeSync();
    });
    conn.on('data', function(msg){ clientHandleMessage(msg); });
    conn.on('close', function(){ handlePlayerConnectionLost(); });
  });
  peer.on('disconnected', function(){ handlePlayerConnectionLost(); });
  peer.on('error', function(err){
    if(opts.isReconnect){
      scheduleReconnectRetry(attemptPlayerReconnect);
      return;
    }
    if(err.type === 'peer-unavailable'){
      els.homeStatus.textContent = 'لم يتم العثور على غرفة بهذا الرمز.';
    } else {
      els.homeStatus.textContent = 'تعذر الاتصال، حاول مرة أخرى.';
    }
    els.homeStatus.classList.add('error');
    els.btnJoinRoom.disabled = false;
  });
}

// fix: switching apps / backgrounding the tab for a while used to silently drop the
// connection, and the ONLY thing the old code did about it was alert() + dump the player
// back to the home screen - they had to manually retype the room code. Now we detect the
// drop and quietly reconnect them under their own name (the host already knows how to
// restore a returning player's id/score by name - see hostAddOrReconnectPlayer).
function handlePlayerConnectionLost(){
  if(app.isHost || app.intentionalLeave || !app.myName) return;
  if(app.reconnecting) return;
  app.reconnecting = true;
  showReconnectBanner();
  attemptPlayerReconnect();
}
function attemptPlayerReconnect(){
  if(app.peer){ try{ app.peer.destroy(); }catch(e){} }
  joinRoomFlow(app.roomCode, app.myName, {isReconnect:true});
}
function scheduleReconnectRetry(retryFn){
  addTimer(setTimeout(function(){
    if(!app.intentionalLeave && app.reconnecting) retryFn();
  }, 2500));
}
function showReconnectBanner(){
  if(els.reconnectBanner) els.reconnectBanner.classList.remove('hidden');
}
function hideReconnectBanner(){
  if(els.reconnectBanner) els.reconnectBanner.classList.add('hidden');
}
// A quick foreground check: if the tab was suspended, 'close'/'disconnected' events can
// be delayed or missed entirely - re-check the connection the instant the user comes back.
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'visible') return;
  unlockAudio(); // proactively resume audio too - don't wait for another tap/click
  if(app.intentionalLeave) return;
  if(!app.isHost && app.myName){
    var alive = app.hostConn && app.hostConn.open;
    if(!alive) handlePlayerConnectionLost();
  } else if(app.isHost && app.game){
    var peerAlive = app.peer && !app.peer.destroyed && !app.peer.disconnected;
    if(!peerAlive) handleHostConnectionLost();
  }
});

// ===================== HOST: MESSAGE HANDLING =====================
// Protocol note: every message carries `senderId` = the sending device's own player id
// (set automatically by sendToHost). Fields named `playerId` inside a message body are
// ALWAYS an explicit TARGET id (e.g. which player's score to adjust) chosen by the leader,
// never the sender. This separation fixes leader controls acting on the wrong player.
function hostHandleMessage(msg, conn){
  if(msg.t === 'time-sync'){
    // Answered immediately and independent of game state / conn.playerId, so it stays
    // accurate even before a player has fully joined.
    if(conn && conn.send) conn.send({t:'time-sync-reply', clientSentAt: msg.clientSentAt, hostNow: Date.now()});
    return;
  }
  var g = app.game;
  if(!g) return;
  if(msg.t === 'join'){
    hostAddOrReconnectPlayer(msg.name, conn, msg.priorId);
  } else if(msg.t === 'leave'){
    hostRemovePlayer(msg.senderId);
  } else if(msg.t === 'ready-toggle'){
    hostToggleReady(msg.senderId);
  } else if(msg.t === 'adjust-score'){
    if(msg.senderId === g.leaderId) hostAdjustScore(msg.playerId, msg.delta);
  } else if(msg.t === 'reset-score'){
    if(msg.senderId === g.leaderId) hostResetScore(msg.playerId);
  } else if(msg.t === 'reset-all-scores'){
    if(msg.senderId === g.leaderId && g.phase === 'lobby') hostResetAllScores();
  } else if(msg.t === 'transfer-leader'){
    if(msg.senderId === g.leaderId && g.players.some(function(p){return p.id===msg.playerId;})){
      g.leaderId = msg.playerId;
      broadcastState();
    }
  } else if(msg.t === 'kick-player'){
    if(msg.senderId === g.leaderId) hostKickPlayer(msg.playerId);
  } else if(msg.t === 'set-theme'){
    if(msg.senderId === g.leaderId && Number.isInteger(msg.theme) && msg.theme>=0 && msg.theme<=5){
      g.theme = msg.theme;
      broadcastState();
    }
  } else if(msg.t === 'update-lobby-settings'){
    // fix #7: mirrors the leader's in-progress choices (games/rounds/bomb/flags config)
    // to everyone's screen live, before they even press a "start" button.
    if(msg.senderId === g.leaderId && msg.settings && g.phase==='lobby'){
      g.lobbySettings = g.lobbySettings || {};
      Object.keys(msg.settings).forEach(function(k){ g.lobbySettings[k] = msg.settings[k]; });
      broadcastState();
    }
  } else if(msg.t === 'start-quick'){
    hostTryStartQuick(msg.senderId, msg.roundCount, msg.selectedGames, conn);
  } else if(msg.t === 'start-bomb'){
    hostTryStartBomb(msg.senderId, msg.cols, msg.scoringMode, msg.roundsTotal, conn);
  } else if(msg.t === 'start-flags'){
    hostTryStartFlags(msg.senderId, msg.roundsTotal, conn);
  } else if(msg.t === 'submit-answer'){
    hostReceiveAnswer(msg.senderId, msg.value);
  } else if(msg.t === 'flags-answer'){
    hostReceiveFlagsAnswer(msg.senderId, msg.value);
  } else if(msg.t === 'bomb-choose'){
    hostBombChoose(msg.senderId, msg.row);
  } else if(msg.t === 'next-round'){
    if(msg.senderId === g.leaderId) hostBeginNextQuickRound();
  } else if(msg.t === 'flags-next-round'){
    if(msg.senderId === g.leaderId) hostAdvanceFlags();
  } else if(msg.t === 'start-words'){
    hostTryStartWords(msg.senderId, msg, conn);
  } else if(msg.t === 'words-guess'){
    hostReceiveWordsGuess(msg.senderId, msg.guess, msg.idx, conn);
  } else if(msg.t === 'words-giveup'){
    hostWordsGiveUp(msg.senderId);
  } else if(msg.t === 'words-next-round'){
    if(msg.senderId === g.leaderId) hostAdvanceWords();
  } else if(msg.t === 'bomb-next-round'){
    if(msg.senderId === g.leaderId) hostBeginBombRound();
  } else if(msg.t === 'back-to-lobby'){
    if(msg.senderId === g.leaderId) hostBackToLobby();
  } else if(msg.t === 'victory-audio-chunk'){
    hostRelayVictoryAudioChunk(msg.senderId, msg, conn);
  } else if(msg.t === 'send-emoji'){
    hostReceiveEmoji(msg.senderId, msg.emoji);
  }
}

function findPlayer(id){
  return app.game.players.filter(function(p){ return p.id===id; })[0];
}
function allPlayersReady(g){
  // fix: a disconnected player (who hasn't been kicked or reconnected yet) should never
  // block the leader from starting a game - only currently-connected players must be ready.
  var connected = g.players.filter(function(p){ return p.connected!==false; });
  return connected.length>0 && connected.every(function(p){ return p.ready; });
}

function hostTryStartQuick(senderId, roundCount, selectedGames, conn){
  var g = app.game;
  if(senderId !== g.leaderId) return;
  if(!allPlayersReady(g)){ if(conn && conn.send) conn.send({t:'notice', text:'لازم كل اللاعبين يضغطون استعداد أولاً'}); return; }
  hostStartQuickGames(roundCount, selectedGames);
}
function hostTryStartBomb(senderId, cols, scoringMode, roundsTotal, conn){
  var g = app.game;
  if(senderId !== g.leaderId) return;
  if(!allPlayersReady(g)){ if(conn && conn.send) conn.send({t:'notice', text:'لازم كل اللاعبين يضغطون استعداد أولاً'}); return; }
  hostStartBombGame(cols, scoringMode, roundsTotal);
}

function reconnectExistingPlayer(existing, conn){
  var g = app.game;
  // A stale old connection object for this same player might still be sitting in the
  // list (host hasn't detected its death yet) - drop it so we don't keep two.
  app.connections = app.connections.filter(function(c){
    if(c.playerId === existing.id && c !== conn){ try{ c.close(); }catch(e){} return false; }
    return true;
  });
  existing.connected = true;
  existing.disconnectedAt = null;
  conn.playerId = existing.id;
  conn.send({t:'welcome', myId:existing.id, code:g.code});
  broadcastState();
}
// fix #2: a player still counts as "expected to answer" for a few seconds after a
// disconnect is first detected, not just while connected===true - this is the SAME grace
// window used everywhere a round-completion check happens, so a brief hiccup can never
// cause the round to end without that player's already-in-flight answer.
var DISCONNECT_GRACE_MS = 5000;
function hostPlayerCountsAsPresent(p){
  if(p.connected) return true;
  return !!(p.disconnectedAt && (Date.now()-p.disconnectedAt) < DISCONNECT_GRACE_MS);
}
function hostAddOrReconnectPlayer(name, conn, priorId){
  var g = app.game;
  // fix: reconnect by the id the client itself remembers first (most reliable - works
  // even if the host hasn't yet noticed the old connection died, so "connected" is still
  // stale-true), falling back to name-matching for a first-time device with no prior id.
  var existing = priorId ? g.players.filter(function(p){ return p.id===priorId; })[0] : null;
  if(existing){
    reconnectExistingPlayer(existing, conn);
    return;
  }
  var byName = g.players.filter(function(p){ return p.name===name; })[0];
  if(byName){
    if(byName.connected){
      name = name + '-' + rand(1,99); // a genuinely different device using the same display name
    } else {
      reconnectExistingPlayer(byName, conn);
      return;
    }
  }
  if(g.phase !== 'lobby'){
    conn.send({t:'game-in-progress'});
    setTimeout(function(){ conn.close(); }, 300);
    return;
  }
  var id = 'p-'+Math.random().toString(36).substring(2,9);
  conn.playerId = id;
  var newPlayer = {id:id, name:name, score:0, connected:true, ready:false};
  g.players.push(newPlayer);
  if(!g.leaderId) g.leaderId = id;
  conn.send({t:'welcome', myId:id, code:g.code});
  broadcastState();
}

function hostRemovePlayer(id){
  var g = app.game;
  var idx = g.players.findIndex(function(p){return p.id===id;});
  if(idx===-1) return;
  g.players.splice(idx,1);
  if(g.leaderId === id){
    g.leaderId = g.players.length ? g.players[0].id : null;
  }
  broadcastState();
  checkAllInAfterDisconnect(); // fix #2: if the last still-pending player just left/was kicked, the round must be able to complete now instead of waiting forever
}

// New: leader can forcibly remove a player (connected or a stale disconnected ghost) -
// their name/score/data is deleted immediately and their connection is closed so they
// don't try to auto-reconnect back in.
function hostKickPlayer(targetId){
  var conn = app.connections.filter(function(c){ return c.playerId===targetId; })[0];
  if(conn){
    try{ conn.send({t:'kicked'}); }catch(e){}
    try{ conn.close(); }catch(e){}
    app.connections = app.connections.filter(function(c){ return c!==conn; });
  }
  hostRemovePlayer(targetId);
}

function hostHandlePlayerDisconnect(conn){
  if(!conn || !conn.playerId) return;
  var p = findPlayer(conn.playerId);
  if(p){
    p.connected = false;
    p.disconnectedAt = Date.now();
    broadcastState();
    // fix #2: a brief WebRTC hiccup (common with several simultaneous connections) can
    // fire a 'close' event even when the player isn't really gone and reconnects a moment
    // later. Previously we treated every disconnect as final immediately and could end a
    // round without ever collecting that player's already-in-flight answer. Now we wait a
    // short grace period before letting a disconnect actually affect round completion -
    // if they reconnect within it, connected flips back to true and nothing happens.
    var pid = p.id;
    addTimer(setTimeout(function(){
      var p2 = findPlayer(pid);
      if(p2 && p2.connected===false) checkAllInAfterDisconnect();
    }, DISCONNECT_GRACE_MS+200));
  }
  app.connections = app.connections.filter(function(c){ return c!==conn; });
}
function checkAllInAfterDisconnect(){
  // fix #2: this only ever handled the quick-games' round-active phase - if a brief
  // disconnect happened during an ACTIVE FLAGS round (very plausible on real phones over
  // real wifi, never seen on a single-computer test), its grace-period recheck did
  // nothing and the round could stay stuck forever waiting on a player who'd already
  // been excluded. Now it re-checks whichever mode is actually active.
  var g = app.game;
  if(!g) return;
  if(g.phase==='round-active' && g.round){
    var presentIds = g.players.filter(hostPlayerCountsAsPresent).map(function(p){return p.id;});
    var allIn = presentIds.length>0 && presentIds.every(function(id){ return !!g.round.submissions[id]; });
    if(allIn) hostFinishQuickRoundCollection();
  } else if(g.phase==='flags-active' && g.flags){
    var presentIds2 = g.players.filter(hostPlayerCountsAsPresent).map(function(p){return p.id;});
    var allIn2 = presentIds2.length>0 && presentIds2.every(function(id){ return !!g.flags.submissions[id]; });
    if(allIn2) hostFinishFlagsRound();
  } else if(g.phase==='words-active' && g.words){
    hostCheckWordsAllIn();
  }
}

function hostToggleReady(id){
  var p = findPlayer(id);
  if(p){ p.ready = !p.ready; broadcastState(); }
}
function hostAdjustScore(targetId, delta){
  var p = findPlayer(targetId);
  if(p){ p.score = Math.max(0, p.score + delta); broadcastState(); }
}
function hostResetScore(targetId){
  var p = findPlayer(targetId);
  if(p){ p.score = 0; broadcastState(); }
}
function hostResetAllScores(){
  app.game.players.forEach(function(p){ p.score = 0; });
  broadcastState();
}

function broadcastState(){
  var g = app.game;
  var payload = {t:'state', game:g};
  app.connections.forEach(function(c){ if(c.open) c.send(payload); });
  renderAll();
}

// ===================== CLIENT: MESSAGE HANDLING =====================
function clientHandleMessage(msg){
  if(msg.t === 'welcome'){
    app.myPlayerId = msg.myId;
    els.homeStatus.textContent='';
  } else if(msg.t === 'game-in-progress'){
    alert('اللعبة بدأت بالفعل، انتظر حتى تنتهي.');
    resetToHome();
  } else if(msg.t === 'notice'){
    alert(msg.text);
  } else if(msg.t === 'host-closed'){
    alert('قام المضيف بإغلاق الغرفة.');
    resetToHome();
  } else if(msg.t === 'kicked'){
    app.intentionalLeave = true; // don't try to auto-reconnect after being kicked
    alert('تم طردك من الغرفة من قبل القائد.');
    resetToHome();
  } else if(msg.t === 'time-sync-reply'){
    applyTimeSyncReply(msg);
  } else if(msg.t === 'victory-audio-chunk-relay'){
    clientHandleVictoryAudioChunk(msg);
  } else if(msg.t === 'victory-audio-ack'){
    clientHandleVictoryAudioAck(msg);
  } else if(msg.t === 'words-guess-ack'){
    clientHandleWordsAck(msg);
    if(app.game) renderAll();
  } else if(msg.t === 'state'){
    app.game = msg.game;
    // fix #3: send the victory clip ONCE per chosen file (not every game start). It's now
    // sent right away (even in the lobby, when the channel is idle) instead of waiting for
    // the game to start - so it has fully arrived long before anyone can win. It is only
    // re-sent if the display never confirmed it, or after a reconnect under a new id.
    // A small random delay spreads out multiple players' sends.
    if(!app.isHost && app.myPlayerId && app.myVictoryAudioBuffer && !app.victoryAudioSent &&
       !(app.victoryAudioAcked && app.victoryAudioAckedFor === app.myPlayerId)){
      app.victoryAudioSent = true;
      addTimer(setTimeout(startVictoryAudioSend, 500 + Math.random()*2000));
    }
    renderAll();
    if(app.game.phase === 'lobby') showScreen('screen-lobby'); else showScreen('screen-game');
  }
}

function sendToHost(obj){
  obj.senderId = app.myPlayerId;
  if(app.isHost){ hostHandleMessage(obj, {senderId:app.myPlayerId, send:function(){}}); }
  else if(app.hostConn && app.hostConn.open) app.hostConn.send(obj);
}

document.querySelectorAll('.step-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    var input = document.getElementById(btn.getAttribute('data-for'));
    if(!input) return;
    var min = input.min !== '' ? parseInt(input.min,10) : -Infinity;
    var max = input.max !== '' ? parseInt(input.max,10) : Infinity;
    var cur = parseInt(input.value,10);
    if(isNaN(cur)) cur = parseInt(input.defaultValue,10) || (isFinite(min) ? min : 0);

  });
});

// ===================== SCHEDULING =====================
// fix #5: rounds are grouped into consecutive blocks per game type (one block per
// selected game), distributed as evenly as possible with random extras for the
// remainder, and the ORDER of the blocks themselves is randomized.
function buildSchedule(n, selectedGames){
  var games = (selectedGames && selectedGames.length) ? selectedGames.slice() : QUICK_GAME_KEYS.slice();
  var base = Math.floor(n/games.length), rem = n % games.length;
  var counts = {}; games.forEach(function(k){counts[k]=base;});
  var extra = pickN(games, rem);
  extra.forEach(function(k){ counts[k]++; });
  var blockOrder = shuffle(games);
  var seq = [];
  blockOrder.forEach(function(k){ for(var i=0;i<counts[k];i++) seq.push(k); });
  return seq;
}

// ===================== HOST: QUICK GAMES FLOW =====================
// NOTE (fix #1): a quick round NEVER ends on a timer. It only ends once every
// currently-connected player has submitted an answer. The hidden 11s countdown
// is used exclusively inside computeScore() for the speed bonus.
function hostStartQuickGames(roundCount, selectedGames){
  var g = app.game;
  roundCount = Math.max(1, Math.min(60, roundCount||10));
  var games = (selectedGames && selectedGames.length) ? selectedGames.filter(function(k){ return QUICK_GAME_KEYS.indexOf(k)>-1; }) : QUICK_GAME_KEYS.slice();
  if(!games.length) games = QUICK_GAME_KEYS.slice();
  g.mode = 'quick';
  g.schedule = buildSchedule(roundCount, games);
  g.scheduleIndex = 0;
  g.totalRounds = g.schedule.length;
  g.round = null;
  hostBeginNextQuickRound();
}

function hostBeginNextQuickRound(){
  var g = app.game;
  if(!g || g.mode!=='quick') return;
  if(g.scheduleIndex >= g.schedule.length){
    var sorted = g.players.slice().sort(function(a,b){ return b.score-a.score; });
    g.winnerId = sorted.length ? sorted[0].id : null;
    g.celebration = { bursts:[], sessionId: Math.random().toString(36).substring(2,9) };
    g.phase = 'quick-finished';
    g.round = null;
    broadcastState();
    return;
  }
  var key = g.schedule[g.scheduleIndex];
  g.scheduleIndex++;
  g.round = { key:key, slotNumber:g.scheduleIndex, totalSlots:g.schedule.length,
    nextKey: (g.scheduleIndex < g.schedule.length) ? g.schedule[g.scheduleIndex] : null };
  startQuickRoundPhaseReady();
}

function startQuickRoundPhaseReady(){
  var g = app.game;
  g.phase = 'round-ready';
  g.round.readyStartAt = syncedNow()+300;
  g.round.data = null; g.round.submissions = {}; g.round.results = null;
  broadcastState();
  addTimer(setTimeout(function(){ startQuickRoundActive(); }, 3300));
}

function startQuickRoundActive(){
  var g = app.game;
  var mod = GAME_MODULES[g.round.key];
  g.round.data = mod.generate(g.players);
  g.phase = 'round-active';
  g.round.activeStartAt = syncedNow()+250;
  g.round.questionPostedAt = g.round.activeStartAt + mod.unlockAt(g.round.data);
  broadcastState();
  // No forced end-of-round timer anymore: we simply wait for all connected
  // players to submit (see hostReceiveAnswer / checkAllInAfterDisconnect).
}

function hostReceiveAnswer(playerId, value){
  var g = app.game;
  if(!g.round || g.phase!=='round-active') return;
  if(g.round.submissions[playerId]) return;
  g.round.submissions[playerId] = {value:value, t:syncedNow()};
  broadcastState();
  // fix #2: use the SAME grace-period-aware presence check as checkAllInAfterDisconnect,
  // so a player mid-reconnect (briefly connected:false) still counts as expected to
  // answer instead of letting the round finish without them.
  var presentIds = g.players.filter(hostPlayerCountsAsPresent).map(function(p){return p.id;});
  var allIn = presentIds.length>0 && presentIds.every(function(id){ return !!g.round.submissions[id]; });
  if(allIn){ hostFinishQuickRoundCollection(); }
}

function hostFinishQuickRoundCollection(){
  var g = app.game;
  if(!g.round || g.phase!=='round-active') return;
  var mod = GAME_MODULES[g.round.key];
  var results = mod.evaluate(g.round.data, g.round.submissions, g.players, g.round.questionPostedAt);
  g.round.results = results;
  g.round.revealStartAt = syncedNow()+150;
  results.perPlayer && Object.keys(results.perPlayer).forEach(function(pid){
    var p = findPlayer(pid);
    if(p) p.score += results.perPlayer[pid].score;
  });
  g.phase = 'round-reveal';
  broadcastState();
  // Fix #3: no auto-advance. We wait for the leader to press "next round".
}

// fix #4/#1: relay a player's uploaded victory clip to every device once, out-of-band
// from the regular reactive state broadcast (this data must never ride along with `g`) -
// now reassembled from small chunks and re-streamed to everyone chunk-by-chunk as they
// arrive, rather than waiting for (and re-sending) one giant message.
var incomingVictoryTransfersHost = {};
function hostRelayVictoryAudioChunk(senderId, msg, conn){
  // fix: no longer relayed to the other players' phones - only this display device ever
  // plays victory music, and the relay was just flooding everyone's connection.
  if(!senderId) return;
  var key = senderId+'|'+msg.transferId;
  reassembleVictoryChunk(incomingVictoryTransfersHost, key, msg, function(full, mime){
    // drop any other half-finished transfers from this same player
    Object.keys(incomingVictoryTransfersHost).forEach(function(k){ if(k.indexOf(senderId+'|')===0) delete incomingVictoryTransfersHost[k]; });
    var buf;
    try{ buf = base64ToArrayBuffer(full); }catch(e){ return; } // corrupt - player will retry (no ack)
    prepareVictoryClip(senderId, buf, mime, function(ok){
      try{ if(conn && conn.open) conn.send({t:'victory-audio-ack', transferId:msg.transferId, ok:ok}); }catch(e){}
    });
  });
}
// fix #4: only the crowned winner may fire celebration emoji, rate-limited to 1/second.
function hostReceiveEmoji(senderId, emoji){
  var g = app.game;
  if(!g.celebration || senderId !== g.winnerId) return;
  if(CELEBRATION_EMOJIS.indexOf(emoji) === -1) return;
  var now = syncedNow();
  if(g.celebration.lastEmojiAt && now - g.celebration.lastEmojiAt < 200) return;
  g.celebration.lastEmojiAt = now;
  g.celebration.bursts = g.celebration.bursts.filter(function(b){ return now - b.spawnedAt < 8000; });
  g.celebration.bursts.push({ id: Math.random().toString(36).substring(2,9), emoji:emoji, spawnedAt: now });

function roundSignature(round){
  if(!round) return null;
  return round.key+'|'+round.slotNumber+'|'+round.readyStartAt;
}
// Build a container's contents only once per unique `key`; returns true if it actually
// (re)built. Prevents tearing out interactive elements on every animation tick, which
// was causing taps to sometimes require 2-3 presses (fix #4).
function buildOnce(container, key, buildFn){
  if(container._builtKey === key) return false;

}
