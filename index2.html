function clearArenaSlots(){
  var old = els.arenaWrap.querySelectorAll('.player-slot');
  old.forEach(function(n){ n.remove(); });
}

// Per-player reveal-animation bookkeeping (which tick count we last played a sound for,
// whether the final correct/wrong sound already fired) - keyed by round-signature+playerId
// so it naturally resets on every new round.
var slotRevealAudio = {};
function slotAudioState(round, p){
  var key = roundSignature(round)+'|'+p.id;
  var st = slotRevealAudio[key];
  if(!st){ st = {lastCount:-1, done:false}; slotRevealAudio[key] = st; }
  return st;
}
// fix #2: counting-type games reveal ONE PLAYER AT A TIME (in player-list order) - each
// player's counter runs from 1 up to their own answer before the next player's starts.
var slotSeqCache = { sig:null, offsets:null };
function getSlotSequenceOffsets(round, players){
  var sig = roundSignature(round);
  if(slotSeqCache.sig === sig) return slotSeqCache.offsets;
  var offsets = {}; var cum = 0;
  players.forEach(function(p){
    var sub = round.submissions[p.id];
    var value = sub ? Math.max(0, parseInt(sub.value,10)||0) : 0;
    offsets[p.id] = cum;
    cum += (sub ? countDurationMs(value) : 0) + 500; // 0.5s pause before the next player starts
  });
  slotSeqCache = { sig:sig, offsets:offsets };
  return offsets;
}
// fix #5: how long the DISPLAY takes to finish showing every player's result, so each
// player's own device can hold back their personal correct/wrong message until after
// that - otherwise everyone learns their own result before the big screen catches up,
// which kills the suspense.
function computeRevealTotalDuration(round, players){
  var mod = GAME_MODULES[round.key];
  if(mod.inputType === 'counter'){
    var extraDelay = mod.revealDelayMs ? mod.revealDelayMs(round.data) : 0;
    var offsets = getSlotSequenceOffsets(round, players);
    var maxEnd = 0;
    players.forEach(function(p){
      var sub = round.submissions[p.id];
      var value = sub ? Math.max(0, parseInt(sub.value,10)||0) : 0;
      var end = (offsets[p.id]||0) + (sub ? countDurationMs(value) : 0);
      if(end > maxEnd) maxEnd = end;
    });
    return extraDelay + maxEnd + 400;
  }
  return Math.max(0, players.length-1)*1000 + 1400;
}
function counterStatusHTML(p, round, extraDelay, myOffset){
  var st = slotAudioState(round, p);
  var sub = round.submissions[p.id];
  if(!sub) return { circle:'<div class="status-circle"></div>', count:'' };
  var value = Math.max(0, parseInt(sub.value,10) || 0);
  var elapsed = syncedNow() - (round.revealStartAt||syncedNow()) - (extraDelay||0) - (myOffset||0);
  if(elapsed < 0) return { circle:'<div class="status-circle gold"></div>', count:'' }; // waiting for their turn
  var count = acceleratingCount(elapsed, value);
  if(count < value){
    if(count > st.lastCount){ st.lastCount = count; if(count>0) playTick(count); }
    // fix #2: the running number lives OUTSIDE the circle so it doesn't get wiped out
    // when the circle switches to the final check/cross mark.
    return { circle:'<div class="status-circle gold"></div>', count:String(count) };
  }
  if(st.lastCount < value) st.lastCount = value;
  var res = round.results.perPlayer[p.id];
  var correct = !!(res && res.correct);
  if(!st.done){ st.done = true; playSound(correct ? 'correct' : 'wrong'); }
  return { circle:'<div class="status-circle '+(correct?'correct':'wrong')+'">'+(correct?'✔':'✖')+'</div>', count:String(value) };
}
function renderPlayerSlots(){
  clearArenaSlots();
  var g = app.game;
  var players = g.players;
  var mod = g.round ? GAME_MODULES[g.round.key] : null;
  var isCounterGame = !!(mod && mod.inputType === 'counter');
  var seqOffsets = (g.round && g.round.results && isCounterGame) ? getSlotSequenceOffsets(g.round, players) : null;
  players.forEach(function(p, idx){
    var slotNum = SLOT_ORDER[idx % 12];
    var pos = SLOT_POS[slotNum];
    var div = document.createElement('div');
    div.className = 'player-slot';
    Object.keys(pos).forEach(function(k){ div.style[k] = pos[k]; });
    var circleHTML, countHTML = '';
    if(g.round && g.round.results){
      if(isCounterGame){
        var extraDelay = mod.revealDelayMs ? mod.revealDelayMs(g.round.data) : 0;
        var res2 = counterStatusHTML(p, g.round, extraDelay, seqOffsets[p.id]);
        circleHTML = res2.circle;
        countHTML = '<div class="count-label">'+res2.count+'</div>';
      } else {
        // fix #3: find-number / remember-path now also play correct/wrong sound on reveal.
        var revealElapsed = syncedNow() - (g.round.revealStartAt||0);
        var myDelay = idx*1000; // 1 second between each player's reveal
        var statusClass = '';
        if(revealElapsed >= myDelay){
          var r = g.round.results.perPlayer[p.id];
          statusClass = r ? (r.correct ? 'correct':'wrong') : '';
          var st2 = slotAudioState(g.round, p);
          if(!st2.done && statusClass){ st2.done = true; playSound(statusClass==='correct' ? 'correct' : 'wrong'); }
        } else {
          statusClass = g.round.submissions && g.round.submissions[p.id] ? 'gold' : '';
        }
        circleHTML = '<div class="status-circle '+statusClass+'">'+(statusClass==='correct'?'✔':statusClass==='wrong'?'✖':'')+'</div>';
      }
    } else if(g.round && g.round.submissions && g.round.submissions[p.id]){
      circleHTML = '<div class="status-circle gold"></div>';
    } else {
      circleHTML = '<div class="status-circle"></div>';
    }
    div.innerHTML = circleHTML + countHTML +
      '<div class="pname">'+escapeHtml(p.name)+'</div>'+
      '<div class="pscore">'+fmtScore(p.score)+'</div>';
    els.arenaWrap.appendChild(div);

  });
}

function flagsSignature(flags){ return 'flags|'+flags.roundNumber+'|'+flags.readyStartAt; }
function computeFlagsRevealTotalDuration(players){ return Math.max(0, players.length-1)*1000 + 1400; }
function renderPlayerSlotsFlags(){
  clearArenaSlots();

  players.forEach(function(p, idx){

    var circleHTML;
    if(g.flags && g.flags.results){
      var revealElapsed = syncedNow() - (g.flags.revealStartAt||0);
      var myDelay = idx*1000; // same 1-second stagger as the other grid/sequence games
      var statusClass = '';
      if(revealElapsed >= myDelay){
        var r = g.flags.results.perPlayer[p.id];
        statusClass = r ? (r.correct ? 'correct':'wrong') : '';
        var key = flagsSignature(g.flags)+'|'+p.id;
        var st = slotRevealAudio[key];
        if(!st){ st = {lastCount:-1, done:false}; slotRevealAudio[key] = st; }
        if(!st.done && statusClass){ st.done = true; playSound(statusClass==='correct' ? 'correct' : 'wrong'); }
      } else {
        statusClass = g.flags.submissions && g.flags.submissions[p.id] ? 'gold' : '';
      }
      circleHTML = '<div class="status-circle '+statusClass+'">'+(statusClass==='correct'?'✔':statusClass==='wrong'?'✖':'')+'</div>';
    } else if(g.flags && g.flags.submissions && g.flags.submissions[p.id]){
      circleHTML = '<div class="status-circle gold"></div>';
    } else {
      circleHTML = '<div class="status-circle"></div>';
    }
    div.innerHTML = circleHTML +
      '<div class="pname">'+escapeHtml(p.name)+'</div>'+
      '<div class="pscore">'+fmtScore(p.score)+'</div>';
    els.arenaWrap.appendChild(div);
  });
}
var flagMoveSoundTracker = { sig:null, lastIdx:-1 };
function checkFlagMoveSound(g, elapsed){
  // Display-only, exactly like Appear.mp3 elsewhere - never plays on a player's phone.
  var sig = flagsSignature(g.flags);
  if(flagMoveSoundTracker.sig !== sig){ flagMoveSoundTracker = {sig:sig, lastIdx:-1}; }
  var idx = Math.floor(elapsed/1000);
  if(idx > flagMoveSoundTracker.lastIdx && idx < g.flags.sequence.length){
    flagMoveSoundTracker.lastIdx = idx;
    var dir = g.flags.sequence[idx];
    playSound((dir==='left'||dir==='right') ? 'flag-lr' : 'flag-ud');
  }
}
// fix: the correct-sequence icons should use as much of the available screen as
// possible - bigger when there are few moves and more room, smaller once there are many
// moves to fit. sizeMode 'display' targets the big shared screen; 'player' keeps a more
// modest, wrap-friendly size for the phone's own comparison row.
function computeFlagsSeqItemSize(count, sizeMode){
  if(sizeMode === 'player'){
    var availWp = Math.min(window.innerWidth*0.9, 500);
    var perRowp = Math.min(count, 6);
    return Math.floor(Math.min(60, Math.max(30, availWp/perRowp - 10)));
  }
  var availW = Math.min(window.innerWidth*0.88, 1600);
  var availH = Math.min(window.innerHeight*0.5, 600);
  var gap = 12;
  var perItemByWidth = (availW - gap*Math.max(0,count-1)) / count;
  return Math.floor(Math.max(40, Math.min(200, perItemByWidth, availH)));
}
function buildFlagsSeqRow(container, sequence, myValue, sizeMode){
  container.innerHTML = '';
  var row = document.createElement('div');
  row.className = 'flags-seq-row';
  var prefix = flagImageColorPrefix(app.game.theme||0);
  var size = computeFlagsSeqItemSize(sequence.length, sizeMode);
  sequence.forEach(function(dir, i){
    var item = document.createElement('div');
    item.className = 'flags-seq-item';
    item.style.width = size+'px';
    item.style.height = size+'px';
    var img = document.createElement('img');
    img.src = FLAG_IMG_URLS[prefix][dir];
    img.style.cssText = 'max-width:100%;max-height:100%;';
    item.appendChild(img);
    if(myValue){
      var mine = myValue[i];
      if(mine!=null){
        item.classList.add('my-pick');
        var badge = document.createElement('div');
        badge.className = 'my-pick-badge' + (mine===dir ? ' good' : '');
        badge.textContent = mine===dir ? '✔' : '✖';
        var bsize = Math.max(14, Math.round(size*0.4));
        badge.style.width = bsize+'px';
        badge.style.height = bsize+'px';
        badge.style.fontSize = Math.max(9, Math.round(bsize*0.55))+'px';
        item.appendChild(badge);
      }
    }
    row.appendChild(item);
  });
  container.appendChild(row);
}
function renderFlagsDisplay(){
  var g = app.game;
  if(g.phase === 'flags-finished'){
    els.pcontrolsWrap.classList.add('hidden');
    els.displayWrap.classList.add('hidden');
    renderWinnerScreen();
    return;
  }
  hideWinnerScreen();
  els.pcontrolsWrap.classList.add('hidden');
  els.displayWrap.classList.remove('hidden');
  els.gameNameLabel.textContent = 'لعبة الأعلام 🚩';
  els.roundIndicator.textContent = 'الجولة '+g.flags.roundNumber+'/'+g.flagsConfig.roundsTotal;
  els.roundOverlay.classList.remove('active');
  renderPlayerSlotsFlags();
  els.nextRoundLabel.classList.add('hidden');

  if(g.phase === 'flags-ready'){
    var remain = Math.max(0, Math.ceil((g.flags.readyStartAt+3000-syncedNow())/1000));
    els.readyGtitle.textContent = 'لعبة الأعلام - '+g.flags.sequence.length+' حركات';
    els.readyCdnum.textContent = remain>0 ? remain : '🚀';
    els.readyOverlay.style.display = 'flex';
    els.arenaCenter.innerHTML = '';
    return;
  }
  els.readyOverlay.style.display = 'none';

  if(g.phase === 'flags-active'){
    var elapsed = syncedNow() - g.flags.activeStartAt;
    var seq = g.flags.sequence;
    var unlockAt = seq.length*1000;
    els.arenaCenter.innerHTML = '';
    if(elapsed < unlockAt){
      var idx = Math.max(0, Math.min(seq.length-1, Math.floor(elapsed/1000)));
      var dir = seq[idx];
      var prefix = flagImageColorPrefix(g.theme||0);
      var img = document.createElement('img');
      img.src = FLAG_IMG_URLS[prefix][dir];
      img.style.cssText = 'max-width:min(50vh,320px);max-height:min(50vh,320px);';
      els.arenaCenter.appendChild(img);
      if(elapsed>=0) checkFlagMoveSound(g, elapsed);
    } else {
      var label = document.createElement('div');
      label.className = 'answer-label';
      label.textContent = 'أرسل التسلسل من جهازك';
      els.arenaCenter.appendChild(label);
    }
    return;
  }

  if(g.phase === 'flags-reveal'){
    buildFlagsSeqRow(els.arenaCenter, g.flags.sequence, null, 'display');
    var label2 = document.createElement('div');
    label2.className = 'answer-label';
    label2.textContent = 'هذا هو التسلسل الصحيح';
    els.arenaCenter.appendChild(label2);
    var nextLen = g.flags.roundNumber < g.flagsConfig.roundsTotal ? (g.flags.sequence.length+1) : null;
    els.nextRoundLabel.textContent = nextLen ? ('الجولة القادمة: '+nextLen+' حركات') : '';
    els.nextRoundLabel.classList.remove('hidden');
  }
}
function renderFlagsPlayer(){
  var g = app.game;
  var me = findPlayer(app.myPlayerId);
  var isLeader = app.myPlayerId === g.leaderId;
  updateDpadTheme(g.theme||0);
  els.pScoreLabel.textContent = me ? fmtScore(me.score) : '0';
  els.btnNextRound.classList.add('hidden');
  els.btnBombNewRound.classList.add('hidden');
  els.btnBombToLobby.classList.add('hidden');
  els.pgridContainer.classList.add('hidden');
  els.counterContainer.classList.add('hidden');
  els.flagsPadContainer.classList.add('hidden');

  if(g.phase === 'flags-finished'){
    els.displayWrap.classList.add('hidden');
    els.pcontrolsWrap.classList.add('hidden');
    renderWinnerScreen();
    return;
  }
  hideWinnerScreen();
  els.displayWrap.classList.add('hidden');
  els.pcontrolsWrap.classList.remove('hidden');
  els.roundOverlay.classList.remove('active');
  els.pRoundIndicator.textContent = g.flags.roundNumber+'/'+g.flagsConfig.roundsTotal;
  els.pGameNameLabel.textContent = 'لعبة الأعلام 🚩';

  var fsig = flagsSignature(g.flags);
  if(fsig !== clientInput.lastFlagsSig){
    clientInput.lastFlagsSig = fsig;
    clientInput.flagsSeq = [];
    clientInput.flagsSubmitted = false;
    els.flagsCharImg.classList.add('hidden');
  }

  if(g.phase === 'flags-ready'){
    els.notifBar.textContent = 'استعد... لعبة الأعلام ('+g.flags.sequence.length+' حركات)';
    els.submittedLabel.classList.add('hidden');
    els.btnSubmit.classList.add('hidden');
    return;
  }

  if(g.phase === 'flags-reveal'){
    els.submittedLabel.classList.remove('hidden');
    els.btnSubmit.classList.add('hidden');
    els.notifBar.textContent = (g.flags.roundNumber < g.flagsConfig.roundsTotal) ? ('الجولة القادمة: '+(g.flags.sequence.length+1)+' حركات') : 'كانت هذه آخر جولة';
    var revealElapsed = syncedNow() - (g.flags.revealStartAt||syncedNow());
    var totalRevealDur = computeFlagsRevealTotalDuration(g.players);
    if(revealElapsed < totalRevealDur){
      els.submittedLabel.textContent = 'SUBMITED!';
      els.submittedLabel.style.color = 'var(--green)';
    } else {
      var r = g.flags.results ? g.flags.results.perPlayer[app.myPlayerId] : null;
      els.submittedLabel.textContent = r ? (r.correct? '✔ إجابة صحيحة! +'+Math.round(r.score) : '✖ إجابة خاطئة') : '';
      els.submittedLabel.style.color = r && r.correct ? 'var(--green)' : 'var(--red)';
      var ansSig = 'flagsown-'+fsig;
      if(els.pgridContainer._builtKey !== ansSig){
        var mySub = g.flags.submissions ? g.flags.submissions[app.myPlayerId] : null;
        buildFlagsSeqRow(els.pgridContainer, g.flags.sequence, mySub ? mySub.value : null, 'player');
        els.pgridContainer._builtKey = ansSig;
      }
      els.pgridContainer.classList.remove('hidden');
    }
    if(isLeader){
      els.btnNextRound.textContent = (g.flags.roundNumber < g.flagsConfig.roundsTotal) ? ('▶ التالي: '+(g.flags.sequence.length+1)+' حركات') : '▶ عرض النتيجة النهائية';
      els.btnNextRound.classList.remove('hidden');
      els.btnBombToLobby.classList.remove('hidden');
    }
    return;
  }

  // phase === 'flags-active'
  var elapsed = syncedNow() - g.flags.activeStartAt;
  var unlockAt = g.flags.sequence.length*1000;
  var locked = elapsed < unlockAt;
  var already = g.flags.submissions && g.flags.submissions[app.myPlayerId];

  if(already || clientInput.flagsSubmitted){
    els.notifBar.textContent = 'تم الإرسال، بانتظار البقية...';
    els.submittedLabel.classList.remove('hidden');
    els.submittedLabel.textContent = 'SUBMITED!';
    els.submittedLabel.style.color = 'var(--green)';
    return;
  }
  els.submittedLabel.classList.add('hidden');
  els.notifBar.textContent = locked ? 'راقب الشاشة الرئيسية...' : ('رتّب نفس تسلسل العلم ('+(g.flags.sequence.length-clientInput.flagsSeq.length)+' حركة متبقية)');
  if(!locked){
    els.flagsPadContainer.classList.remove('hidden');
    els.flagsRemaining.textContent = g.flags.sequence.length - clientInput.flagsSeq.length;
    els.dpadUp.disabled = false; els.dpadDown.disabled = false; els.dpadLeft.disabled = false; els.dpadRight.disabled = false;
  }
}

function renderQuickPlayer(){
  var g = app.game;

  var isLeader = app.myPlayerId === g.leaderId;
  els.pScoreLabel.textContent = me ? fmtScore(me.score) : '0';
  els.btnNextRound.classList.add('hidden');
  els.btnBombNewRound.classList.add('hidden');
  els.btnBombToLobby.classList.add('hidden');

  if(g.phase === 'quick-finished'){
    renderWinnerScreen();
    return;
  }
  hideWinnerScreen();
  els.roundOverlay.classList.remove('active');
  var round = g.round;
  if(!round) return;
  els.pRoundIndicator.textContent = round.slotNumber+'/'+round.totalSlots;
  els.pGameNameLabel.textContent = GAME_LABELS[round.key];

  var sig = roundSignature(round);
  if(sig !== clientInput.lastRoundSig){
    clientInput.lastRoundSig = sig;
    clientInput.gridValue = null; clientInput.counterValue = 0; clientInput.pathArray=[];
    clientInput.submitted = false;
    els.pgridContainer._builtKey = null;
  }
  var mod = GAME_MODULES[round.key];

  if(g.phase === 'round-ready'){

    els.counterContainer.classList.add('hidden');
    els.btnSubmit.classList.add('hidden');
    els.submittedLabel.classList.add('hidden');
    return;
  }

  if(g.phase === 'round-reveal'){
    els.pgridContainer.classList.add('hidden');
    els.counterContainer.classList.add('hidden');
    els.btnSubmit.classList.add('hidden');
    els.submittedLabel.classList.remove('hidden');
    els.notifBar.textContent = round.nextKey ? ('الجولة القادمة: '+GAME_LABELS[round.nextKey]) : 'كانت هذه آخر جولة';
    // fix #5: hold back this player's own correct/wrong result until the shared display
    // has finished revealing everyone's results, so it isn't spoiled early.
    var revealElapsed = syncedNow() - (round.revealStartAt||syncedNow());
    var totalRevealDur = computeRevealTotalDuration(round, g.players);
    if(revealElapsed < totalRevealDur){
      els.submittedLabel.textContent = 'SUBMITED!';
      els.submittedLabel.style.color = 'var(--green)';
    } else {
      var r = round.results ? round.results.perPlayer[app.myPlayerId] : null;
      els.submittedLabel.textContent = r ? (r.correct? '✔ إجابة صحيحة! +'+Math.round(r.score) : '✖ إجابة خاطئة') : '';
      els.submittedLabel.style.color = r && r.correct ? 'var(--green)' : 'var(--red)';
      // new: for grid-based games, also show the player their own picked answer next to
      // the correct one so they can see exactly what went right/wrong.
      if(mod.inputType !== 'counter' && mod.renderPlayerOwnAnswer){
        var ansSig = 'ownanswer-'+sig;
        if(els.pgridContainer._builtKey !== ansSig){
          var mySub = round.submissions ? round.submissions[app.myPlayerId] : null;
          mod.renderPlayerOwnAnswer(els.pgridContainer, round, mySub ? mySub.value : null);
          els.pgridContainer._builtKey = ansSig;
        }
        els.pgridContainer.classList.remove('hidden');
      }
    }
    if(isLeader){
      els.btnNextRound.textContent = round.nextKey ? ('▶ التالي: '+GAME_LABELS[round.nextKey]) : '▶ عرض النتيجة النهائية';
      els.btnNextRound.classList.remove('hidden');
      els.btnBombToLobby.classList.remove('hidden');
    }
    return;
  }

  // phase === 'round-active'
  var elapsed = syncedNow() - round.activeStartAt;
  var unlockAt = mod.unlockAt(round.data);
  var locked = elapsed < unlockAt;
  var already = round.submissions && round.submissions[app.myPlayerId];

  if(already || clientInput.submitted){
    els.notifBar.textContent = 'تم الإرسال، بانتظار البقية...';
    els.pgridContainer.classList.add('hidden');
    els.counterContainer.classList.add('hidden');
    els.btnSubmit.classList.add('hidden');
    els.submittedLabel.classList.remove('hidden');
    els.submittedLabel.textContent = 'SUBMITED!';
    els.submittedLabel.style.color = 'var(--green)';
    return;
  }

  els.submittedLabel.classList.add('hidden');
  els.notifBar.textContent = locked ? 'راقب الشاشة الرئيسية...' : mod.notifText(round);

  if(mod.inputType === 'counter'){
    els.pgridContainer.classList.add('hidden');
    els.counterContainer.classList.remove('hidden');
    els.counterNum.textContent = clientInput.counterValue;
    els.counterBtn.disabled = locked;
    els.counterMinusBtn.disabled = locked;
    els.btnSubmit.classList.remove('hidden');
    els.btnSubmit.disabled = locked;
  } else {
    els.counterContainer.classList.add('hidden');
    els.pgridContainer.classList.remove('hidden');
    if(locked){
      els.pgridContainer._builtKey = null; // keep mirroring live while locked
      mod.renderPlayerGridLocked(els.pgridContainer, round);
      els.btnSubmit.classList.add('hidden');
    } else {
      mod.renderPlayerGridInteractive(els.pgridContainer, round, sig);
      els.btnSubmit.classList.remove('hidden');
      els.btnSubmit.disabled = mod.inputType==='grid-single' ? (clientInput.gridValue==null) : (clientInput.pathArray.length===0);
    }
  }
}

function renderEmojiBursts(g){

      span.textContent = burst.emoji;
      span._spawnedAt = burst.spawnedAt;
      span._x = 5 + rnd()*88;
      span._delay = rnd()*1000;
      span._drift = (rnd()-0.5)*10;
      span._phase = rnd()*6.28;
      layer.appendChild(span);
    }
  });
  Array.prototype.slice.call(layer.children).forEach(function(span){
    var age = now - span._spawnedAt - span._delay;
    if(age < 0){ span.style.opacity = '0'; return; }
    if(age > lifetime){ span.remove(); return; }
    var progress = age/lifetime;
    var y = 108 - progress*126;
    var x = span._x + Math.sin(progress*6+span._phase)*span._drift;
    span.style.left = x+'%';
    span.style.top = y+'%';
    span.style.opacity = String(0.72 * (progress<0.85 ? 1 : Math.max(0,(1-(progress-0.85)/0.15))));

// ===================== SCORING =====================
// Shared accelerating count-up model used by every reveal counter (cube check-off and
// per-player answer counters): starts at 10 counts/sec, speeds up by +5/sec every second.
// count(t) = 10t + 2.5t^2  (integral of rate(t) = 10 + 5t)
function acceleratingCount(elapsedMs, maxValue){
  var t = Math.max(0, elapsedMs/1000);
  var raw = 10*t + 2.5*t*t;
  return Math.max(0, Math.min(maxValue, Math.floor(raw)));
}
// Inverse: how long (ms) it takes the accelerating counter to reach `value`.
function countDurationMs(value){
  value = Math.max(0, value||0);
  if(value<=0) return 150;
  var t = (-10 + Math.sqrt(100 + 10*value)) / 5;
  return Math.max(150, t*1000);
}
function computeScore(correct, submittedAt, questionPostedAt, rankAmongCorrect, numPlayers){
  if(!correct) return 0;
  var elapsedSec = Math.max(0,(submittedAt - questionPostedAt)/1000);
  var remaining = 11 - elapsedSec;
  var bonusPct = Math.max(0, Math.min(1, remaining/10));
  var x = 10;
  var bonus = bonusPct*2*x;
  var n = numPlayers - (rankAmongCorrect-1);
  var placement = n*(x/10);
  return x + bonus + placement;
}
function genericEvaluate(isCorrectFn, data, submissions, players, questionPostedAt){
  var order = Object.keys(submissions)
    .filter(function(pid){ return isCorrectFn(data, submissions[pid].value); })
    .sort(function(a,b){ return submissions[a].t - submissions[b].t; });
  var perPlayer = {};
  var numPlayers = players.length;
  Object.keys(submissions).forEach(function(pid){
    var correct = isCorrectFn(data, submissions[pid].value);
    var rank = order.indexOf(pid)+1;
    var score = correct ? computeScore(true, submissions[pid].t, questionPostedAt, rank, numPlayers) : 0;
    perPlayer[pid] = {correct:correct, score:score};
  });
  players.forEach(function(p){ if(!perPlayer[p.id]) perPlayer[p.id] = {correct:false, score:0}; });
  return {perPlayer:perPlayer};
}
function idxToRC(i){ return {row:Math.floor(i/5), col:i%5}; }

function buildGrid5(container){

// ===================== GAME 1: find-number =====================
// fix #4: play Appear.mp3 exactly once each time a new number / new red-square batch
// shows up. Keyed by round-signature so it resets automatically every round; each device
// (host display OR a player's phone) only ever runs ONE of the two call sites below, so a
// single shared tracker per game is safe.
var appearTrackers = {};
function checkAppear(trackerKey, round, currentCount){
  var sig = roundSignature(round);
  var st = appearTrackers[trackerKey];
  if(!st || st.sig!==sig){ st = {sig:sig, last:-1}; appearTrackers[trackerKey]=st; }
  if(currentCount > st.last){
    st.last = currentCount;
    playSound('appear');
  }
}
// fix: pick numbers that are spread out (no obvious decade/pattern trick for players to
// exploit like before) but still genuinely random - reject candidates that land too close
// to an already-picked number, falling back to plain unique random if that ever fails.
function pickSpreadNumbers(count, min, max, minGap){
  for(var attempt=0; attempt<300; attempt++){
    var picked = [];
    var candidates = shuffle(range(min,max));
    for(var i=0; i<candidates.length && picked.length<count; i++){
      var c = candidates[i];
      if(picked.every(function(n){ return Math.abs(n-c) >= minGap; })) picked.push(c);
    }
    if(picked.length === count) return picked;
  }
  return pickN(range(min,max), count);
}
var G1 = {
  inputType:'grid-single',
  generate:function(players){
    var cellIdxs = pickN(range(0,24), 10);
    var values = pickSpreadNumbers(10, 1, 99, 6);
    var cells = cellIdxs.map(function(ci, order){ return {cell:ci, value:values[order], revealAt:order*1000}; });
    var hideAt = (cells.length-1)*1000 + 3000;
    var targetIndex = rand(0,9);
    return { cells:cells, hideAt:hideAt, targetCell:cells[targetIndex].cell, targetValue:cells[targetIndex].value };
  },
  unlockAt:function(data){ return data.hideAt; },
  notifText:function(round){ return 'اوجد موقع الرقم '+round.data.targetValue; },
  renderDisplay:function(container, round){
    var data = round.data;
    var elapsed = syncedNow() - round.activeStartAt;
    var cells = buildGrid5(container);
    var revealedCount = 0;
    data.cells.forEach(function(c){
      var el = cells[c.cell];
      if(elapsed >= c.revealAt){
        el.classList.add('red');
        el.textContent = elapsed < data.hideAt ? c.value : '';
        revealedCount++;
      }
    });
    checkAppear('g1-display', round, revealedCount);
    var label = document.createElement('div');
    label.className = 'answer-label';
    if(elapsed >= data.hideAt) label.textContent = 'أوجد موقع الرقم: '+data.targetValue;
    container.appendChild(label);
  },
  renderAnswerReveal:function(container, round){
    // fix #7: show every number that appeared (in red), with the correct one in blue -
    // not just the target cell on its own.
    var data = round.data;
    var cells = buildGrid5(container);
    data.cells.forEach(function(c){
      cells[c.cell].classList.add(c.cell===data.targetCell ? 'blue' : 'red');
      cells[c.cell].textContent = c.value;
    });
    var label = document.createElement('div');
    label.className = 'answer-label';
    label.textContent = 'الإجابة الصحيحة: الرقم '+data.targetValue;
    container.appendChild(label);
  },
  // New: shown on the PLAYER's own device once the display has finished its reveal -
  // same correct-answer grid, plus a ring around whichever cell they personally picked
  // so they can immediately see whether/where they went wrong.
  renderPlayerOwnAnswer:function(container, round, myValue){
    var data = round.data;
    var cells = buildGrid5(container);
    data.cells.forEach(function(c){
      cells[c.cell].classList.add(c.cell===data.targetCell ? 'blue' : 'red');
      cells[c.cell].textContent = c.value;
    });
    if(myValue!=null && cells[myValue]){
      cells[myValue].classList.add('my-pick');
      var badge = document.createElement('div');

    // fix #6: cap the running total at 45 so it stays answerable - trim down random
    // seconds that still have more than 1 square until we're at/under the cap.
    var guard = 0;
    while(target>45 && guard<2000){

      for(var k=0;k<n;k++){
        var pos; var tries=0;
        do{ pos = Math.floor(rnd()*25); tries++; } while(used[pos] && tries<50);

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

// ===================== GAME 3: remember-path =====================
function generatePath(){
  for(var attempt=0; attempt<60; attempt++){
    var targetLen = rand(9,18);
    var start = rand(0,24);
    var path = [start];
    var visited = {}; visited[start]=true;
    var ok = true;
    while(path.length < targetLen){
      var cur = path[path.length-1];
      var rc = idxToRC(cur);
      var neighbors = [];
      [[0,1],[0,-1],[1,0],[-1,0]].forEach(function(d){
        var nr=rc.row+d[0], nc=rc.col+d[1];
        if(nr>=0&&nr<5&&nc>=0&&nc<5){
          var ni = nr*5+nc;
          if(!visited[ni]) neighbors.push(ni);
        }
      });
      if(!neighbors.length){ ok=false; break; }
      var next = neighbors[rand(0,neighbors.length-1)];
      path.push(next); visited[next]=true;
    }
    if(ok && path.length>=9) return path;
  }
  return [0,1,2,3,4,9,14,19,24];
}

// ===================== FLAGS GAME =====================
var FLAG_DIRECTIONS = ['up','down','left','right'];
function randomFlagDirExcluding(exclude){
  var options = FLAG_DIRECTIONS.filter(function(d){ return d!==exclude; });
  return options[rand(0,options.length-1)];
}
function generateInitialFlagSequence(){
  var seq = [randomFlagDirExcluding(null)];
  while(seq.length < 3){ seq.push(randomFlagDirExcluding(seq[seq.length-1])); }
  return seq;
}
function hostTryStartFlags(senderId, roundsTotal, conn){
  var g = app.game;
  if(senderId !== g.leaderId) return;
  if(!allPlayersReady(g)){ if(conn && conn.send) conn.send({t:'notice', text:'لازم كل اللاعبين يضغطون استعداد أولاً'}); return; }
  hostStartFlagsGame(roundsTotal);
}
function hostStartFlagsGame(roundsTotal){
  var g = app.game;
  roundsTotal = Math.max(2, parseInt(roundsTotal,10)||5);
  g.mode = 'flags';
  g.flagsConfig = { roundsTotal: roundsTotal };
  g.flags = { sequence:[], roundNumber:0, submissions:{}, results:null };
  hostBeginFlagsRound();
}
function hostBeginFlagsRound(){
  var g = app.game;
  var seq = g.flags.sequence;
  if(seq.length===0){
    g.flags.sequence = generateInitialFlagSequence();
  } else {
    // fix: same direction never repeats back-to-back - the new move must differ from
    // whatever the sequence currently ends on.
    seq.push(randomFlagDirExcluding(seq[seq.length-1]));
  }
  g.flags.roundNumber++;
  g.flags.submissions = {};
  g.flags.results = null;
  g.flags.readyStartAt = syncedNow()+300;
  g.phase = 'flags-ready';
  broadcastState();
  addTimer(setTimeout(function(){ startFlagsActive(); }, 3300));
}
function startFlagsActive(){
  var g = app.game;
  g.flags.activeStartAt = syncedNow()+250;
  g.flags.questionPostedAt = g.flags.activeStartAt + g.flags.sequence.length*1000;
  g.phase = 'flags-active';
  broadcastState();
  // No forced end-of-round timer, exactly like the quick games - we simply wait for
  // every present player to submit (see hostReceiveFlagsAnswer).
}
function hostReceiveFlagsAnswer(playerId, value){
  var g = app.game;
  if(!g.flags || g.phase!=='flags-active') return;
  if(g.flags.submissions[playerId]) return;
  if(!Array.isArray(value)) return;
  g.flags.submissions[playerId] = { value:value, t:syncedNow() };
  broadcastState();
  var presentIds = g.players.filter(hostPlayerCountsAsPresent).map(function(p){return p.id;});
  var allIn = presentIds.length>0 && presentIds.every(function(id){ return !!g.flags.submissions[id]; });
  if(allIn) hostFinishFlagsRound();
}
function hostFinishFlagsRound(){
  var g = app.game;
  if(!g.flags || g.phase!=='flags-active') return;
  var isCorrectFn = function(seq, v){
    return Array.isArray(v) && v.length===seq.length && v.every(function(d,i){ return d===seq[i]; });
  };
  var results = genericEvaluate(isCorrectFn, g.flags.sequence, g.flags.submissions, g.players, g.flags.questionPostedAt);
  g.flags.results = results;
  g.flags.revealStartAt = syncedNow()+150;
  results.perPlayer && Object.keys(results.perPlayer).forEach(function(pid){
    var p = findPlayer(pid);
    if(p) p.score += results.perPlayer[pid].score;
  });
  g.phase = 'flags-reveal';
  broadcastState();
  // No auto-advance - the leader presses "next round" (see hostAdvanceFlags below).
}
function hostAdvanceFlags(){
  var g = app.game;
  if(!g.flags || !g.flagsConfig) return;
  if(g.flags.roundNumber >= g.flagsConfig.roundsTotal){
    var sorted = g.players.slice().sort(function(a,b){ return b.score-a.score; });
    g.winnerId = sorted.length ? sorted[0].id : null;
    g.celebration = { bursts:[], sessionId: Math.random().toString(36).substring(2,9) };
    g.phase = 'flags-finished';
    broadcastState();
  } else {
    hostBeginFlagsRound();
  }
}


// ===================== WORDS GAME: DICTIONARY =====================
// Source: Riyadh Dictionary of Contemporary Arabic (dictionary.ksaa.gov.sa).
// WORDS_ANSWERS (5422): clean 5-letter dictionary words - nouns, adjectives, past-tense
// verbs and broken plurals; no "ال", no tanween, no attached pronouns, no specialised jargon

// ===================== WORDS GAME (Arabic Wordle) =====================
// Every player guesses the SAME hidden 5-letter word on their own phone, one row per
// attempt (attempt count chosen by the leader). Green = right letter in the right place,
// yellow = letter is in the word but elsewhere. Scoring mirrors the quick games: you must
// find the word to score; base points + a hidden speed bonus that fades over 300s + a
// placement bonus for the order in which players found it. No round time limit - the
// round ends once every present player has either found the word or used all attempts.
var WORDS_LEN = 5;
var WORDS_BASE_POINTS = 20;      // for finding the word at all
var WORDS_BONUS_POINTS = 50;     // speed bonus at t=0, fading linearly...
var WORDS_BONUS_WINDOW_SEC = 300; // ...to 0 after this many seconds
var WORDS_ATTEMPT_BONUS = 10;    // + this much for every attempt left unused when the word is found
// bumped whenever the phone <-> display message format changes; a phone running a different
// (e.g. cached) copy of the game than the display is warned to reload
var WORDS_PROTOCOL = 10;
var WORDS_LABEL = 'لعبة الكلمات 🔤';

// Letter rules.
// IDENTITY (yellow tiles + the repeat counts): every alef / hamza form is ONE letter
//   (ا أ إ آ ء ئ ؤ ى), ت and ة are ONE letter (same sound), ه is only ever ه.
// GREEN / CONVERSION: a typed letter may only stand for these letters of the dictionary word
//   (and a sent guess is rewritten to the dictionary's spelling on exactly the same terms):
//   ا -> ى anywhere; at the START of the word also أ إ آ
//   أ (long-press ا) -> إ آ ؤ ئ anywhere; at the start also ا
//   إ / آ            -> أ إ آ anywhere; at the start also ا
//   ى -> ا or ئ anywhere        ئ (long-press ى) -> ى
//   و -> ؤ anywhere             ؤ (long-press و) -> only ؤ
//   ء -> only ء, and nothing else ever becomes ء (عقلاء can't be typed عقلاى / عقلاا)
//   LAST letter only: ت -> ة, ة -> ه, ه -> ة (never ت -> ه, never ة -> ت)
function wordsIsAlef(c){
  return c==='ا'||c==='أ'||c==='إ'||c==='آ'||c==='ٱ'||c==='ء'||c==='ؤ'||c==='ئ'||c==='ى';
}
function wordsIdent(c){ if(wordsIsAlef(c)) return 'ا'; return c==='ة' ? 'ت' : c; }
var WORDS_TYPED_TO = {
  'ا':'ى', 'ٱ':'ى', 'أ':'إآؤئ', 'إ':'أآ', 'آ':'أإ', 'ى':'ائ', 'ئ':'ى', 'و':'ؤ'
};
var WORDS_START_ALEFS = 'اأإآٱ';
function wordsTypedMatches(t, a, i){
  if(t===a) return true;
  if(i===WORDS_LEN-1 && ((t==='ت'&&a==='ة') || (t==='ة'&&a==='ه') || (t==='ه'&&a==='ة'))) return true;
  if(i===0 && WORDS_START_ALEFS.indexOf(t)>=0 && WORDS_START_ALEFS.indexOf(a)>=0) return true;
  return !!(WORDS_TYPED_TO[t] && WORDS_TYPED_TO[t].indexOf(a)>=0);
}
// does a typed word fit a dictionary word letter by letter (under the rules above)?
function wordsFits(typed, word){
  var t = wordsSplit(typed), a = wordsSplit(word);
  if(t.length!==WORDS_LEN || a.length!==WORDS_LEN) return false;
  for(var i=0;i<WORDS_LEN;i++) if(!wordsTypedMatches(t[i], a[i], i)) return false;
  return true;
}
// kept for older helpers: alef family -> ا
function wordsNormChar(c){ return wordsIsAlef(c) ? 'ا' : c; }
// ه is shown as "هـ" so it's never mistaken for another letter
function wordsShowChar(c){ return c==='ه' ? 'هـ' : (c||''); }
// letters to SHOW for a sent guess: always the guess's OWN spelling (it was already turned
// into the dictionary spelling when sent). Letters are never copied from the answer.
function wordsDisplayLetters(guess, answer, states){ return wordsSplit(guess); }
// how many letters of the answer share the identity of letter `c` (the letter written on a
// GREEN tile) - the corner number, shown when > 1 (all alef forms count together; ت + ة)
function wordsLetterCount(answer, c){
  var id = wordsIdent(c), n = 0;
  wordsSplit(answer).forEach(function(x){ if(wordsIdent(x)===id) n++; });
  return n;
}
// buckets of dictionary words that could be the same typed word: alef family + و -> ا,
// final ت/ة/ه -> ه. Inside a bucket the most common spelling comes first.
function wordsSkel(w){
  var s = wordsSplit(w).map(function(c){ return (wordsIsAlef(c) || c==='و') ? 'ا' : c; });
  if(s.length===WORDS_LEN && 'تةه'.indexOf(s[WORDS_LEN-1])>=0) s[WORDS_LEN-1] = 'ه';
  return s.join('');
}
// Two tiers: REFERENCE spellings (Riyadh dictionary + answers) and EXTRA ones from older
// word lists (may lack hamzas - "اسنان" - or carry pronouns - "مكتبه").
var WORDS_BUCKETS = null;
function wordsBuckets(){
  if(!WORDS_BUCKETS){
    WORDS_BUCKETS = {};
    var seen = {};
    var add = function(w, tier){
      if(seen[w]) return; seen[w] = true;
      var k = wordsSkel(w), b = WORDS_BUCKETS[k] || (WORDS_BUCKETS[k] = { ref:[], extra:[] });
      b[tier].push(w);
    };
    var i;
    WORDS_ANSWERS.forEach(function(w){ add(w, 'ref'); });
    for(i=0;i+WORDS_LEN<=WORDS_DICT_PACKED.length;i+=WORDS_LEN) add(WORDS_DICT_PACKED.substr(i,WORDS_LEN), 'ref');
    for(i=0;i+WORDS_LEN<=WORDS_EXTRA_PACKED.length;i+=WORDS_LEN) add(WORDS_EXTRA_PACKED.substr(i,WORDS_LEN), 'extra');
  }
  return WORDS_BUCKETS;
}
// the dictionary spelling of a typed word, or null if no word fits it. Reference spellings
// always win: typed exactly -> kept; else the most common reference word it fits
// (اسنان -> أسنان, مكتبه -> مكتبة); only if none fits, an extra-list word (exact first).
function wordsCanonical(guess){
  var typed = wordsSplit(guess).join('');
  var b = wordsBuckets()[wordsSkel(typed)];
  if(!b) return null;
  var pick = function(list){
    if(list.indexOf(typed)>=0) return typed;
    for(var i=0;i<list.length;i++) if(wordsFits(typed, list[i])) return list[i];
    return null;
  };
  return pick(b.ref) || pick(b.extra);
}
// Standard Wordle colouring, duplicates handled: greens first (same letter, or an allowed
// conversion of it), then yellows only while that letter (identity) still has unmatched
// copies ELSEWHERE in the answer - never from the tile's own position.
function wordsEvaluate(guess, answer){
  var g = wordsSplit(guess), a = wordsSplit(answer);
  var res = [], used = [];
  for(var i=0;i<WORDS_LEN;i++){
    if(g[i]!=null && a[i]!=null && wordsTypedMatches(g[i], a[i], i)){ res[i] = 'correct'; used[i] = true; }
    else res[i] = 'absent';
  }
  for(var j=0;j<WORDS_LEN;j++){
    if(res[j]==='correct' || g[j]==null) continue;
    for(var k=0;k<WORDS_LEN;k++){
      if(k!==j && !used[k] && a[k]!=null && wordsIdent(a[k])===wordsIdent(g[j])){ res[j] = 'present'; used[k] = true; break; }
    }
  }
  return res;
}
function wordsIsSolved(guess, answer){
  return wordsEvaluate(guess, answer).every(function(s){ return s==='correct'; });
}
// what actually gets sent/recorded for a typed guess: the answer's own spelling if it IS
// the answer, else the dictionary spelling; null = not a known word (rejected in strict mode)
function wordsResolveGuess(guess, answer, strict){
  if(wordsIsSolved(guess, answer)) return answer;
  var c = wordsCanonical(guess);
  if(c) return c;
  return strict ? null : guess;
}
function wordsSplit(w){ return String(w||'').replace(/[ً-ٰٟـ]/g,'').split(''); }
function wordsSignature(words){ return 'words|'+words.roundNumber+'|'+words.readyStartAt; }
function wordsRevealTotalDuration(players){ return Math.max(0, players.length-1)*1000 + 1400; }

// ---------- host ----------
var hostUsedWordAnswers = {}; // no repeats within the session (resets once all are used)
function hostPickWordAnswer(){
  var pool = WORDS_ANSWERS.filter(function(w){ return !hostUsedWordAnswers[w]; });
  if(!pool.length){ hostUsedWordAnswers = {}; pool = WORDS_ANSWERS.slice(); }
  var w = pool[rand(0,pool.length-1)];
  hostUsedWordAnswers[w] = true;
  return w;
}
function hostTryStartWords(senderId, cfg, conn){
  var g = app.game;
  if(senderId !== g.leaderId) return;
  if(!allPlayersReady(g)){ if(conn && conn.send) conn.send({t:'notice', text:'لازم كل اللاعبين يضغطون استعداد أولاً'}); return; }
  hostStartWordsGame(cfg||{});
}
function hostStartWordsGame(cfg){
  var g = app.game;
  g.mode = 'words';
  g.wordsConfig = {
    roundsTotal: Math.max(1, Math.min(20, parseInt(cfg.roundsTotal,10)||5)),
    attempts: Math.max(3, Math.min(10, parseInt(cfg.attempts,10)||6)),
    minutes: Math.max(1, Math.min(30, parseInt(cfg.minutes,10)||5)),   // round time limit
    strict: cfg.strict !== 'any'
  };
  g.words = { roundNumber:0, protocol:WORDS_PROTOCOL };
  hostBeginWordsRound();
}
function hostBeginWordsRound(){
  var g = app.game;
  g.words.roundNumber++;
  g.words.answer = hostPickWordAnswer();
  g.words.progress = {};    // playerId -> { guesses:[...], done, solved }
  g.words.submissions = {}; // playerId -> { value:lastWord, solved, attempts, t } once done
  g.words.results = null;
  g.words.readyStartAt = syncedNow()+300;
  g.phase = 'words-ready';
  broadcastState();
  addTimer(setTimeout(function(){ startWordsActive(); }, 3300));
}
function startWordsActive(){
  var g = app.game;
  if(!g.words || g.phase!=='words-ready') return;
  g.words.activeStartAt = syncedNow()+250;
  g.words.questionPostedAt = g.words.activeStartAt; // the speed-bonus clock starts here
  // the round's time limit (chosen by the leader) - separate from the hidden speed bonus
  g.words.endsAt = g.words.activeStartAt + g.wordsConfig.minutes*60000;
  g.phase = 'words-active';
  broadcastState();
  var round = g.words.roundNumber;
  addTimer(setTimeout(function(){ hostWordsTimeUp(round); }, g.words.endsAt - syncedNow() + 200));
}
// time's up: everyone still guessing is finished with their last sent word (no points)
function hostWordsTimeUp(round){
  var g = app.game;
  if(!g.words || g.phase!=='words-active' || g.words.roundNumber!==round) return;
  g.players.forEach(function(p){
    var pr = g.words.progress[p.id] || (g.words.progress[p.id] = { guesses:[], done:false, solved:false });
    if(pr.done) return;
    pr.done = true; pr.solved = false; pr.timeUp = true;
    g.words.submissions[p.id] = { value: pr.guesses.length ? pr.guesses[pr.guesses.length-1] : '',
      solved:false, attempts:pr.guesses.length, t:g.words.endsAt, timeUp:true };
  });
  hostFinishWordsRound();
}
// what's left of the round, in ms (display + phones), and its mm:ss form
function wordsTimeLeftMs(w){
  if(!w || !w.endsAt) return null;
  // never more than the full round (the round starts a moment after the countdown screen)
  return Math.max(0, Math.min(w.endsAt - syncedNow(), w.endsAt - (w.activeStartAt||0)));
}
function wordsFmtTime(ms){
  var s = Math.ceil(ms/1000), m = Math.floor(s/60); s = s%60;
  return m + ':' + (s<10?'0':'') + s;
}
// fix: every guess now gets an explicit answer back to the phone that sent it
// ('words-guess-ack': accepted / already had it / rejected + why). Before, a guess that was
// delayed on the connection (weak wifi, or a big victory-clip chunk queued ahead of it) or
// rejected was simply never answered, and after 6s the phone gave up and handed the letters
// back ("لم تصل المحاولة") - and a manual resend of the same word then looked like a
// duplicate. The phone now also re-sends automatically until it gets this answer.
function hostReceiveWordsGuess(playerId, guess, idx, conn){
  var reply = function(ok, reason, stored){
    if(!conn || !conn.send || conn.open===false) return;
    try{ conn.send({t:'words-guess-ack', idx:idx, ok:ok, reason:reason||'', guess:stored||''}); }catch(e){}
  };
  var g = app.game;
  if(!g.words || g.phase!=='words-active' || !findPlayer(playerId)) { reply(false, 'not-active'); return; }
  if(g.words.endsAt && syncedNow() > g.words.endsAt + 1500) { reply(false, 'not-active'); return; } // too late
  if(typeof guess !== 'string') { reply(false, 'bad'); return; }
  guess = guess.replace(/[\u064B-\u065F\u0670\u0640\s]/g,'');
  if(guess.length!==WORDS_LEN || !/^[\u0621-\u063A\u0641-\u064A]+$/.test(guess)) { reply(false, 'bad'); return; }
  // record the dictionary spelling (the display never trusts the phone's own conversion)
  guess = wordsResolveGuess(guess, g.words.answer, g.wordsConfig.strict);
  if(!guess) { reply(false, 'not-in-dictionary'); return; }
  var pr = g.words.progress[playerId] || (g.words.progress[playerId] = { guesses:[], done:false, solved:false });
  if(pr.done) { reply(false, 'done'); return; }
  // idx = how many guesses the phone had already seen. A resend of a guess we already
  // recorded is confirmed again (and the state re-sent) instead of silently dropped.
  if(typeof idx === 'number' && idx !== pr.guesses.length){
    if(idx < pr.guesses.length && pr.guesses[idx]===guess){ reply(true, 'dup', guess); broadcastState(); }
    else reply(false, 'out-of-sync');
    return;
  }
  pr.guesses.push(guess);
  reply(true, '', guess);
  var solved = wordsIsSolved(guess, g.words.answer);
  if(solved || pr.guesses.length >= g.wordsConfig.attempts){
    pr.done = true; pr.solved = solved;
    g.words.submissions[playerId] = { value:guess, solved:solved, attempts:pr.guesses.length, t:syncedNow() };
  }
  broadcastState();
  if(pr.done) hostCheckWordsAllIn();
}
function hostCheckWordsAllIn(){
  var g = app.game;
  if(!g.words || g.phase!=='words-active') return;
  var presentIds = g.players.filter(hostPlayerCountsAsPresent).map(function(p){return p.id;});
  var allIn = presentIds.length>0 && presentIds.every(function(id){ return !!g.words.submissions[id]; });
  if(allIn) hostFinishWordsRound();
}
// "withdraw from this round": the player stops guessing; their last SENT word counts as
// their final answer (wrong, so 0 points) and the round no longer waits for them
function hostWordsGiveUp(playerId){
  var g = app.game;
  if(!g.words || g.phase!=='words-active' || !findPlayer(playerId)) return;
  var pr = g.words.progress[playerId] || (g.words.progress[playerId] = { guesses:[], done:false, solved:false });
  if(pr.done) return;
  pr.done = true; pr.solved = false; pr.gaveUp = true;
  g.words.submissions[playerId] = { value: pr.guesses.length ? pr.guesses[pr.guesses.length-1] : '',
    solved:false, attempts:pr.guesses.length, t:syncedNow(), gaveUp:true };
  broadcastState();
  hostCheckWordsAllIn();
}
function computeWordsScore(submittedAt, questionPostedAt, rankAmongCorrect, numPlayers, attemptsLeft){
  var elapsedSec = Math.max(0, (submittedAt - questionPostedAt)/1000);
  var bonusPct = Math.max(0, Math.min(1, (WORDS_BONUS_WINDOW_SEC - elapsedSec)/WORDS_BONUS_WINDOW_SEC));
  var placement = numPlayers - (rankAmongCorrect-1); // same placement points as the quick games
  var attemptsBonus = Math.max(0, attemptsLeft||0) * WORDS_ATTEMPT_BONUS; // unused attempts
  return WORDS_BASE_POINTS + bonusPct*WORDS_BONUS_POINTS + placement + attemptsBonus;
}
function hostFinishWordsRound(){
  var g = app.game;
  if(!g.words || g.phase!=='words-active') return;
  var subs = g.words.submissions;
  var order = Object.keys(subs)
    .filter(function(pid){ return subs[pid].solved; })
    .sort(function(a,b){ return subs[a].t - subs[b].t; });
  var perPlayer = {};
  g.players.forEach(function(p){
    var s = subs[p.id];
    var correct = !!(s && s.solved);
    perPlayer[p.id] = { correct:correct,
      score: correct ? computeWordsScore(s.t, g.words.questionPostedAt, order.indexOf(p.id)+1, g.players.length,
                                         g.wordsConfig.attempts - s.attempts) : 0 };
  });
  g.words.results = { perPlayer:perPlayer };
  g.words.revealStartAt = syncedNow()+150;
  Object.keys(perPlayer).forEach(function(pid){
    var p = findPlayer(pid);
    if(p) p.score += perPlayer[pid].score;
  });
  g.phase = 'words-reveal';
  broadcastState();
  // no auto-advance - the leader presses "next round", like every other game
}
function hostAdvanceWords(){
  var g = app.game;
  if(!g.words || !g.wordsConfig || g.phase!=='words-reveal') return;
  if(g.words.roundNumber >= g.wordsConfig.roundsTotal){
    var sorted = g.players.slice().sort(function(a,b){ return b.score-a.score; });
    g.winnerId = sorted.length ? sorted[0].id : null;
    g.celebration = { bursts:[], sessionId: Math.random().toString(36).substring(2,9) };
    g.phase = 'words-finished';
    broadcastState();
  } else {
    hostBeginWordsRound();
  }
}

// ---------- player phone ----------
// Same letter order as the iPhone Arabic keyboard. Rows are listed RIGHT-TO-LEFT (the
// keyboard is laid out rtl), so each row's first key sits at the right edge; "إرسال" is on
// the right, delete on the left. LONG-PRESS types a second letter: ا -> أ, و -> ؤ, ى -> ئ.
var WORDS_KB_ROWS = [
  ['ج','ح','خ','ه','ع','غ','ف','ق','ث','ص','ض'],
  ['ة','ك','م','ن','ت','ا','ل','ب','ي','س','ش'],
  ['ENTER','ى','و','ر','ز','د','ذ','ط','ظ','ء','DEL']
];
var WORDS_KB_LONG = { 'ا':'أ', 'و':'ؤ', 'ى':'ئ' };
var WORDS_LONG_PRESS_MS = 420;
// keyboard keys greyed out together: letters with the same identity (all alef forms; ت/ة)
function wordsKeyFor(c){ return wordsIdent(c); }
// a pressed key types its own letter exactly (ا, أ, ء, ى, ئ, و, ؤ ... are all different now)
function wordsTypedChar(k){ return k; }
var WORDS_STATE_RANK = { absent:1, present:2, correct:3 };
var WORDS_RESEND_MS = 2500;       // re-send an unanswered guess this often...
var WORDS_SEND_GIVEUP_MS = 15000; // ...and give the letters back only after this long
// the display's answer to one of our guesses (see hostReceiveWordsGuess)
function clientHandleWordsAck(msg){
  var pend = clientInput.wordsPending;
  if(!pend || msg.idx !== pend.idx) return;
  if(msg.ok){ pend.acked = true; return; } // recorded - the state update clears "pending"
  if(msg.reason === 'done' || msg.reason === 'not-active'){ clientInput.wordsPending = null; return; }
  // really rejected: give the letters back and say why
  clientInput.wordsTyped = pend.typed || wordsSplit(pend.word);
  clientInput.wordsPending = null;
  var why = msg.reason === 'not-in-dictionary' ? 'شاشة العرض لم تقبل هذه الكلمة (ليست في قاموسها)'
          : msg.reason === 'out-of-sync' ? 'حصل خلل في التزامن، اضغط إرسال مرة أخرى'
          : 'لم تُقبل المحاولة، اضغط إرسال مرة أخرى';
  clientInput.wordsToast = { text: why, until: Date.now()+3500 };
}
function wordsMyProgress(){
  var g = app.game;
  return (g.words && g.words.progress && g.words.progress[app.myPlayerId]) || { guesses:[], done:false, solved:false };
}
function wordsShowToast(text){
  clientInput.wordsToast = { text:text, until: Date.now()+1800 };
  renderAll();
}
function wordsShakeCurrentRow(){
  var row = els.wordsBoard.querySelector('.words-row.current');
  if(!row) return;
  row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
}
function wordsCanType(){
  var g = app.game;
  if(!g || app.isHost || g.mode!=='words' || g.phase!=='words-active') return false;
  if(clientInput.wordsPending) return false;
  return !wordsMyProgress().done;
}
function wordsPressKey(k){
  if(!wordsCanType()) return;
  var g = app.game;
  if(k==='DEL'){ clientInput.wordsTyped.pop(); renderAll(); return; }
  if(k==='ENTER'){
    if(clientInput.wordsTyped.length < WORDS_LEN){ wordsShakeCurrentRow(); wordsShowToast('الكلمة لازم تكون 5 أحرف'); return; }
    // send the dictionary spelling: اسنان -> أسنان, مسأول -> مسؤول, مكتبه -> مكتبة ...
    var guess = wordsResolveGuess(clientInput.wordsTyped.join(''), g.words.answer, g.wordsConfig.strict);
    if(!guess){
      wordsShakeCurrentRow(); wordsShowToast('الكلمة غير موجودة في القاموس'); return;
    }
    var idx = wordsMyProgress().guesses.length;
    var now = Date.now();
    clientInput.wordsPending = { word:guess, idx:idx, typed:clientInput.wordsTyped.slice(), sentAt:now, lastSentAt:now, acked:false };
    clientInput.wordsTyped = [];
    sendToHost({t:'words-guess', guess:guess, idx:idx});
    playSound('submit');
    renderAll();
    return;
  }
  if(clientInput.wordsTyped.length < WORDS_LEN){ clientInput.wordsTyped.push(wordsTypedChar(k)); renderAll(); }
}
els.wordsGiveup.addEventListener('click', function(){
  var g = app.game;
  if(!g || g.mode!=='words' || g.phase!=='words-active' || wordsMyProgress().done) return;
  if(!confirm('الانسحاب من هذه الجولة؟ آخر كلمة أرسلتها ستُحسب كإجابتك النهائية.')) return;
  clientInput.wordsTyped = [];
  sendToHost({t:'words-giveup'});
});
function buildWordsKeyboard(){
  els.wordsKb.innerHTML = WORDS_KB_ROWS.map(function(row){
    return '<div class="words-kb-row">'+row.map(function(k){
      if(k==='ENTER') return '<button type="button" class="words-key wide enter" data-k="ENTER">إرسال</button>';
      if(k==='DEL') return '<button type="button" class="words-key wide del" data-k="DEL" aria-label="حذف">⌫</button>';
      var alt = WORDS_KB_LONG[k];
      return '<button type="button" class="words-key'+(alt?' has-alt':'')+'" data-k="'+k+'"'+(alt?' data-alt="'+alt+'"':'')+'>'+wordsShowChar(k)+'</button>';
    }).join('')+'</div>';
  }).join('');
  els.wordsKb._stateKey = null;

// one delegated listener, attached once - keys are never rebuilt mid-tap.
// Keys WITH a long-press letter are handled by the pointer events below instead.
els.wordsKb.addEventListener('click', function(e){
  var btn = e.target.closest ? e.target.closest('.words-key') : null;
  if(btn && !btn.hasAttribute('data-alt')) wordsPressKey(btn.getAttribute('data-k'));
});
// long-press: hold ا / و / ى to type أ / ؤ / ئ; a normal tap types the key's own letter
var wordsLongPress = null;
function wordsEndLongPress(commit){
  if(!wordsLongPress) return;
  var lp = wordsLongPress; wordsLongPress = null;
  clearTimeout(lp.timer);
  lp.btn.classList.remove('pressing');
  if(commit && !lp.fired) wordsPressKey(lp.btn.getAttribute('data-k'));
}
els.wordsKb.addEventListener('pointerdown', function(e){
  var btn = e.target.closest ? e.target.closest('.words-key[data-alt]') : null;
  if(!btn || btn.disabled) return;
  e.preventDefault(); // no text selection / iOS callout while holding
  wordsEndLongPress(false);
  var lp = { btn:btn, fired:false, timer:null };
  lp.timer = setTimeout(function(){
    lp.fired = true;
    btn.classList.remove('pressing');
    wordsPressKey(btn.getAttribute('data-alt'));
  }, WORDS_LONG_PRESS_MS);
  wordsLongPress = lp;
  btn.classList.add('pressing');
});
els.wordsKb.addEventListener('pointerup', function(){ wordsEndLongPress(true); });
els.wordsKb.addEventListener('pointercancel', function(){ wordsEndLongPress(false); });
els.wordsKb.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('pointerup', function(){ wordsEndLongPress(false); }); // released off the keyboard
// physical keyboard too (handy when testing on a computer)
document.addEventListener('keydown', function(e){
  if(!wordsCanType()) return;
  if(e.key==='Backspace'){ e.preventDefault(); wordsPressKey('DEL'); return; }
  if(e.key==='Enter'){ e.preventDefault(); wordsPressKey('ENTER'); return; }
  if(e.key && e.key.length===1 && /[ء-غف-ي]/.test(e.key)){ e.preventDefault(); wordsPressKey(e.key); }
});
function renderWordsBoard(rowsData, attempts){

      var st = rd && rd.states ? rd.states[i] : (letter ? 'filled' : '');
      var delay = rd && rd.animate ? ' style="animation-delay:'+(i*110)+'ms"' : '';
      var badge = rd && rd.counts && rd.counts[i] > 1 ? '<sup class="words-count">'+rd.counts[i]+'</sup>' : '';
      html += '<span class="words-tile '+st+(rd && rd.animate ? ' flip' : '')+'"'+delay+'>'+escapeHtml(wordsShowChar(letter))+badge+'</span>';
    }

function renderWordsPlayer(){
  var g = app.game;
  var me = findPlayer(app.myPlayerId);
  var isLeader = app.myPlayerId === g.leaderId;
  els.pScoreLabel.textContent = me ? fmtScore(me.score) : '0';
  els.btnNextRound.classList.add('hidden');
  els.btnBombNewRound.classList.add('hidden');
  els.btnBombToLobby.classList.add('hidden');
  els.btnBombContinue.classList.add('hidden');
  els.pgridContainer.classList.add('hidden');
  els.counterContainer.classList.add('hidden');
  els.flagsPadContainer.classList.add('hidden');
  els.btnSubmit.classList.add('hidden');

  if(g.phase === 'words-finished'){
    els.wordsContainer.classList.add('hidden');
    els.displayWrap.classList.add('hidden');
    els.pcontrolsWrap.classList.add('hidden');
    renderWinnerScreen();
    return;
  }
  hideWinnerScreen();
  els.roundOverlay.classList.remove('active');
  var w = g.words;
  var attempts = g.wordsConfig.attempts;
  els.pRoundIndicator.textContent = w.roundNumber+'/'+g.wordsConfig.roundsTotal;
  els.pGameNameLabel.textContent = WORDS_LABEL;

  var sig = wordsSignature(w);
  if(sig !== clientInput.lastWordsSig){
    clientInput.lastWordsSig = sig;
    clientInput.wordsTyped = [];
    clientInput.wordsPending = null;
    clientInput.wordsSeenRows = 0;
    clientInput.wordsToast = null;
    els.wordsBoard._builtKey = null;
    buildWordsKeyboard();
  }

  if(g.phase === 'words-ready'){
    els.notifBar.textContent = 'استعد... '+WORDS_LABEL+' - '+attempts+' محاولات';
    els.submittedLabel.classList.add('hidden');
    els.wordsContainer.classList.add('hidden');
    return;
  }

  var pr = wordsMyProgress();
  // a sent guess stays "pending" until the display's state includes it. While waiting, the
  // phone re-sends it every WORDS_RESEND_MS (the display answers each send - see
  // clientHandleWordsAck); only after WORDS_SEND_GIVEUP_MS without any answer at all are
  // the letters handed back.
  var pend = clientInput.wordsPending;
  if(pend && pr.guesses.length > pend.idx){ clientInput.wordsPending = pend = null; }
  if(pend && g.phase==='words-active'){
    var nowP = Date.now();
    if(!pend.acked && nowP-pend.lastSentAt > WORDS_RESEND_MS && nowP-pend.sentAt < WORDS_SEND_GIVEUP_MS){
      pend.lastSentAt = nowP;
      sendToHost({t:'words-guess', guess:pend.word, idx:pend.idx});
    }
    if(nowP-pend.sentAt > (pend.acked ? WORDS_SEND_GIVEUP_MS*2 : WORDS_SEND_GIVEUP_MS)){
      clientInput.wordsTyped = pend.typed || wordsSplit(pend.word);
      clientInput.wordsPending = pend = null;
      clientInput.wordsToast = { text:'تعذّر الاتصال بشاشة العرض، اضغط إرسال مرة أخرى', until: nowP+3000 };
    }
  }
  if(g.words.protocol && g.words.protocol !== WORDS_PROTOCOL && !(clientInput.wordsToast && Date.now() < clientInput.wordsToast.until)){
    clientInput.wordsToast = { text:'نسخة اللعبة في جهازك تختلف عن شاشة العرض - حدّث الصفحة', until: Date.now()+4000 };
  }

  // rows: confirmed guesses, then the pending one, then what's being typed now
  var rowsData = [];
  function sentRow(word){
    var states = wordsEvaluate(word, w.answer);
    return { letters: wordsDisplayLetters(word, w.answer, states), typed: wordsSplit(word), states: states,
      counts: states.map(function(s, i){ return s==='correct' ? wordsLetterCount(w.answer, wordsSplit(word)[i]) : 0; }) };
  }
  pr.guesses.forEach(function(gw){ rowsData.push(sentRow(gw)); });
  if(pend) rowsData.push(sentRow(pend.word));
  var colouredRows = rowsData.length;
  var activeTyping = g.phase==='words-active' && !pr.done && !pend;
  if(activeTyping && rowsData.length < attempts){
    rowsData.push({ letters:clientInput.wordsTyped.slice(), states:null, cls:'current' });
  }
  if(colouredRows > clientInput.wordsSeenRows){
    rowsData[colouredRows-1].animate = true; // flip only the newly coloured row
  }
  var boardKey = sig+'|'+g.phase+'|'+rowsData.map(function(r){ return r.letters.join('')+(r.states?'#':''); }).join(',')+'|'+attempts;
  if(els.wordsBoard._builtKey !== boardKey){
    renderWordsBoard(rowsData, attempts);
    els.wordsBoard._builtKey = boardKey;
    clientInput.wordsSeenRows = colouredRows;
  }

  // keyboard: green / yellow finds are shown ONLY on the tiles above - the keyboard just
  // greys out letters that turned out not to be in the word at all
  var keyState = {};
  rowsData.forEach(function(r){
    if(!r.states) return;
    r.typed.forEach(function(c, i){
      var k = wordsKeyFor(c);
      if((WORDS_STATE_RANK[r.states[i]]||0) > (WORDS_STATE_RANK[keyState[k]]||0)) keyState[k] = r.states[i];
    });
  });
  var kbKey = JSON.stringify(keyState)+'|'+(activeTyping?1:0);
  if(els.wordsKb._stateKey !== kbKey){
    els.wordsKb.querySelectorAll('.words-key').forEach(function(b){
      var k = b.getAttribute('data-k');
      b.classList.remove('correct','present','absent');
      if(keyState[wordsKeyFor(k)]==='absent') b.classList.add('absent');
      b.disabled = !activeTyping;
    });
    els.wordsKb._stateKey = kbKey;
  }

  var toast = clientInput.wordsToast;
  var showToast = !!(toast && Date.now() < toast.until);
  els.wordsToast.classList.toggle('hidden', !showToast);
  if(showToast) els.wordsToast.textContent = toast.text;

  els.wordsContainer.classList.remove('hidden');

  els.wordsGiveup.classList.toggle('hidden', !(g.phase==='words-active' && !pr.done));

  if(g.phase === 'words-reveal'){
    els.wordsKb.classList.add('hidden');
    els.submittedLabel.classList.remove('hidden');
    var revealElapsed = syncedNow() - (w.revealStartAt||syncedNow());
    if(revealElapsed < wordsRevealTotalDuration(g.players)){
      els.notifBar.textContent = 'جاري التصحيح...';
      els.submittedLabel.textContent = 'SUBMITED!';
      els.submittedLabel.style.color = 'var(--green)';
    } else {
      els.notifBar.textContent = 'الكلمة الصحيحة: '+w.answer;
      var r = w.results ? w.results.perPlayer[app.myPlayerId] : null;
      els.submittedLabel.textContent = r ? (r.correct ? '✔ عرفت الكلمة! +'+Math.round(r.score) : (pr.gaveUp ? '🏳️ انسحبت من الجولة' : pr.timeUp ? '⏰ انتهى الوقت' : '✖ ما عرفت الكلمة')) : '';
      els.submittedLabel.style.color = r && r.correct ? 'var(--green)' : 'var(--red)';
    }
    if(isLeader){
      els.btnNextRound.textContent = w.roundNumber < g.wordsConfig.roundsTotal ? ('▶ الجولة التالية ('+(w.roundNumber+1)+'/'+g.wordsConfig.roundsTotal+')') : '▶ عرض النتيجة النهائية';
      els.btnNextRound.classList.remove('hidden');
      els.btnBombToLobby.classList.remove('hidden');
    }
    return;
  }

  els.notifBar.classList.remove('words-clock-bar','low');
  // phase === 'words-active'
  if(pr.done){
    els.wordsKb.classList.add('hidden');
    els.submittedLabel.classList.remove('hidden');
    els.submittedLabel.textContent = 'SUBMITED!';
    els.submittedLabel.style.color = 'var(--green)';
    els.notifBar.textContent = pr.solved ? '✔ أحسنت! بانتظار بقية اللاعبين...' :
      (pr.gaveUp ? '🏳️ انسحبت من الجولة، بانتظار بقية اللاعبين...' : pr.timeUp ? '⏰ انتهى الوقت' : 'انتهت محاولاتك، بانتظار بقية اللاعبين...');
    return;
  }
  els.wordsKb.classList.remove('hidden');
  els.submittedLabel.classList.add('hidden');
  // only the round's countdown here - the rows already show which attempt this is
  var leftP = wordsTimeLeftMs(w);
  els.notifBar.textContent = leftP==null ? '' : wordsFmtTime(leftP);
  els.notifBar.classList.add('words-clock-bar');
  els.notifBar.classList.toggle('low', leftP!=null && leftP <= 30000);
}


var BOMB_ROWS = 4, BOMB_MIN_COLS = 4, BOMB_MAX_COLS = 10;
function buildBombOrder(players){
  var groups = {};
  players.forEach(function(p){ (groups[p.score]=groups[p.score]||[]).push(p.id); });
  var scores = Object.keys(groups).map(Number).sort(function(a,b){return b-a;});
  var order = [];
  scores.forEach(function(s){ order = order.concat(shuffle(groups[s])); });
  return order; // fixed for the whole round - never recalculated mid-round
}
function bombNextConnectedTurn(bomb, players){
  var tries=0;
  while(tries < bomb.order.length){
    var pid = bomb.order[bomb.turnIndex];
    var p = players.filter(function(x){return x.id===pid;})[0];
    if(p && p.connected) return;
    bomb.turnIndex = (bomb.turnIndex+1) % bomb.order.length;
    tries++;
  }
}

// fix #6: columns are now leader-chosen (4-10), never derived from player count. Scoring
// mode ('classic' = original per-step points, 'rounds' = 1 point to whoever wins each
// round, played over a fixed number of rounds) is also leader-chosen.
function hostStartBombGame(cols, scoringMode, roundsTotal){
  var g = app.game;
  cols = Math.max(BOMB_MIN_COLS, Math.min(BOMB_MAX_COLS, parseInt(cols,10)||8));
  scoringMode = (scoringMode==='rounds') ? 'rounds' : 'classic';
  roundsTotal = Math.max(1, Math.min(30, parseInt(roundsTotal,10)||5));
  g.mode = 'bomb';
  g.bombConfig = { cols:cols, scoringMode:scoringMode, roundsTotal:roundsTotal };
  g.bombRoundsPlayed = 0;
  hostBeginBombRound();
}

function hostBeginBombRound(){
  var g = app.game;
  var cfg = g.bombConfig;
  var grid = [];
  for(var c=0;c<cfg.cols;c++){
    var safeRow = rand(0,BOMB_ROWS-1);
    var col = [];
    for(var r=0;r<BOMB_ROWS;r++) col.push(r===safeRow);
    grid.push(col);
  }
  var everDiscovered = grid.map(function(col){ return col.map(function(){return false;}); });
  var order = buildBombOrder(g.players); // fix #9: recomputed only at the start of each round
  g.bomb = { grid:grid, everDiscovered:everDiscovered, rows:BOMB_ROWS, cols:cfg.cols,
    order:order, turnIndex:0, currentCol:0, turnRevealed:[], finished:false, winnerId:null, lastChoice:null,
    instanceId: Math.random().toString(36).substring(2,9) };
  bombNextConnectedTurn(g.bomb, g.players);
  g.phase = 'bomb-playing';
  broadcastState();
}

// fix #5/#6: classic-mode wins now also go through the full winner-screen ceremony
// (instead of the old plain banner), and both paths set the same g.winnerId/celebration
// fields renderWinnerScreen() already knows how to use.
function finalizeBombWin(g, cfg, p, playerId){
  g.bomb.finished = true;
  g.bomb.winnerId = playerId;
  if(cfg.scoringMode==='classic'){
    if(p) p.score += 20;
    g.winnerId = playerId;
    g.celebration = { bursts:[], sessionId: Math.random().toString(36).substring(2,9) };
    g.phase = 'bomb-finished';
  } else {
    if(p) p.score += 1;
    g.bombRoundsPlayed++;
    if(g.bombRoundsPlayed >= cfg.roundsTotal){
      var sorted = g.players.slice().sort(function(a,b){ return b.score-a.score; });
      g.winnerId = sorted.length ? sorted[0].id : null;
      g.celebration = { bursts:[], sessionId: Math.random().toString(36).substring(2,9) };
      g.phase = 'bomb-tournament-finished';
    } else {
      g.phase = 'bomb-round-finished'; // leader must press continue for the next round - unchanged
    }
  }
}
function hostBombChoose(playerId, row){
  var g = app.game;
  if(!g.bomb || g.phase!=='bomb-playing') return;
  if(g.bomb.order[g.bomb.turnIndex] !== playerId) return;
  var col = g.bomb.currentCol;
  if(col==null || col>=g.bomb.cols) return;
  var isSafe = g.bomb.grid[col][row];
  var p = findPlayer(playerId);
  var cfg = g.bombConfig;
  if(isSafe){
    var wasEver = g.bomb.everDiscovered[col][row];
    g.bomb.everDiscovered[col][row] = true; // internal memory only, used for classic scoring
    if(cfg.scoringMode==='classic' && p) p.score += wasEver ? 1 : 5;
    g.bomb.turnRevealed.push({col:col,row:row}); // visible only for THIS turn (fix #9)
    g.bomb.lastChoice = {col:col,row:row,safe:true};
    g.bomb.currentCol++;
    if(g.bomb.currentCol >= g.bomb.cols){
      // fix #6: pause 1s on the just-completed board (everyone can see the winning move)
      // before switching away to the winner screen - but ONLY when this win ends the
      // whole game (classic mode, or the last round of rounds-mode). An intermediate
      // rounds-mode round keeps transitioning immediately, exactly as before.
      var isFinalWin = (cfg.scoringMode==='classic') || (g.bombRoundsPlayed+1 >= cfg.roundsTotal);
      broadcastState(); // show the winning move immediately regardless
      if(isFinalWin){
        addTimer(setTimeout(function(){ finalizeBombWin(g, cfg, p, playerId); broadcastState(); }, 1000));
      } else {
        finalizeBombWin(g, cfg, p, playerId);
        broadcastState();
      }
      return;
    }
    broadcastState();
  } else {
    g.bomb.lastChoice = {col:col,row:row,safe:false};
    broadcastState();
    addTimer(setTimeout(function(){
      g.bomb.turnIndex = (g.bomb.turnIndex+1) % g.bomb.order.length;
      bombNextConnectedTurn(g.bomb, g.players);
      g.bomb.currentCol = 0;
      g.bomb.turnRevealed = []; // fix #9: colors reset for next player - must rely on memory
      g.bomb.lastChoice = null;
      broadcastState();
    }, 2000));
  }
}

function bombSig(bomb){ return bomb.lastChoice ? (bomb.lastChoice.col+'-'+bomb.lastChoice.row+'-'+bomb.lastChoice.safe) : 'none'; }
var lastBombSoundSig = null;
function maybePlayBombSound(bomb){
  var sig = bombSig(bomb);
  if(sig !== lastBombSoundSig){
    lastBombSoundSig = sig;
    if(bomb.lastChoice) playSound(bomb.lastChoice.safe ? 'correct' : 'boom');
  }
}
var lastVictorySig = null;
function maybePlayVictorySound(bomb){
  if(!bomb.finished) return;
  var sig = bomb.instanceId+'-win';
  if(sig !== lastVictorySig){
    lastVictorySig = sig;
    playSound('victory');
  }
}

// Bomb grid is rendered ONLY when the underlying state actually changes (called from
// renderAll after a broadcastState), never on a timer - this removes the double/triple
// tap issue (fix #4/#9) since click handlers are never torn out mid-gesture.
function renderBombGrid(container, bomb, interactive, onPick){
  container.innerHTML = '';
  var row1 = document.createElement('div');
  row1.style.cssText = 'display:flex;align-items:center;gap:1.4vw;direction:ltr;';
  var arrow = document.createElement('div');
  arrow.className = 'bomb-arrow';
  arrow.textContent = '➡';
  var gridEl = document.createElement('div');
  gridEl.className = 'bomb-grid';
  // fix #4: compute one SQUARE cell size that fits the available space, instead of
  // stretching a fixed-width/height box into rectangles. Uses this device's own viewport,
  // so it adapts correctly whether it's the big display or a player's phone.
  var availW = window.innerWidth*0.8 - 70;
  var availH = window.innerHeight*0.52;
  var cellSize = Math.floor(Math.min(availW/bomb.cols, availH/bomb.rows));
  cellSize = Math.max(22, Math.min(cellSize, 150));
  gridEl.style.gridTemplateColumns = 'repeat('+bomb.cols+', '+cellSize+'px)';
  gridEl.style.gridTemplateRows = 'repeat('+bomb.rows+', '+cellSize+'px)';
  gridEl.style.width = 'auto';
  gridEl.style.height = 'auto';
  var cellFont = Math.max(14, Math.floor(cellSize*0.42));
  for(var r=0;r<bomb.rows;r++){
    for(var c=0;c<bomb.cols;c++){
      var cell = document.createElement('div');
      cell.className = 'bomb-cell';
      cell.style.gridColumnStart = c+1;
      cell.style.gridRowStart = r+1;
      cell.style.fontSize = cellFont+'px';
      var isRevealedSafe = bomb.turnRevealed.some(function(t){ return t.col===c && t.row===r; });
      var isLastBomb = bomb.lastChoice && bomb.lastChoice.col===c && bomb.lastChoice.row===r && !bomb.lastChoice.safe;
      var isLastSafe = bomb.lastChoice && bomb.lastChoice.col===c && bomb.lastChoice.row===r && bomb.lastChoice.safe;
      if(isRevealedSafe || isLastSafe) cell.classList.add('safe');
      if(isLastBomb){
        cell.classList.add('bomb');
        var img = document.createElement('img');
        img.src = ASSET_BASE + 'Bomb.png';
        cell.appendChild(img);
      }
      if(!bomb.finished && c===bomb.currentCol) cell.style.outline = '3px solid var(--gold)';
      if(interactive && c===bomb.currentCol){
        cell.style.cursor = 'pointer';
        (function(rr){ cell.addEventListener('click', function(){ onPick(rr); }, {passive:true}); })(r);
      }
      gridEl.appendChild(cell);
    }
  }
  row1.appendChild(arrow);
  row1.appendChild(gridEl);
  container.appendChild(row1);
}

function renderPlayerSlotsBomb(){
  var g = app.game;
  clearArenaSlots();
  var currentTurnId = (g.bomb && !g.bomb.finished) ? g.bomb.order[g.bomb.turnIndex] : null;
  g.players.forEach(function(p, idx){
    var slotNum = SLOT_ORDER[idx % 12];
    var pos = SLOT_POS[slotNum];
    var div = document.createElement('div');
    div.className = 'player-slot';
    Object.keys(pos).forEach(function(k){ div.style[k] = pos[k]; });
    var isTurn = p.id === currentTurnId;
    div.innerHTML =
      '<div class="status-circle" style="'+(isTurn?'background:var(--gold);box-shadow:0 0 12px var(--gold);':'')+'">'+(isTurn?'🎮':'')+'</div>'+
      '<div class="pname">'+escapeHtml(p.name)+'</div>'+
      '<div class="pscore">'+fmtScore(p.score)+'</div>';
    els.arenaWrap.appendChild(div);
  });
}

function renderBombDisplay(){
  var g = app.game;
  if(g.phase === 'bomb-tournament-finished' || g.phase === 'bomb-finished'){
    els.pcontrolsWrap.classList.add('hidden');
    els.displayWrap.classList.add('hidden');
    renderWinnerScreen();
    return;
  }
  hideWinnerScreen();
  els.pcontrolsWrap.classList.add('hidden');
  els.displayWrap.classList.remove('hidden');
  els.gameNameLabel.textContent = 'لعبة القنابل 💣';
  els.roundIndicator.textContent = g.bombConfig && g.bombConfig.scoringMode==='rounds' ? ('الجولة '+(g.phase==='bomb-playing'?(g.bombRoundsPlayed+1):g.bombRoundsPlayed)+'/'+g.bombConfig.roundsTotal) : '';
  els.readyOverlay.style.display = 'none';
  els.roundOverlay.classList.remove('active');
  renderPlayerSlotsBomb();
  els.arenaCenter.innerHTML = '';

  if(g.phase === 'bomb-round-finished'){
    var w = findPlayer(g.bomb.winnerId);
    var banner = document.createElement('div');
    banner.className = 'bomb-win-banner';
    banner.textContent = '🏆 فاز بهذه الجولة: ' + (w?w.name:'');
    els.arenaCenter.appendChild(banner);
    var gridHost0 = document.createElement('div');
    els.arenaCenter.appendChild(gridHost0);
    renderBombGrid(gridHost0, g.bomb, false); // path stays visible (fix #9)
    maybePlayVictorySound(g.bomb);
    return;
  }
  var turnPlayer = findPlayer(g.bomb.order[g.bomb.turnIndex]);
  var banner2 = document.createElement('div');
  banner2.className = 'bomb-turn-banner';
  banner2.textContent = turnPlayer ? ('دور: '+turnPlayer.name) : '';
  els.arenaCenter.appendChild(banner2);
  var gridHost = document.createElement('div');
  els.arenaCenter.appendChild(gridHost);
  renderBombGrid(gridHost, g.bomb, false);
  maybePlayBombSound(g.bomb);
}

function renderBombPlayer(){
  var g = app.game;
  if(g.phase === 'bomb-tournament-finished' || g.phase === 'bomb-finished'){
    els.displayWrap.classList.add('hidden');
    els.pcontrolsWrap.classList.add('hidden');
    renderWinnerScreen();
    return;
  }
  hideWinnerScreen();
  els.displayWrap.classList.add('hidden');
  els.pcontrolsWrap.classList.remove('hidden');
  var me = findPlayer(app.myPlayerId);
  var isLeader = app.myPlayerId === g.leaderId;
  els.pScoreLabel.textContent = me ? fmtScore(me.score) : '0';
  els.pRoundIndicator.textContent = g.bombConfig && g.bombConfig.scoringMode==='rounds' ? ((g.phase==='bomb-playing'?(g.bombRoundsPlayed+1):g.bombRoundsPlayed)+'/'+g.bombConfig.roundsTotal) : '';
  els.pGameNameLabel.textContent = 'لعبة القنابل 💣';
  els.btnSubmit.classList.add('hidden');
  els.counterContainer.classList.add('hidden');
  els.submittedLabel.classList.add('hidden');
  els.pgridContainer.classList.remove('hidden');
  els.btnNextRound.classList.add('hidden');
  els.btnBombNewRound.classList.add('hidden');
  els.btnBombToLobby.classList.add('hidden');
  els.btnBombContinue.classList.add('hidden');
  els.roundOverlay.classList.remove('active');

  if(g.phase === 'bomb-round-finished'){
    var w2 = findPlayer(g.bomb.winnerId);
    els.notifBar.textContent = '🏆 فاز بهذه الجولة: ' + (w2?w2.name:'');
    renderBombGrid(els.pgridContainer, g.bomb, false);
    maybePlayVictorySound(g.bomb);
    if(isLeader){
      els.btnBombContinue.classList.remove('hidden');
      els.btnBombToLobby.classList.remove('hidden');
    }
    return;
  }
  var myTurn = g.bomb.order[g.bomb.turnIndex] === app.myPlayerId;
  els.notifBar.textContent = myTurn ? 'دورك! اختر مربعاً آمناً' : 'بانتظار دور اللاعب الآخر...';
  renderBombGrid(els.pgridContainer, g.bomb, myTurn, function(row){
    sendToHost({t:'bomb-choose', row:row});
  });
  maybePlayBombSound(g.bomb);
}

})();
